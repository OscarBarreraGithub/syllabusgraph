assessment:
- The index labels and excerpts identify physics topics for every row. A format label
  adds no navigational value, while topical homes preserve the required single-primary
  association without asserting equivalence.
- Across all four books, the labels distinguish Maxwell or U(1) material from Yang-Mills
  curvature, ghosts, background gauges, anomalies, and broken-gauge mass matrices.
  Preserving those distinctions makes the primary homes cross-book consistent.
- Källén-Lehmann representations organize correlators, Lorentz representations organize
  particle fields, and Casimir forces arise from vacuum modes. The revised homes follow
  those meanings rather than shared vocabulary.
- The moved rows explicitly concern Majorana quantization, mode algebras, normal ordering,
  hole reinterpretation, or beta-function scheme invariance. Their revised homes align
  equivalent treatments across books.
- A full label-and-excerpt review found the same failure in anomaly, gravity, chiral,
  QED, renormalization, and symmetry nodes. The revision keeps supported homes, explicitly
  moves mismatches, splits supersymmetry from unification, and adds coherent homes
  for Casimir, large-N, and Wick-ordering material.
