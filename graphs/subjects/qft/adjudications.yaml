      operator in the stated infinitesimal form has a Hermitian generator. It does
      not establish why a continuous symmetry has that representation or why Hermiticity
      gives observable status. Removing those broader conclusions eliminates both
      unsupported premises while retaining the assigned origin. The existing private
      later-boundaries companion retains the exact book-edge handoffs and their endpoints
      for a future packet; they are not presented as evidence for this narrower node.
