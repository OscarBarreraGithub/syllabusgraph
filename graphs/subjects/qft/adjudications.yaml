    issue: Authorize the existing classical SSB record replacement.
    alternatives:
    - Authorize the supplied replacement with the Peskin-Schroeder origin and evidence.
    - Defer the replacement and omit the Peskin-Schroeder correspondence from this
      run.
    resolution: Authorize the supplied replacement and clear the amendment marker.
    rationale: Schwartz Problem 3.5 and Peskin-Schroeder Section 11.1 describe the
      same bounded classical real-scalar Z2-breaking construction around a selected
      vacuum. The supplied replacement leaves the accepted shared content and Schwartz
      provenance unchanged while adding the exact Peskin-Schroeder discrete-shift
