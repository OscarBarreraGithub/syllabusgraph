      task node.
    alternatives:
    - Authorize the full replacement with all retained citations and clear the resolved
      amendment.
    - Defer the unit and preserve the accepted Noether-current task node unchanged.
    resolution: Authorize the full replacement and clear the resolved amendment.
    rationale: Schwartz states the total Noether current and assigns its on-shell
      ordinary-conservation check, while separately distinguishing the fermion-only
      covariantly conserved matter current. Weinberg independently separates ordinary
      total-current conservation from covariant matter-current conservation and explains
