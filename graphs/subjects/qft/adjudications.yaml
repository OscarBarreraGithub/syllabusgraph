    issue: The p. 52 node imports unsupported p. 50–51 premises for symmetry unitarity
      and observable status.
    alternatives:
    - Narrow the node to the conditional Hermiticity result supported on packet p.
      52 and retain both broader handoffs privately.
    - Defer the full draft until the p. 50–51 endpoints and complete operative witnesses
      are available in a new immutable packet.
    resolution: Narrow the node to conditional Hermiticity of U = 1 + iεt and preserve
      both broader source-boundary handoffs privately.
