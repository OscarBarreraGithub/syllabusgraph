    issue: Correct the trace-route origin.
    alternatives:
    - Use the cross-section result as the route node's origin and keep inputs on prerequisite
      edges.
    - Remove the route node and encode its joint inputs directly on the target result.
    resolution: Use the tree-level cross-section result as the trace-route origin.
    rationale: The route node represents an alternative trace-based derivation of
