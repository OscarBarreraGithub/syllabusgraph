- id: qft.align006.background-field-axial-anomaly
  label: Background-field axial anomaly
  summary: The massive triangle gives <psibar gamma5 psi>_A=i e^2 epsilon F F/(32pi^2m),
    consistently requiring <partial J5>_A=-e^2 epsilon F F/(16pi^2). The text limits
