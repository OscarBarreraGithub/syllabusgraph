    - 372
    note: Dual construction, exceptional degree count, and equivalence conclusion.
  notation:
  - source: weinberg-1
    note: D is spacetime dimension and φ is the dual (D−p−2)-form; the dual symbols
      and indexed equations were visually checked privately.
