  notation: []
- id: qft.atom-photon-interaction-hamiltonian
  label: Atom-photon interaction Hamiltonian
  summary: For the Einstein-coefficient application, split H=H_0+H_int with H_0=H_atom+H_photon
    and treat the remaining interaction perturbatively. A semiclassical form H_int=φH_I
    makes the photon field dynamical and its ladder-operator matrix elements produce
    the √n and √(n+1) factors.
  kind: method
  group: qft.free-scalar-quantization
  origins:
  - project: schwartz
    node: schwartz.atom-photon-interaction-hamiltonian
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: 2.3.4 Einstein coefficients revisited
    pages:
    - 26
    note: Recasts the atomic transition calculation with a quantum photon field.
  notation: []
- id: qft.baryon-octet-decuplet-quantum-number-diagram
  label: Baryon octet and decuplet quantum-number organization
  summary: The baryon octet and decuplet diagram organizes states by charge and strangeness.
    Its diagonal lines have common charge and its horizontal lines common strangeness,
    retaining this as a representation-level diagram rather than an inferred dynamical
    statement.
  kind: representation
  group: qft.spontaneously-broken-symmetries
  origins:
  - project: schwartz
    node: schwartz.baryon-octet-decuplet-quantum-number-diagram
    note: Retains the diagram's stated quantum-number organization only.
  evidence:
  - source: schwartz
    section: Figure 28.2
    pages:
    - 574
  notation:
  - source: schwartz
    note: Strangeness is the number of strange quarks minus strange antiquarks in
      the hadron.
- id: qft.blackbody-cavity-modes-and-classical-spectrum
  label: Blackbody cavity modes and the classical spectrum
  summary: A thermal blackbody can be idealized as a periodic box of electromagnetic
    standing-wave modes. Classical equipartition assigns equal thermal energy to modes,
    so their growing phase-space density gives an intensity proportional to ω²kBT
    (with c restored as c⁻³).
  kind: representation
  group: qft.radiation-quantization
  origins:
  - project: schwartz
    node: schwartz.blackbody-cavity-modes-and-classical-spectrum
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: 1.1 Blackbody radiation
    pages:
    - 3
    note: Defines the cavity modes and obtains the equipartition spectrum.
  notation: []
- id: qft.bosonic-spontaneous-and-stimulated-emission-factor
  label: Bosonic spontaneous and stimulated emission factor
  summary: For atomic de-excitation into a photon mode already occupied by n_ω photons,
    the squared amplitude is proportional to n_ω+1; excitation is proportional to
    n_ω. The additive one is the spontaneous contribution and the occupation term
    is stimulated emission or absorption.
  kind: result
  group: qft.radiation-quantization
  origins:
  - project: schwartz
    node: schwartz.bosonic-spontaneous-and-stimulated-emission-factor
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: 1.3 Quantum field theory
    pages:
    - 9
    note: Obtains the nω+1 and nω transition factors.
  notation: []
- id: qft.brst-auxiliary-field-transformations-and-nilpotence
  label: BRST auxiliary-field transformations and nilpotence
  summary: 'An auxiliary commuting field lets the gauge-fixed action carry a constant
    anticommuting BRST symmetry: matter and gauge fields transform by a ghost-parameter
    gauge transformation, the antighost maps to the auxiliary field, and the ghost
    has a quadratic transformation. Anticommutation, the Lie algebra, and the Jacobi
    identity give a nilpotent differential. This is the Yang–Mills auxiliary-field
    construction, with source-specific B or h notation.'
  kind: method
  group: qft.brst-and-physical-states
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.brst-auxiliary-field-symmetry-and-nilpotence
    note: Retains the nondynamical B^a rewriting and its all-field nilpotence statement.
  - project: weinberg-2
    node: weinberg-2.brst-field-transformations
    note: Retains the Fourier-introduced h^a formulation and constant anticommuting
      parameter.
  - project: weinberg-2
    node: weinberg-2.brst-nilpotence
    note: Retains the graded-Leibniz extension of nilpotence to products.
  evidence:
  - source: peskin-schroeder
    section: 16.4 BRST Symmetry
    pages:
    - 517
    - 518
  - source: weinberg-2
    section: '15.7'
    pages:
    - 28
    - 29
    - 30
    - 31
  notation:
  - source: peskin-schroeder
    note: The auxiliary field is B^a and the BRST parameter is epsilon.
  - source: weinberg-2
    note: The auxiliary field is h^a and the BRST parameter theta is a constant anticommuting
      c-number.
- id: qft.brst-cohomology-and-physical-state-qualification
  label: BRST cohomology and physical-state qualification
  summary: A conserved nilpotent BRST charge defines physical states as Q-closed states
    modulo Q-exact states. Schwartz states the identification as a formal conclusion,
    while Weinberg derives it as the condition for gauge-fixing-independent physical
    matrix elements. Neither source is treated as a general unitarity proof for every
    local symmetry.
  kind: result
  group: qft.brst-and-physical-states
  origins:
  - project: schwartz
    node: schwartz.brst-cohomological-physical-state-qualification
    note: Retains the qualified Delta-cohomology identification.
  - project: weinberg-2
    node: weinberg-2.brst-cohomology-of-physical-states
    note: Retains Q-closed/Q-exact equivalence and its matrix-element scope.
  evidence:
  - source: schwartz
    section: 25.4.2
    pages:
    - 501
  - source: weinberg-2
    section: '15.7'
    pages:
    - 32
    - 33
  notation: []
- id: qft.brst-conditional-ghost-free-gauge-independence
  label: Conditional ghost-free gauge independence from BRST cohomology
  summary: 'For gauge-invariant operators between Q-closed states, changing the gauge-fixing
    functional leaves physical matrix elements unchanged. The ghost-free conclusion
    is conditional: it follows for a general BRST-invariant action if there is a gauge-fixing
    functional in which ghosts decouple; it is not an independent proof that such
    a gauge exists for every local symmetry.'
  kind: result
  group: qft.general-brst
  origins:
  - project: weinberg-2
    node: weinberg-2.brst-conditional-ghost-free-gauge-independence
    note: Retains the Q-closed-state and existing-decoupling-gauge conditions.
  evidence:
  - source: weinberg-2
    section: '15.8'
    pages:
    - 41
  notation: []
- id: qft.brst-exact-gauge-fixing-functional
  label: BRST-exact gauge-fixing functional
  summary: In the auxiliary-field formulation, the gauge-fixed action can be written
    as a gauge-and-matter part plus sPsi, where Psi has ghost number minus one. Nilpotence
    makes the sPsi term BRST invariant; this statement concerns the action's form,
    not automatic invariance of arbitrary Green functions or matrix elements.
  kind: result
  group: qft.brst-and-physical-states
  origins:
  - project: weinberg-2
    node: weinberg-2.brst-exact-gauge-fixing
    note: Retains the I_new = integral L + sPsi formulation and its scope.
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 31
    - 32
  notation: []
- id: qft.brst-faddeev-popov-transformation-and-nilpotence-task
  label: BRST transformations and nilpotence task in the Faddeev–Popov form
  summary: For the gauge-fixed Faddeev–Popov Lagrangian, the gauge and matter variations
    are ghost-parameter gauge transformations, the ghost transforms quadratically,
    and the antighost variation cancels gauge-fixing variation. The source assigns
    verification that the Slavnov operator Delta is nilpotent; it does not supply
    that exercise's proof on the problem page.
  kind: method
  group: qft.brst-and-physical-states
  origins:
  - project: schwartz
    node: schwartz.brst-transformations-and-nilpotency-task
    note: Retains the Faddeev–Popov-form transformations and the assigned nilpotence
      verification.
  evidence:
  - source: schwartz
    section: 25.4.2; Problem 25.7
    pages:
    - 500
    - 501
    - 507
  notation:
  - source: schwartz
    note: Delta is the Slavnov operator defined by the Grassmann-parameter BRST variation.
- id: qft.brst-free-electrodynamic-polarization-example
  label: BRST free-electrodynamic polarization example
  summary: In the free electrodynamic BRST example, Q-closed one-photon states are
    transverse up to momentum shifts, while ghost and antighost excitations are excluded
    or Q-exact. This is an illustrative free-field analysis used for the physical-state
    condition, not a direct proof of non-Abelian interacting unitarity.
  kind: result
  group: qft.brst-and-physical-states
  origins:
  - project: weinberg-2
    node: weinberg-2.brst-electrodynamic-polarization-example
    note: Retains the free-electrodynamic scope and the polarization/cohomology argument.
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 33
    - 34
  notation: []
- id: qft.brst-general-action-and-yang-mills-unitarity-result
  label: General BRST action and Yang–Mills unitarity result
  summary: Beyond the bilinear Faddeev–Popov action, a ghost-number-zero BRST-invariant
    local action has a gauge/matter functional plus s applied to a ghost-number-minus-one
    functional. For Yang–Mills, the source states BRST cohomology is ghost-free, positive
    definite, and has a unitary S matrix; it separately warns that other local symmetries
    require their own proofs.
  kind: result
  group: qft.brst-and-physical-states
  origins:
  - project: weinberg-2
    node: weinberg-2.brst-unitarity-and-general-gauge-fixing
    note: Retains the Yang–Mills result and the separate-proof boundary for other
      local symmetries.
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 35
    - 36
  notation: []
- id: qft.brst-light-cone-and-gravity-unitarity-limitation
  label: Light-cone and gravity limits on BRST ghost-decoupling arguments
  summary: Light-cone quantization plays the ghost-decoupling role for string theory
    that axial gauge plays for Yang–Mills. For general relativity, no coordinate choice
    decouples ghosts, so a physical ghost-free Hilbert space requires a unitarity
    proof rather than that decoupling argument.
  kind: result
  group: qft.general-brst
  origins:
  - project: weinberg-2
    node: weinberg-2.string-light-cone-and-gravity-brst-limitation
    note: Retains the contrast between string light-cone quantization and gravity.
  evidence:
  - source: weinberg-2
    section: '15.8'
    pages:
    - 41
  notation: []
- id: qft.brst-renormalizability-and-nonbilinear-ghost-qualification
  label: BRST renormalizability and nonbilinear-ghost qualification
  summary: Power counting alone does not guarantee an available counterterm. Because
    BRST transformations are nonlinear, action symmetry does not directly imply symmetry
    of Green functions or matrix elements; gauges beyond bilinear Faddeev–Popov form
    can require quartic ghost counterterms. The source defers the renormalizability
    proof to later sections.
  kind: result
  group: qft.brst-and-physical-states
  origins:
  - project: weinberg-2
    node: weinberg-2.brst-beyond-power-counting-and-bilinear-faddeev-popov
    note: Retains the counterterm and deferred-proof qualifications.
  evidence:
