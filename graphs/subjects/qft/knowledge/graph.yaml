    a color-neutral fermionic bound state has U(1)_V charge kN with odd k. Writing
    ℓ(r,s,k) as its helicity +1/2 multiplicity minus its conjugate helicity −1/2 multiplicity
    and summing over k>0, anomaly matching requires Σℓ d_s tr^(r)({𝒯_a,𝒯_b}𝒯_c)=N
    tr({λ_a,λ_b}λ_c) and Σℓ d_s k tr^(r)({𝒯_a,𝒯_b})=tr({λ_a,λ_b}). The multiplicities
    are integers; if parity is unbroken, ℓ(r,s,k)=−ℓ(s,r,k).
