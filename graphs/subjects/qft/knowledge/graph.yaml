- id: qft.higgs-radial-mode-and-renormalizability-limit
  label: Higgs radial mode and renormalizability limit
  summary: At low energy, massive-vector behavior by itself does not distinguish explicit
    from spontaneous breaking. In a linear sigma model the radial sigma/Higgs field
    is part of the renormalizable completion; the nonlinear pion-only theory is generally
    nonrenormalizable. The Abelian-Higgs exception without a radial mode relies on
    the absence of photon self-interactions, so it does not establish the non-Abelian
    case.
