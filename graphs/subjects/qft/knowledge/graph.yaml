- id: qft.align006.anomaly-pole-order-of-limits
  label: Anomaly pole and soft-pion order-of-limits
  summary: The apparent conservation of an on-shell axial-current two-photon amplitude
    conflicts with the nonzero anomalous divergence only if one interchanges the q^2->0
    and massless-pion limits. The pion pole supplies q_mu/q^2, so the anomaly remains
    finite when the divergence is evaluated before the soft limit.
  kind: method
