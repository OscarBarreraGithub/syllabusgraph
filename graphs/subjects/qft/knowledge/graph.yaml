- id: qft.align006.chiral-gauge-theory-left-handed-couplings
  label: Chiral gauge theory and left-handed matter
  summary: A chiral gauge theory couples gauge fields to one handedness of fermion.
    A mass term would pair left and right fields and generally is not gauge invariant
    before symmetry breaking, so consistent gauge representations and anomaly cancellation
