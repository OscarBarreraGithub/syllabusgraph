- id: qft.higgs-mechanism-superconducting-meissner-screening
  label: Higgs mechanism, superconducting photon mass, and Meissner screening
  summary: In the Ginzburg–Landau/Abelian-Higgs description of a superconductor, the
    broken phase gives the electromagnetic field a mass. Magnetic fields are consequently
    excluded or screened over the inverse photon-mass scale; this is the Meissner
    effect. The statement concerns the effective superconducting description, not
