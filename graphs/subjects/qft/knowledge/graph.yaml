- id: qft.align013.peskin-schroeder.gluon-twist-two-operators-odd-n-total-derivative
  label: Gluon twist-two operators and the odd-n exclusion
  summary: The gluon twist-two operators O_g^(n) are symmetrized, traceless operators
    made from F^{mu alpha}, covariant derivatives, and F_alpha^nu; they have dimension
    n+2, spin n, and twist two. Transferring covariant derivatives between the field
    strengths gives O_g^(n)=(-1)^n O_g^(n)+a total derivative. For odd n it is therefore
    a total derivative; at zero momentum injection its proton matrix element vanishes,
    so it cannot affect the DIS cross section. For even n it mixes with O_f^(n).
  kind: result
