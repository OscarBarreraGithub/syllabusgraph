- id: qft.zero-momentum-goldstone-effective-vertices
  label: Zero-momentum Goldstone effective-vertex constraints
  summary: Differentiated effective-potential symmetry identities make vacuum tadpoles
    and zero-momentum transitions from a Goldstone boson to other scalars vanish.
    A further identity makes the three-Goldstone zero-momentum vertex vanish, so leading
    low-energy Goldstone emission does not come from external low-energy Goldstone
    lines.
  kind: result
  group: qft.spontaneously-broken-symmetries
  origins:
  - project: weinberg-2
    node: weinberg-2.zero-momentum-goldstone-effective-vertices
    note: Retains the zero-four-momentum effective-vertex conditions and their leading-soft
      external-Goldstone consequence.
  evidence:
  - source: weinberg-2
    section: '19.2'
    pages:
    - 176
    - 177
  notation:
  - source: weinberg-2
    note: The constraints concern zero external four-momentum and leading order in
      small Goldstone energies.
