- id: qft.schwartz-equal-time-commutator-derivation
  label: Schwartz mode derivation of equal-time scalar-field commutators
  summary: In the Schwartz free-field route, the field mode expansion, its canonical
    momentum, and the creation-annihilation algebra are inserted into the field commutators
    to derive the equal-time scalar algebra. The source then states the same fixed-time
    relations for an interacting theory; this derivation route is separate from the
    Peskin-Schroeder prescription.
  kind: method
  group: qft.second-quantized-scalar-field
  origins:
  - project: schwartz
    node: schwartz.equal-time-scalar-field-commutation-relations
    note: Preserves the source’s derivation of its equal-time result from free momentum
      modes, including its stated fixed-time interacting extension; it is a route-specific
      method record.
  evidence:
  - source: schwartz
    section: 2.3.3 Commutation relations
    pages:
    - 24
    - 25
    note: Derives the field commutator from the mode algebra, defines the conjugate
      momentum, and gives the canonical equal-time commutator.
  notation:
  - source: schwartz
    note: The source explicitly limits the derivation to equal time and says the different-time
      calculation is more subtle.
- id: qft.spinless-boson-and-mass-constraint
  label: Bosonic statistics and particle-antiparticle mass equality
  summary: The complex scalar construction has nontrivial spacelike commutation only
    for Bose statistics. Its causality condition also requires particle and antiparticle
    masses to be equal, so that the relevant positive-frequency functions coincide.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 204
    note: The source rules out Fermi statistics for a nonzero spinless field and states
      equal mass as necessary and sufficient together with equal coefficient magnitudes.
  group: qft.causal-scalar-fields
  origins:
  - project: weinberg-1
    node: weinberg-1.spinless-boson-and-mass-constraint
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
