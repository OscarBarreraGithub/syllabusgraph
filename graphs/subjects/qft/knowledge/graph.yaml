    it collinear and pT→0. The small-pT differential cross section has residue αs
    CF(1+z²)/(2π(1−z)); dimensional regularization supplies the full distributional
    Pqq endpoint, whose reconstruction uses sum rules. This is the chapter’s example,
    distinct from the general theorem whose proof is deferred to Section 36.4.
