- id: qft.pform-exterior-derivative-and-local-exactness
  label: Exterior derivative, closed forms, and local exactness
  summary: A p-form is an antisymmetric covariant tensor of rank p; its antisymmetrized
    exterior derivative d is a (p+1)-form and obeys d²=0. Exact forms are therefore
    closed. Poincaré's theorem supplies the converse only on a region smoothly contractible
    to a point; on multiply connected spaces a closed form can be locally but not
    globally exact. This is local differential-form reasoning, not a classification
    of global homotopy sectors.
  kind: concept
  group: qft.extended-field-topology
  origins:
  - project: weinberg-1
    node: weinberg-1.p-form-exterior-derivative-and-local-exactness
    note: Retains the p-form definition, nilpotence, contractible-region condition,
      and multiply connected caveat as a local de Rham/Poincaré construction.
  evidence:
  - source: weinberg-1
    section: '8.8'
    pages:
    - 369
    - 370
    note: Definitions, nilpotence, local theorem, and global caveat.
  notation:
  - source: weinberg-1
    note: d is the exterior derivative; “closed” means dω=0 and “exact” means ω=dη
      in the stated local scope.
