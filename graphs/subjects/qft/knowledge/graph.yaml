- id: qft.align006.fujikawa-chiral-measure-jacobian
  label: Fujikawa Jacobian for a local chiral rotation
  summary: Expand Grassmann fields in eigenmodes of i slash-D and regulate the local
    trace tr[gamma_5] with exp[(i slash-D)^2/M^2]. Under psi -> (1+i alpha(x)gamma_5)psi,
    the fermion measure has a nontrivial gauge-invariant Jacobian; the heat-kernel
    term quadratic in sigma dot F gives the F tilde-F density and reproduces the ABJ
    Ward identity. The method is attributed to Fujikawa.
  kind: method
  group: qft.anomaly-regularization-and-matching
  origins:
