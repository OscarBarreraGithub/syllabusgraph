    note: Contrasts the classical spectrum with observation.
  notation: []
- id: qft.unbroken-subgroup-reduction-at-d-four
  label: d=4 gauge-Higgs scaling reduction to unbroken Yang–Mills
  summary: For the gauge-Higgs scaling problem at d=4, a finite-R minimum requires
    the covariant-gradient and potential terms T[φ,A] and V[φ] to vanish. After a
    gauge transformation makes a vacuum value constant, gauge fields for broken generators
    vanish; the remaining H fields must solve the Euclidean Yang–Mills equations.
    This conditional reduction replaces G by its unbroken subgroup H and does not
    assert that every broken theory has instantons.
  kind: result
  group: qft.extended-field-topology
  origins:
  - project: weinberg-2
    node: weinberg-2.unbroken-subgroup-reduction-at-d-four
    note: Retains the d=4 finite-R condition, constant-vacuum gauge, broken-generator
      elimination, and conditional reduction to H Yang–Mills.
  evidence:
  - source: weinberg-2
    section: '23.1'
    pages:
    - 429
    - 430
    note: Gauge-Higgs scaling and reduction to the unbroken subgroup.
  notation:
  - source: weinberg-2
    note: T, K, and V are the three source-defined gauge-Higgs contributions; H is
      the unbroken subgroup.
- id: qft.unpolarized-trace-technology
  label: Trace technology for unpolarized cross sections
  summary: Products of gamma matrices and spinors in an unpolarized cross section
    can be reduced with trace identities, avoiding explicit gamma-matrix and spinor
    representations. The source says this method also readily restores the final-state
    mass omitted in the high-energy example.
  kind: method
  group: qft.qed-scattering
  origins:
