- id: qft.weinberg2-fixed-point-eigenvalue-invariance
  label: Coordinate invariance of fixed-point stability eigenvalues
  summary: A nonsingular redefinition of coupling coordinates relates fixed-point
    stability matrices by similarity, so their eigenvalues are independent of the
    coupling definition.
