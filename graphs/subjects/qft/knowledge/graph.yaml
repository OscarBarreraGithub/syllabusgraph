- id: qft.abelian-higgs-gauge-shift-and-degree-count
  label: Abelian Higgs gauge shift and degree count
  summary: The Abelian Higgs gauge transformation A_mu to A_mu+(partial_mu alpha)/e
    and pi to pi−F_pi alpha removes pi in unitary gauge, while Lorenz gauge leaves
    a massless pi with two constrained-vector modes. These three degrees of freedom
    equal those of an unconstrained massive vector, expressing that the vector eats
    the Goldstone.
  kind: method
  group: qft.spontaneously-broken-symmetries
  origins:
  - project: schwartz
    node: schwartz.abelian-higgs-gauge-shift-and-degree-count
    note: Retains both gauge descriptions, their degree count, and the source's physical-spectrum
      caution.
  evidence:
  - source: schwartz
    section: 28.3.1
    pages:
    - 576
  notation:
  - source: schwartz
    note: The transformation law is a gauge transformation, not the law of a scalar
      in a linear representation.
- id: qft.abelian-higgs-model-and-vector-mass
  label: Abelian Higgs model and vector mass before gauge fixing
  summary: Gauging the broken U(1) and substituting phi=(v+sigma)/sqrt(2) exp(i pi/F_pi)
    gives a vector mass term one-half e-squared v-squared A_mu-squared, hence m_A=e
    v, before resolving scalar-vector mixing. In this gauged convention, after radial
    decoupling, canonical pi normalization requires F_pi=v, unlike the ungauged linear-sigma
    convention.
  kind: result
  group: qft.spontaneously-broken-symmetries
  origins:
  - project: schwartz
    node: schwartz.abelian-higgs-model-and-vector-mass
    note: Retains the displayed mass term, m_A=e v conclusion, mixing qualification,
      and source-specific gauged F_pi normalization.
  evidence:
  - source: schwartz
    section: 28.3.1
    pages:
    - 575
    - 576
  notation:
  - source: schwartz
    note: F_pi=v is fixed in the decoupled gauged Lagrangian; F_pi=sqrt(2)v belongs
      to the earlier ungauged parametrization.
- id: qft.abelian-rxi-ghost-higgs-coupling-and-unphysical-mass
  label: Abelian R-xi ghost–Higgs coupling and common unphysical mass
  summary: In the spontaneously broken Abelian R-xi construction, the Goldstone, unphysical
    vector components, and Faddeev–Popov ghosts acquire the same gauge-dependent mass.
    Unlike unbroken QED, the Abelian ghosts couple to the physical Higgs field even
    though they do not directly couple to the gauge field. This is a broken-theory
    qualification, separate from generic R-xi propagator formulas.
  kind: result
  group: qft.gauge-quantization
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.rxi-abelian-propagators-and-ghost
    note: Retains the common unphysical mass and the specifically broken-Abelian ghost–Higgs
      coupling qualification.
  evidence:
  - source: peskin-schroeder
    section: '21.1'
    pages:
    - 734
- id: qft.adjoint-representation
