  label: Sourced Maxwell equations from the action
  summary: Varying ℒ=−1/4F_μνF^μν−A_μJ^μ gives ∂_μF^μν=J^ν. In Lorenz gauge this becomes
    □A^ν=J^ν, formally A^ν=(1/□)J^ν; the inverse wave operator is the propagator that
    carries source information to the field.
  kind: result
  group: qft.classical-field-theory
