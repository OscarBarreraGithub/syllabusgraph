- id: qft.anti-brst-ghost-antighost-role-observation
  label: Anti-BRST observation about ghost and antighost roles
  summary: Anti-BRST invariance reveals a similarity between ghost and antighost roles
    despite their asymmetric appearance in the construction. The source explicitly
    calls the similarity mysterious, so this is an observation rather than an explanatory
    derivation.
  kind: concept
  group: qft.general-brst
  origins:
