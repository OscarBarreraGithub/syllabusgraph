    section: 2.2.1 Simple harmonic oscillator
    pages:
    - 18
    note: Reviews canonical oscillator quantization and time evolution.
  notation: []
- id: qft.charge-conjugation-time-reversal-phase-constraints
  label: Charge-conjugation and time-reversal phase constraints
  summary: For the causal scalar field to transform proportionally under charge conjugation,
    the one-particle phases obey ξᶜ = ξ*. Time reversal is antiunitary; requiring
    a simple relation to the field at the time-reversed point instead gives ζᶜ = ζ*.
    In the self-conjugate case the charge-conjugation phase is real and equals ±1.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 206
    note: Equations (5.2.20)–(5.2.31) derive the charge-conjugation and time-reversal
      phase conditions for the scalar field.
  notation:
  - source: weinberg-1
    note: ξ and ζ are the one-particle phases for charge conjugation and time reversal,
      respectively.
  group: qft.causal-scalar-fields
  origins:
  - project: weinberg-1
    node: weinberg-1.charge-conjugation-time-reversal-phase-constraints
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.charge-conservation-obstruction
  label: Charge-conservation obstruction for a self-adjoint field
  summary: If the particle carries a conserved charge, charge-preserving interaction
    terms need equal numbers of a(p) and a†(p). This cannot be achieved by a polynomial
    solely in the self-adjoint neutral-field combination, which lacks a simple commutator
    with the charge operator.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 203
    note: The source contrasts the simple charge commutators of φ⁺ and its adjoint
      with the self-adjoint field.
  group: qft.causal-scalar-fields
  origins:
  - project: weinberg-1
    node: weinberg-1.charge-conservation-obstruction
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.classical-feynman-diagrams-and-rules
  label: Classical Feynman diagrams and rules
  summary: 'The iterative Green-function solution can be represented by diagrams:
    propagator lines connect the observation point, source insertions, and nonlinear
    branching vertices weighted by λ, with internal points integrated. The source
    calls these Feynman diagrams and distinguishes the quantum extension by the possibility
    of loops when ℏ is nonzero. Problem 3.4 asks for the next-order diagrams, their
    integral expressions, and a Green-function check of the result.'
  kind: representation
  group: qft.classical-field-theory
  origins:
  - project: schwartz
    node: schwartz.classical-feynman-diagrams-and-rules
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
