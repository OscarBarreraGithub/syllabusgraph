nodes:
- id: qft.adjoint-representation
  label: Adjoint representation from structure constants
  summary: For structure constants satisfying the displayed antisymmetry and Jacobi
    relation, matrices (t^A_α)^β{}_γ=−i C^β_{γα} furnish the adjoint (regular) representation
    of the Lie algebra.
  kind: representation
  group: qft.nonabelian-gauge-invariance
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 3
    note: Equations (15.1.6)–(15.1.7) construct and name the adjoint representation.
  notation:
  - source: weinberg-2
    note: A superscript A on t denotes the adjoint representation in this treatment.
  origins:
  - project: weinberg-2
    node: weinberg-2.adjoint-representation
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.canonical-field-momentum-hamiltonian
  label: Canonical momentum and Hamiltonian for a field
  summary: The conjugate momentum density is pi(x) = partial L / partial phidot(x),
    and the Hamiltonian is H = integral d^3x [pi phidot - L]. This is the continuum
    Legendre construction used for the field.
  kind: method
  group: qft.scalar-field-foundations
  notation:
  - source: peskin-schroeder
    note: pi(x) denotes momentum density, whereas the physical momentum associated
      with translations is treated separately later.
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Hamiltonian Field Theory'
    pages:
    - 16
    note: The text obtains the momentum density by a discretization argument and then
      passes to the continuum Hamiltonian density.
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.canonical-field-momentum-hamiltonian
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.charge-conjugation-time-reversal-phase-constraints
  label: Charge-conjugation and time-reversal phase constraints
  summary: For the causal scalar field to transform proportionally under charge conjugation,
    the one-particle phases obey ξᶜ = ξ*. Time reversal is antiunitary; requiring
    a simple relation to the field at the time-reversed point instead gives ζᶜ = ζ*.
    In the self-conjugate case the charge-conjugation phase is real and equals ±1.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 206
    note: Equations (5.2.20)–(5.2.31) derive the charge-conjugation and time-reversal
      phase conditions for the scalar field.
  notation:
  - source: weinberg-1
    note: ξ and ζ are the one-particle phases for charge conjugation and time reversal,
      respectively.
  group: qft.causal-scalar-fields
  origins:
  - project: weinberg-1
    node: weinberg-1.charge-conjugation-time-reversal-phase-constraints
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.charge-conservation-obstruction
  label: Charge-conservation obstruction for a self-adjoint field
  summary: If the particle carries a conserved charge, charge-preserving interaction
    terms need equal numbers of a(p) and a†(p). This cannot be achieved by a polynomial
    solely in the self-adjoint neutral-field combination, which lacks a simple commutator
    with the charge operator.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 203
    note: The source contrasts the simple charge commutators of φ⁺ and its adjoint
      with the self-adjoint field.
  group: qft.causal-scalar-fields
  origins:
  - project: weinberg-1
    node: weinberg-1.charge-conservation-obstruction
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.complex-causal-scalar-field
  label: Complex causal scalar field from particle and antiparticle
  summary: For spinless bosons of equal mass and opposite charges, combining a particle
    annihilation field with an antiparticle creation field gives φ(x) = φ⁺(x) + φ⁺c†(x).
    The field has [Q, φ(x)] = −qφ(x) and is the essentially unique causal scalar field
    in this construction; it covers self-conjugate neutral particles as the special
    case aᶜ(p) = a(p).
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 203
    - 204
    note: The source introduces opposite-charge equal-mass bosons, forms the charge-eigenfield,
      and gives its normalized mode expansion in equation (5.2.11).
  notation:
  - source: weinberg-1
    note: Superscript c labels the charge-conjugate particle; φ⁺c† is the adjoint
      of its annihilation field.
  group: qft.causal-scalar-fields
  origins:
  - project: weinberg-1
    node: weinberg-1.complex-causal-scalar-field
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.covariant-derivative
  label: Covariant derivative of matter fields
  summary: The operator (D_μψ)_l=∂_μψ_l−iA^β_μ(t_β)_l{}^mψ_m is constructed so that
    D_μψ transforms in the same representation as ψ under the local transformation.
    This records the endpoint of the source's cancellation argument through equation
    (15.1.11).
  kind: method
  group: qft.nonabelian-gauge-invariance
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 4
    note: Equations (15.1.10)–(15.1.11) define D_μ and show its homogeneous transformation.
  notation:
  - source: weinberg-2
    note: D_μ acts on matter components through the representation matrices t_β.
  origins:
  - project: weinberg-2
    node: weinberg-2.covariant-derivative
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.equal-time-scalar-field-commutators
  label: Equal-time canonical commutators of a scalar field
  summary: At a common time, a scalar field and its conjugate momentum satisfy [phi(x),
    pi(y)] = i delta^(3)(x-y), while the field-field and momentum-momentum commutators
    vanish. Peskin and Schroeder state this as the canonical quantization prescription
    for a real field; Schwartz derives the same equal-time algebra from momentum modes
    and notes its fixed-time interacting-theory extension. Neither treatment here
    supplies an unequal-time relation.
  kind: result
  group: qft.scalar-field-foundations
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.canonical-quantization-real-field
    note: Corresponds to the real-field canonical prescription, including promotion
      of phi and pi to operators; the source presents it first in the Schroedinger
      picture and then at common Heisenberg time.
  - project: schwartz
    node: schwartz.equal-time-scalar-field-commutation-relations
    note: Corresponds to the equal-time scalar algebra derived from the free mode
      expansion; the source also states the same fixed-time relations for interacting
      fields.
  evidence:
  - source: peskin-schroeder
    section: 2.3 The Klein-Gordon Field as Harmonic Oscillators
    pages:
    - 19
    - 20
    note: The text first states promotion of phi and pi, then gives the continuous-system
      equal-time commutation relations.
  - source: schwartz
    section: 2.3.3 Commutation relations
    pages:
    - 24
    - 25
    note: Derives the field commutator from the mode algebra, defines the conjugate
      momentum, and gives the canonical equal-time commutator.
  notation:
  - source: peskin-schroeder
    note: The equal-time relations are introduced in the Schroedinger picture; the
      book says they also hold at a common time after switching to the Heisenberg
      picture.
  - source: schwartz
    note: The source explicitly limits the derivation to equal time and says the different-time
      calculation is more subtle.
- id: qft.field-euler-lagrange-equation
  label: Field Euler-Lagrange equation
  summary: Varying a local field action with boundary-vanishing variations yields
    partial_mu[partial L / partial(partial_mu phi)] - partial L / partial phi = 0;
    one equation occurs for each field.
  kind: result
  group: qft.scalar-field-foundations
  notation:
  - source: peskin-schroeder
    note: This is Eq. (2.3), with partial_mu acting on the derivative of the Lagrangian
      density with respect to partial_mu phi.
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Lagrangian Field Theory'
    pages:
    - 16
    note: The derivation removes the surface term by boundary conditions and uses
      arbitrary variations to obtain the local equation of motion.
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.field-euler-lagrange-equation
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.finite-gauge-transformations
  label: Finite gauge transformations
  summary: A finite transformation acts on matter through exp(i t_αΛ^α(x)); requiring
    the covariant derivative to transform in the same way fixes the corresponding
    finite transformation law for the gauge field. Its infinitesimal limit recovers
    the earlier local rules.
  kind: method
  group: qft.nonabelian-gauge-invariance
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 5
    note: Equations (15.1.15)–(15.1.17) give the finite matter and gauge-field transformations
      and relate them to the infinitesimal rules.
  notation:
  - source: weinberg-2
    note: Λ^α(x) parameterizes the finite group element, while ε^α(x) denotes its
      infinitesimal limit.
  origins:
  - project: weinberg-2
    node: weinberg-2.finite-gauge-transformations
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.fock-space-particle-sectors
  label: Fock space and physical particle sectors
  summary: For one particle type, the Fock space is organized into Hilbert spaces
    H_n of physical n-particle states. A state in H_n has on-shell momenta p_i with
    p_i^0>0; for several particle types, the Fock space is the direct sum of their
    associated Hilbert spaces. The source emphasizes that this is not a sum over arbitrary
    four-vectors, because energy is fixed by three-momentum and mass.
  kind: representation
  group: qft.second-quantized-scalar-field
  evidence:
  - source: schwartz
    section: 2.3 Second quantization
    pages:
    - 21
    note: Defines the physical n-particle sectors and their on-shell momentum labels.
  notation:
  - source: schwartz
    note: The source writes |p⃗⟩, |p^μ⟩, and |p⟩ interchangeably for physical momentum
      states, with p_i^0=√(p⃗_i²+m_i²).
  origins:
  - project: schwartz
    node: schwartz.fock-space-particle-sectors
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.free-scalar-field-mode-expansion
  label: Free scalar field as a momentum-mode expansion
  summary: The free scalar field operator is defined by φ_0(x⃗)=∫d^3p/(2π)^3[2ω_p]^−1/2(a_p
    e^{ip⃗·x⃗}+a†_p e^−ip⃗·x⃗). This resembles a classical mode expansion, but the
    coefficients are operators; the source treats the quantum formula itself as the
    definition rather than as a consequence of the classical expression.
  kind: representation
  group: qft.second-quantized-scalar-field
  evidence:
  - source: schwartz
    section: 2.3.1 Field expansion
    pages:
    - 21
    - 22
    note: Defines φ_0 from the momentum-mode operators and states the limited role
      of the classical analogy.
  notation:
  - source: schwartz
    note: The subscript 0 denotes a free field. The spatial phases on these pages
      use p⃗·x⃗.
  origins:
  - project: schwartz
    node: schwartz.free-scalar-field-mode-expansion
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.gauge-field-lagrangian-restrictions
  label: Gauge-field terms and mass restriction
  summary: Within this construction, the gauge field may occur only through field
    strengths and covariant derivatives; a direct quadratic mass term is excluded.
    For a parity-conserving Lorentz-invariant gauge-field term, the source gives −¼
    g_{αβ}F^α_{μν}F^{βμν} with constant g_{αβ}. If parity (or CP or T) conservation
    is not assumed, it may also include L′_A=−½ θ_{αβ}ε^{μνρσ}F^α_{μν}F^β_{ρσ}, with
    constant θ_{αβ}; the source describes this term as a derivative that does not
    affect the field equations or Feynman rules.
  kind: result
  group: qft.nonabelian-gauge-invariance
  evidence:
  - source: weinberg-2
    section: '15.2'
    pages:
    - 7
    note: The opening page of Section 15.2 excludes direct gauge-field dependence
      and the mass term, then gives the parity-conserving quadratic field-strength
      term in equation (15.2.3).
  notation:
  - source: weinberg-2
    note: g_{αβ} is a constant matrix in the displayed quadratic gauge-field Lagrangian
      term.
  - source: weinberg-2
    note: θ_{αβ} is the other constant matrix in the displayed parity-odd term; ε^{μνρσ}
      is the spacetime antisymmetric tensor used there.
  origins:
  - project: weinberg-2
    node: weinberg-2.gauge-field-lagrangian-restrictions
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.gauge-field-transformation
  label: Inhomogeneous gauge-field transformation
  summary: Gauge fields A^α_μ transform as δA^β_μ=∂_μ ε^β+C^β_{γα}ε^α A^γ_μ. The derivative
    of the local parameter supplies the compensating term missing from the derivative
    of a matter field.
  kind: concept
  group: qft.nonabelian-gauge-invariance
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 4
    note: Equations (15.1.8)–(15.1.9) derive the need for and give the gauge-field
      transformation.
  notation:
  - source: weinberg-2
    note: The book includes coupling factors in t_α, and consequently in the structure
      constants, rather than displaying a separate coupling in D_μ.
  origins:
  - project: weinberg-2
    node: weinberg-2.gauge-field-transformation
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.gauge-invariant-lagrangian-ingredients
  label: Gauge-covariant ingredients for a Lagrangian
  summary: A Lagrangian built from matter fields, their gauge-covariant derivatives,
    field strengths, and covariant derivatives of field strengths is gauge invariant
    when it is invariant under the corresponding global transformations, because these
    ingredients transform without derivatives of the local parameters.
  kind: concept
  group: qft.nonabelian-gauge-invariance
  evidence:
  - source: weinberg-2
    section: '15.2'
    pages:
    - 7
    note: The opening of Section 15.2 gives the sufficient construction criterion
      and lists the allowed covariant ingredients in equation (15.2.1).
  origins:
  - project: weinberg-2
    node: weinberg-2.gauge-invariant-lagrangian-ingredients
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.heisenberg-free-field-time-evolution
  label: Heisenberg evolution of a free scalar field
  summary: In the Heisenberg picture, free momentum-mode operators evolve as a_p(t)=e^−iω_pta_p
    and a†_p(t)=e^iω_pta†_p, giving φ_0(x)=∫d^3p/(2π)^3[2ω_p]^−1/2(a_p e^−ipx+a†_p
    e^ipx), with p^μ=(ω_p,p⃗). For a massive scalar, ω_p=√(p⃗²+m²) and the expansion
    satisfies (□+m²)φ(x)=0. Its free-Hamiltonian commutator realizes i∂_tφ=[φ,H_0].
  kind: method
  group: qft.second-quantized-scalar-field
  evidence:
  - source: schwartz
    section: 2.3.2 Time dependence
    pages:
    - 22
    - 23
    note: Introduces Heisenberg time dependence, the spacetime mode expansion, the
      massive dispersion relation, and its Hamiltonian consistency check.
  notation:
  - source: schwartz
    note: On page 22 the displayed field is massless with ω_p=|p⃗|; page 23 gives
      the massive replacement ω_p=√(p⃗²+m²).
  origins:
  - project: schwartz
    node: schwartz.heisenberg-free-field-time-evolution
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.hermitian-local-interaction-condition
  label: Hermiticity and spacelike commutation for scalar interactions
  summary: For a Lorentz-scalar interaction density built from scalar-field pieces,
    hermiticity brings in both annihilation and creation pieces, while Lorentz invariance
    of the S-matrix also requires interaction densities to commute at spacelike separation.
  kind: assumption
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 201
    note: The source states the scalar transformation condition and the additional
      spacelike-commutation condition, then identifies hermiticity as requiring the
      adjoint piece.
  group: qft.causal-scalar-fields
  origins:
  - project: weinberg-1
    node: weinberg-1.hermitian-local-interaction-condition
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.klein-gordon-canonical-hamiltonian
  label: Klein-Gordon canonical Hamiltonian
  summary: For the real Klein-Gordon field, pi = phidot and H = integral d^3x [1/2
    pi^2 + 1/2 (grad phi)^2 + 1/2 m^2 phi^2]. The terms are identified as temporal-motion,
    spatial-gradient, and field-amplitude energy costs.
  kind: result
  group: qft.scalar-field-foundations
  notation:
  - source: peskin-schroeder
    note: This is Eq. (2.8), constructed from the Lagrangian of Eq. (2.6).
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Hamiltonian Field Theory'
    pages:
    - 17
    note: The book states the conjugate momentum and the resulting Hamiltonian for
      the real scalar field.
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.klein-gordon-canonical-hamiltonian
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.klein-gordon-classical-equation
  label: Classical Klein-Gordon equation
  summary: The real Klein-Gordon Lagrangian gives (partial_t^2 - grad^2 + m^2) phi
    = 0, equivalently (partial_mu partial^mu + m^2) phi = 0. In this treatment it
    is a classical field equation rather than a one-particle wave equation.
  kind: result
  group: qft.scalar-field-foundations
  notation:
  - source: peskin-schroeder
    note: The two displayed forms are Eq. (2.7); the sign convention is the one implicit
      in Eq. (2.6).
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Hamiltonian Field Theory'
    pages:
    - 17
    note: The text applies the usual variational procedure to Eq. (2.6) and explicitly
      distinguishes the result from a quantum-mechanical wave equation.
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.klein-gordon-classical-equation
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.klein-gordon-fourier-oscillator-modes
  label: Klein-Gordon Fourier modes as harmonic oscillators
  summary: Expanding the real classical field in spatial Fourier modes gives, for
    each momentum p, [d_t^2 + |p|^2 + m^2] phi(p,t) = 0. Each mode therefore has the
    simple-harmonic-oscillator frequency omega_p = sqrt(|p|^2 + m^2).
  kind: representation
  group: qft.scalar-field-foundations
  notation:
  - source: peskin-schroeder
    note: The expansion is phi(x,t) = integral d^3p/(2pi)^3 exp(i p dot x) phi(p,t),
      with phi*(p) = phi(-p) for a real field.
  evidence:
  - source: peskin-schroeder
    section: 2.3 The Klein-Gordon Field as Harmonic Oscillators
    pages:
    - 20
    note: Equations (2.21) and (2.22) identify the Fourier-space equation and oscillator
      frequency.
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.klein-gordon-fourier-oscillator-modes
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.lie-algebra-structure-constants
  label: Lie-algebra generators and structure constants
  summary: The generators obey [t_α,t_β]=i C^γ_{αβ}t_γ. The real structure constants
    are antisymmetric in α and β and obey the Jacobi constraint inherited from the
    generator commutator.
  kind: representation
  group: qft.nonabelian-gauge-invariance
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 2
    - 3
    note: Equations (15.1.2)–(15.1.5) give the commutator, antisymmetry, and Jacobi
      constraint.
  notation:
  - source: weinberg-2
    note: The book writes the structure constants as C^γ_{αβ}; their placement should
      not be silently replaced by another convention.
  origins:
  - project: weinberg-2
    node: weinberg-2.lie-algebra-structure-constants
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.local-field-action
  label: Local field action
  summary: For fields phi(x), the action is the spacetime integral of a local Lagrangian
    density L(phi, partial_mu phi); stationary variations are taken with fixed boundary
    field configurations.
  kind: method
  group: qft.scalar-field-foundations
  notation:
  - source: peskin-schroeder
    note: The book calls the Lagrangian density script L simply the Lagrangian, and
      writes S = integral d^4x L(phi, partial_mu phi).
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Lagrangian Field Theory'
    pages:
    - 15
    - 16
    note: The action is expressed through a local density depending on fields and
      their derivatives; the boundary conditions used to eliminate the surface term
      span pp. 15-16.
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.local-field-action
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.local-matter-gauge-transformations
  label: Local infinitesimal transformations of matter fields
  summary: Matter components transform infinitesimally as δψ_l(x)=i ε^α(x)(t_α)_l{}^m
    ψ_m(x), with real spacetime-dependent parameters and constant generator matrices.
  kind: concept
  group: qft.nonabelian-gauge-invariance
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 2
    note: Equation (15.1.1) states the local matter-field transformation and identifies
      the parameters and generators.
  notation:
  - source: weinberg-2
    note: Weinberg uses Greek generator labels α, β, … and spacetime indices μ, ν,
      …; matter components are ψ_l.
  origins:
  - project: weinberg-2
    node: weinberg-2.local-matter-gauge-transformations
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.momentum-mode-creation-annihilation-algebra
  label: Momentum-mode creation and annihilation algebra
  summary: Free-field momentum modes use operators satisfying [a_k,a†_p]=(2π)^3δ^3(p⃗−k⃗).
    The creation operator creates a one-particle momentum state according to a†_p|0⟩=(2ω_p)^−1/2|p⃗⟩.
    With this normalization, the one-particle identity is ∫d^3p/((2π)^3 2ω_p) |p⃗⟩⟨p⃗|.
  kind: representation
  group: qft.second-quantized-scalar-field
  evidence:
  - source: schwartz
    section: 2.3.1 Field expansion
    pages:
    - 21
    note: Gives the continuum commutator, vacuum-to-one-particle convention, normalization,
      and identity resolution.
  notation:
  - source: schwartz
    note: The factors of 2π and √(2ω_p) are stated to be conventions; ω_p is the mode
      energy.
  origins:
  - project: schwartz
    node: schwartz.momentum-mode-creation-annihilation-algebra
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.nonabelian-field-strength
  label: Non-Abelian field strength from covariant-derivative commutators
  summary: The commutator [D_ν,D_μ] acting on matter defines F^γ_{νμ}; explicitly
    F^γ_{νμ}=∂_νA^γ_μ−∂_μA^γ_ν+C^γ_{αβ}A^α_νA^β_μ. It transforms homogeneously in
    the adjoint representation. The source identifies this as a commutator construction
    and leaves a direct transformation-law check to the reader.
  kind: result
  group: qft.nonabelian-gauge-invariance
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 5
    note: Equations (15.1.12)–(15.1.14) define the field strength through the commutator
      and give its transformation law.
  notation:
  - source: weinberg-2
    note: The source orders the spacetime indices as F^γ_{νμ}; the displayed nonlinear
      term uses A^α_νA^β_μ.
  origins:
  - project: weinberg-2
    node: weinberg-2.nonabelian-field-strength
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.nonzero-spacelike-mixed-commutator
  label: Nonzero spacelike mixed commutator
  summary: The mixed bracket of the annihilation and creation scalar-field pieces
    is Δ₊(x − y). Although Δ₊ is Lorentz invariant and even for spacelike arguments,
    it does not vanish there, so an annihilation piece alone cannot supply a hermitian
    local interaction.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 202
    note: Equations (5.2.6)–(5.2.9) define Δ₊ and evaluate it for spacelike separation
      before establishing that it is nonzero.
  notation:
  - source: weinberg-1
    note: Δ₊(x) denotes the positive-frequency integral in equation (5.2.7).
  group: qft.causal-scalar-fields
  origins:
  - project: weinberg-1
