- id: qft.abelian-curvature-from-holonomy
  label: Abelian curvature from holonomy and covariant-derivative commutators
  summary: An infinitesimal closed comparator loop measures F_mu_nu=partial_mu A_nu-partial_nu
    A_mu. The same curvature is obtained from the covariant-derivative commutator,
    and a closed Abelian Wilson loop is gauge invariant and related by Stokes theorem
    to flux.
  kind: result
