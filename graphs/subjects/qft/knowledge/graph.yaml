- id: qft.one-particle-nonrelativistic-wavefunction-limit
  label: One-particle wavefunction and nonrelativistic limit
  summary: Restricting the second-quantized theory to one-particle states gives ⟨x|=⟨0|φ(x)
    and ψ(x)=⟨x|ψ⟩. For a massive free field, this wavefunction obeys i∂_tψ=√(m²−∇⃗²)ψ.
    Expanding at low energy and removing the rest-energy contribution gives i∂_tψ=−∇⃗²ψ/(2m),
    the free nonrelativistic Schrödinger equation.
  kind: result
  group: qft.second-quantized-scalar-field
  evidence:
  - source: schwartz
    section: 2.3.2 Time dependence
    pages:
    - 23
    - 24
    note: Defines the one-particle wavefunction and derives its massive free-field
      and low-energy forms.
  notation:
  - source: schwartz
    note: The source calls the final expansion a low-energy (large-mass) expansion
      and obtains the nonrelativistic equation after subtracting the mc² energy contribution.
  origins:
  - project: schwartz
    node: schwartz.one-particle-nonrelativistic-wavefunction-limit
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.one-particle-position-state-from-field
  label: One-particle position state from a field operator
  summary: Projecting the field-created vacuum state onto a momentum state gives ⟨p⃗|φ_0(x⃗)|0⟩=e^−ip⃗·x⃗.
    Hence |x⃗⟩≡φ_0(x⃗)|0⟩ is the unique one-particle state with that momentum-space
    overlap. Other Fock-space states can share the overlap if they include additional
    zero- or two-particle components, so the uniqueness claim is specifically within
    the one-particle sector.
  kind: result
  group: qft.second-quantized-scalar-field
  evidence:
  - source: schwartz
    section: 2.3.1 Field expansion
    pages:
    - 22
    note: Computes the momentum projection and states the one-particle-sector qualification
      on the position state.
  notation:
  - source: schwartz
    note: The source uses |x⃗⟩ for φ_0(x⃗)|0⟩ and distinguishes it from arbitrary
      Fock-space states with the same one-particle projection.
  origins:
  - project: schwartz
    node: schwartz.one-particle-position-state-from-field
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.parity-covariance-constraint
  label: Parity covariance constrains intrinsic parities
  summary: Requiring the parity-transformed causal scalar field to remain proportional
    to the field that can coexist with it forces ηᶜ = η*. Thus a spinless particle-antiparticle
    pair has even intrinsic parity; for a self-conjugate spinless particle, η is real
    and equals ±1.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 205
    - 206
    note: Equations (5.2.18)–(5.2.19) derive the particle-antiparticle parity relation,
      and the next page gives its self-conjugate consequence.
  notation:
  - source: weinberg-1
    note: η and ηᶜ are the intrinsic parities of particle and antiparticle, and ℘x
      = (−x, x⁰).
  group: qft.causal-scalar-fields
  origins:
  - project: weinberg-1
    node: weinberg-1.parity-covariance-constraint
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.pauli-jordan-commutator
  label: Complex scalar-field commutator
  summary: The complex scalar field satisfies [φ(x), φ†(y)] = Δ(x − y), where Δ is
    the difference Δ₊(x − y) − Δ₊(y − x).
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 205
    note: Equations (5.2.12) and (5.2.13) state the field commutator and define Δ.
  notation:
  - source: weinberg-1
    note: The source denotes this commutator kernel by Δ, defined as an antisymmetrized
      Δ₊.
  group: qft.causal-scalar-fields
  origins:
  - project: weinberg-1
    node: weinberg-1.pauli-jordan-commutator
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.peskin-canonical-quantization-prescription
  label: Peskin-Schroeder canonical quantization prescription for a real field
  summary: In the Peskin-Schroeder real-field route, canonical quantization promotes
    phi and its conjugate momentum density pi to operators and stipulates their equal-time
    commutators. This is the source-specific prescription route to the shared equal-time
    algebra, rather than a prerequisite for the separate Schwartz mode derivation.
  kind: method
  group: qft.scalar-field-foundations
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.canonical-quantization-real-field
    note: Preserves the full canonical-quantization prescription in this source-specific
      route; its stipulated equal-time algebra is represented by the shared result
      separately.
  evidence:
  - source: peskin-schroeder
    section: 2.3 The Klein-Gordon Field as Harmonic Oscillators
    pages:
    - 19
    - 20
    note: The text first states promotion of phi and pi, then gives the continuous-system
      equal-time commutation relations.
  notation:
  - source: peskin-schroeder
    note: The equal-time relations are introduced in the Schroedinger picture; the
      book says they also hold at a common time after switching to the Heisenberg
      picture.
- id: qft.pure-gauge-flatness
  label: Pure gauge and the flatness criterion
  summary: A gauge field is pure gauge when a gauge transformation can make it vanish
    everywhere. In a simply connected region, vanishing field strength is stated to
    be both necessary and sufficient for this condition.
  kind: result
  group: qft.nonabelian-gauge-invariance
  evidence:
