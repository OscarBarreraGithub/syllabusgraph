- id: qft.align006.avv-aaa-routing-and-gauge-invariant-completion
  label: AVV/AAA routing and exact gauge-invariant anomaly completions
  summary: For one global/axial current and two gauged/vector currents, a=k₁−k₂ preserves
    both vector currents and gives [∂_μΓ_{αβγ}^{μνρ}]_anom=−D_{αβγ}ε^{κνλρ}∂_{yκ}δ⁴(y−x)∂_{zλ}δ⁴(z−x)/(4π²).
    For AAA, a=(k₁−k₂)/3 gives one third of AVV. With V_μ=λ_aV_{μa}/2, A_μ=λ_aA_{μa}/2,
    V_{μν}=∂_μV_ν−∂_νV_μ−i[V_μ,V_ν]−i[A_μ,A_ν], and A_{μν}=∂_μA_ν−∂_νA_μ−i[V_μ,A_ν]−i[A_μ,V_ν],
    Bardeen's vector-conserving result is 𝒳_aΓ=iε^{μνρσ}Tr{2λ_a[V_{μν}V_{ρσ}+A_{μν}A_{ρσ}/3−32A_μA_νA_ρA_σ/3+(8i/3)(A_μA_νV_{ρσ}+A_μV_{ρσ}A_ν+V_{ρσ}A_μA_ν)]}/(32π²).
    For all currents treated symmetrically, square and pentagon graphs complete the
    triangle to [D_μJ^μ_α]_anom=−ε^{κνλρ}Tr{T_α[∂_κA_ν∂_λA_ρ−(i/2)∂_κA_νA_λA_ρ+(i/2)A_κ∂_νA_λA_ρ−(i/2)A_κA_ν∂_λA_ρ]}/(24π²).
  kind: method
  group: qft.anomaly-regularization-and-matching
  origins:
  - project: weinberg-2
    node: weinberg-2.avv-aaa-routing-and-gauge-invariant-completion
    note: Retains this reviewed book-specific treatment, including its stated conditions,
      conventions, and proof or task boundary.
  evidence:
