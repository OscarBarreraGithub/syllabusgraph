nodes:
- id: qft.adjoint-representation
  label: Adjoint representation from structure constants
  summary: For structure constants satisfying the displayed antisymmetry and Jacobi
    relation, matrices (t^A_α)^β{}_γ=−i C^β_{γα} furnish the adjoint (regular) representation
    of the Lie algebra.
  kind: representation
  group: qft.nonabelian-gauge-invariance
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 3
    note: Equations (15.1.6)–(15.1.7) construct and name the adjoint representation.
  notation:
  - source: weinberg-2
    note: A superscript A on t denotes the adjoint representation in this treatment.
  origins:
  - project: weinberg-2
    node: weinberg-2.adjoint-representation
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.atom-photon-interaction-hamiltonian
  label: Atom-photon interaction Hamiltonian
  summary: For the Einstein-coefficient application, split H=H_0+H_int with H_0=H_atom+H_photon
    and treat the remaining interaction perturbatively. A semiclassical form H_int=φH_I
    makes the photon field dynamical and its ladder-operator matrix elements produce
    the √n and √(n+1) factors.
  kind: method
  group: qft.free-scalar-quantization
  origins:
  - project: schwartz
    node: schwartz.atom-photon-interaction-hamiltonian
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: 2.3.4 Einstein coefficients revisited
    pages:
    - 26
    note: Recasts the atomic transition calculation with a quantum photon field.
  notation: []
- id: qft.blackbody-cavity-modes-and-classical-spectrum
  label: Blackbody cavity modes and the classical spectrum
  summary: A thermal blackbody can be idealized as a periodic box of electromagnetic
    standing-wave modes. Classical equipartition assigns equal thermal energy to modes,
    so their growing phase-space density gives an intensity proportional to ω²kBT
    (with c restored as c⁻³).
  kind: representation
  group: qft.radiation-quantization
  origins:
  - project: schwartz
    node: schwartz.blackbody-cavity-modes-and-classical-spectrum
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: 1.1 Blackbody radiation
    pages:
    - 3
    note: Defines the cavity modes and obtains the equipartition spectrum.
  notation: []
- id: qft.bosonic-spontaneous-and-stimulated-emission-factor
  label: Bosonic spontaneous and stimulated emission factor
  summary: For atomic de-excitation into a photon mode already occupied by n_ω photons,
    the squared amplitude is proportional to n_ω+1; excitation is proportional to
    n_ω. The additive one is the spontaneous contribution and the occupation term
    is stimulated emission or absorption.
  kind: result
  group: qft.radiation-quantization
  origins:
  - project: schwartz
    node: schwartz.bosonic-spontaneous-and-stimulated-emission-factor
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: 1.3 Quantum field theory
    pages:
    - 9
    note: Obtains the nω+1 and nω transition factors.
  notation: []
- id: qft.canonical-and-path-integral-quantization-routes
  label: Canonical and path-integral quantization routes
  summary: The source identifies canonical quantization and the Feynman path integral
    as two common approaches to field theory. Canonical quantization supplies physical
    operator insight and is needed for some results such as LSZ, while path integrals
    are more concise and support applications such as nonperturbative QCD.
  kind: method
  group: qft.lorentz-and-oscillators
  origins:
  - project: schwartz
    node: schwartz.canonical-and-path-integral-quantization-routes
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: Chapter 2 introduction
    pages:
    - 10
    note: Contrasts the two approaches and gives source-specific examples.
  notation: []
- id: qft.canonical-field-momentum-hamiltonian
  label: Canonical momentum and Hamiltonian for a field
  summary: The conjugate momentum density is pi(x) = partial L / partial phidot(x),
    and the Hamiltonian is H = integral d^3x [pi phidot - L]. This is the continuum
    Legendre construction used for the field.
  kind: method
  group: qft.scalar-field-foundations
  notation:
  - source: peskin-schroeder
    note: pi(x) denotes momentum density, whereas the physical momentum associated
      with translations is treated separately later.
  - source: schwartz
    note: Schwartz presents the construction in density form and separates the scalar
      energy-density specialization.
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Hamiltonian Field Theory'
    pages:
    - 16
    note: The text obtains the momentum density by a discretization argument and then
      passes to the continuum Hamiltonian density.
  - source: schwartz
    section: 3.1 Hamiltonians and Lagrangians
    pages:
    - 29
    - 30
    note: Introduces field Hamiltonians through the Legendre transform and gives the
      scalar energy density.
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.canonical-field-momentum-hamiltonian
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
  - project: schwartz
    node: schwartz.classical-field-hamiltonian-lagrangian-legendre-transform
    note: Corresponds to the general field Legendre construction.
  - project: schwartz
    node: schwartz.canonical-scalar-field-energy-density
    note: Supplies the scalar-field energy-density specialization of the same Legendre
      construction.
- id: qft.canonical-quantum-harmonic-oscillator
  label: Canonical quantum harmonic oscillator
  summary: Quantizing a linear oscillator promotes x and p to [x,p]=i; the combinations
    a and a† obey [a,a†]=1 and put H=ω(a†a+1/2). In the Heisenberg picture the annihilation
    operator evolves as a(t)=e^(−iωt)a(0).
  kind: method
  group: qft.lorentz-and-oscillators
  origins:
  - project: schwartz
    node: schwartz.canonical-quantum-harmonic-oscillator
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: 2.2.1 Simple harmonic oscillator
    pages:
    - 18
    note: Reviews canonical oscillator quantization and time evolution.
  notation: []
- id: qft.charge-conjugation-time-reversal-phase-constraints
  label: Charge-conjugation and time-reversal phase constraints
  summary: For the causal scalar field to transform proportionally under charge conjugation,
    the one-particle phases obey ξᶜ = ξ*. Time reversal is antiunitary; requiring
    a simple relation to the field at the time-reversed point instead gives ζᶜ = ζ*.
    In the self-conjugate case the charge-conjugation phase is real and equals ±1.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 206
    note: Equations (5.2.20)–(5.2.31) derive the charge-conjugation and time-reversal
      phase conditions for the scalar field.
  notation:
  - source: weinberg-1
    note: ξ and ζ are the one-particle phases for charge conjugation and time reversal,
      respectively.
  group: qft.causal-scalar-fields
  origins:
  - project: weinberg-1
    node: weinberg-1.charge-conjugation-time-reversal-phase-constraints
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.charge-conservation-obstruction
  label: Charge-conservation obstruction for a self-adjoint field
  summary: If the particle carries a conserved charge, charge-preserving interaction
    terms need equal numbers of a(p) and a†(p). This cannot be achieved by a polynomial
    solely in the self-adjoint neutral-field combination, which lacks a simple commutator
    with the charge operator.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 203
    note: The source contrasts the simple charge commutators of φ⁺ and its adjoint
      with the self-adjoint field.
  group: qft.causal-scalar-fields
  origins:
  - project: weinberg-1
    node: weinberg-1.charge-conservation-obstruction
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.classical-feynman-diagrams-and-rules
  label: Classical Feynman diagrams and rules
  summary: 'The iterative Green-function solution can be represented by diagrams:
    propagator lines connect the observation point, source insertions, and nonlinear
    branching vertices weighted by λ, with internal points integrated. The source
    calls these Feynman diagrams and distinguishes the quantum extension by the possibility
    of loops when ℏ is nonzero. Problem 3.4 asks for the next-order diagrams, their
    integral expressions, and a Green-function check of the result.'
  kind: representation
  group: qft.classical-field-theory
  origins:
  - project: schwartz
    node: schwartz.classical-feynman-diagrams-and-rules
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: 3.5 Green's functions
    pages:
    - 42
    note: States the classical diagram rules and their physical gravity example.
  - source: schwartz
    section: Problem 3.4
    pages:
    - 43
    note: Extends the diagram expansion and checks it against Green functions.
  notation: []
- id: qft.classical-spontaneous-symmetry-breaking
  label: Classical spontaneous symmetry breaking
  summary: For a real scalar with a negative mass term and stabilizing quartic interaction,
    constant solutions of the field equation include ground states that need not respect
    the Lagrangian's φ→−φ symmetry. Expanding φ=c+π about a selected vacuum gives
    a fluctuation theory and illustrates spontaneous breaking of a discrete Z₂ symmetry.
  kind: result
  group: qft.classical-field-theory
  origins:
  - project: schwartz
    node: schwartz.classical-spontaneous-symmetry-breaking
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: Problem 3.5 Spontaneous symmetry breaking
    pages:
    - 43
    note: Specifies the classical symmetry-breaking construction.
  notation: []
- id: qft.cm-high-energy-muon-pair-setup
  label: High-energy center-of-mass muon-pair setup
  summary: The introductory e+e- to mu+mu- calculation takes p'=-p and k'=-k in the
    CM frame and neglects electron and muon masses by assuming E is much larger than
    both. It averages unobserved initial spins and sums unobserved final spins.
  kind: assumption
  group: qft.qed-scattering
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.cm-high-energy-muon-pair-setup
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: peskin-schroeder
    section: Chapter 1, The Simplest Situation
    pages:
    - 4
    note: The source explicitly states the CM relations, high-energy massless approximation,
      and spin convention.
  notation:
  - source: peskin-schroeder
    note: Bold symbols are 3-vectors and italic symbols 4-vectors; theta is the scattering
      angle.
- id: qft.coherent-states-of-the-oscillator
  label: Coherent states of the harmonic oscillator
  summary: The problem defines |z⟩=e^(za†)|0⟩, asks to show it is an eigenstate of
    a, and studies its occupation amplitudes and minimum uncertainty ΔpΔx=1/2. It
    also asks why a† cannot have an eigenstate.
  kind: representation
  group: qft.lorentz-and-oscillators
  origins:
  - project: schwartz
    node: schwartz.coherent-states-of-the-oscillator
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: Problem 2.7 Coherent states of the simple harmonic oscillator
    pages:
    - 28
    note: Specifies the coherent-state construction and properties.
  notation: []
- id: qft.coherent-sum-of-diagram-amplitudes
  label: Coherent addition of allowed diagram amplitudes
  summary: When more than one diagram contributes, add the amplitudes before squaring.
    The source illustrates this with Bhabha scattering, which has a second lowest-order
    diagram.
  kind: result
  group: qft.qed-scattering
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.coherent-sum-of-diagram-amplitudes
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: peskin-schroeder
    section: Chapter 1
    pages:
    - 10
    note: The Bhabha example explicitly says the two diagram amplitudes must first
      be added, then squared.
  notation: []
- id: qft.complex-causal-scalar-field
  label: Complex causal scalar field from particle and antiparticle
  summary: For spinless bosons of equal mass and opposite charges, combining a particle
    annihilation field with an antiparticle creation field gives φ(x) = φ⁺(x) + φ⁺c†(x).
    The field has [Q, φ(x)] = −qφ(x) and is the essentially unique causal scalar field
    in this construction; it covers self-conjugate neutral particles as the special
    case aᶜ(p) = a(p).
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 203
    - 204
    note: The source introduces opposite-charge equal-mass bosons, forms the charge-eigenfield,
      and gives its normalized mode expansion in equation (5.2.11).
  notation:
  - source: weinberg-1
    note: Superscript c labels the charge-conjugate particle; φ⁺c† is the adjoint
      of its annihilation field.
  group: qft.causal-scalar-fields
  origins:
  - project: weinberg-1
    node: weinberg-1.complex-causal-scalar-field
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.complex-scalar-u1-current
  label: Complex scalar U(1) current
  summary: The complex Klein-Gordon Lagrangian is invariant under the global phase
    rotation phi to exp(i alpha)phi. Treating phi and phi-star as independent fields
    gives j^mu=i[(partial^mu phi-star)phi-phi-star(partial^mu phi)], whose charge
    later has an electromagnetic interpretation after coupling.
  kind: result
  group: qft.field-symmetry-and-charge
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.complex-scalar-u1-current
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  - project: schwartz
    node: schwartz.noether-current-and-conserved-charge
    note: Corresponds to Schwartz’s complex-scalar global-U(1) example. Its phi ->
      exp(-i alpha)phi convention reverses the displayed current’s overall sign relative
      to Peskin-Schroeder’s convention.
  - project: schwartz
    node: schwartz.complex-scalar-global-u1-symmetry
    note: Corresponds to Schwartz’s global complex-scalar U(1) symmetry used in the
      p. 33 current derivation; the sign convention is retained separately.
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Noether''s Theorem'
    pages:
    - 18
    note: Equations (2.14)-(2.16) specify the phase symmetry, current, and later electromagnetic-current
      interpretation.
  - source: schwartz
    section: 3.3 Noether’s theorem
    pages:
    - 33
    note: The global phase variation is substituted into the Noether current.
  notation:
  - source: peskin-schroeder
    note: The source chooses the current's overall normalization arbitrarily.
  - source: schwartz
    note: Schwartz uses phi -> exp(-i alpha) phi; this reverses the overall displayed
      current sign relative to Peskin-Schroeder’s exp(i alpha) convention.
- id: qft.compton-scattering-as-photon-momentum-application
  label: Compton scattering as photon momentum application
  summary: The Compton-scattering problem treats crystal electrons as free for the
    collision, derives the reflected X-ray frequency versus angle, examines the massless-electron
    limit, and asks what distribution would be expected without quantized photon momentum.
  kind: method
  group: qft.radiation-quantization
  origins:
  - project: schwartz
    node: schwartz.compton-scattering-as-photon-momentum-application
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: Problem 2.5 Compton scattering
    pages:
    - 27
    note: Poses the momentum-quantization scattering test.
  notation: []
- id: qft.coulomb-potential-from-field-propagation
  label: Coulomb potential from field propagation
  summary: For a static point source J⁰=eδ³(x⃗), Lorenz-gauge Maxwell theory gives
    A⁰=−e∆⁻¹δ³(x⃗). Fourier transformation and contour integration yield A⁰(r)=e/(4πr),
    recovering the Coulomb potential as propagation from the source.
  kind: result
  group: qft.classical-field-theory
  origins:
  - project: schwartz
    node: schwartz.coulomb-potential-from-field-propagation
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: 3.4.2 Coulomb potential
    pages:
    - 39
    note: Calculates the potential from the point-charge source.
  notation: []
- id: qft.covariant-derivative
  label: Covariant derivative of matter fields
  summary: The operator (D_μψ)_l=∂_μψ_l−iA^β_μ(t_β)_l{}^mψ_m is constructed so that
    D_μψ transforms in the same representation as ψ under the local transformation.
    This records the endpoint of the source's cancellation argument through equation
    (15.1.11).
  kind: method
  group: qft.nonabelian-gauge-invariance
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 4
    note: Equations (15.1.10)–(15.1.11) define D_μ and show its homogeneous transformation.
  notation:
  - source: weinberg-2
    note: D_μ acts on matter components through the representation matrices t_β.
  origins:
  - project: weinberg-2
    node: weinberg-2.covariant-derivative
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.current-roles-and-nondynamical-sources
  label: Roles of currents and nondynamical sources
  summary: A current can be a Noether current, an external prescribed charge flow,
    a source coupled as −A_μJ^μ, or a placeholder for matter terms. In the external-source
    role it has no kinetic term and is not solved dynamically alongside propagating
    fields; the notation separates source production from field response.
  kind: concept
  group: qft.classical-field-theory
  origins:
  - project: schwartz
    node: schwartz.current-roles-and-nondynamical-sources
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: 3.3.2 Currents
    pages:
    - 36
    note: Lists current roles and states the nondynamical-source qualification.
  notation: []
- id: qft.discrete-lorentz-transformations-and-causal-type
  label: Discrete Lorentz transformations and causal type
  summary: Parity P and time reversal T preserve the Minkowski metric but are not
    products of rotations and boosts. Lorentz-invariant norms classify vectors as
    timelike, spacelike, or lightlike; a four-momentum is lightlike exactly when the
    particle is massless. Problem 2.4 tests whether a single-coordinate reflection
    is Lorentz and why it is not counted with P and T.
  kind: concept
  group: qft.lorentz-and-oscillators
  origins:
  - project: schwartz
    node: schwartz.discrete-lorentz-transformations-and-causal-type
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: 2.1.3 Discrete transformations
    pages:
    - 16
    note: Defines P, T, and the norm-based causal classifications.
  - source: schwartz
    section: Problem 2.4
    pages:
    - 27
    note: Applies the definition to an improper single-coordinate reflection.
  notation: []
- id: qft.einstein-emission-and-absorption-coefficients
  label: Einstein emission and absorption coefficient relations
  summary: For two atomic levels, the spontaneous-emission coefficient A, stimulated-emission
    coefficient B, and absorption coefficient B′ satisfy B=B′ and A/B=ℏω³/π². The
    source develops this common result both through thermal detailed balance and through
    a field-theoretic transition-rate calculation that does not assume equilibrium.
  kind: result
  group: qft.radiation-quantization
  origins:
  - project: schwartz
    node: schwartz.einstein-emission-and-absorption-coefficients
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: 1.2 Einstein coefficients
    pages:
    - 6
    note: Obtains the coefficient relations from equilibrium.
  - source: schwartz
    section: 1.3 Quantum field theory
    pages:
    - 9
    note: Obtains the same relations without assuming thermal equilibrium.
  notation: []
- id: qft.energy-momentum-tensor-improvement-ambiguity
  label: Energy-momentum tensor improvement ambiguity
  summary: The problem investigates how adding a total derivative ∂_μX^μ to a Lagrangian
    changes the canonical energy-momentum tensor while leaving the integrated total
    energy invariant, and asks how to obtain a symmetric tensor for electromagnetism.
    It identifies that local tensor representatives are not unique.
  kind: concept
  group: qft.classical-field-theory
  origins:
  - project: schwartz
    node: schwartz.energy-momentum-tensor-improvement-ambiguity
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: Problem 3.3 Ambiguities in the energy-momentum tensor
    pages:
    - 43
    note: States the total-derivative, total-energy, and symmetry questions.
  notation: []
- id: qft.equal-time-scalar-field-commutators
  label: Equal-time canonical commutators of a scalar field
  summary: At a common time, a scalar field and its conjugate momentum satisfy [phi(x),
    pi(y)] = i delta^(3)(x-y), while the field-field and momentum-momentum commutators
    vanish. Peskin and Schroeder state this as the canonical quantization prescription
    for a real field; Schwartz derives the same equal-time algebra from momentum modes
    and notes its fixed-time interacting-theory extension. Neither treatment here
    supplies an unequal-time relation.
  kind: result
  group: qft.scalar-field-foundations
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.canonical-quantization-real-field
    note: Corresponds to the real-field canonical prescription, including promotion
      of phi and pi to operators; the source presents it first in the Schroedinger
      picture and then at common Heisenberg time.
  - project: schwartz
    node: schwartz.equal-time-scalar-field-commutation-relations
    note: Corresponds to the equal-time scalar algebra derived from the free mode
      expansion; the source also states the same fixed-time relations for interacting
      fields.
  evidence:
  - source: peskin-schroeder
    section: 2.3 The Klein-Gordon Field as Harmonic Oscillators
    pages:
    - 19
    - 20
    note: The text first states promotion of phi and pi, then gives the continuous-system
      equal-time commutation relations.
  - source: schwartz
    section: 2.3.3 Commutation relations
    pages:
    - 24
    - 25
    note: Derives the field commutator from the mode algebra, defines the conjugate
      momentum, and gives the canonical equal-time commutator.
  notation:
  - source: peskin-schroeder
    note: The equal-time relations are introduced in the Schroedinger picture; the
      book says they also hold at a common time after switching to the Heisenberg
      picture.
  - source: schwartz
    note: The source explicitly limits the derivation to equal time and says the different-time
      calculation is more subtle.
- id: qft.equilibration-requires-particle-creation-and-destruction
  label: Equilibration requires particle creation and destruction
  summary: For radiation of initially one frequency to thermalize into all frequencies,
    different particle types must turn into one another. The source uses this need
    for creation and destruction as a motivation for quantum field theory.
  kind: concept
  group: qft.radiation-quantization
  origins:
  - project: schwartz
    node: schwartz.equilibration-requires-particle-creation-and-destruction
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: 1.1 Blackbody radiation
    pages:
    - 5
    note: Explains why equilibration motivates QFT.
  notation: []
- id: qft.fermi-golden-rule-field-interaction
  label: Fermi golden rule for a field-creating interaction
  summary: Using Γ∼|⟨f|H_int|i⟩|²δ(E_f−E_i), a Hermitian interaction that creates
    or annihilates the photon has form H_I†a†+H_Ia. Its atomic matrix element supplies
    the transition amplitude while the oscillator operator changes photon occupation.
  kind: method
  group: qft.radiation-quantization
  origins:
  - project: schwartz
    node: schwartz.fermi-golden-rule-field-interaction
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
  - source: schwartz
    section: 1.3 Quantum field theory
    pages:
    - 8
    note: Applies Fermi's golden rule and the creation-annihilation interaction.
  notation: []
- id: qft.field-euler-lagrange-equation
  label: Field Euler-Lagrange equation
  summary: Varying a local field action with boundary-vanishing variations yields
    partial_mu[partial L / partial(partial_mu phi)] - partial L / partial phi = 0;
    one equation occurs for each field.
  kind: result
  group: qft.scalar-field-foundations
  notation:
  - source: peskin-schroeder
    note: This is Eq. (2.3), with partial_mu acting on the derivative of the Lagrangian
      density with respect to partial_mu phi.
  - source: schwartz
    note: The p. 42 extension concerns higher-derivative Lagrangians and is a qualification
      rather than the first-derivative formula.
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Lagrangian Field Theory'
    pages:
    - 16
    note: The derivation removes the surface term by boundary conditions and uses
      arbitrary variations to obtain the local equation of motion.
  - source: schwartz
    section: 3.2 The Euler-Lagrange equations
