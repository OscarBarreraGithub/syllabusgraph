- id: qft.pure-gauge-asymptotics-and-instanton-dimension
  label: Pure-gauge asymptotics and instanton dimension constraint
  summary: Finite Euclidean Yang–Mills S[A]=¼∫d^dx F^a_ijF^a_ij permits a direction-dependent
    pure-gauge asymptote A_i→g⁻¹∂_ig, defining a based map S^(d−1)→G and π_(d−1)(G).
