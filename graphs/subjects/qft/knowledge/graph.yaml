- id: qft.align013.peskin-schroeder.dis-n2-energy-momentum-conservation-and-asymptotic-fractions
  label: n-equals-two conservation eigenvector and asymptotic momentum fractions
  summary: At n=2 the zero-anomalous-dimension left eigenvector is the total QCD energy-momentum
    tensor T_mu_nu=sum_f O_f^(2)+O_g^(2). Its proton matrix element implies sum_f
    A_f^(2)+A_g^(2)=1, the momentum sum rule. Other n=2 components decay logarithmically.
    In the Q^2 to infinity limit, integral_0^1 dx x f_f^+(x,Q^2) tends to 3/(16+3n_f)
    for each flavor and integral_0^1 dx x f_g(x,Q^2) tends to 16/(16+3n_f); for n_f=4
    these are 3/28 and 4/7, approached slowly from physical PDFs.
