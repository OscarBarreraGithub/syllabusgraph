    section: Chapter 1
    pages:
    - 8
    note: Equations (1.8) and (1.9) follow the spin average and sum and are described
      as angularly dependent with sharp energy decrease.
  notation:
  - source: peskin-schroeder
    note: alpha=e^2/(4 pi) in the book's units.
- id: qft.two-level-equilibrium-detailed-balance
  label: Two-level equilibrium detailed balance
  summary: For atoms with energies E₁ and E₂ separated by ℏω, the population-rate
    equation includes spontaneous emission A, stimulated emission BI(ω), and absorption
    B′I(ω). In thermal equilibrium, zero net rate together with n_i proportional to
    e^(−βE_i) gives I(ω)=A/[B′e^(βℏω)−B].
  kind: method
  group: qft.radiation-quantization
  origins:
  - project: schwartz
    node: schwartz.two-level-equilibrium-detailed-balance
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
