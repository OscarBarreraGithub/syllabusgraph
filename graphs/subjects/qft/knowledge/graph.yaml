- id: qft.align013.peskin-schroeder.quark-twist-two-anomalous-dimension
  label: Quark twist-two anomalous dimensions suppress higher moments
  summary: Compute the counterterms for O_f^(n) with zero momentum injected at the
    insertion, symmetrize all indices, and subtract traces. Besides the vertex graph,
    explicit gauge fields in iD_mu=i partial_mu-g A_mu^a t^a generate two external-leg
    contraction diagrams. The resulting one-loop gamma_f^(n) vanishes at n=1, protecting
    flavor number; for n>1 it is positive (equivalently its a_f^(n) coefficient is
    negative in the chapter convention), so higher quark-distribution moments decrease
    as Q^2 grows.
