- id: qft.align006.adler-bardeen-radiative-and-mass-decoupling-qualification
  label: Radiative nonrenormalization and symmetry-allowed mass decoupling
  summary: 'The chapter gives only the gist of the external Adler-Bardeen all-orders
    analysis: its surface-term power counting says virtual gauge interactions inside
    the anomalous fermion loop lower its degree enough to remove radiative contributions,
    while external-field interactions renormalize the local F F operator. Separately,
    its displayed mass-matrix/Schur-lemma argument shows that fermions with a symmetry-allowed
    mass contribute zero or cancel in the anomaly.'
  kind: result
  group: qft.anomaly-regularization-and-matching
  origins:
