- id: qft.weinberg-1.locality-condition-to-mixed-bracket
  from: qft.hermitian-local-interaction-condition
  to: qft.nonzero-spacelike-mixed-commutator
  relation: prerequisite
  source_level: recognize
  target_level: derive
  necessity: necessary
  rationale: The mixed bracket is calculated because hermiticity requires both field
    pieces while the interaction must satisfy spacelike commutation.
  failure_mode: Without the two requirements, the nonzero mixed bracket is an isolated
    calculation rather than the obstruction it establishes.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 201
    - 202
    note: The text poses the hermiticity/locality problem and immediately evaluates
      the mixed bracket as Δ₊.
- id: qft.weinberg-1.mixed-bracket-to-real-field
  from: qft.nonzero-spacelike-mixed-commutator
  to: qft.real-causal-scalar-field
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The even, nonzero spacelike Δ₊ term is the quantity whose cancellation
    fixes Bose statistics and the relative coefficient magnitudes.
  failure_mode: A learner cannot justify the coefficient condition or the exclusion
    of Fermi statistics without the form and spacelike behavior of the mixed bracket.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 202
    - 203
    note: The spacelike bracket expressions on page 202 are followed by the vanishing
      condition on page 203.
- id: qft.weinberg-1.mixed-bracket-to-statistics-mass-constraint
  from: qft.nonzero-spacelike-mixed-commutator
  to: qft.spinless-boson-and-mass-constraint
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The complex-field spacelike bracket is expressed through the same Δ₊
    function calculated for the mixed annihilation-creation bracket; its cancellation
    yields the Bose-statistics and equal-mass conditions.
  failure_mode: Without the Δ₊ mixed-bracket calculation, the equal-mass requirement
    and the exclusion of nonzero Fermi scalar fields cannot be derived from the spacelike
    bracket.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 202
    - 203
    - 204
    note: Pages 202–203 derive the Δ₊ mixed-bracket behavior; page 204 reuses Δ₊ in
      the complex-field bracket and states the Bose-statistics and equal-mass conditions.
- id: qft.weinberg-1.real-field-to-charge-obstruction
  from: qft.real-causal-scalar-field
  to: qft.charge-conservation-obstruction
  relation: evidence
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The obstruction is specifically the inability of a polynomial in the
    self-adjoint field to enforce the operator balance required by conserved charge.
  failure_mode: Without the self-adjoint field’s composition, the charge-conservation
    failure is misstated as a generic limitation of scalar fields.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 203
    note: The source explicitly contrasts a polynomial in equation (5.2.10) with charge-conserving
      terms.
- id: qft.weinberg-1.scalar-representation-to-real-field
  from: qft.scalar-lorentz-representation
  to: qft.real-causal-scalar-field
  relation: prerequisite
  source_level: recognize
  target_level: derive
  necessity: necessary
  rationale: The field construction is specialized to the one-component scalar representation
    and its spin-zero content.
  failure_mode: Treating the construction as a result for an unspecified Lorentz representation
    obscures why no spin labels occur and overextends the derivation.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 201
    note: The section first fixes the scalar representation and then writes the scalar
      annihilation and creation fields.
- id: qft.weinberg-1.statistics-mass-to-complex-field
  from: qft.spinless-boson-and-mass-constraint
  to: qft.complex-causal-scalar-field
  relation: prerequisite
  source_level: derive
  target_level: derive
  necessity: necessary
  rationale: The equal-mass and Bose-statistics conditions are the stated necessary
    and sufficient conditions for the nonzero complex field to commute with its adjoint
    at spacelike separation.
  failure_mode: Omitting these conditions makes the displayed complex field look causal
    for unequal masses or fermionic statistics.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 204
    note: The source identifies these conditions immediately before normalizing the
      complex field.
- id: qft.weinberg-2.adjoint-representation-prerequisite-gauge-field
  from: qft.adjoint-representation
  to: qft.gauge-field-transformation
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The source introduces the homogeneous part of the gauge-field transformation
    by replacing the matter generators with the adjoint-representation matrices before
    rewriting the result with structure constants.
  failure_mode: The origin and index structure of the homogeneous gauge-field transformation
    cannot be derived without applying the adjoint matrices.
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 4
    note: The paragraph preceding equation (15.1.9) explicitly replaces t_α with the
      adjoint representation matrices of equation (15.1.6).
- id: qft.weinberg-2.covariant-derivative-prerequisite-field-strength
  from: qft.covariant-derivative
  to: qft.nonabelian-field-strength
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The source constructs the covariant curl by evaluating the commutator
    of two covariant derivatives on a matter field.
  failure_mode: The commutator definition of F^γ_{νμ} cannot be formed without D_μ.
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 5
    note: Equation (15.1.12) defines field strength through [D_ν,D_μ].
- id: qft.weinberg-2.covariant-derivative-prerequisite-lagrangian-ingredients
  from: qft.covariant-derivative
  to: qft.gauge-invariant-lagrangian-ingredients
  relation: prerequisite
  source_level: recognize
  target_level: use
  necessity: necessary
  rationale: The sufficient construction criterion explicitly includes gauge-covariant
    derivatives among the ingredients whose transformations lack derivatives of the
    local parameters.
  failure_mode: A proposed matter-derivative term cannot be assessed by the stated
    construction criterion without D_μψ.
  evidence:
  - source: weinberg-2
    section: '15.2'
    pages:
    - 7
    note: The opening paragraph of Section 15.2 names matter fields and their gauge-covariant
      derivatives as ingredients.
- id: qft.weinberg-2.field-strength-prerequisite-lagrangian-ingredients
  from: qft.nonabelian-field-strength
  to: qft.gauge-invariant-lagrangian-ingredients
  relation: prerequisite
  source_level: recognize
  target_level: use
  necessity: necessary
  rationale: The sufficient construction criterion explicitly includes F^α_{μν} and
    its gauge-covariant derivatives.
  failure_mode: The gauge-field sector of the listed construction cannot be formed
    without the field-strength tensor.
  evidence:
  - source: weinberg-2
    section: '15.2'
    pages:
    - 7
    note: Equation (15.2.1) includes F^α_{μν} and D_ρF^α_{μν}.
- id: qft.weinberg-2.field-strength-prerequisite-pure-gauge
  from: qft.nonabelian-field-strength
  to: qft.pure-gauge-flatness
  relation: prerequisite
  source_level: recognize
  target_level: use
  necessity: necessary
  rationale: The pure-gauge criterion is stated in terms of whether the field-strength
    tensor vanishes throughout a simply connected region.
  failure_mode: The flatness criterion cannot be applied without identifying F^α_{μν}.
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 6
    note: The page states that vanishing field strength is necessary and sufficient
      for a pure gauge in a simply connected region.
- id: qft.weinberg-2.gauge-field-prerequisite-covariant-derivative
  from: qft.gauge-field-transformation
  to: qft.covariant-derivative
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The inhomogeneous part of the gauge-field transformation cancels the
    derivative-of-parameter contribution in the proposed covariant derivative.
  failure_mode: Without this transformation law, the cancellation establishing homogeneous
    transformation of D_μψ cannot be checked.
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 4
    note: The text immediately after equation (15.1.10) identifies the cancellation
      and reaches equation (15.1.11).
- id: qft.weinberg-2.lagrangian-ingredients-prerequisite-gauge-field-restrictions
  from: qft.gauge-invariant-lagrangian-ingredients
  to: qft.gauge-field-lagrangian-restrictions
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The restriction on direct gauge-field dependence and the field-strength
    quadratic term are drawn within the stated gauge-invariant Lagrangian construction.
  failure_mode: The exclusion of a direct mass term is detached from the source's
    stated condition on allowable gauge-field dependence.
  evidence:
  - source: weinberg-2
    section: '15.2'
    pages:
    - 7
    note: After equation (15.2.1), the text states the restriction and then presents
      equation (15.2.3).
- id: qft.weinberg-2.local-transformations-prerequisite-gauge-field
  from: qft.local-matter-gauge-transformations
  to: qft.gauge-field-transformation
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The gauge-field transformation is introduced to cancel the derivative-of-parameter
    term produced by differentiating the local matter transformation.
  failure_mode: The compensating inhomogeneous term has no stated problem to solve
    if the local derivative transformation is not known.
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 4
    note: Equation (15.1.8) exposes the extra derivative term, followed by the stated
      need for A^α_μ.
- id: qft.weinberg-2.local-transformations-require-lie-algebra
  from: qft.local-matter-gauge-transformations
  to: qft.lie-algebra-structure-constants
  relation: evidence
  source_level: recognize
  target_level: recognize
  necessity: necessary
  rationale: The source assumes the local transformations are infinitesimal Lie-group
    transformations and then requires the generators to obey the stated commutator.
  failure_mode: Without the Lie-algebra relation, the constants controlling non-Abelian
    generator composition are unspecified.
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 2
    note: The text directly connects the Lie-group assumption to the generator commutation
      relations.
- id: qft.weinberg-2.structure-constants-prerequisite-adjoint
  from: qft.lie-algebra-structure-constants
  to: qft.adjoint-representation
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The adjoint matrices are constructed directly from the structure constants,
    using their antisymmetry and Jacobi constraint.
  failure_mode: A learner cannot construct or verify the adjoint generators without
    the structure constants and their identities.
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 3
    note: Equations (15.1.3), (15.1.5), and (15.1.6) state this construction.
- id: qft.weinberg2-mode-elimination-to-sliding-coupling
  from: qft.weinberg2-high-energy-mode-elimination
  to: qft.continuum-rg-running-coupling-large-log-method
  relation: prerequisite
  source_level: recognize
  target_level: derive
  necessity: necessary
  rationale: The sliding-scale construction addresses logarithms arising when virtual-mode
    scope is poorly matched to the process scale.
  failure_mode: Choosing and evolving a sliding scale has no source-defined purpose.
  evidence:
  - source: weinberg-2
    section: 18; 18.2
    pages:
    - 111
    - 112
    - 119
    - 120
- id: qft.weinberg2-operator-flow-to-fixed-point-power
  from: qft.weinberg2-sliding-operator-anomalous-dimension
  to: qft.weinberg2-fixed-point-anomalous-power
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: Fixed-point anomalous power applies the integrated operator normalization
    as the coupling approaches the fixed point.
  failure_mode: The shift of dimensional power cannot be derived from operator flow.
  evidence:
  - source: weinberg-2
    section: 18.2; 18.3(c)
    pages:
    - 124
    - 133
- id: qft.weinberg2-operator-flow-to-mass-flow
  from: qft.weinberg2-sliding-operator-anomalous-dimension
  to: qft.weinberg2-mass-independent-rg-mass-flow
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The mass beta functions use anomalous dimensions of their mass operators.
  failure_mode: The anomalous-dimension terms in the running masses are unavailable.
  evidence:
  - source: weinberg-2
    section: 18.2; 18.4
    pages:
    - 124
    - 143
    - 144
- id: qft.weinberg2-sliding-coupling-to-operator-flow
  from: qft.continuum-rg-running-coupling-large-log-method
  to: qft.weinberg2-sliding-operator-anomalous-dimension
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The operator normalization flow is evaluated along the same running-coupling
