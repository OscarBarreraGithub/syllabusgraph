- id: qft.align006.euclidean-fujikawa-spectrum-and-index-theorem
  label: Euclidean spectral derivation and the Dirac index
  summary: After Wick rotation, the gauge-covariant Euclidean Dirac operator is Hermitian
    and its regulated eigenfunction sum defines the anomaly. Nonzero eigenvalues pair
    under γ₅ and cancel; zero modes of γ₅ chirality ±1 remain, so the integral of
    the Chern-Pontryagin density equals the difference in their numbers (with the
    book's normalization), the Atiyah-Singer index theorem.
  kind: method
  group: qft.anomaly-regularization-and-matching
  origins:
  - project: weinberg-2
    node: weinberg-2.euclidean-fujikawa-spectrum-and-index-theorem
    note: Retains this reviewed book-specific treatment, including its stated conditions,
      conventions, and proof or task boundary.
