- id: qft.align006.hypercharge-anomaly-constraints-and-b-minus-l-extension
  label: Hypercharge constraints and anomaly-free B−L extension
  summary: Solving the one-generation gauge and gravitational anomaly equations for
    arbitrary multiplet charges gives, apart from interchanging u_R and d_R, the observed
    hypercharge pattern or an excluded alternative U(1)′ pattern; both cannot be gauged
    together. With otherwise neutral unseen fermions, mixed-anomaly constraints allow
    an extra U(1) charge that is a linear combination of hypercharge and B−L; a phenomenologically
    appreciable local B−L must be spontaneously broken above the electroweak scale.
