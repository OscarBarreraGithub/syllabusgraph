    pages:
    - 528
- id: qft.weinberg2-fixed-point-anomalous-power
  label: Fixed-point anomalous power scaling
  summary: With Weinberg’s convention mu dN_mu/dmu=gamma(g_mu) N_mu, an operator contributes
    E^(-gamma(g_*)) near a finite ultraviolet fixed point. Thus its matrix-element
    power is D_*=D-gamma(g_*) for each operator, with gamma evaluated at the fixed
    point.
  kind: result
  group: qft.renormalization-group
  origins:
  - project: weinberg-2
