    section: 15.6–15.7
    pages:
    - 27
    - 32
    - 35
  notation: []
- id: qft.canonical-and-path-integral-quantization-routes
  label: Canonical and path-integral quantization routes
  summary: The source identifies canonical quantization and the Feynman path integral
    as two common approaches to field theory. Canonical quantization supplies physical
    operator insight and is needed for some results such as LSZ, while path integrals
    are more concise and support applications such as nonperturbative QCD.
  kind: method
  group: qft.lorentz-and-oscillators
  origins:
  - project: schwartz
    node: schwartz.canonical-and-path-integral-quantization-routes
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
  evidence:
