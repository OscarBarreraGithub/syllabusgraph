- id: qft.align006.chiral-gauge-gamma5-calculation-prescription
  label: Bounded gamma-five prescription for chiral gauge calculations
  summary: After imposing anomaly cancellation, the source says the t Hooft-Veltman
    gamma_5 definition is unsatisfactory because it does not manifestly preserve gauge-current
    conservation. A formal gamma_5 anticommuting with every gamma^mu gives unambiguous
    gauge-invariant results for amplitudes not proportional to epsilon^{mu nu lambda
    sigma}, at least through two-loop order. As a last resort, one may use a non-gauge-invariant
    regulator and add non-gauge-invariant counterterms so that the gauge Ward identities
    remain valid.
  kind: method
  group: qft.anomaly-regularization-and-matching
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.chiral-gauge-gamma5-calculation-prescription
    note: Retains this reviewed book-specific treatment, including its stated conditions,
      conventions, and proof or task boundary.
