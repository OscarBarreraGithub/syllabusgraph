- id: qft.align006.abj-triangle-dimensional-gamma5-route
  label: Triangle derivation of the ABJ anomaly in dimensional regularization
  summary: The axial-current two-photon triangle cannot use the formal momentum-shift
    cancellation without regulating its divergent integral. In the t Hooft--Veltman
    continuation gamma_5 anticommutes with the physical four gamma matrices but commutes
    with extra-dimensional ones; the evanescent (d-4) numerator combines with a logarithmic
    1/(d-4) integral to leave the finite anomaly while the photon Ward identities
    remain valid.
  kind: method
  group: qft.anomaly-regularization-and-matching
  origins:
  - project: peskin-schroeder
