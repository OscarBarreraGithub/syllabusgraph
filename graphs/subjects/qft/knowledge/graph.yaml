- id: qft.align006.anomaly-free-gauge-algebras-and-standard-model-risk
  label: Gauge algebras with automatic local anomaly absence
  summary: Groups with only real or pseudoreal representations, and certain additional
    listed algebras with vanishing D-symbols, have no local perturbative gauge anomaly
    for any fermion representation. Local anomalies can arise with SU(n) factors for
    n≥3 or U(1) factors; therefore Standard Model SU(3)×SU(2)×U(1) requires cancellations
    among quarks and leptons.
  kind: result
  group: qft.anomaly-regularization-and-matching
  origins:
  - project: weinberg-2
    node: weinberg-2.anomaly-free-gauge-algebras-and-standard-model-risk
    note: Retains this reviewed book-specific treatment, including its stated conditions,
      conventions, and proof or task boundary.
  evidence:
