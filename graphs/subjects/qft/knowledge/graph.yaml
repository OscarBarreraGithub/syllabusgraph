- id: qft.weinberg-witten-current-obstructions
  label: Weinberg–Witten spin-one and spin-two obstructions
  summary: For a theory with a global non-Abelian symmetry under which massless spin-one
    particles are charged, the spin-one Weinberg–Witten statement excludes a gauge-invariant
    conserved current (equivalently, in the source formulation, a conserved Lorentz-covariant
    current). Separately, in the stated fixed-spacetime setting, a massless spin-two
    particle is excluded when there is a conserved Lorentz-covariant energy-momentum
    tensor. These are conditional theorem statements, not generic gauge-theory claims.
  kind: result
  origins:
  - project: schwartz
    node: schwartz.weinberg-witten-spin-one-current-obstruction
    note: Retains the global non-Abelian, charged massless spin-one hypothesis and
      the no-gauge-invariant-conserved-current conclusion.
  - project: schwartz
    node: schwartz.weinberg-witten-spin-two-and-fixed-spacetime-qualification
    note: Retains the fixed-spacetime and conserved Lorentz-covariant energy-momentum
      hypotheses and their conditional spin-two conclusion.
