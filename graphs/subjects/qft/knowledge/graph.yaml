    section: 1.2 Einstein coefficients
    pages:
    - 6
    note: Sets up the rate balance and thermal populations.
  notation: []
- id: qft.ultraviolet-catastrophe
  label: Ultraviolet catastrophe
  summary: The equipartition spectrum rises with frequency, whereas the observed blackbody
    distribution peaks at finite frequency. This high-frequency disagreement is the
    ultraviolet catastrophe and shows that classical equipartition cannot describe
    blackbody radiation.
  kind: result
  group: qft.radiation-quantization
  origins:
  - project: schwartz
    node: schwartz.ultraviolet-catastrophe
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
