  label: Wilson and conventional renormalization tradeoffs
  summary: Wilson’s cutoff approach changes mathematical bookkeeping and can obscure
    manifest symmetries or the simplicity of renormalizable QED while producing an
    infinite cutoff-dependent EFT. At low energy its dominant couplings remain renormalizable;
