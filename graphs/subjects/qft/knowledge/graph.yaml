    section: '22.4'
    pages:
    - 384
    note: The rendered source lists the automatic cases and states that anomalies
      can occur for SU(n) with n≥3 and for U(1) factors.
  notation: []
- id: qft.align006.anomaly-hypercharge-solutions-and-charge-quantization
  label: Anomaly solutions and charge quantization
  summary: 'The four constraints are U(1)_Y^3: (2Y_L^3-Y_e^3-Y_nu^3)+3(2Y_Q^3-Y_u^3-Y_d^3)=0;
    SU(3)^2U(1): 2Y_Q-Y_u-Y_d=0; SU(2)^2U(1):Y_L+3Y_Q=0; and grav^2U(1):(2Y_L-Y_e-Y_nu)+3(2Y_Q-Y_u-Y_d)=0.
    Their two displayed solution families are (30.85): Y_L=-a/2-b, Y_e=-a-b, Y_nu=-b,
    Y_Q=a/6+b/3, Y_u=2a/3+b/3, Y_d=-a/3+b/3; and (30.86): Y_Q=Y_L=0, Y_u=c, Y_d=-c,
    Y_e=d, Y_nu=-d. In the first family Y_nu=0 gives b=0 and a rescaling sets a=1;
    every displayed solution has Y_L+3Y_Q=0, giving equal and opposite proton/electron
    charge.'
  kind: result
  group: qft.anomaly-regularization-and-matching
  origins:
  - project: schwartz
    node: schwartz.anomaly-hypercharge-solutions-and-charge-quantization
    note: Retains this reviewed book-specific treatment, including its stated conditions,
      conventions, and proof or task boundary.
