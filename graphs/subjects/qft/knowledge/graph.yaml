    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.real-causal-scalar-field
  label: Self-adjoint causal scalar field
  summary: 'For one neutral spinless species, cancellation of the spacelike brackets
    requires Bose statistics and equal magnitudes of the annihilation and creation
    coefficients. A state-phase redefinition and field rescaling give φ(x) = φ⁺(x)
    + φ⁺†(x), a self-adjoint field whose normal-ordered polynomial interactions commute
    at spacelike separation. Once that relative-phase convention is chosen, every
    scalar field for the particle in the interaction density must use it: separately
    causal fields with different relative phases generally fail to commute with one
    another at spacelike separation.'
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 202
    - 203
    note: The source derives the coefficient condition from the spacelike brackets
      and gives the normalized self-adjoint field in equation (5.2.10).
  notation:
  - source: weinberg-1
    note: The source uses κ and λ for the coefficients in φ(x) = κφ⁺(x) + λφ⁻(x).
  group: qft.causal-scalar-fields
  origins:
  - project: weinberg-1
    node: weinberg-1.real-causal-scalar-field
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.real-klein-gordon-lagrangian
  label: Real Klein-Gordon Lagrangian
  summary: The real scalar field is governed classically by L = 1/2 phidot^2 - 1/2
    (grad phi)^2 - 1/2 m^2 phi^2, equivalently 1/2 (partial_mu phi)^2 - 1/2 m^2 phi^2
    in the book's notation.
  kind: representation
  group: qft.scalar-field-foundations
  notation:
  - source: peskin-schroeder
    note: The field phi is real-valued here; m is initially a parameter and is later
      interpreted as mass.
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Hamiltonian Field Theory'
    pages:
    - 16
    note: Equation (2.6) defines the single-field classical Lagrangian used in the
      subsequent Klein-Gordon discussion.
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.real-klein-gordon-lagrangian
    note: The shared record preserves this book-specific treatment without asserting
      equivalence beyond the stated concept.
- id: qft.relativistic-field-viewpoint
  label: Relativistic field viewpoint
  summary: A relativistic quantum description must accommodate variable particle number
    and preserve causal observables; the text motivates a multiparticle field theory
    through pair creation, virtual multiparticle states, and the spacelike propagation
    problem of a one-particle amplitude.
  kind: concept
  group: qft.scalar-field-foundations
