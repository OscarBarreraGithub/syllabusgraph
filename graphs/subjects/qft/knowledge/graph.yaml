- id: qft.weinberg1-renormalizable-critical-surface
  label: Renormalizable critical surface as a stable manifold
  summary: 'Weinberg gives a small-coupling argument: for Lambda much less than Lambda_0,
    deviations from an N-dimensional surface decay as positive powers while N_nm is
    positive-definite. Nonrenormalizable couplings then become functions of N renormalizable
    ones, but the conclusion is limited when that positivity fails.'
  kind: result
  group: qft.renormalization-group
  origins:
