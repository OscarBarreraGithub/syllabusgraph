- id: qft.tree-level-muon-pair-cross-section
  label: Leading muon-pair angular distribution and energy scaling
  summary: After initial-spin averaging and final-spin summation, the leading e+e-
    to mu+mu- distribution is proportional to alpha-squared times (1+cos-squared theta)/E_cm-squared;
    the total cross section falls as 1/E_cm-squared. This is a high-energy CM result
    with higher-order corrections.
  kind: result
  group: qft.qed-scattering
  origins:
  - project: peskin-schroeder
    node: peskin-schroeder.tree-level-muon-pair-cross-section
    note: Preserves this reviewed source treatment and its stated assumptions, notation,
      and derivation scope without asserting more than the shared concept.
