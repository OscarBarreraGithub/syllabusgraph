- id: qft.align006.real-representations-and-mixed-gravitational-anomaly
  label: Real representations and mixed gravitational U(1) constraint
  summary: For a real fermion representation R, t_R^a is unitarily equivalent to -(t_R^a)^T,
    so A^{abc}=-A^{abc} and the gauge anomaly vanishes; Dirac-fermion gauge theories
    are a special case. For SU(n), A(a)=n-4 and A(s)=n+4 for two-index antisymmetric/symmetric
    tensors, and R=a+(n-4)n-bar is the stated anomaly-free example. The mixed gravitational
    factor tr(t^a) vanishes automatically for non-Abelian generators; every U(1) generator
    must be traceless for consistent gravitational coupling.
