    section: '8.8'
    pages:
    - 370
    - 371
    note: Gauge transformation, field strength, action/current condition, and field
      equation.
  notation:
  - source: weinberg-1
    note: Q is an arbitrary (p−1)-form; J is an antisymmetric p-form current. The
      indexed action and equation were visually checked in the private inspection
      note.
- id: qft.pform-gauge-duality
  label: Duality of p-form gauge fields
  summary: In D spacetime dimensions, dualizing the (p+1)-form field strength and
    p-form current rewrites the field equation and conservation condition. Applying
    the local closed-implies-exact step yields a dual (D−p−2)-form gauge field φ and
    its gauge transformation. For p=D−1 the gauge field has no degrees of freedom;
    for p≤D−2 the source concludes equivalence to the dual-form theory. This derivation
    retains its local-exactness condition and does not claim a global homotopy classification.
  kind: result
  group: qft.extended-field-topology
  origins:
  - project: weinberg-1
    node: weinberg-1.p-form-gauge-duality
    note: Retains the dual-current argument, the local Poincaré step, the p=D−1 exception,
      and the stated dual-form equivalence.
