- id: qft.align006.abj-anomaly-operator-equation
  label: Adler-Bell-Jackiw axial anomaly
  summary: For one massless four-dimensional QED Dirac fermion, a gauge-invariant
    axial-current definition obeys partial_mu j_5^mu=e^2 epsilon^{mu nu rho sigma}F_{mu
    nu}F_{rho sigma}/(16pi^2). The text names this the Adler-Bell-Jackiw anomaly and
    records the Adler-Bardeen result that this operator relation receives no higher-order
    QED corrections.
  kind: result
  group: qft.anomaly-regularization-and-matching
