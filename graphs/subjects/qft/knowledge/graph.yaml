- id: qft.higgs-mechanism-and-abelian-higgs-lagrangian
  label: Higgs mechanism and Abelian Higgs Lagrangian
  summary: When the broken continuous symmetry is gauged, the physical Goldstone disappears
    from the spectrum and the gauge boson becomes massive. The Abelian realization
