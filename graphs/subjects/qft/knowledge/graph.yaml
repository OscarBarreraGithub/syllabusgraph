- id: qft.soft-goldstone-external-line-theorem
  label: Soft Goldstone emission from external-line poles
  summary: Current conservation separates a Goldstone pole from the non-pole current
    matrix element. If the non-pole term is nonsingular, soft emission has an Adler
    zero; if external hard-particle lines give 1/|q| poles, their finite direction-dependent
    contributions determine the very-soft Goldstone amplitude, while internal attachments
    vanish in the limit.
