- id: qft.align013.shared.dis-quark-gluon-twist-two-mixing-and-scaling-violation
  label: Quark--gluon twist-two mixing and logarithmic scaling violation
  summary: The singlet quark and gluon twist-two sectors mix under renormalization;
    the conserved energy-momentum combination constrains the spin-two sector while
    higher moments produce logarithmic violations of strict scaling. The common core
    retains Peskin--Schroeder's nonsymmetric coefficient matrix, Schwartz's coupled
