- id: qft.align006.fujikawa-even-dimensional-anomaly
  label: Even-dimensional Fujikawa anomaly form
  summary: In even d=2n dimensions, take gamma_5 as the product of all Dirac matrices.
    The functional-measure derivation gives partial_mu j_5^mu=(-1)^{n+1} [2 e^n/(n!(4
    pi)^n)] epsilon^{mu_1...mu_2n} F_{mu_1 mu_2}...F_{mu_{2n-1} mu_{2n}}. This is
