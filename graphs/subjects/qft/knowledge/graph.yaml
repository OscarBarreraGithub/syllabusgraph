- id: qft.align006.fujikawa-fermionic-measure-chiral-variation
  label: Fujikawa variation of the fermionic measure
  summary: For massless complex spin-1/2 fields, the Grassmann measure transforms
    with the inverse determinants. A local non-chiral pseudounitary transformation
    leaves it invariant, while an infinitesimal local chiral transformation produces
    an anomaly function from the regulated trace of γ₅t at coincident points.
