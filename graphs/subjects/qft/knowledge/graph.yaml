- id: qft.weinberg1-wilson-conventional-tradeoffs
  label: Wilson and conventional renormalization tradeoffs
  summary: Wilson’s cutoff approach changes mathematical bookkeeping and can obscure
    manifest symmetries or the simplicity of renormalizable QED while producing an
    infinite cutoff-dependent EFT. At low energy its dominant couplings remain renormalizable;
    after expression in observable masses and charges, its physical answers agree
    with conventional renormalization.
  kind: result
  group: qft.renormalization-group
  origins:
  - project: weinberg-1
    node: weinberg-1.wilson-conventional-equivalence-and-tradeoffs
    note: The source’s equivalence is physical-answer equivalence after observable
      parametrization, not identity of intermediate couplings or conveniences.
