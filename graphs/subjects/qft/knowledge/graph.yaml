- id: qft.align013.schwartz.gamma-star-quark-collinear-residue-derivation
  label: Gamma-star quark collinear residue derivation
  summary: For γ* q→qg, the real-emission squared amplitude is expressed through ŝ,
    t-hat, and u-hat, with Q²>0, ŝ>0, and t-hat,u-hat<0. At fixed z and Q², ŝ is nonzero,
