- id: qft.align011.degenerate-vacua-and-cluster-selection
  label: Infinite-volume vacuum sectors and cluster selection
  summary: At finite volume, symmetry eigenstates can be linear combinations of candidate
    broken vacua because tunnelling gives nonzero off-diagonal Hamiltonian matrix
    elements. Those elements are exponentially suppressed with spatial volume, so
    arbitrarily weak local symmetry-breaking perturbations select stable sectors macroscopically;
    at infinite volume locality and the continuum spectrum make local-operator matrix
    elements diagonal, and exactly those sector vacua satisfy cluster decomposition
    rather than arbitrary superpositions.
