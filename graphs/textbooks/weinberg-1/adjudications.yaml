  - finding: 2
    issue: The prerequisite edge between the general decay-rate result and two-body
      phase-space specialization is reversed.
    alternatives:
    - Remove the reversed edge and add a necessary edge from the general decay-rate
      node to the two-body phase-space specialization.
    - Remove the reversed edge and connect the master transition-rate node directly
      to the two-body phase-space node for both decay and scattering branches.
    resolution: Replace the reversed edge with decay-rate → two-body-phase-space as
      a necessary prerequisite.
    rationale: The source derives the arbitrary-final-state one-particle rate in Eq.
      (3.4.13) before reducing phase space; Eq. (3.4.29) is its two-body specialization.
