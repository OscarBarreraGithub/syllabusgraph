  - finding: 0
    issue: Discrete-inversion results lack joint operator, field, and Dirac-identity
      inputs, while a scalar analogy is compulsory.
    alternatives:
    - Add explicit use-level prerequisites and make the scalar comparison helpful
      pedagogical context.
    - Fold the matrix identities into the Dirac construction, then connect that combined
      node with the operator and field inputs.
    resolution: Add the explicit use-level inputs and downgrade the scalar analogy
      to helpful pedagogical context.
    rationale: The source performs each transformation on a constructed causal field
      by applying particle-operator symmetry rules. The Dirac results also use the
      earlier transpose or conjugation identities, while the spin-one calculation
      uses vector polarization identities. Keeping these as separate prerequisite
      records preserves the source's reusable methods and makes every joint derivation
      route complete. The scalar discussion supplies an analogy to the vector phase
      pattern rather than algebra needed by the vector derivation.
