  - finding: 1
    issue: Integrated transition reciprocity omits its necessary SS† identity input.
    alternatives:
    - Add a necessary edge from the retained SS† identity node to the integrated reciprocity
      node.
    - Merge the SS† identity into the integrated reciprocity node and remove the separate
      identity record.
    resolution: Add the missing necessary SS†-identity prerequisite edge.
    rationale: Equation (3.6.17) follows only after combining the reverse-inclusive
      SS† equation (3.6.16) with the S†S equation (3.6.2). Retaining both existing
      nodes and connecting them is the smallest complete resolution.
    evidence:
    - source: weinberg-1
      section: '3.6'
