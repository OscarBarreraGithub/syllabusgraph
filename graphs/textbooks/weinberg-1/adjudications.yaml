  - finding: 1
    issue: The general Lorentz-scalar method omits the product-representation input
      needed to couple its two index sets independently.
    alternatives:
    - Add the Lorentz irrep classification as a necessary use-level prerequisite.
    - Expand the scalar-coupling node to rederive the product representation before
      applying angular-momentum coupling.
    resolution: Add the Lorentz irrep classification as a necessary use-to-derive
      prerequisite.
    rationale: The source constructs a scalar by using the product structure of an
      (A,B) representation and coupling its two rotation-index families separately
      to zero. The angular-momentum input explains each coupling, while the Lorentz
      classification explains why there are two independent factors. A direct prerequisite
      edge records the missing jointly necessary input without duplicating the representation
      derivation inside the scalar method.
    evidence:
    - source: weinberg-1
      section: 5.6–5.7
      pages:
      - 230
      - 231
      - 235
      - 236
    affected_records:
    - kind: edges
      id: weinberg-1.lorentz-irrep-to-general-scalar-couplings
  - finding: 2
    issue: Problems 2 and 3 request parity transformations, but their current inversion
      input supplies only charge and time reversal.
    alternatives:
    - Add the general causal-field parity relation directly as a prerequisite to both
      problems.
    - Create a shared general P, C, T problem method and make both construction problems
      depend on that method.
    resolution: Add the general parity relation as a necessary use-to-derive prerequisite
      to Problems 2 and 3.
    rationale: Both exercises request all three discrete transformations. Their existing
      general charge and time-reversal input covers C and T, and their representation
      input identifies the admissible field type, but neither supplies the causal
      field's parity action or intrinsic particle-antiparticle parity relation. Direct
      parity edges complete each exercise without introducing an extra method node.
    evidence:
