      (A,B) representation and coupling its two rotation-index families separately
      to zero. The angular-momentum input explains each coupling, while the Lorentz
      classification explains why there are two independent factors. A direct prerequisite
      edge records the missing jointly necessary input without duplicating the representation
      derivation inside the scalar method.
