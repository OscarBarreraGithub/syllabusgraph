  - finding: 0
    issue: New symmetry and decay applications lack prerequisites, and time-reversal
      reciprocity omits accepted antiunitarity and massive one-particle inputs.
    alternatives:
    - Add necessary prerequisite edges from the existing symmetry, decay, covariance,
      and accepted one-particle time-reversal records to each retained application/result
      node.
    - Fold the five application nodes into their parent result summaries and remove
      the standalone records, while still adding the two accepted time-reversal inputs.
    resolution: Retain the useful standalone applications and add nine necessary prerequisite
      edges.
    rationale: The source presents these as applications of immediately preceding
      symmetry or rate results, and p. 127 explicitly imports the one-particle time-reversal
      action from Section 2.6. Edges preserve that proof structure without deleting
      useful teachable units or changing accepted records.
