  - finding: 3
    issue: The normal-ordering method is isolated from the cluster and causal-field
      premises applied in its derivation.
    alternatives:
    - Connect the reviewed cluster route and causal-field combination directly to
      the normal-ordering method.
    - Split the method into separate cluster-ordering and locality-preservation nodes
      with one prerequisite route for each.
    resolution: Add necessary use-level inputs from the cluster route and the causal-field
      combination.
    rationale: The normal-ordering argument has two independent jobs. The cluster
      route explains why the expansion must display one overall momentum delta function,
      and causal fields explain why converting the normal-ordered expression into
      ordinary field products preserves spacelike commutation. Two direct inputs capture
      those jointly necessary premises while retaining the useful combined method
      node.
