  - finding: 1
    issue: The general Lorentz-scalar method omits the product-representation input
      needed to couple its two index sets independently.
    alternatives:
    - Add the Lorentz irrep classification as a necessary use-level prerequisite.
    - Expand the scalar-coupling node to rederive the product representation before
      applying angular-momentum coupling.
    resolution: Add the Lorentz irrep classification as a necessary use-to-derive
      prerequisite.
