  - weinberg-1.vacuum-polarization-charge-shift
  - weinberg-1.renormalization-physical-parameters
  - weinberg-1.lamb-shift-experimental-test
  summary: Divergent self-energy and vacuum-polarization calculations threatened the
    consistency of QFT, while a measured finite hydrogen level shift demanded quantitative
    radiative predictions. Renormalization reframes the formal parameters in terms
    of observable mass and charge.
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 31
    - 32
    - 34
    - 35
    note: The source presents the divergences, the parameter-redefinition response,
