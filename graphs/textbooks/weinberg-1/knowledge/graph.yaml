- id: weinberg-1.projective-cocycles
  label: Projective cocycles and phase redefinitions
  summary: Associativity constrains the phase in a projective multiplication law to
    a two-cocycle. A coboundary phase produced by rephasing U(T) is trivial and can
    be removed; intrinsic projectivity means no such rephasing eliminates the phase.
  kind: method
  evidence:
  - source: weinberg-1
    section: '2.7'
    pages:
    - 81
    - 82
    note: Defines the projective law, cocycle condition, and trivial cocycles.
- id: weinberg-1.projective-symmetry-representations
  label: Projective representations and superselection qualification
  summary: Because Hilbert operators act on vectors while symmetries act on rays,
    composition can hold only up to a phase. The phase becomes state-independent when
    the relevant superpositions are physically available; superselection sectors are
    the stated exception.
  kind: representation
  evidence:
  - source: weinberg-1
    section: '2.2'
    pages:
    - 52
    - 53
    note: Derives the composition phase and states the superselection exception.
- id: weinberg-1.proper-orthochronous-lorentz-component
  label: Proper orthochronous Lorentz subgroup and discrete inversions
  summary: The component connected to identity has det Λ=+1 and Λ⁰₀≥+1; equality includes
    the identity and spatial rotations. Every other Lorentz transformation is this
    component times space inversion, time reversal, or both, so continuous and discrete
    transformations can be studied separately.
  kind: representation
  evidence:
  - source: weinberg-1
    section: '2.3'
    pages:
    - 58
    note: Classifies Lorentz components and isolates ℘ and 𝒯.
- id: weinberg-1.quantum-spontaneous-emission
  label: Quantum-field derivation of spontaneous and induced emission
  summary: Quantizing radiation makes an emission matrix element carry sqrt(n_k+1),
    so its rate has an n_k contribution identified as induced emission and a unit
    contribution identified as spontaneous emission. This derives the Einstein rate
    relation without thermodynamic equilibrium arguments.
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 18
    - 19
    note: The source derives the n_k+1 rate factor and separates it into induced and
      spontaneous contributions.
- id: weinberg-1.radiation-normal-modes
  label: Radiation field as normal-mode oscillators
  summary: Expanding a bounded radiation field in Fourier modes turns its Hamiltonian
    into a sum of independent harmonic oscillators, one for each normal-mode frequency.
  kind: representation
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 15
    note: The source expands the one-dimensional field and identifies the resulting
      independent oscillator Hamiltonian.
- id: weinberg-1.real-causal-scalar-field
  label: Self-adjoint causal scalar field
  summary: 'For one neutral spinless species, cancellation of the spacelike brackets
    requires Bose statistics and equal magnitudes of the annihilation and creation
    coefficients. A state-phase redefinition and field rescaling give φ(x) = φ⁺(x)
    + φ⁺†(x), a self-adjoint field whose normal-ordered polynomial interactions commute
    at spacelike separation. Once that relative-phase convention is chosen, every
    scalar field for the particle in the interaction density must use it: separately
    causal fields with different relative phases generally fail to commute with one
    another at spacelike separation.'
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 202
    - 203
    note: The source derives the coefficient condition from the spacelike brackets
      and gives the normalized self-adjoint field in equation (5.2.10).
  notation:
  - source: weinberg-1
    note: The source uses κ and λ for the coefficients in φ(x) = κφ⁺(x) + λφ⁻(x).
- id: weinberg-1.renormalization-physical-parameters
  label: Renormalization of mass and charge
  summary: Renormalization absorbs divergent self-energy and vacuum-polarization contributions
    into bare mass and charge parameters, leaving finite measured mass and charge.
    At lowest order, predictions such as scattering cross sections are finite when
    expressed in terms of the physical total charge.
  kind: method
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 34
    note: The source explains mass redefinition, charge renormalization, and the question
      whether all divergences can be handled this way.
- id: weinberg-1.s-matrix-observable-formalism
  label: S-matrix as an observable scattering formalism
  summary: The S-matrix describes amplitudes for scattering processes and was explored
    as a formulation based on observable quantities rather than state vectors and
    quantum fields. It remains a central component of modern quantum field theory.
  kind: representation
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 33
    note: The source introduces the S-matrix alternative and defines its elements
      as scattering amplitudes.
- id: weinberg-1.scalar-field-particle-antiparticle-operators
  label: Charged scalar field contains particle and antiparticle operators
  summary: Canonical quantization of a free complex scalar field introduces two independent
    bosonic operator families with equal contributions to the Hamiltonian. They represent
    particles and antiparticles of equal mass and, when charged, opposite charge without
    identifying either as a hole.
  kind: method
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 25
    - 26
    - 27
    note: The Fourier canonical variables lead to the a and b operators, the positive-energy
      Hamiltonian, and the particle-antiparticle interpretation.
- id: weinberg-1.scalar-lorentz-representation
  label: Scalar Lorentz representation and zero spin
  summary: A one-component field in the scalar Lorentz representation, D(Λ) = 1, has
    only the j = 0 rotational solution; in this construction it describes spin-zero
    particles.
  kind: representation
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 201
    note: The scalar Lorentz representation is reduced to rotations and identified
      with j = 0.
  notation:
  - source: weinberg-1
    note: The source writes the scalar representation as D(Λ) = 1.
- id: weinberg-1.sl2c-double-cover-of-lorentz-group
  label: SL(2,C) double cover of the proper orthochronous Lorentz group
  summary: A real four-vector corresponds to a Hermitian 2×2 matrix, whose determinant
    gives its Lorentz square. Congruence by a unit-determinant complex matrix preserves
    that square, yielding a proper orthochronous Lorentz transformation; k and −k
    act identically, so SO+(3,1) is SL(2,C)/Z2.
  kind: representation
  evidence:
  - source: weinberg-1
    section: '2.7'
    pages:
    - 86
    - 87
    - 88
    note: Builds the Hermitian-matrix representation and identifies the quotient for
      the connected Lorentz component.
  notation:
  - source: weinberg-1
    note: The source uses v=Vμσμ with σ0=1; k∈SL(2,C) acts as v↦kvk†.
- id: weinberg-1.spin-orbit-fine-structure
  label: Spin, spin-orbit coupling, and hydrogen fine structure
  summary: The spinless relativistic wave equation gives an incorrect hydrogen fine
    splitting. Electron spin, its magnetic moment, spin-orbit coupling, and Thomas
    precession correct the splitting so that energies depend on principal quantum
    number and total angular momentum rather than orbital angular momentum separately.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 5
    - 6
    note: The source compares the incorrect spinless spectrum with experiment and
      explains the two effects that repair the fine structure.
- id: weinberg-1.spin-statistics-connection
  label: Spin-statistics connection
  summary: 'The chapter states that the quantization bracket is fixed by spin: integer-spin
    particles use commutators and half-integer-spin particles use anticommutators.'
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 20
    note: The source explicitly states the integer-spin/commutator and half-integer-spin/anticommutator
      rule.
- id: weinberg-1.spin-zero-klein-gordon-legitimacy
  label: Spin-zero particles and the legitimate Klein-Gordon equation
  summary: The indefinite one-particle scalar density does not make the Klein-Gordon
    equation physically invalid for spin-zero particles. The chapter notes known elementary
    spin-zero and spin-one particles and states that mesonic-atom fine structure is
    calculated from stationary Klein-Gordon solutions.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 13
    note: The first numbered objection to Dirac's rationale cites spin-zero particles
      and the continued use of the relativistic Klein-Gordon-Schrodinger equation.
- id: weinberg-1.spinless-boson-and-mass-constraint
  label: Bosonic statistics and particle-antiparticle mass equality
  summary: The complex scalar construction has nontrivial spacelike commutation only
    for Bose statistics. Its causality condition also requires particle and antiparticle
    masses to be equal, so that the relevant positive-frequency functions coincide.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 204
    note: The source rules out Fermi statistics for a nonzero spinless field and states
      equal mass as necessary and sufficient together with equal coefficient magnitudes.
- id: weinberg-1.symmetry-as-transition-probability-invariance
  label: Symmetry as preservation of transition probabilities
  summary: A symmetry changes the observer's ray assignment while leaving probabilities
    of possible experiments unchanged; this condition is necessary, with further conditions
    deferred to the next chapter.
  kind: assumption
  evidence:
  - source: weinberg-1
    section: '2.2'
    pages:
    - 51
    note: Defines the ray-level invariance condition and explicitly qualifies it as
      necessary only.
- id: weinberg-1.symmetry-generators-as-hermitian-observables
  label: Hermitian generators of infinitesimal symmetries
  summary: A unitary transformation infinitesimally near identity has a Hermitian
    linear generator, making symmetry generators candidates for observables such as
    momentum and angular momentum.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.2'
    pages:
    - 52
    note: Expands a near-identity unitary symmetry and identifies its Hermitian generator.
- id: weinberg-1.time-reversal-forbids-static-dipoles
  label: Time-reversal invariance forbids static electric or gravitational dipoles
  summary: A static electric or gravitational field would remove the spin degeneracy
    of a particle with the corresponding dipole moment. Since Kramers degeneracy persists
    under arbitrary static fields that respect time reversal, the chapter concludes
    that such dipole moments are forbidden by time-reversal invariance.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.6'
    pages:
    - 81
    note: States the static-field consequence of Kramers degeneracy.
- id: weinberg-1.time-reversal-square-and-kramers-degeneracy
  label: T² sign and Kramers degeneracy
  summary: For both massive spin and massless helicity, T² acts as (−1)^(2j), where
    massless spin means |σ|. A noninteracting state with an odd number of half-integer-spin/helicity
    particles has T²=−1; any energy eigenstate of this kind in a time-reversal-invariant
    setting has a distinct degenerate partner (Kramers degeneracy), even when rotation
    symmetry is broken.
  kind: result
  evidence:
  - source: weinberg-1
    section: 2.6–2.7
    pages:
    - 80
    - 81
    note: Derives the T² action and the Kramers-degeneracy consequence.
- id: weinberg-1.topological-helicity-quantization-and-covering-choice
  label: Topological helicity quantization and proper-orthochronous covering choice
  summary: Within the proper orthochronous Lorentz group, a 4π rotation of a massless
    state is contractible, forcing helicity to be integer or half-integer. Replacing
    SO+(3,1) by its simply connected cover SL(2,C) removes the inference of an integer/half-integer
    superselection rule from proper-orthochronous Lorentz invariance alone; symmetry
    principles by themselves do not settle whether such superpositions can be prepared.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.7'
    pages:
    - 89
    - 90
    note: Applies topology to massless helicity and explains the universal-cover alternative.
- id: weinberg-1.unconventional-time-reversal-degeneracy
  label: Unconventional time reversal can require extra degeneracy
  summary: For a nontrivial paired time-reversal block, no linear combination is merely
    multiplied by a phase, so time-reversal invariance imposes a two-fold degeneracy
    beyond spin. An internal symmetry may allow redefinition of time reversal and
    remove the mixing; without it the doubling is attributable to time reversal. This
    is a possible representation, not a proof that such particles exist.
  kind: result
  evidence:
  - source: weinberg-1
    section: Appendix C
    pages:
    - 102
    - 103
    note: Derives the extra degeneracy and states the internal-symmetry qualification.
- id: weinberg-1.uv-self-energy-divergence
  label: Ultraviolet self-energy divergence
  summary: Pointlike fields that create or destroy particles at spacetime points produce
    divergent self-energy corrections. In perturbation theory, high-wave-number photon
    intermediate states yield ultraviolet divergences; a short-distance cutoff makes
    the early bound-electron self-energy scale as the inverse cutoff radius squared.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 31
    note: The source relates point localization, electron self-energy, high-momentum
      intermediate states, and the ultraviolet cutoff behavior.
- id: weinberg-1.vacuum-polarization-charge-shift
  label: Vacuum polarization shifts charge
  summary: An external charge density polarizes the vacuum. The induced density includes
    a logarithmically divergent term proportional to the original charge density and
    finite derivative terms, so vacuum polarization changes the relation between a
    formal charge parameter and measured charge.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 32
    note: Equation (1.3.3) and its discussion identify the finite and divergent vacuum-polarization
      coefficients.
- id: weinberg-1.vacuum-selects-annihilation-operators
  label: Vacuum condition selects scalar annihilation operators
  summary: Taking vacuum expectation values of the canonical commutators determines
    which scalar-field coefficients annihilate the vacuum. The result fixes the positive-
    and negative-frequency operator roles and makes the energy relative to the vacuum
    positive.
  kind: method
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 27
    note: The source uses vacuum expectation values of the commutator to rule out
      the wrong assignment and infer the operator roles.
- id: weinberg-1.wigner-symmetry-representation-theorem
  label: Wigner representation of ray symmetries
  summary: An invertible ray transformation preserving transition probabilities is
    represented on Hilbert space by either a linear unitary operator or an antilinear
    antiunitary operator. The latter possibility is retained for time-reversing symmetries.
  kind: result
  evidence:
  - source: weinberg-1
    section: 2.2 and Appendix A
    pages:
    - 51
    - 91
    note: States Wigner's theorem and introduces its proof.
- id: weinberg-1.wigner-theorem-proof-coefficient-dichotomy
  label: 'Proof method: coefficient ratios are preserved or conjugated'
  summary: By fixing phases with selected two-component superpositions and comparing
    transition probabilities, the proof shows that coefficient ratios of an arbitrary
    state are either preserved or complex conjugated. A consistency argument forces
    one choice across all components and then all states for a fixed symmetry.
  kind: method
  evidence:
  - source: weinberg-1
    section: Appendix A
    pages:
    - 92
    - 93
    - 94
    - 95
    note: Establishes the global preservation-versus-conjugation dichotomy.
- id: weinberg-1.wigner-theorem-proof-operator-conclusion
  label: 'Proof conclusion: linear-unitary or antilinear-antiunitary operator'
  summary: The preserved-coefficient branch gives a linear operator preserving scalar
    products, hence unitary; the conjugated-coefficient branch gives an antilinear
    operator conjugating scalar products, hence antiunitary. This completes the theorem
    stated in Section 2.2.
  kind: result
  evidence:
  - source: weinberg-1
    section: Appendix A
    pages:
    - 95
    - 96
    note: Derives linearity/unitarity and antilinearity/antiunitarity from the two
      branches.
- id: weinberg-1.wigner-theorem-proof-orthonormal-basis
  label: 'Proof method: transformed orthonormal basis'
  summary: Appendix A begins Wigner's theorem by choosing a complete orthonormal basis
    of rays and arbitrary normalized representatives of their images. Transition-probability
    preservation keeps the image basis orthonormal, and invertibility proves it complete.
  kind: method
  evidence:
  - source: weinberg-1
    section: Appendix A
    pages:
    - 91
    - 92
    note: Constructs and normalizes the image basis before treating arbitrary rays.
- id: weinberg-1.yukawa-massive-mediator-potential
  label: Yukawa potential and mediator mass-range relation
  summary: A scalar field coupled to nucleons produces a short-range potential proportional
    to exp(-lambda r)/r rather than a Coulomb 1/r potential. Quantization identifies
    lambda with a mediator mass hbar lambda/c, so the observed force range estimates
    the mass scale.
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 30
    note: Equation (1.2.74) and the following discussion connect the potential range
      to the mass of the quantized scalar particle.
