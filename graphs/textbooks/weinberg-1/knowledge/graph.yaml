    note: The source denotes this commutator kernel by Δ, defined as an antisymmetrized
      Δ₊.
- id: weinberg-1.pauli-term-symmetry-allowance
  label: Pauli term and the limits of symmetry predictions
  summary: A Pauli interaction proportional to a gamma-matrix commutator and electromagnetic
    field strength is compatible with Lorentz and gauge invariance and can shift the
    electron magnetic moment. Thus those symmetries alone do not fix the Dirac value
    of the magnetic moment.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 14
    note: Equation (1.1.32) and the surrounding discussion identify the allowed Pauli
      term and its magnetic-moment effect.
- id: weinberg-1.pion-muon-resolution-yukawa-meson
  label: Pion-muon distinction resolves the Yukawa-meson identification
  summary: 'The mesons prevalent in low-altitude cosmic rays interact too weakly with
    nucleons to be Yukawa''s nuclear-force mediator. The resolution is two mesons:
    the heavier pion has strong interactions and plays Yukawa''s role, while the lighter
    muon has weak and electromagnetic interactions and comes from pion decay.'
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 30
    note: The source describes the atmospheric-absorption puzzle, weak interaction
      result, and pion-muon resolution.
- id: weinberg-1.positron-antiparticle-evidence
  label: Positron evidence for an oppositely charged equal-mass antiparticle
  summary: The cosmic-ray track interpreted as a positron had the curvature of a positive
    charge and a range and specific ionization consistent with a particle differing
    from the electron only in charge sign. This evidence supported the same-mass,
    opposite-charge antiparticle predicted by the revised hole interpretation.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 12
    - 13
    note: The source describes the hole prediction and the track evidence for a light
      positive particle with electron-like mass.
- id: weinberg-1.positron-contributions-soften-self-energy
  label: Positron intermediate states soften self-energy divergence
  summary: Including the additional processes associated with filled negative-energy
    states cancels the leading inverse-cutoff-squared mass-shift terms. The remaining
    electron self-mass divergence is logarithmic, an important precursor to renormalization.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 31
    - 32
    note: The source describes the missed magnetic self-energy term, the cancellation,
      and the residual logarithmic cutoff dependence.
- id: weinberg-1.prewar-renormalization-confidence-barrier
  label: Prewar lack of confidence in renormalization
  summary: Prewar calculations included an omitted-term error in Dancoff's radiative
    correction and widespread pessimism about QED. The chapter identifies lack of
    confidence in renormalization, rather than an unavailable formalism alone, as
    the missing element that prevented earlier serious Lamb-shift calculations; postwar
    experiments and collaboration changed that judgment.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
