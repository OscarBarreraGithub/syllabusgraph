    - 13
    note: The source describes the hole prediction and the track evidence for a light
      positive particle with electron-like mass.
- id: weinberg-1.positron-contributions-soften-self-energy
  label: Positron intermediate states soften self-energy divergence
  summary: Including the additional processes associated with filled negative-energy
    states cancels the leading inverse-cutoff-squared mass-shift terms. The remaining
    electron self-mass divergence is logarithmic, an important precursor to renormalization.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
