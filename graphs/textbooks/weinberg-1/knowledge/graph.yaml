  - weinberg-1.real-causal-scalar-field
  summary: A hermitian interaction needs both annihilation and creation pieces, but
    their mixed spacelike bracket is nonzero; the construction asks how a field combination
    can still satisfy the spacelike-commutation requirement.
  evidence:
