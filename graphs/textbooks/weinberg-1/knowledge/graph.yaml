nodes:
- id: weinberg-1.charge-conjugation-time-reversal-phase-constraints
  label: Charge-conjugation and time-reversal phase constraints
  summary: For the causal scalar field to transform proportionally under charge conjugation,
    the one-particle phases obey ξᶜ = ξ*. Time reversal is antiunitary; requiring
    a simple relation to the field at the time-reversed point instead gives ζᶜ = ζ*.
    In the self-conjugate case the charge-conjugation phase is real and equals ±1.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 206
    note: Equations (5.2.20)–(5.2.31) derive the charge-conjugation and time-reversal
      phase conditions for the scalar field.
  notation:
  - source: weinberg-1
    note: ξ and ζ are the one-particle phases for charge conjugation and time reversal,
      respectively.
- id: weinberg-1.charge-conservation-obstruction
  label: Charge-conservation obstruction for a self-adjoint field
  summary: If the particle carries a conserved charge, charge-preserving interaction
    terms need equal numbers of a(p) and a†(p). This cannot be achieved by a polynomial
    solely in the self-adjoint neutral-field combination, which lacks a simple commutator
    with the charge operator.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 203
    note: The source contrasts the simple charge commutators of φ⁺ and its adjoint
      with the self-adjoint field.
- id: weinberg-1.complex-causal-scalar-field
  label: Complex causal scalar field from particle and antiparticle
  summary: For spinless bosons of equal mass and opposite charges, combining a particle
    annihilation field with an antiparticle creation field gives φ(x) = φ⁺(x) + φ⁺c†(x).
    The field has [Q, φ(x)] = −qφ(x) and is the essentially unique causal scalar field
    in this construction; it covers self-conjugate neutral particles as the special
    case aᶜ(p) = a(p).
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 203
    - 204
    note: The source introduces opposite-charge equal-mass bosons, forms the charge-eigenfield,
      and gives its normalized mode expansion in equation (5.2.11).
  notation:
  - source: weinberg-1
    note: Superscript c labels the charge-conjugate particle; φ⁺c† is the adjoint
      of its annihilation field.
- id: weinberg-1.hermitian-local-interaction-condition
  label: Hermiticity and spacelike commutation for scalar interactions
  summary: For a Lorentz-scalar interaction density built from scalar-field pieces,
    hermiticity brings in both annihilation and creation pieces, while Lorentz invariance
    of the S-matrix also requires interaction densities to commute at spacelike separation.
  kind: assumption
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 201
    note: The source states the scalar transformation condition and the additional
      spacelike-commutation condition, then identifies hermiticity as requiring the
      adjoint piece.
- id: weinberg-1.nonzero-spacelike-mixed-commutator
  label: Nonzero spacelike mixed commutator
  summary: The mixed bracket of the annihilation and creation scalar-field pieces
    is Δ₊(x − y). Although Δ₊ is Lorentz invariant and even for spacelike arguments,
    it does not vanish there, so an annihilation piece alone cannot supply a hermitian
    local interaction.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 202
    note: Equations (5.2.6)–(5.2.9) define Δ₊ and evaluate it for spacelike separation
      before establishing that it is nonzero.
  notation:
  - source: weinberg-1
    note: Δ₊(x) denotes the positive-frequency integral in equation (5.2.7).
- id: weinberg-1.parity-covariance-constraint
  label: Parity covariance constrains intrinsic parities
  summary: Requiring the parity-transformed causal scalar field to remain proportional
    to the field that can coexist with it forces ηᶜ = η*. Thus a spinless particle-antiparticle
    pair has even intrinsic parity; for a self-conjugate spinless particle, η is real
    and equals ±1.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 205
    - 206
    note: Equations (5.2.18)–(5.2.19) derive the particle-antiparticle parity relation,
      and the next page gives its self-conjugate consequence.
  notation:
  - source: weinberg-1
    note: η and ηᶜ are the intrinsic parities of particle and antiparticle, and ℘x
      = (−x, x⁰).
- id: weinberg-1.pauli-jordan-commutator
  label: Complex scalar-field commutator
  summary: The complex scalar field satisfies [φ(x), φ†(y)] = Δ(x − y), where Δ is
    the difference Δ₊(x − y) − Δ₊(y − x).
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 205
    note: Equations (5.2.12) and (5.2.13) state the field commutator and define Δ.
  notation:
  - source: weinberg-1
    note: The source denotes this commutator kernel by Δ, defined as an antisymmetrized
      Δ₊.
- id: weinberg-1.real-causal-scalar-field
  label: Self-adjoint causal scalar field
  summary: 'For one neutral spinless species, cancellation of the spacelike brackets
    requires Bose statistics and equal magnitudes of the annihilation and creation
    coefficients. A state-phase redefinition and field rescaling give φ(x) = φ⁺(x)
    + φ⁺†(x), a self-adjoint field whose normal-ordered polynomial interactions commute
    at spacelike separation. Once that relative-phase convention is chosen, every
    scalar field for the particle in the interaction density must use it: separately
    causal fields with different relative phases generally fail to commute with one
    another at spacelike separation.'
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 202
    - 203
    note: The source derives the coefficient condition from the spacelike brackets
      and gives the normalized self-adjoint field in equation (5.2.10).
  notation:
  - source: weinberg-1
    note: The source uses κ and λ for the coefficients in φ(x) = κφ⁺(x) + λφ⁻(x).
- id: weinberg-1.scalar-lorentz-representation
  label: Scalar Lorentz representation and zero spin
  summary: A one-component field in the scalar Lorentz representation, D(Λ) = 1, has
    only the j = 0 rotational solution; in this construction it describes spin-zero
    particles.
  kind: representation
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 201
    note: The scalar Lorentz representation is reduced to rotations and identified
      with j = 0.
  notation:
  - source: weinberg-1
    note: The source writes the scalar representation as D(Λ) = 1.
- id: weinberg-1.spinless-boson-and-mass-constraint
  label: Bosonic statistics and particle-antiparticle mass equality
  summary: The complex scalar construction has nontrivial spacelike commutation only
    for Bose statistics. Its causality condition also requires particle and antiparticle
    masses to be equal, so that the relevant positive-frequency functions coincide.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 204
    note: The source rules out Fermi statistics for a nonzero spinless field and states
      equal mass as necessary and sufficient together with equal coefficient magnitudes.
edges:
- id: weinberg-1.charge-obstruction-to-complex-field
  from: weinberg-1.charge-conservation-obstruction
  to: weinberg-1.complex-causal-scalar-field
  relation: pedagogical
  source_level: derive
  target_level: derive
  necessity: helpful
  rationale: 'The source uses the charge-conservation obstruction to motivate why
    the particle-antiparticle field combination is useful: it retains a simple charge
    commutator while meeting the spacelike-causality condition.'
  failure_mode: Without this motivation, the introduction of a distinct antiparticle
    can appear arbitrary and the charge-eigenfield role is less well motivated, though
    the causal mode combination can be derived by another route.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 203
    - 204
    note: The source says it must suppose two opposite-charge bosons, then defines
      a field with the same Q commutator as the annihilation field.
- id: weinberg-1.complex-field-to-c-t-constraints
  from: weinberg-1.complex-causal-scalar-field
  to: weinberg-1.charge-conjugation-time-reversal-phase-constraints
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The charge-conjugation and time-reversal derivations transform the particle
    and antiparticle pieces of the complex causal scalar field.
  failure_mode: Without its particle-antiparticle composition, the phase constraints
    are reduced to unexplained one-particle-state conventions.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 206
    note: The source transforms the annihilation and charge-conjugate creation pieces
      and imposes proportionality of the resulting field.
- id: weinberg-1.complex-field-to-commutator
  from: weinberg-1.complex-causal-scalar-field
  to: weinberg-1.pauli-jordan-commutator
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The later commutator statement is explicitly for the complex scalar field
    and defines its kernel from the particle-antiparticle mode expansion.
  failure_mode: Without the field definition, Δ can be confused with the earlier positive-frequency
    mixed bracket Δ₊.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 204
    - 205
    note: Equation (5.2.11) gives the complex field, and equations (5.2.12)–(5.2.13)
      state its commutator.
- id: weinberg-1.complex-field-to-parity-constraint
  from: weinberg-1.complex-causal-scalar-field
  to: weinberg-1.parity-covariance-constraint
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The parity argument tests whether the transformed particle-antiparticle
    scalar field is proportional to the original field that can coexist with it in
    an interaction.
  failure_mode: Without the two-term causal field, the relation between particle and
    antiparticle intrinsic parities has no stated field-theoretic basis.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 205
    - 206
    note: The source applies parity to the two constituent fields, requires proportionality,
      and then gives the self-conjugate consequence.
- id: weinberg-1.locality-condition-to-mixed-bracket
  from: weinberg-1.hermitian-local-interaction-condition
  to: weinberg-1.nonzero-spacelike-mixed-commutator
  relation: prerequisite
  source_level: recognize
  target_level: derive
  necessity: necessary
  rationale: The mixed bracket is calculated because hermiticity requires both field
    pieces while the interaction must satisfy spacelike commutation.
  failure_mode: Without the two requirements, the nonzero mixed bracket is an isolated
    calculation rather than the obstruction it establishes.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 201
    - 202
    note: The text poses the hermiticity/locality problem and immediately evaluates
      the mixed bracket as Δ₊.
- id: weinberg-1.mixed-bracket-to-real-field
  from: weinberg-1.nonzero-spacelike-mixed-commutator
  to: weinberg-1.real-causal-scalar-field
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The even, nonzero spacelike Δ₊ term is the quantity whose cancellation
    fixes Bose statistics and the relative coefficient magnitudes.
  failure_mode: A learner cannot justify the coefficient condition or the exclusion
    of Fermi statistics without the form and spacelike behavior of the mixed bracket.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 202
    - 203
    note: The spacelike bracket expressions on page 202 are followed by the vanishing
      condition on page 203.
- id: weinberg-1.mixed-bracket-to-statistics-mass-constraint
  from: weinberg-1.nonzero-spacelike-mixed-commutator
  to: weinberg-1.spinless-boson-and-mass-constraint
  relation: prerequisite
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The complex-field spacelike bracket is expressed through the same Δ₊
    function calculated for the mixed annihilation-creation bracket; its cancellation
    yields the Bose-statistics and equal-mass conditions.
  failure_mode: Without the Δ₊ mixed-bracket calculation, the equal-mass requirement
    and the exclusion of nonzero Fermi scalar fields cannot be derived from the spacelike
    bracket.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 202
    - 203
    - 204
    note: Pages 202–203 derive the Δ₊ mixed-bracket behavior; page 204 reuses Δ₊ in
      the complex-field bracket and states the Bose-statistics and equal-mass conditions.
- id: weinberg-1.real-field-to-charge-obstruction
  from: weinberg-1.real-causal-scalar-field
  to: weinberg-1.charge-conservation-obstruction
  relation: evidence
  source_level: use
  target_level: derive
  necessity: necessary
  rationale: The obstruction is specifically the inability of a polynomial in the
    self-adjoint field to enforce the operator balance required by conserved charge.
  failure_mode: Without the self-adjoint field’s composition, the charge-conservation
    failure is misstated as a generic limitation of scalar fields.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 203
    note: The source explicitly contrasts a polynomial in equation (5.2.10) with charge-conserving
      terms.
- id: weinberg-1.scalar-representation-to-real-field
  from: weinberg-1.scalar-lorentz-representation
  to: weinberg-1.real-causal-scalar-field
  relation: prerequisite
  source_level: recognize
  target_level: derive
  necessity: necessary
  rationale: The field construction is specialized to the one-component scalar representation
    and its spin-zero content.
  failure_mode: Treating the construction as a result for an unspecified Lorentz representation
    obscures why no spin labels occur and overextends the derivation.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 201
    note: The section first fixes the scalar representation and then writes the scalar
      annihilation and creation fields.
- id: weinberg-1.statistics-mass-to-complex-field
  from: weinberg-1.spinless-boson-and-mass-constraint
  to: weinberg-1.complex-causal-scalar-field
  relation: prerequisite
  source_level: derive
  target_level: derive
  necessity: necessary
  rationale: The equal-mass and Bose-statistics conditions are the stated necessary
    and sufficient conditions for the nonzero complex field to commute with its adjoint
    at spacelike separation.
  failure_mode: Omitting these conditions makes the displayed complex field look causal
    for unequal masses or fermionic statistics.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 204
    note: The source identifies these conditions immediately before normalizing the
      complex field.
groups: []
motivations:
- id: weinberg-1.why-combine-field-pieces
  nodes:
  - weinberg-1.hermitian-local-interaction-condition
  - weinberg-1.nonzero-spacelike-mixed-commutator
  - weinberg-1.real-causal-scalar-field
  summary: A hermitian interaction needs both annihilation and creation pieces, but
    their mixed spacelike bracket is nonzero; the construction asks how a field combination
    can still satisfy the spacelike-commutation requirement.
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 201
    - 202
    note: The source presents the hermiticity problem, computes the nonzero Δ₊ term,
      and asks what to do with it.
