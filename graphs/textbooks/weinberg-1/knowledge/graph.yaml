    note: Coordinates are x^μ with x^0=t and c=1; η11=η22=η33=+1 and η00=−1.
- id: weinberg-1.poincare-lie-algebra
  label: Poincaré Lie algebra and covariance of generators
  summary: 'Conjugation by a Poincaré transformation makes Pμ a four-vector and Jμν
    a tensor with an origin-dependent orbital term. Expanding this covariance gives
    the Lorentz-generator, Lorentz-momentum, and mutually commuting momentum commutators:
    the Poincaré Lie algebra.'
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.4'
    pages:
    - 60
    note: Derives covariance laws and equations (2.4.12)–(2.4.14).
- id: weinberg-1.poincare-momentum-orbits-and-vacuum
  label: Poincaré momentum orbits, physical sectors, and vacuum
  summary: Proper-orthochronous Lorentz orbits are classified by p² and, for timelike
    p, the sign of p0. The chapter lists six standard-momentum classes and little
    groups; it treats positive-energy massive and massless orbits as particles, identifies
    pμ=0 as the invariant vacuum, and notes that the remaining classes have no known
    physical interpretation here.
  kind: representation
  evidence:
  - source: weinberg-1
    section: '2.5'
    pages:
    - 64
    - 65
    - 66
    note: Classifies invariant momentum data, tabulates the six classes, and identifies
      the physical cases and vacuum.
- id: weinberg-1.positron-antiparticle-evidence
  label: Positron evidence for an oppositely charged equal-mass antiparticle
  summary: The cosmic-ray track interpreted as a positron had the curvature of a positive
    charge and a range and specific ionization consistent with a particle differing
    from the electron only in charge sign. This evidence supported the same-mass,
    opposite-charge antiparticle predicted by the revised hole interpretation.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
