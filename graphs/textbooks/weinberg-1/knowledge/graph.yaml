nodes:
- id: weinberg-1.abelian-gauge-averaging-covariant-qed-path-integral
  label: Abelian gauge averaging for the covariant QED path integral
  summary: For gauge-invariant inserted operators, action, and measure, change variables
    by a finite Abelian gauge transformation and average over the gauge function with
    a quadratic weight. Integrating the gauge function turns the Coulomb-gauge delta
    functional into a covariant gauge-fixing term; field-independent factors cancel
    in connected vacuum expectations.
  kind: method
  evidence:
  - source: weinberg-1
    section: '9.6'
    pages:
    - 416
    - 417
    note: The source states the gauge-invariance restriction, makes the change of
      variables, introduces the weighted gauge-function average, and derives the covariant
      gauge-fixed action.
- id: weinberg-1.abelian-symmetry-exponentiation
  label: Exponentiation of Abelian symmetry generators
  summary: For additive parameters the structure constants vanish, the generators
    commute, and finite transformations are exponentials of the Hermitian generators.
  kind: method
  evidence:
  - source: weinberg-1
    section: '2.2'
    pages:
    - 55
    note: Treats translations and fixed-axis rotations as the additive case.
- id: weinberg-1.action-at-a-distance-electrodynamics
  label: Action-at-a-distance alternative to the electromagnetic field
  summary: The Wheeler-Feynman approach sought to eliminate the electromagnetic field
    by deriving electromagnetic interactions directly between charges, with retarded
    or advanced potentials emerging when all charges in the universe are included.
  kind: representation
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 33
    note: The source describes eliminating the field in favor of direct interaction
      at a distance and its retarded/advanced-potential result.
- id: weinberg-1.additive-operator-and-free-hamiltonian-form
  label: Additive observables and the free Hamiltonian in Fock form
  summary: An additive operator whose eigenvalue on a multiparticle state is the sum
    of one-particle values has the one-body Fock expression ∫dq a†(q)a(q)f(q). The
    free Hamiltonian is the special case with f(q) equal to the one-particle energy,
    so its spectrum adds E(q) over occupied particles.
  kind: result
  group: weinberg-1.cluster-decomposition
  evidence:
  - source: weinberg-1
    section: '4.2'
    pages:
    - 176
    note: The source gives the additive-operator expression and specializes it to
      H0.
  notation:
  - source: weinberg-1
    note: For a particle of species n and mass m_n, E(p,σ,n)=sqrt(p²+m_n²).
- id: weinberg-1.angular-momentum-coupling-orthogonality
  label: Angular-momentum coupling and spherical-harmonic orthogonality
  summary: The two-body coupled basis is built from Clebsch–Gordan coefficients and
    spherical harmonics. Their orthogonality and the adopted momentum-state normalization
    are the inputs that produce the stated scalar products of the coupled partial-wave
    states.
  kind: method
  group: weinberg-1.partial-waves-and-resonances
  evidence:
  - source: weinberg-1
    section: '3.7'
    pages:
    - 152
    - 153
    note: The source defines the basis with Clebsch–Gordan coefficients and Y_l^m
      and gives its target normalization, which Problem 7 asks to prove.
- id: weinberg-1.anomalous-magnetic-moment-radiative-correction
  label: Anomalous magnetic moment as a radiative correction
  summary: Precision measurements found the electron magnetic moment slightly above
    the Dirac value. The successful first-order radiative correction calculation reproduced
    the anomaly and, together with the Lamb shift, established the physical reality
    of radiative corrections.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 36
    note: The source gives the measured deviation, the radiative-correction interpretation,
      and agreement with observation.
- id: weinberg-1.antiparticles-from-charge-eigenfields
  label: Antiparticles from charge-eigenfield causality
  summary: To make a causal field have a definite conserved charge, its annihilation
    component must be paired with a creation component for a species carrying opposite
    conserved quantum numbers. The construction therefore requires an antiparticle,
    possibly identical with a neutral particle.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.1'
    pages:
    - 199
    note: The charge commutator argument requires opposite-charge particle species
      and then restricts attention to an irreducible field and its antiparticle.
- id: weinberg-1.antiunitary-time-reversal-s-matrix-reciprocity
  label: Antiunitary time reversal and S-matrix reciprocity
  summary: Time reversal is antiunitary, reverses momenta and spin components, and
    interchanges in with out states. If its free-state action commutes with V, antiunitarity
    reverses the iε prescription and yields a relation between a process and the reversed
    inverse process, rather than a generic equality of the two directly reversed rates.
  kind: result
  group: weinberg-1.discrete-symmetries
  evidence:
  - source: weinberg-1
    section: '3.3'
    pages:
    - 127
    - 128
    - 129
    note: The source states the in/out interchange, antiunitary scalar-product rule,
      interaction criterion, and its Lippmann–Schwinger justification.
- id: weinberg-1.appendix-dirac-brackets-type-a-proof
  label: 'Appendix proof: Dirac brackets for auxiliary-coordinate constraints'
  summary: When auxiliary coordinates have zero conjugate momenta and secondary constraints
    solve them in terms of independent canonical variables, compute all constrained
    commutators from the independent brackets and show they equal i times the Dirac
    brackets.
  kind: method
  evidence:
  - source: weinberg-1
    section: Appendix A
    pages:
    - 333
    - 334
    note: Part A states the constraint form and compares all brackets with the canonical
      commutators.
- id: weinberg-1.appendix-dirac-brackets-type-b-proof
  label: 'Appendix proof: Dirac brackets after coordinate and momentum reduction'
  summary: When constraints separately reduce coordinates and momenta, use the tangent
    and normal relations implied by those constraints to derive the commutators as
    i times Dirac brackets; the Hamiltonian may then be written using constrained
    variables.
  kind: method
  evidence:
  - source: weinberg-1
    section: Appendix B
    pages:
    - 335
    - 336
    - 337
    note: Part B derives the reduced brackets and closes by giving the constrained-variable
      Hamiltonian.
- id: weinberg-1.appendix-feynman-parameters-dimensional-integrals
  label: 'Appendix: Feynman parameters and dimensional loop integrals'
  summary: The appendix gives the N-denominator Feynman-parameter identity and the
    dimensionally continued Euclidean loop-integral formula used in the vacuum-polarization
    calculation. Ultraviolet divergences appear as Gamma-function poles as d approaches
    four, with stated special cases and recursion guidance.
  kind: method
  evidence:
  - source: weinberg-1
    section: Appendix Assorted Integrals
    pages:
    - 497
    note: The appendix states the general parameter formula, dimensional integral,
      and the Gamma-pole interpretation.
- id: weinberg-1.asymptotic-completeness-assumption
  label: Asymptotic completeness assumption
  summary: The unitarity proof treats the in and out scattering states as complete
    orthonormal sets spanning the same Hilbert space. This is an assumption about
    the asymptotic scattering description, beyond normalization alone.
  kind: assumption
  group: weinberg-1.asymptotic-scattering
  evidence:
  - source: weinberg-1
    section: '3.2'
    pages:
    - 113
    - 114
    note: The source says the in/out states inhabit one Hilbert space and uses completeness
      of each set to establish both unitarity relations.
- id: weinberg-1.asymptotic-multiparticle-state-labels-and-normalization
  label: Asymptotic multiparticle state labels and normalization
  summary: A noninteracting multiparticle state transforms as a direct product of
    one-particle states. Its labels collect each momentum, spin component or massless
    helicity, and species; the normalization includes exchange terms for identical
    species, while the abbreviated label α and integration dα avoid counting identical-particle
    exchanges twice.
  kind: representation
  group: weinberg-1.asymptotic-scattering
  evidence:
  - source: weinberg-1
    section: '3.1'
    pages:
    - 107
    - 108
    note: The text defines the direct-product asymptotic states, their labels, permutation
      normalization, abbreviated label, integration, and completeness convention.
  notation:
  - source: weinberg-1
    note: α abbreviates the full collection of individual momenta, spin components
      or helicities, and particle-type labels; δ(β−α) includes momentum delta functions
      and Kronecker deltas with allowed identical-particle permutations.
- id: weinberg-1.asymptotic-overlap-unitarity-proof
  label: Asymptotic overlap proof of S unitarity
  summary: With asymptotic completeness and the equal in/out normalization, insert
    the out or in completeness relation between scattering-state overlaps. The two
    insertions give S†S=1 and SS†=1 as a direct proof of S unitarity.
  kind: method
  group: weinberg-1.s-matrix-and-symmetries
  evidence:
  - source: weinberg-1
    section: '3.2'
    pages:
    - 113
    - 114
    note: The source defines the overlap and derives both completeness-based unitarity
      identities.
- id: weinberg-1.auxiliary-field-constraint-interaction-picture-route
  label: Auxiliary-field constraints and interaction-picture route
  summary: Fields without time derivatives have no canonical conjugates; solve their
    constraint equations together with the canonical momentum definitions when possible,
    then express the Hamiltonian in canonical variables, split it into H₀ and V, and
    transform V to the interaction picture.
  kind: method
  evidence:
  - source: weinberg-1
    section: '7.2'
    pages:
    - 303
    note: The text describes auxiliary C fields, their constraints, and the route
      to an interaction-picture perturbation Hamiltonian.
- id: weinberg-1.auxiliary-field-restoration-of-covariant-action
  label: Auxiliary-field restoration of a covariant vector action
  summary: For real massive vector fields, after canonical momentum integration the
    apparent Lagrangian omits the time component and hides covariance. Reintroducing
    the auxiliary A0 integration before eliminating the momenta restores the original
    Lorentz-invariant action, up to field-independent factors.
  kind: method
  evidence:
  - source: weinberg-1
    section: '9.3'
    pages:
    - 393
    - 394
    note: The source presents the massive-vector example, adds A0, and states that
      eliminating the momenta recovers the original covariant Lagrangian.
- id: weinberg-1.belinfante-symmetric-energy-momentum-tensor
  label: Belinfante symmetric energy-momentum tensor
  summary: Lorentz invariance improves the canonical energy-momentum tensor by a divergence
    term to a conserved symmetric Belinfante tensor with the same integrated four-momentum;
    this symmetric tensor is the gravitational source.
  kind: result
  evidence:
  - source: weinberg-1
    section: '7.4'
    pages:
    - 315
    - 316
    note: The source derives the improvement, conservation, symmetry, and equality
      of integrated momentum.
- id: weinberg-1.berezin-integration-completeness-and-inverse-jacobian
  label: Berezin integration, completeness, and inverse Jacobian
  summary: Berezin integration selects the highest Grassmann coefficient with an ordered
    anticommuting differential measure. It is linear, translation-invariant, and equivalent
    to repeated single-variable integration with the stated reversed differential
    order; it yields fermionic eigenstate completeness and, under a nonsingular linear
    change of Grassmann variables, transforms with the inverse determinant.
  kind: method
  evidence:
  - source: weinberg-1
    section: '9.5'
    pages:
    - 403
    - 404
    - 405
    - 406
    - 407
    note: The source defines coefficient-selecting Berezin integration, derives repeated-integral,
      linearity, and translation properties, gives the inverse-determinant change
      rule, and establishes completeness.
- id: weinberg-1.born-rule-complete-orthogonal-rays
  label: Born rule for a complete orthogonal set of rays
  summary: For tests that distinguish mutually orthogonal rays, the transition probability
    is the squared scalar-product modulus, and probabilities sum to one when the final
    vectors are complete.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.1'
    pages:
    - 50
    note: Gives the transition probability and completeness normalization.
- id: weinberg-1.bose-fermi-exchange-symmetry-cluster-argument
  label: Bose–Fermi exchange symmetry and its cluster argument
  summary: For identical particles, exchanging labels gives the same ray up to a unit
    phase. If that phase is species-dependent, applying the exchange twice restricts
    it to +1 or −1. The source argues that dependence on distant particles conflicts
    with cluster decomposition, spin dependence would require a nonexistent one-dimensional
    rotation representation, and Lorentz-compatible momentum dependence does not evade
    the double-exchange argument. It also states the path-dependent two-dimensional
    caveat.
  kind: result
  group: weinberg-1.cluster-decomposition
  evidence:
  - source: weinberg-1
    section: '4.1'
    pages:
    - 170
    - 171
    note: The exchange-ray phase is introduced and its restrictions, including the
      dimensional caveat, are discussed.
  notation:
  - source: weinberg-1
    note: A particle label has momentum p, spin component or helicity σ, and species
      n; α_n denotes the exchange phase for species n.
- id: weinberg-1.bosonic-fock-space-vacuum-energy
  label: Bosonic occupation-number states and vacuum energy
  summary: A bosonic Fock state is specified by unrestricted nonnegative occupation
    numbers for normal modes. Creation and annihilation operators change a mode occupation
    by one, and the Hamiltonian is the sum of hbar omega per quantum plus an infinite
    zero-point vacuum energy.
  kind: representation
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 17
    note: The source interprets the ladder matrices, identifies the vacuum, and reads
      the energy spectrum from equation (1.2.14).
- id: weinberg-1.bosonic-phase-space-path-integral
  label: Bosonic phase-space path integral from canonical slices
  summary: For bosonic canonical pairs after first-class constraints have been gauge-fixed
    and remaining second-class constraints solved into unconstrained Q,P variables,
    insert coordinate and momentum completeness relations between infinitesimal time
    slices, with Q ordered left of P. The continuum limit integrates over all q and
    p paths with fixed endpoint coordinates and action ∫(q̇p−H)dt.
  kind: method
  evidence:
  - source: weinberg-1
    section: '9.1'
    pages:
    - 378
    - 379
    - 380
    - 381
    note: The source states the constrained-system qualification, coordinate and momentum
      completeness, the infinitesimal kernel, and the time-sliced endpoint path integral.
- id: weinberg-1.box-normalization-and-connected-transition-element
  label: Box normalization and connected transition element
  summary: A finite spatial box discretizes momenta and a finite time interval regulates
    energy conservation, turning squared delta functions into volume and time factors.
    For final states with no unchanged proper subset of the initial particles, the
    connected transition defines a delta-function-free Mβα and yields the differential
    master transition-rate formula in the large-box limit.
  kind: method
  group: weinberg-1.rates-and-phase-space
  evidence:
  - source: weinberg-1
    section: '3.4'
    pages:
    - 134
    - 135
    - 136
    note: The text introduces spatial and time boxes, restricts to the connected part,
      and derives equations (3.4.10)–(3.4.12).
  notation:
  - source: weinberg-1
    note: The source’s connected restriction excludes a final state having an unchanged
      proper subset with the same four-momentum as a corresponding initial subset.
- id: weinberg-1.breit-wigner-cross-section-and-partial-widths
  label: Breit–Wigner cross-section and partial widths
  summary: For a two-body resonance without background, the unitarity decomposition
    gives the Breit–Wigner total and channel cross-sections. The channel quantities
    Γ_n sum, including higher-multiplicity channels, to Γ and are the decay partial
    widths; the peak’s full width at half maximum is Γ and its total cross-section
    is bounded at order one squared wavelength.
  kind: result
  group: weinberg-1.partial-waves-and-resonances
  evidence:
  - source: weinberg-1
    section: '3.8'
    pages:
    - 162
    - 163
    note: Equations (3.8.16)–(3.8.19) identify the Breit–Wigner form, partial widths,
      peak width, bound, and unresolved-width integral.
- id: weinberg-1.canonical-energy-momentum-tensor
  label: Canonical energy-momentum tensor from translations
  summary: Spacetime translation invariance gives a conserved canonical energy-momentum
    tensor whose time components integrate to Pν; its spatial components generate
    spatial translations and its time component is the Hamiltonian.
  kind: result
  evidence:
  - source: weinberg-1
    section: '7.3'
    pages:
    - 311
    - 312
    note: The source derives the translation currents, their generator role, and the
      canonical Hamiltonian expression.
- id: weinberg-1.canonical-field-action-formalism
  label: Canonical field theory from a local action
  summary: In the canonical field formalism, a Lagrangian is the spatial integral
    of a local function of fields and derivatives; stationary action gives field equations,
    and derivatives with respect to field time derivatives supply conjugate momenta
    and equal-time quantization brackets.
  kind: method
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 20
    - 21
    - 22
    note: The source describes the Heisenberg-Pauli prescription and works it out
      for a free complex scalar field.
- id: weinberg-1.canonical-fock-commutation-relations
  label: Bosonic and fermionic Fock brackets
  summary: The creation–annihilation bracket equals δ(q′−q), while the creation–creation
    and annihilation–annihilation brackets vanish. These are commutators for bosons
    and anticommutators for fermions; for different species the bracket commutes unless
    both particles are fermions. They follow from the explicit actions on every Fock
    state.
  kind: result
  group: weinberg-1.cluster-decomposition
  evidence:
  - source: weinberg-1
    section: '4.2'
    pages:
    - 174
    note: The source applies the actions to arbitrary states to establish all three
      bracket relations.
  notation:
  - source: weinberg-1
    note: The displayed ± bracket means AB∓BA, with the top sign for bosons and the
      bottom sign for fermions.
- id: weinberg-1.canonical-functional-derivatives-and-hamilton-equations
  label: Canonical functional derivatives and Hamilton equations
  summary: Bracket-defined functional derivatives fix the quantum signs for bosonic
    functionals. The free Hamiltonian generates time translation of canonical variables,
    yielding the Hamiltonian equations for fields and conjugates.
  kind: method
  evidence:
  - source: weinberg-1
    section: '7.1'
    pages:
    - 296
    note: The text defines the derivatives and derives time evolution from the free
      Hamiltonian.
- id: weinberg-1.canonical-oscillator-quantization
  label: Canonical quantization and ladder operators
  summary: Canonical coordinate-momentum commutators for each normal mode are represented
    by creation and annihilation matrices. Their commutator algebra and time dependence
    give the oscillator coordinate as a sum of lowering and raising pieces.
  kind: method
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 16
    note: Equations (1.2.6)–(1.2.13) introduce the canonical brackets and their ladder-operator
      realization.
- id: weinberg-1.canonical-rotation-generator-action
  label: Canonical rotation-generator action on fields
  summary: Write the rotation generator using canonical fields, conjugates, orbital
    derivatives, and finite-dimensional rotation matrices; the equal-time brackets
    then give the expected rotation action on both fields and momenta.
  kind: method
  evidence:
  - source: weinberg-1
    section: '7.4'
    pages:
    - 318
    note: Equations (7.4.24)–(7.4.26) state the canonical form and its commutators.
- id: weinberg-1.canonical-symmetry-generator-method
  label: Canonical charge as symmetry generator
  summary: For a symmetry acting at fixed time on canonical fields, express its charge
    as a momentum-weighted field variation and use equal-time brackets to show that
    the charge generates the field transformation and the conjugate transformation.
  kind: method
  evidence:
  - source: weinberg-1
    section: '7.3'
    pages:
    - 309
    - 310
    note: Equations (7.3.16)–(7.3.19) give the canonical charge and generator calculation.
- id: weinberg-1.causal-combination-of-creation-and-annihilation-fields
  label: Causal combination of creation and annihilation fields
  summary: Hermiticity rules out using only annihilation or only creation fields.
    A causal field is therefore a coefficient-controlled linear combination of both,
    chosen so its graded brackets vanish at spacelike separation; local interactions
    use even numbers of fermionic components.
  kind: method
  evidence:
  - source: weinberg-1
    section: '5.1'
    pages:
    - 198
    note: The source introduces the combined field in equation (5.1.31) and its spacelike
      bracket condition in equation (5.1.32).
- id: weinberg-1.causal-dirac-field-and-fermion-statistics
  label: Causal Dirac field requires fermion statistics
  summary: Spacelike cancellation of the Dirac field's two spin sums is possible only
    with anticommutators, equal coefficient magnitudes, and opposite parity eigenvalues
    for the particle-annihilation and antiparticle-creation spinors. A phase choice
    fixes the usual normalized Dirac field and its anticommutator.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.5'
    pages:
    - 222
    - 223
    - 224
    note: Equations (5.5.29)–(5.5.39) derive the coefficient conditions, enforce Fermi
      statistics, and record the resulting field and anticommutator.
- id: weinberg-1.causal-massive-vector-field
  label: Causal massive vector field
  summary: Spacelike cancellation for a spin-one vector field requires Bose statistics
    and equal magnitudes of its annihilation and creation coefficients. It yields
    a real neutral vector field, or a complex field made from equal-mass opposite-charge
    particle and antiparticle operators.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.3'
    pages:
    - 210
    - 211
    note: The mixed bracket is evaluated and the causal real and charged vector fields
      are given in equations (5.3.31)–(5.3.35).
- id: weinberg-1.central-charges-from-projectivity
  label: Central charges as the local algebraic form of projectivity
  summary: Near identity, a projective phase adds antisymmetric constants times the
    identity to generator commutators. Jacobi identities constrain these central charges;
    charges of the form induced by shifting generators are removable.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.7'
    pages:
    - 82
    - 83
    note: Expands the cocycle and derives the centrally extended commutators and shift.
- id: weinberg-1.charge-as-number-difference
  label: Charge as particle-minus-antiparticle number
  summary: After subtracting the vacuum contribution, the relevant conserved number
    operators have both signs and count particles minus antiparticles. For charged
    species, charge is proportional to this difference, so particles and antiparticles
    carry opposite charge.
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 28
    note: The source interprets the signed number operators and derives the opposite-charge
      conclusion.
- id: weinberg-1.charge-conjugation-cp-cpt-process-relations
  label: C, CP, and CPT process relations
  summary: Charge conjugation is a unitary particle–antiparticle interchange whose
    phases, like intrinsic parity phases, are conventional except for neutral self-conjugate
    particles. C and P fail in weak interactions, CP also fails weakly, while the
    text identifies CPT as exact in quantum field theory and states that its antiunitarity
    relates a process to the inverse antiparticle process with reversed spin components.
  kind: result
  group: weinberg-1.discrete-symmetries
  evidence:
  - source: weinberg-1
    section: '3.3'
    pages:
    - 131
    - 132
    - 133
    - 134
    note: The source defines C, discusses CP eigenstates and violation, states the
      CPT qualification, and connects observed CP violation to T violation assuming
      CPT.
  notation:
  - source: weinberg-1
    note: The CPT statement is explicitly qualified in the text as applying in quantum
      field theory; it is not a consequence of proper-orthochronous Lorentz covariance
      alone.
- id: weinberg-1.charge-conjugation-neutral-pion-decay-selection
  label: Charge-conjugation selection in neutral-pion decays
  summary: For completely neutral self-conjugate particles, C conservation equates
    the products of charge-conjugation parities. With the photon’s stated C parity
    and observed π0→2γ decay, the neutral pion has C=+1 and π0→3γ is forbidden.
  kind: result
  group: weinberg-1.discrete-symmetries
  evidence:
  - source: weinberg-1
    section: '3.3'
    pages:
    - 131
    - 132
    note: The source applies C conservation to neutral particles and gives the π0
      two- and three-photon consequences.
- id: weinberg-1.charge-conjugation-time-reversal-phase-constraints
  label: Charge-conjugation and time-reversal phase constraints
  summary: For the causal scalar field to transform proportionally under charge conjugation,
    the one-particle phases obey ξᶜ = ξ*. Time reversal is antiunitary; requiring
    a simple relation to the field at the time-reversed point instead gives ζᶜ = ζ*.
    In the self-conjugate case the charge-conjugation phase is real and equals ±1.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 206
    note: Equations (5.2.20)–(5.2.31) derive the charge-conjugation and time-reversal
      phase conditions for the scalar field.
  notation:
  - source: weinberg-1
    note: ξ and ζ are the one-particle phases for charge conjugation and time reversal,
      respectively.
- id: weinberg-1.charge-conservation-obstruction
  label: Charge-conservation obstruction for a self-adjoint field
  summary: If the particle carries a conserved charge, charge-preserving interaction
    terms need equal numbers of a(p) and a†(p). This cannot be achieved by a polynomial
    solely in the self-adjoint neutral-field combination, which lacks a simple commutator
    with the charge operator.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 203
    note: The source contrasts the simple charge commutators of φ⁺ and its adjoint
      with the self-adjoint field.
- id: weinberg-1.charge-scale-photon-field-renormalization
  label: Physical charge scale from photon-field normalization
  summary: 'Global gauge invariance fixes relative charge assignments but leaves their
    common scale free. Defining the renormalized electromagnetic field by a complete
    photon propagator with unit residue fixes that scale: the physical matter charge
    is q_i=sqrt(Z3) q_Bi. Thus higher-order charge renormalization is a common photon-field
    normalization factor rather than a particle-specific correction.'
  kind: result
  evidence:
  - source: weinberg-1
    section: '10.4'
    pages:
    - 444
    - 445
    note: The source explicitly identifies the unfixed scale, defines the renormalized
      photon field, and gives q_i=sqrt(Z3)q_Bi.
- id: weinberg-1.cluster-decomposition-forces-multiparticle-scattering
  label: Cluster decomposition forces higher-particle scattering
  summary: If a Hamiltonian has a nonzero two-particle interaction term, its three-particle
    matrix element contains spectator-delta contributions. Cancelling them with a
    three-particle coefficient would introduce two momentum delta factors, violating
    the one-delta clustering condition. Therefore a clustering theory with two-particle
    scattering cannot set all three-and-higher-particle scattering processes to zero.
  kind: result
