nodes:
- id: weinberg-1.abelian-symmetry-exponentiation
  label: Exponentiation of Abelian symmetry generators
  summary: For additive parameters the structure constants vanish, the generators
    commute, and finite transformations are exponentials of the Hermitian generators.
  kind: method
  evidence:
  - source: weinberg-1
    section: '2.2'
    pages:
    - 55
    note: Treats translations and fixed-axis rotations as the additive case.
- id: weinberg-1.action-at-a-distance-electrodynamics
  label: Action-at-a-distance alternative to the electromagnetic field
  summary: The Wheeler-Feynman approach sought to eliminate the electromagnetic field
    by deriving electromagnetic interactions directly between charges, with retarded
    or advanced potentials emerging when all charges in the universe are included.
  kind: representation
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 33
    note: The source describes eliminating the field in favor of direct interaction
      at a distance and its retarded/advanced-potential result.
- id: weinberg-1.anomalous-magnetic-moment-radiative-correction
  label: Anomalous magnetic moment as a radiative correction
  summary: Precision measurements found the electron magnetic moment slightly above
    the Dirac value. The successful first-order radiative correction calculation reproduced
    the anomaly and, together with the Lamb shift, established the physical reality
    of radiative corrections.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 36
    note: The source gives the measured deviation, the radiative-correction interpretation,
      and agreement with observation.
- id: weinberg-1.born-rule-complete-orthogonal-rays
  label: Born rule for a complete orthogonal set of rays
  summary: For tests that distinguish mutually orthogonal rays, the transition probability
    is the squared scalar-product modulus, and probabilities sum to one when the final
    vectors are complete.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.1'
    pages:
    - 50
    note: Gives the transition probability and completeness normalization.
- id: weinberg-1.bosonic-fock-space-vacuum-energy
  label: Bosonic occupation-number states and vacuum energy
  summary: A bosonic Fock state is specified by unrestricted nonnegative occupation
    numbers for normal modes. Creation and annihilation operators change a mode occupation
    by one, and the Hamiltonian is the sum of hbar omega per quantum plus an infinite
    zero-point vacuum energy.
  kind: representation
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 17
    note: The source interprets the ladder matrices, identifies the vacuum, and reads
      the energy spectrum from equation (1.2.14).
- id: weinberg-1.canonical-field-action-formalism
  label: Canonical field theory from a local action
  summary: In the canonical field formalism, a Lagrangian is the spatial integral
    of a local function of fields and derivatives; stationary action gives field equations,
    and derivatives with respect to field time derivatives supply conjugate momenta
    and equal-time quantization brackets.
  kind: method
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 20
    - 21
    - 22
    note: The source describes the Heisenberg-Pauli prescription and works it out
      for a free complex scalar field.
- id: weinberg-1.canonical-oscillator-quantization
  label: Canonical quantization and ladder operators
  summary: Canonical coordinate-momentum commutators for each normal mode are represented
    by creation and annihilation matrices. Their commutator algebra and time dependence
    give the oscillator coordinate as a sum of lowering and raising pieces.
  kind: method
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 16
    note: Equations (1.2.6)–(1.2.13) introduce the canonical brackets and their ladder-operator
      realization.
- id: weinberg-1.central-charges-from-projectivity
  label: Central charges as the local algebraic form of projectivity
  summary: Near identity, a projective phase adds antisymmetric constants times the
    identity to generator commutators. Jacobi identities constrain these central charges;
    charges of the form induced by shifting generators are removable.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.7'
    pages:
    - 82
    - 83
    note: Expands the cocycle and derives the centrally extended commutators and shift.
- id: weinberg-1.charge-as-number-difference
  label: Charge as particle-minus-antiparticle number
  summary: After subtracting the vacuum contribution, the relevant conserved number
    operators have both signs and count particles minus antiparticles. For charged
    species, charge is proportional to this difference, so particles and antiparticles
    carry opposite charge.
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 28
    note: The source interprets the signed number operators and derives the opposite-charge
      conclusion.
- id: weinberg-1.charge-conjugation-time-reversal-phase-constraints
  label: Charge-conjugation and time-reversal phase constraints
  summary: For the causal scalar field to transform proportionally under charge conjugation,
    the one-particle phases obey ξᶜ = ξ*. Time reversal is antiunitary; requiring
    a simple relation to the field at the time-reversed point instead gives ζᶜ = ζ*.
    In the self-conjugate case the charge-conjugation phase is real and equals ±1.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 206
    note: Equations (5.2.20)–(5.2.31) derive the charge-conjugation and time-reversal
      phase conditions for the scalar field.
  notation:
  - source: weinberg-1
    note: ξ and ζ are the one-particle phases for charge conjugation and time reversal,
      respectively.
- id: weinberg-1.charge-conservation-obstruction
  label: Charge-conservation obstruction for a self-adjoint field
  summary: If the particle carries a conserved charge, charge-preserving interaction
    terms need equal numbers of a(p) and a†(p). This cannot be achieved by a polynomial
    solely in the self-adjoint neutral-field combination, which lacks a simple commutator
    with the charge operator.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 203
    note: The source contrasts the simple charge commutators of φ⁺ and its adjoint
      with the self-adjoint field.
- id: weinberg-1.complex-causal-scalar-field
  label: Complex causal scalar field from particle and antiparticle
  summary: For spinless bosons of equal mass and opposite charges, combining a particle
    annihilation field with an antiparticle creation field gives φ(x) = φ⁺(x) + φ⁺c†(x).
    The field has [Q, φ(x)] = −qφ(x) and is the essentially unique causal scalar field
    in this construction; it covers self-conjugate neutral particles as the special
    case aᶜ(p) = a(p).
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 203
    - 204
    note: The source introduces opposite-charge equal-mass bosons, forms the charge-eigenfield,
      and gives its normalized mode expansion in equation (5.2.11).
  notation:
  - source: weinberg-1
    note: Superscript c labels the charge-conjugate particle; φ⁺c† is the adjoint
      of its annihilation field.
- id: weinberg-1.conserved-poincare-generators
  label: Conserved momentum, angular momentum, and energy
  summary: With H=P0, the three-momentum, angular momentum, and energy commute with
    H and are conserved; boost generators do not, so their eigenvalues are not used
    to label physical states. The three-vector commutators exhibit rotations, boosts,
    and translations explicitly.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.4'
    pages:
    - 61
    note: Identifies the conserved generators, boosts, and finite translation and
      rotation operators.
- id: weinberg-1.continuous-symmetries-unitary
  label: Continuous symmetries use linear unitary operators
  summary: A symmetry connected continuously to the identity cannot switch to an antilinear
    realization; it is represented by a linear unitary operator. Antiunitary symmetries
    involve reversal of time's direction in this treatment.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.2'
    pages:
    - 51
    note: Uses continuity from the identity to select the unitary-linear branch.
- id: weinberg-1.cpt-and-unconventional-inversion-actions
  label: CPT, CP, and unconventional inversion multiplets
  summary: The stated quantum-field-theory CPT action maps a particle to its antiparticle
    without extra phase or mixing matrix, excluding the proposed anomalous sign for
    (CPT)². With conventional time reversal, CP and charge conjugation act conventionally;
    an unconventional time-reversal multiplet can make CP fail to interchange a paired
    particle-antiparticle pair. The text reports no known examples of such unconventional
    inversion representations.
  kind: result
  evidence:
  - source: weinberg-1
    section: Appendix C
    pages:
    - 103
    - 104
    note: Relates the general multiplet analysis to CPT, CP, and C.
- id: weinberg-1.de-broglie-matter-waves
  label: de Broglie relations and matter-wave group velocity
  summary: Lorentz invariance of a material-particle wave phase motivates K=p/h and
    nu=E/h. With these relations, the group velocity of a wave packet equals the represented
    particle velocity.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 3
    note: Equation (1.1.1) and the surrounding argument connect Lorentz-invariant
      phase, energy-momentum, and group velocity.
- id: weinberg-1.degenerate-multiplet-parity-and-joint-inversion-degeneracy
  label: Parity diagonalization and joint parity–time-reversal degeneracy
  summary: On a degenerate multiplet parity is represented by a unitary matrix that
    can be diagonalized by a basis choice, unlike antiunitary time reversal. That
    parity-diagonal basis need not make time reversal simple, so the two inversions
    together can impose degeneracies that neither requires separately.
  kind: representation
  evidence:
  - source: weinberg-1
    section: Appendix C
    pages:
    - 103
    note: Contrasts parity diagonalization with the time-reversal basis and states
      the joint-degeneracy possibility.
- id: weinberg-1.degenerate-multiplet-time-reversal-blocks
  label: Time reversal on degenerate multiplets has canonical blocks
  summary: For degenerate massive species, antiunitary time reversal may mix species
    through a unitary matrix rather than a phase. A unitary basis change acts by congruence,
    not ordinary similarity, so it need not diagonalize the action but can reduce
    it to one-dimensional phase blocks and paired two-dimensional blocks.
  kind: representation
  evidence:
  - source: weinberg-1
    section: Appendix C
    pages:
    - 100
    - 101
    - 102
    note: Introduces the multiplet action and derives the canonical block reduction.
- id: weinberg-1.deprojectivization-theorem
  label: Conditions for eliminating a projective phase
  summary: A group's representation may be rephased to an ordinary one when its generator
    central charges can all be removed and the group is simply connected. Hence intrinsic
    projectivity can arise locally from nonremovable central charges or globally from
    nontrivial topology.
  kind: result
  evidence:
  - source: weinberg-1
    section: 2.7 and Appendix B
    pages:
    - 83
    - 84
    - 96
    note: States the theorem and introduces its appendix proof.
- id: weinberg-1.dirac-electromagnetic-coupling-spin
  label: Dirac electromagnetic coupling predicts spin and magnetic moment
  summary: Minimal electromagnetic coupling in the Dirac equation yields a conserved
    total angular momentum with an intrinsic hbar/2 term. Iterating the equation produces
    magnetic and electric field terms; in the slow limit the magnetic term gives the
    observed electron magnetic moment and the correct leading fine structure.
  kind: method
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 9
    - 10
    note: The source applies the electromagnetic substitutions, identifies the spin
      term in conserved angular momentum, and interprets the iterated equation.
- id: weinberg-1.dirac-hole-theory
  label: Dirac hole theory
  summary: Filling the negative-energy electron states blocks downward transitions
    by exclusion; vacancies behave as positive-energy, oppositely charged objects.
    This construction attempted to reinterpret negative-energy solutions and anticipated
    a positron-like particle.
  kind: representation
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 12
    note: The source states the filled negative-energy sea proposal and the quantum
      numbers of holes.
- id: weinberg-1.dirac-linearization-clifford-algebra
  label: Dirac linearization and matrix anticommutation relations
  summary: Seeking a positive density led to a multicomponent wave equation first
    order in time and, for Lorentz covariance, space derivatives. Squaring it to recover
    the relativistic dispersion relation imposes anticommutation relations on constant
    matrices, realized by four-by-four matrices.
  kind: method
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 7
    - 8
    note: The source connects the sign problem of the Klein-Gordon density to first-order
      time evolution and derives the matrix constraints in equations (1.1.15)–(1.1.18).
- id: weinberg-1.dirac-positive-probability-current
  label: Positive probability current for the Dirac equation
  summary: The Dirac equation has a continuity equation with density psi-dagger psi
    and current c psi-dagger alpha psi. The density is positive and its space integral
    is conserved, meeting the original positive-probability aim.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 10
    note: Equations (1.1.28)–(1.1.29) give the continuity equation, density, current,
      and probability interpretation.
- id: weinberg-1.dirac-spinor-lorentz-covariance
  label: Dirac spinor Lorentz covariance
  summary: Writing the first-order equation with gamma matrices makes their anticommutation
    relations Lorentz invariant. A Lorentz transformation of coordinates is accompanied
    by a similarity transformation of the multicomponent wave function, establishing
    covariance of the Dirac equation.
  kind: representation
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 9
    note: Equations (1.1.19)–(1.1.21) and the following paragraph state the gamma-matrix
      and spinor transformation argument.
- id: weinberg-1.dyson-renormalizability-criterion
  label: Dyson equivalence and renormalizability criterion
  summary: Dyson showed that the Schwinger and Tomonaga operator approaches yield
    the same graphical rules as Feynman's approach and outlined why diagram divergences
    can be absorbed into finitely many masses and couplings in renormalizable theories.
    The Pauli term provides an example that would spoil QED renormalizability.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 37
    note: The source states the formalism equivalence, finite-parameter absorption
      criterion, and the Pauli-term consequence.
- id: weinberg-1.effective-field-theory-low-energy-form
  label: Field theories as low-energy effective descriptions
  summary: 'The chapter presents quantum electrodynamics and related field theories
    as possible low-energy approximations: any relativistic quantum theory of particles
    is said to take a field-theory form at sufficiently low energy, without asserting
    that fields are fundamental.'
  kind: assumption
  group: weinberg-1.historical-introduction
  evidence:
  - source: weinberg-1
    section: Historical Introduction
    pages:
    - 2
    note: The source states the effective-field-theory viewpoint and its low-energy
      rationale.
- id: weinberg-1.fermion-antiparticle-operator-reinterpretation
  label: Fermion antiparticles from negative-energy operator reinterpretation
  summary: For a charged Dirac field, negative-frequency electron annihilation and
    creation operators can be redefined as positron creation and annihilation operators.
    Relative to the vacuum containing no positive-energy electrons or positrons, this
    rewrites the physical Hamiltonian as positive, up to an infinite vacuum constant.
  kind: method
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 23
    - 24
    note: Equations (1.2.41)–(1.2.47) display the negative-energy problem, operator
      redefinition, vacuum condition, and positive relative energy.
- id: weinberg-1.fermionic-anticommutation-occupancy
  label: Fermionic anticommutators and single-mode occupancy
  summary: 'Electron normal modes require anticommutation relations rather than bosonic
    commutators: their occupation numbers can only be zero or one. The associated
    operators annihilate an occupied mode or create a particle only in an unoccupied
    mode.'
  kind: method
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 19
    - 20
    note: Equations (1.2.22)–(1.2.25) and their interpretation implement exclusion
      through anticommutators.
- id: weinberg-1.feynman-rules-covariant-perturbation
  label: Feynman rules and covariant perturbation theory
  summary: A path-integral representation of the S-matrix yields graphical rules for
    perturbative amplitudes. The rules combine particle creation and antiparticle
    annihilation processes automatically, giving Lorentz-invariant results at every
    stage and exposing divergence structure.
  kind: method
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 36
    - 37
    note: The source introduces the functional-integral S-matrix form and states the
      practical and covariance properties of the graphical rules.
- id: weinberg-1.field-commutator-lorentz-invariance
  label: Lorentz invariance of field commutators
  summary: Canonical quantization raises the question of compatibility with Lorentz
    invariance; commutators of fields at different spacetime points are Lorentz invariant
    and encode limitations on measurements at timelike separated points.
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 19
    note: The source reports the Lorentz invariance of spacetime field commutators
      and their measurement interpretation.
- id: weinberg-1.fields-are-not-probability-amplitudes
  label: Quantum fields are operators, not probability amplitudes
  summary: Neither Klein-Gordon nor Dirac wave fields in the field theory are single-particle
    probability amplitudes. Probabilities come from Hilbert-space inner products between
    Fock states, while fields create or destroy particles in normal modes; this removes
    the negative-probability objection for every spin.
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 27
    - 28
    note: The source contrasts indefinite conserved field densities with the positive
      probabilities of equation (1.2.73).
- id: weinberg-1.finite-lowest-order-qed-reactions
  label: Finite lowest-order QED reaction calculations
  summary: Lowest-order calculations of Compton scattering, annihilation, electron
    scattering, bremsstrahlung, pair production, and Bhabha scattering gave finite
    cross sections in reasonable agreement with experimental data, despite broader
    dissatisfaction with prewar QFT.
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 29
    note: The source lists representative lowest-order reactions and characterizes
      their finite, experimentally reasonable results.
- id: weinberg-1.fundamental-length-nonlocal-cutoff
  label: Fundamental length and nonlocal ultraviolet cutoff proposals
  summary: One proposed cure for ultraviolet divergences introduces a fundamental
    length below which field theory does not apply, effectively cutting off momenta
    at hbar/L; related proposals give field theory nonlocal structure.
  kind: assumption
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 33
    note: The source describes the fundamental-length cutoff and specific nonlocal
      field-theory proposals.
- id: weinberg-1.galilean-contraction-and-mass-central-charge
  label: Galilean contraction and mass central charge
  summary: The low-velocity Inönü–Wigner contraction of the Poincaré algebra yields
    the Galilean algebra with a central total-mass operator. Its translation–boost
    phase gives a projective representation and a mass superselection statement, removable
    by adjoining mass as a central generator.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.4'
    pages:
    - 62
    note: Takes the low-velocity limit and discusses its phase and enlarged algebra.
- id: weinberg-1.group-operator-path-construction
  label: Path construction of finite group operators
  summary: Appendix B constructs a finite group operator by integrating a differential
    equation along a path in group-parameter space using the infinitesimal generators.
    Associativity makes concatenated paths reproduce operator products; with no central
    charges, endpoint-fixed infinitesimal path variations leave the endpoint operator
    stationary.
  kind: method
  evidence:
  - source: weinberg-1
    section: Appendix B
    pages:
    - 96
    - 97
    - 98
    note: Sets up the path-ordered construction and proves its local path-variation
      property.
- id: weinberg-1.hermitian-local-interaction-condition
  label: Hermiticity and spacelike commutation for scalar interactions
  summary: For a Lorentz-scalar interaction density built from scalar-field pieces,
    hermiticity brings in both annihilation and creation pieces, while Lorentz invariance
    of the S-matrix also requires interaction densities to commute at spacelike separation.
  kind: assumption
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 201
    note: The source states the scalar transformation condition and the additional
      spacelike-commutation condition, then identifies hermiticity as requiring the
      adjoint piece.
- id: weinberg-1.hermitian-observables-and-eigenstates
  label: Hermitian observables and definite values
  summary: An observable is a linear Hermitian operator. A ray has a definite observable
    value when its vectors are eigenvectors; Hermiticity makes eigenvalues real and
    eigenspaces with different eigenvalues orthogonal.
  kind: representation
  evidence:
  - source: weinberg-1
    section: '2.1'
    pages:
    - 50
    note: States the Hermitian-operator representation, eigenvalue criterion, and
      orthogonality consequence.
- id: weinberg-1.hilbert-space-rays
  label: Physical states as Hilbert-space rays
  summary: 'Physical states are rays of normalized vectors in a complex Hilbert space:
    vectors differing by a unit-modulus complex factor represent the same state. The
    scalar product is conjugate symmetric, linear in its second argument, positive,
    and complete enough for limits.'
  kind: representation
  evidence:
  - source: weinberg-1
    section: '2.1'
    pages:
    - 49
    - 50
    note: Defines Hilbert space, rays, and the ray equivalence relation.
  notation:
  - source: weinberg-1
    note: The text writes scalar products as (Φ,Ψ), also ⟨Φ|Ψ⟩; a ray is represented
      by normalized Ψ up to a phase.
- id: weinberg-1.hole-theory-limitations
  label: Limits of the hole interpretation
  summary: The filled-sea picture leaves an infinite background charge, cannot identify
    holes with protons because of charge symmetry and rapid atomic annihilation, and
    does not extend to bosons because Bose statistics supplies no exclusion blocking.
    It is therefore not a general account of antiparticles.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 12
    - 13
    - 14
    note: The source lists the charge, proton, annihilation, and bosonic-statistics
      objections to hole theory.
- id: weinberg-1.homotopy-classes-classify-global-projective-phases
  label: Homotopy classes classify global projective phases
  summary: If the parameter space is simply connected, continuous deformation makes
    the constructed finite operator path-independent and yields an ordinary representation.
    Otherwise, the residual composition phase depends only on the homotopy class of
    the loop; possible global projective types are the one-dimensional representations
    of the fundamental group when local central charges vanish.
  kind: result
  evidence:
  - source: weinberg-1
    section: Appendix B
    pages:
    - 98
    - 99
    - 100
    note: Concludes the theorem and identifies the fundamental-group classification.
- id: weinberg-1.indefinite-metric-state-cancellation
  label: Indefinite-metric states proposed to cancel infinities
  summary: Another radical proposal permits negative-probability states so that contributions
    in sums over states can cancel infinities; it became the idea of an indefinite
    metric in Hilbert space, though not in its original form.
  kind: assumption
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 33
    - 34
    note: The source presents negative-probability states as a cancellation proposal
      and identifies the later indefinite-metric formulation.
- id: weinberg-1.induced-representations-and-little-groups
  label: Induced Poincaré representations from little groups
  summary: Choose a standard momentum in each Lorentz orbit and a standard Lorentz
    transformation L(p) to p. The residual W(Λ,p)=L⁻¹(Λp)ΛL(p) fixes the standard
    momentum and lies in its little group; its unitary representation induces the
    transformation of arbitrary-momentum states.
  kind: method
  evidence:
  - source: weinberg-1
    section: '2.5'
    pages:
    - 64
    - 65
    note: Constructs standard states, Wigner little-group elements, and induced representations.
  notation:
  - source: weinberg-1
    note: The little group is the subgroup fixing the chosen standard four-momentum
      k; W(Λ,p) depends on the convention L(p).
- id: weinberg-1.infrared-inclusive-cancellation
  label: Infrared divergence cancellation in inclusive processes
  summary: Infrared divergences from the low-energy part of integrations cancel when
    the calculation includes processes with arbitrary numbers of emitted low-energy
    photons.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 33
    note: The source states the cancellation condition for infrared infinities.
- id: weinberg-1.interaction-hamiltonian-perturbation-theory
  label: Interaction Hamiltonians and time-dependent perturbation theory
  summary: In field theory, interaction terms are third or higher order in field variables,
    and process rates are obtained by using these interaction operators in time-dependent
    perturbation theory.
  kind: method
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 29
    note: The source states the interaction-order structure and rate-calculation method.
- id: weinberg-1.klein-gordon-indefinite-density
  label: Indefinite conserved density of the Klein-Gordon equation
  summary: The conserved density constructed from a relativistic scalar wave function
    contains a time derivative and has no definite sign, so it cannot serve as a one-particle
    probability density.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 7
    note: Equations (1.1.10)–(1.1.12) give the conserved density and state that it
      lacks definite sign.
- id: weinberg-1.klein-gordon-minimal-substitution
  label: Klein-Gordon equation from relativistic energy-momentum substitution
  summary: Schrodinger obtained a relativistic wave equation by replacing free-particle
    energy and momentum with time and space derivatives in the Lorentz-invariant energy-momentum
    relation, then applying electromagnetic-potential substitutions for an external
    field.
  kind: method
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 4
    note: Equations (1.1.2)–(1.1.4) give the classical relation, derivative identifications,
      and formal substitution method.
- id: weinberg-1.lamb-shift-experimental-test
  label: Lamb shift as a test of radiative energy corrections
  summary: Resonant microwave transitions between metastable 2s and rapidly decaying
    2p hydrogen states, with a controlled Zeeman splitting, measure a nonzero 2s-2p
    energy difference. The observed value established a concrete finite effect that
    divergent calculations had previously been dismissed as unable to predict.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 34
    - 35
    note: The source describes the earlier prediction issue and the Lamb-Retherford
      resonance measurement.
- id: weinberg-1.lie-algebra-from-local-group-law
  label: Lie algebra from a connected Lie group's local law
  summary: Expanding an ordinary unitary representation near the identity converts
    the quadratic part of the group multiplication law into commutators of Hermitian
    generators; the structure constants define the Lie algebra and recursively determine
    the local representation from its generators.
  kind: method
  evidence:
  - source: weinberg-1
    section: '2.2'
    pages:
    - 53
    - 54
    note: Derives the generator commutators from the local multiplication law.
- id: weinberg-1.light-by-light-effective-interaction
  label: Finite low-frequency light-by-light effective interaction
  summary: Virtual electron-positron pairs induce nonlinear electromagnetic interactions
    that can be represented by a low-frequency effective Lagrangian. The apparent
    infinities in the light-by-light calculation are spurious, so this effective interaction
    can be derived without an arbitrary subtraction prescription.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 32
    note: The source introduces the low-frequency effective Lagrangian and reports
      the conclusion that its apparent infinities are spurious.
- id: weinberg-1.lorentz-invariant-one-particle-normalization
  label: Invariant mass-shell delta and adopted momentum-state normalization
  summary: On a positive-energy mass shell, the Lorentz-invariant delta function is
    p0δ3(p′−p). Weinberg then adopts N(p)=√(k0/p0), yielding momentum states normalized
    as δσ′σδ3(p′−p), not as p0δ3(p′−p). Little-group matrices are unitary because
    standard-momentum states are orthonormal.
  kind: method
  evidence:
  - source: weinberg-1
    section: '2.5'
    pages:
    - 65
    - 66
    - 67
    note: Derives little-group unitarity, identifies the invariant delta, and states
      the adopted normalization.
- id: weinberg-1.lorentz-topology-sign-projective-representations
  label: Proper-orthochronous Lorentz topology and representations up to a sign
  summary: 'SL(2,C) is simply connected and topologically R3×S3, but quotienting k∼−k
    leaves the proper orthochronous Lorentz group SO+(3,1) doubly connected. Its possible
    projective composition phases are therefore signs: integer-spin states are single-valued,
    while half-integer-spin states can acquire a minus sign on the noncontractible
    loop, producing the stated superselection rule.'
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.7'
    pages:
    - 88
    - 89
    note: Derives the topology and its sign-valued projective representations for
      the connected component.
- id: weinberg-1.many-time-formalism-limitation
  label: Many-time relativistic wave-function formalism and its limitation
  summary: A wave function depending on spacetime and spin coordinates of all positive-
    and negative-energy electrons gives manifest Lorentz invariance, but treats electrons
    differently from photons and is ill suited to processes such as beta decay that
    create an electron and antineutrino without matching antiparticles.
  kind: representation
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 22
    - 23
    note: The source describes the many-time construction, its Lorentz advantage,
      and its physical limitations.
- id: weinberg-1.massive-intrinsic-parity-and-time-reversal
  label: Massive intrinsic parity and conventional time reversal
  summary: For a nondegenerate massive species, parity acts on rest states by a spin-independent
    intrinsic-parity phase and maps momentum p to −p. Time reversal reverses p and
    spin projection with the standard (−1)^(j−σ) factor; its remaining species phase
    is removable by rephasing the one-particle states.
  kind: representation
  evidence:
  - source: weinberg-1
    section: '2.6'
    pages:
    - 77
    - 78
    note: Derives the intrinsic-parity and time-reversal actions for massive states.
- id: weinberg-1.massive-spin-so3-little-group
  label: Massive spin from the SO(3) little group and SU(2) cover
  summary: For p²=−M² and p0>0, the standard rest momentum has little group SO(3).
    Ordinary irreducible SO(3) representations have integer j; the j=0,1/2,1,… multiplets
    with 2j+1 components use either projective SO(3) representations or ordinary representations
    of its SU(2) covering group, as the chapter's enlarged-group convention permits.
  kind: representation
  evidence:
  - source: weinberg-1
    section: 2.5 and 2.7
    pages:
    - 66
    - 68
    - 89
    - 90
    note: Develops massive little-group multiplets and later specifies the projective/cover
      qualification.
- id: weinberg-1.massive-wigner-rotation
  label: Massive-particle Wigner rotations under proper orthochronous transformations
  summary: With a rotation-covariant standard boost from rest, a proper orthochronous
    Lorentz transformation acts on a massive momentum state through a momentum-dependent
    Wigner rotation in its spin-j representation. For a spatial rotation in the connected
    rotation subgroup this reduces to the same rotation for every momentum, preserving
    the nonrelativistic angular-momentum machinery.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.5'
    pages:
    - 68
    - 69
    note: Specifies the standard boost and proves the rotation consistency property.
- id: weinberg-1.massless-helicity-lorentz-action
  label: Proper-orthochronous Lorentz action on helicity and polarization phase
  summary: Under a proper orthochronous Lorentz transformation, a massless state transforms
    by a phase exp(iσθ(Λ,p)) determined by its Wigner little-group rotation. Helicity
    is invariant between inertial frames in this connected component; parity is treated
    separately and flips helicity. The choice of standard rotation fixes a phase convention
    and necessarily has a spinorial sign subtlety for half-integer helicity.
  kind: result
  evidence:
  - source: weinberg-1
    section: 2.5–2.6
    pages:
    - 72
    - 73
    - 74
    - 78
    note: Gives the connected transformation law and treats parity separately.
  notation:
  - source: weinberg-1
    note: σ is the component of angular momentum along the momentum; θ(Λ,p) is the
      little-group rotation angle in the selected L(p) convention.
- id: weinberg-1.massless-helicity-representations
  label: Physical massless helicity representations
  summary: Nonzero eigenvalues of the ISO(2) translation generators generate a continuous
    family of states. To describe observed massless particles without that continuum,
    set those generators to zero; the remaining J3 eigenvalue σ is helicity and supplies
    the one-dimensional little-group representation.
  kind: representation
  evidence:
  - source: weinberg-1
    section: '2.5'
    pages:
    - 71
    - 72
    note: Shows the continuum consequence and imposes the zero-translation physical
      representation.
- id: weinberg-1.massless-iso2-little-group
  label: ISO(2) little group of a massless momentum
  summary: 'For a positive-energy null standard momentum, the little group is ISO(2):
    a rotation about the momentum semidirectly acting on two commuting planar translations.
    Its generators are J3 and two commuting combinations of rotations and boosts.'
  kind: representation
  evidence:
  - source: weinberg-1
    section: '2.5'
    pages:
    - 70
    - 71
    note: Derives the ISO(2) form and its Lie algebra.
- id: weinberg-1.massless-parity-helicity-pairing
  label: Parity pairs opposite massless helicities
  summary: Parity reverses momentum while retaining the spin component along a fixed
    axis, so it maps a massless helicity σ state to helicity −σ. Thus a parity symmetry
    requires an opposite-helicity partner for any nonzero-helicity massless species;
    momentum-dependent signs in the stated convention reflect rotation-group topology.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.6'
    pages:
    - 78
    - 79
    note: Derives the helicity flip and its convention-dependent sign.
- id: weinberg-1.massless-polarization-lorentz-rotation
  label: Proper-orthochronous Lorentz rotation of photon and graviton polarization
    planes
  summary: Under a proper orthochronous Lorentz transformation, a superposition of
    opposite helicities is not invariant because its components acquire helicity-dependent
    phases. For linearly polarized photons, the polarization-plane angle rotates by
    θ(Λ,p); for linearly polarized gravitons it rotates by twice that angle.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.5'
    pages:
    - 74
    note: Applies the helicity transformation phase to photon and graviton polarization.
- id: weinberg-1.massless-time-reversal-preserves-helicity
  label: Time reversal preserves massless helicity
  summary: Time reversal reverses both momentum and angular momentum, so it preserves
    their longitudinal projection and by itself does not demand a partner of opposite
    helicity. The finite-momentum action again contains a convention-dependent phase.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.6'
    pages:
    - 79
    - 80
    note: Contrasts time reversal with parity for massless states.
- id: weinberg-1.matrix-mechanics-observable-program
  label: Observable-only program of matrix mechanics
  summary: Matrix mechanics was motivated by requiring quantum theory to use only
    quantities observable in principle, such as energy levels and emission or absorption
    rates. The chapter identifies this positivist program as an ancestor of later
    S-matrix and dispersion-theory approaches, while noting that modern QFT does not
    meet that ideal.
  kind: method
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 3
    - 4
    note: The section introduces matrix mechanics and states its observable-only rationale
      and later reappearances.
- id: weinberg-1.matter-wave-quantization-and-diffraction
  label: Matter-wave quantization and electron diffraction
  summary: Requiring an integral number of matter wavelengths around a closed orbit
    recovers the old Bohr-Sommerfeld conditions; crystal scattering interference supplies
    an experimental consequence of the wave description.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 3
    note: The source describes the closed-orbit quantization argument and the electron-crystal
      interference test.
- id: weinberg-1.negative-energy-instability
  label: Negative-energy instability in relativistic particle mechanics
  summary: Both Dirac and Klein-Gordon equations retain negative-energy plane-wave
    solutions. Unlike classical mechanics, radiative interactions can drive a positive-energy
    electron into a negative-energy state, so simply discarding the negative branch
    does not explain material stability.
  kind: assumption
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 11
    note: The source contrasts the classical energy gap with radiative transitions
      to negative-energy states in relativistic quantum mechanics.
- id: weinberg-1.nitrogen-14-statistics-and-neutron-model
  label: Nitrogen-14 statistics contradiction and proton-neutron nuclear model
  summary: A proton-electron composition of nitrogen-14 would make it a fermion, contrary
    to molecular spectroscopy identifying it as a boson. Discovery of the neutron
    and the proton-neutron model of nuclei resolve this contradiction and imply a
    short-range non-electromagnetic nuclear force.
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 29
    note: The source presents the nitrogen-14 statistics contradiction, neutron discovery,
      proton-neutron nuclear composition, and need for a strong force.
- id: weinberg-1.nonphysical-little-groups-require-infinite-unitary-multiplets
  label: Nonphysical little groups require infinite nontrivial unitary multiplets
  summary: For the spacelike p²>0 orbit and the pμ=0 orbit, the little groups SO(2,1)
    and SO(3,1) have no nontrivial finite-dimensional unitary representations. Thus
    any nontrivial fixed-momentum transformation in either class would require infinitely
    many states.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.5'
    pages:
    - 65
    note: Footnote states the finite-dimensional unitary-representation restriction
      for these two little groups.
- id: weinberg-1.nonzero-spacelike-mixed-commutator
  label: Nonzero spacelike mixed commutator
  summary: The mixed bracket of the annihilation and creation scalar-field pieces
    is Δ₊(x − y). Although Δ₊ is Lorentz invariant and even for spacelike arguments,
    it does not vanish there, so an annihilation piece alone cannot supply a hermitian
    local interaction.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 202
    note: Equations (5.2.6)–(5.2.9) define Δ₊ and evaluate it for spacelike separation
      before establishing that it is nonzero.
  notation:
  - source: weinberg-1
    note: Δ₊(x) denotes the positive-frequency integral in equation (5.2.7).
- id: weinberg-1.old-fashioned-perturbation-covariant-equivalence
  label: Equivalence of complete old-fashioned and covariant perturbation theory
  summary: When all terms through a chosen order are retained, old-fashioned nonrelativistic
    perturbation theory gives the same results as manifestly relativistic Feynman,
    Schwinger, and Tomonaga formalisms; early precise Lamb-shift calculations used
    both styles.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 38
    note: The source states the equivalence condition and identifies the methods used
      in post-Bethe Lamb-shift calculations.
- id: weinberg-1.one-particle-irreducible-poincare-states
  label: One-particle states as irreducible Poincaré representations
  summary: A one-particle state is labeled by a four-momentum eigenvalue plus only
    discrete internal labels; a bound composite may count as one particle. Particle
    types are identified with irreducible components of the inhomogeneous proper-orthochronous
    Lorentz representation.
  kind: representation
  evidence:
  - source: weinberg-1
    section: '2.5'
    pages:
    - 63
    note: Defines the one-particle restriction and irreducibility criterion.
- id: weinberg-1.parity-covariance-constraint
  label: Parity covariance constrains intrinsic parities
  summary: Requiring the parity-transformed causal scalar field to remain proportional
    to the field that can coexist with it forces ηᶜ = η*. Thus a spinless particle-antiparticle
    pair has even intrinsic parity; for a self-conjugate spinless particle, η is real
    and equals ±1.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 205
    - 206
    note: Equations (5.2.18)–(5.2.19) derive the particle-antiparticle parity relation,
      and the next page gives its self-conjugate consequence.
  notation:
  - source: weinberg-1
    note: η and ηᶜ are the intrinsic parities of particle and antiparticle, and ℘x
      = (−x, x⁰).
- id: weinberg-1.parity-unitary-time-reversal-antiunitary
  label: Parity is unitary and time reversal antiunitary
  summary: Assuming the discrete inversion symmetries are conserved is only an approximation
    because weak interactions violate parity and observed effects also limit time
    reversal. Given a spectrum bounded below by the vacuum, parity must be linear
    unitary while time reversal must be antilinear antiunitary; both preserve energy,
    but they transform J, K, and P differently.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.6'
    pages:
    - 75
    - 76
    note: States the approximation and uses the energy-spectrum argument to select
      the operator types.
- id: weinberg-1.particle-representations-logical-start
  label: Particles as the logical starting point
  summary: 'The book distinguishes its logical route from the historical route: quantum
    theory and special relativity give firmer direct knowledge of particles, characterized
    as representations of the inhomogeneous Lorentz group, than of particular field
    descriptions.'
  kind: representation
  group: weinberg-1.historical-introduction
  evidence:
  - source: weinberg-1
    section: Historical Introduction
    pages:
    - 1
    note: The author contrasts the historical wave-equation route with beginning from
      particles as Lorentz-group representations.
- id: weinberg-1.particle-spectrum-framework-limit
  label: Particle-spectrum limit of a photon-electron-positron framework
  summary: The discovery of mesons, strange particles, and other species showed that
    a conceptual framework restricted to photons, electrons, and positrons is too
    narrow to be a serious fundamental theory.
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 30
    note: The source draws this conclusion from the proliferating particle spectrum.
- id: weinberg-1.pauli-exclusion-and-statistics
  label: Pauli exclusion principle and particle statistics
  summary: For electrons, antisymmetry of the many-particle wave function forbids
    more than one electron in a state; symmetric wave functions instead describe Bose-Einstein
    particles. The exclusion rule accounts for shell filling and stabilizes atomic
    electron configurations.
  kind: assumption
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 11
    - 12
    note: The source derives the shell-population motivation, states antisymmetry,
      and contrasts fermions with bosons.
- id: weinberg-1.pauli-jordan-commutator
  label: Complex scalar-field commutator
  summary: The complex scalar field satisfies [φ(x), φ†(y)] = Δ(x − y), where Δ is
    the difference Δ₊(x − y) − Δ₊(y − x).
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 205
    note: Equations (5.2.12) and (5.2.13) state the field commutator and define Δ.
  notation:
  - source: weinberg-1
    note: The source denotes this commutator kernel by Δ, defined as an antisymmetrized
      Δ₊.
- id: weinberg-1.pauli-term-symmetry-allowance
  label: Pauli term and the limits of symmetry predictions
  summary: A Pauli interaction proportional to a gamma-matrix commutator and electromagnetic
    field strength is compatible with Lorentz and gauge invariance and can shift the
    electron magnetic moment. Thus those symmetries alone do not fix the Dirac value
    of the magnetic moment.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 14
    note: Equation (1.1.32) and the surrounding discussion identify the allowed Pauli
      term and its magnetic-moment effect.
- id: weinberg-1.pion-muon-resolution-yukawa-meson
  label: Pion-muon distinction resolves the Yukawa-meson identification
  summary: 'The mesons prevalent in low-altitude cosmic rays interact too weakly with
    nucleons to be Yukawa''s nuclear-force mediator. The resolution is two mesons:
    the heavier pion has strong interactions and plays Yukawa''s role, while the lighter
    muon has weak and electromagnetic interactions and comes from pion decay.'
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 30
    note: The source describes the atmospheric-absorption puzzle, weak interaction
      result, and pion-muon resolution.
- id: weinberg-1.poincare-central-charges-removable
  label: All Poincaré-algebra central charges are removable
  summary: Applying Jacobi identities to the most general centrally extended Poincaré
    commutators shows that the candidate charges can be eliminated by constant shifts
    of Pμ and Jμν. The Lorentz subalgebra is semisimple; the non-semisimple translation
    sector needs the explicit argument, unlike the Galilean mass charge.
  kind: result
  evidence:
  - source: weinberg-1
    section: '2.7'
    pages:
    - 84
    - 85
    - 86
    note: Works through the Jacobi constraints and generator redefinitions.
- id: weinberg-1.poincare-generators
  label: Poincaré generators Jμν and Pμ
  summary: Near identity, the unitary Poincaré operator is generated by six antisymmetric
    Hermitian Jμν and four Hermitian Pμ. The former include rotations and boosts;
    the latter become momentum and energy, subject to the sign convention stated in
    the text.
  kind: representation
  evidence:
  - source: weinberg-1
    section: '2.4'
    pages:
    - 59
    note: Introduces the infinitesimal operator and its ten Hermitian generators.
  notation:
