  nodes:
  - weinberg-1.radiation-normal-modes
  - weinberg-1.bosonic-fock-space-vacuum-energy
  - weinberg-1.quantum-spontaneous-emission
  summary: Classical emission formulas and thermodynamic rate arguments left spontaneous
    emission insufficiently explained for an individual atom; quantized radiation
    modes provide the missing unit term in the emission rate.
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 17
    - 18
    - 19
    note: The source identifies the inadequacy of classical and thermodynamic arguments
      and gives the quantum n_k+1 derivation.
- id: weinberg-1.why-renormalization
  nodes:
