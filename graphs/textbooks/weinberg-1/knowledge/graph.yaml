  - weinberg-1.path-integral-bosonic-gaussian-pairing-route
  summary: Canonical derivations can require noncovariant Hamiltonian and propagator
    terms even though final rules are covariant. The chapter seeks a route from Lagrangians
    directly to Lorentz-covariant Feynman rules.
  evidence:
  - source: weinberg-1
    section: Chapter 9 introduction
    pages:
    - 376
    note: The introduction identifies the awkward canonical cancellations and the
      desired direct Lagrangian-to-covariant-rule calculation.
