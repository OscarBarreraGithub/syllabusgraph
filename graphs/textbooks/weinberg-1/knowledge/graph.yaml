    note: Indices are raised and lowered with η; Jμν=−Jνμ, H=P0, and the sign of the
      translation term is a convention.
- id: weinberg-1.poincare-group-and-lorentz-interval
  label: Poincaré transformations preserve the Lorentz interval
  summary: Inertial-frame changes are affine transformations x′ = Λx+a whose Lorentz
    matrix preserves the Minkowski metric (signature +++−). Their composition defines
    the inhomogeneous Lorentz, or Poincaré, group; the interval condition preserves
    light speed.
  kind: representation
  evidence:
  - source: weinberg-1
    section: '2.3'
    pages:
    - 55
    - 56
    - 57
    note: Defines the metric-preserving affine transformations and their group law.
  notation:
