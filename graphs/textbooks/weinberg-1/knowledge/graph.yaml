- id: weinberg-1.subtracted-forward-dispersion-relation
  label: Subtracted forward dispersion relation
  summary: If division by a polynomial P of sufficient degree makes the cut amplitude
    vanish at infinity, a contour argument expresses it through its discontinuity
    plus a subtraction polynomial. The polynomial degree is the number of subtractions;
    taking P=1 is allowed only when the amplitude itself has the needed falloff. For
    forward scattering, intermediate-state sums and unitarity express the cut functions
    in total cross-sections, while changing energy sign gives the antiparticle crossing
    relation.
