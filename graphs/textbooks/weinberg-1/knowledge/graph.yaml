  nodes:
  - weinberg-1.phase-space-s-matrix-with-asymptotic-wave-functionals
  - weinberg-1.qed-coulomb-gauge-constrained-path-integral
  summary: The chapter derives path integrals from canonical quantization because
    manifest Lorentz invariance in the path-integral rules does not itself make S-matrix
    unitarity manifest, and because naive Lagrangian rules can fail when extra vertices
    are required.
  evidence:
  - source: weinberg-1
    section: Chapter 9 introduction
    pages:
    - 377
    note: The introduction states the unitarity limitation and the nonlinear-sigma-model
      warning about naive rules.
- id: weinberg-1.path-integral-nonperturbative-boundary-motivation
  nodes:
  - weinberg-1.external-dirac-field-determinant-loop-expansion
  - weinberg-1.path-integral-qed-covariant-photon-propagator-proof
  summary: The source motivates path integrals by their access to S-matrix contributions
    with an essential singularity at zero coupling, which no finite perturbative order
    can reveal. It says the determinant/topological nonperturbative development is
    pursued in Volume II; this packet does not extract that later theorem.
  evidence:
  - source: weinberg-1
    section: Chapter 9 introduction
    pages:
    - 377
    note: The introduction identifies the non-finite-perturbative contribution motivation.
  - source: weinberg-1
    section: '9.5'
    pages:
    - 413
    note: The determinant discussion explicitly defers its topological nonperturbative
      development to Volume II.
