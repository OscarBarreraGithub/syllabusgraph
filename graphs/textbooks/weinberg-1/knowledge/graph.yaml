nodes:
- id: weinberg-1.action-at-a-distance-electrodynamics
  label: Action-at-a-distance alternative to the electromagnetic field
  summary: The Wheeler-Feynman approach sought to eliminate the electromagnetic field
    by deriving electromagnetic interactions directly between charges, with retarded
    or advanced potentials emerging when all charges in the universe are included.
  kind: representation
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 33
    note: The source describes eliminating the field in favor of direct interaction
      at a distance and its retarded/advanced-potential result.
- id: weinberg-1.anomalous-magnetic-moment-radiative-correction
  label: Anomalous magnetic moment as a radiative correction
  summary: Precision measurements found the electron magnetic moment slightly above
    the Dirac value. The successful first-order radiative correction calculation reproduced
    the anomaly and, together with the Lamb shift, established the physical reality
    of radiative corrections.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 36
    note: The source gives the measured deviation, the radiative-correction interpretation,
      and agreement with observation.
- id: weinberg-1.bosonic-fock-space-vacuum-energy
  label: Bosonic occupation-number states and vacuum energy
  summary: A bosonic Fock state is specified by unrestricted nonnegative occupation
    numbers for normal modes. Creation and annihilation operators change a mode occupation
    by one, and the Hamiltonian is the sum of hbar omega per quantum plus an infinite
    zero-point vacuum energy.
  kind: representation
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 17
    note: The source interprets the ladder matrices, identifies the vacuum, and reads
      the energy spectrum from equation (1.2.14).
- id: weinberg-1.canonical-field-action-formalism
  label: Canonical field theory from a local action
  summary: In the canonical field formalism, a Lagrangian is the spatial integral
    of a local function of fields and derivatives; stationary action gives field equations,
    and derivatives with respect to field time derivatives supply conjugate momenta
    and equal-time quantization brackets.
  kind: method
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 20
    - 21
    - 22
    note: The source describes the Heisenberg-Pauli prescription and works it out
      for a free complex scalar field.
- id: weinberg-1.canonical-oscillator-quantization
  label: Canonical quantization and ladder operators
  summary: Canonical coordinate-momentum commutators for each normal mode are represented
    by creation and annihilation matrices. Their commutator algebra and time dependence
    give the oscillator coordinate as a sum of lowering and raising pieces.
  kind: method
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 16
    note: Equations (1.2.6)–(1.2.13) introduce the canonical brackets and their ladder-operator
      realization.
- id: weinberg-1.charge-as-number-difference
  label: Charge as particle-minus-antiparticle number
  summary: After subtracting the vacuum contribution, the relevant conserved number
    operators have both signs and count particles minus antiparticles. For charged
    species, charge is proportional to this difference, so particles and antiparticles
    carry opposite charge.
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 28
    note: The source interprets the signed number operators and derives the opposite-charge
      conclusion.
- id: weinberg-1.charge-conjugation-time-reversal-phase-constraints
  label: Charge-conjugation and time-reversal phase constraints
  summary: For the causal scalar field to transform proportionally under charge conjugation,
    the one-particle phases obey ξᶜ = ξ*. Time reversal is antiunitary; requiring
    a simple relation to the field at the time-reversed point instead gives ζᶜ = ζ*.
    In the self-conjugate case the charge-conjugation phase is real and equals ±1.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 206
    note: Equations (5.2.20)–(5.2.31) derive the charge-conjugation and time-reversal
      phase conditions for the scalar field.
  notation:
  - source: weinberg-1
    note: ξ and ζ are the one-particle phases for charge conjugation and time reversal,
      respectively.
- id: weinberg-1.charge-conservation-obstruction
  label: Charge-conservation obstruction for a self-adjoint field
  summary: If the particle carries a conserved charge, charge-preserving interaction
    terms need equal numbers of a(p) and a†(p). This cannot be achieved by a polynomial
    solely in the self-adjoint neutral-field combination, which lacks a simple commutator
    with the charge operator.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 203
    note: The source contrasts the simple charge commutators of φ⁺ and its adjoint
      with the self-adjoint field.
- id: weinberg-1.complex-causal-scalar-field
  label: Complex causal scalar field from particle and antiparticle
  summary: For spinless bosons of equal mass and opposite charges, combining a particle
    annihilation field with an antiparticle creation field gives φ(x) = φ⁺(x) + φ⁺c†(x).
    The field has [Q, φ(x)] = −qφ(x) and is the essentially unique causal scalar field
    in this construction; it covers self-conjugate neutral particles as the special
    case aᶜ(p) = a(p).
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 203
    - 204
    note: The source introduces opposite-charge equal-mass bosons, forms the charge-eigenfield,
      and gives its normalized mode expansion in equation (5.2.11).
  notation:
  - source: weinberg-1
    note: Superscript c labels the charge-conjugate particle; φ⁺c† is the adjoint
      of its annihilation field.
- id: weinberg-1.de-broglie-matter-waves
  label: de Broglie relations and matter-wave group velocity
  summary: Lorentz invariance of a material-particle wave phase motivates K=p/h and
    nu=E/h. With these relations, the group velocity of a wave packet equals the represented
    particle velocity.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 3
    note: Equation (1.1.1) and the surrounding argument connect Lorentz-invariant
      phase, energy-momentum, and group velocity.
- id: weinberg-1.dirac-electromagnetic-coupling-spin
  label: Dirac electromagnetic coupling predicts spin and magnetic moment
  summary: Minimal electromagnetic coupling in the Dirac equation yields a conserved
    total angular momentum with an intrinsic hbar/2 term. Iterating the equation produces
    magnetic and electric field terms; in the slow limit the magnetic term gives the
    observed electron magnetic moment and the correct leading fine structure.
  kind: method
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 9
    - 10
    note: The source applies the electromagnetic substitutions, identifies the spin
      term in conserved angular momentum, and interprets the iterated equation.
- id: weinberg-1.dirac-hole-theory
  label: Dirac hole theory
  summary: Filling the negative-energy electron states blocks downward transitions
    by exclusion; vacancies behave as positive-energy, oppositely charged objects.
    This construction attempted to reinterpret negative-energy solutions and anticipated
    a positron-like particle.
  kind: representation
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 12
    note: The source states the filled negative-energy sea proposal and the quantum
      numbers of holes.
- id: weinberg-1.dirac-linearization-clifford-algebra
  label: Dirac linearization and matrix anticommutation relations
  summary: Seeking a positive density led to a multicomponent wave equation first
    order in time and, for Lorentz covariance, space derivatives. Squaring it to recover
    the relativistic dispersion relation imposes anticommutation relations on constant
    matrices, realized by four-by-four matrices.
  kind: method
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 7
    - 8
    note: The source connects the sign problem of the Klein-Gordon density to first-order
      time evolution and derives the matrix constraints in equations (1.1.15)–(1.1.18).
- id: weinberg-1.dirac-positive-probability-current
  label: Positive probability current for the Dirac equation
  summary: The Dirac equation has a continuity equation with density psi-dagger psi
    and current c psi-dagger alpha psi. The density is positive and its space integral
    is conserved, meeting the original positive-probability aim.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 10
    note: Equations (1.1.28)–(1.1.29) give the continuity equation, density, current,
      and probability interpretation.
- id: weinberg-1.dirac-spinor-lorentz-covariance
  label: Dirac spinor Lorentz covariance
  summary: Writing the first-order equation with gamma matrices makes their anticommutation
    relations Lorentz invariant. A Lorentz transformation of coordinates is accompanied
    by a similarity transformation of the multicomponent wave function, establishing
    covariance of the Dirac equation.
  kind: representation
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 9
    note: Equations (1.1.19)–(1.1.21) and the following paragraph state the gamma-matrix
      and spinor transformation argument.
- id: weinberg-1.dyson-renormalizability-criterion
  label: Dyson equivalence and renormalizability criterion
  summary: Dyson showed that the Schwinger and Tomonaga operator approaches yield
    the same graphical rules as Feynman's approach and outlined why diagram divergences
    can be absorbed into finitely many masses and couplings in renormalizable theories.
    The Pauli term provides an example that would spoil QED renormalizability.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 37
    note: The source states the formalism equivalence, finite-parameter absorption
      criterion, and the Pauli-term consequence.
- id: weinberg-1.effective-field-theory-low-energy-form
  label: Field theories as low-energy effective descriptions
  summary: 'The chapter presents quantum electrodynamics and related field theories
    as possible low-energy approximations: any relativistic quantum theory of particles
    is said to take a field-theory form at sufficiently low energy, without asserting
    that fields are fundamental.'
  kind: assumption
  group: weinberg-1.historical-introduction
  evidence:
  - source: weinberg-1
    section: Historical Introduction
    pages:
    - 2
    note: The source states the effective-field-theory viewpoint and its low-energy
      rationale.
- id: weinberg-1.fermion-antiparticle-operator-reinterpretation
  label: Fermion antiparticles from negative-energy operator reinterpretation
  summary: For a charged Dirac field, negative-frequency electron annihilation and
    creation operators can be redefined as positron creation and annihilation operators.
    Relative to the vacuum containing no positive-energy electrons or positrons, this
    rewrites the physical Hamiltonian as positive, up to an infinite vacuum constant.
  kind: method
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 23
    - 24
    note: Equations (1.2.41)–(1.2.47) display the negative-energy problem, operator
      redefinition, vacuum condition, and positive relative energy.
- id: weinberg-1.fermionic-anticommutation-occupancy
  label: Fermionic anticommutators and single-mode occupancy
  summary: 'Electron normal modes require anticommutation relations rather than bosonic
    commutators: their occupation numbers can only be zero or one. The associated
    operators annihilate an occupied mode or create a particle only in an unoccupied
    mode.'
  kind: method
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 19
    - 20
    note: Equations (1.2.22)–(1.2.25) and their interpretation implement exclusion
      through anticommutators.
- id: weinberg-1.feynman-rules-covariant-perturbation
  label: Feynman rules and covariant perturbation theory
  summary: A path-integral representation of the S-matrix yields graphical rules for
    perturbative amplitudes. The rules combine particle creation and antiparticle
    annihilation processes automatically, giving Lorentz-invariant results at every
    stage and exposing divergence structure.
  kind: method
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 36
    - 37
    note: The source introduces the functional-integral S-matrix form and states the
      practical and covariance properties of the graphical rules.
- id: weinberg-1.field-commutator-lorentz-invariance
  label: Lorentz invariance of field commutators
  summary: Canonical quantization raises the question of compatibility with Lorentz
    invariance; commutators of fields at different spacetime points are Lorentz invariant
    and encode limitations on measurements at timelike separated points.
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 19
    note: The source reports the Lorentz invariance of spacetime field commutators
      and their measurement interpretation.
- id: weinberg-1.fields-are-not-probability-amplitudes
  label: Quantum fields are operators, not probability amplitudes
  summary: Neither Klein-Gordon nor Dirac wave fields in the field theory are single-particle
    probability amplitudes. Probabilities come from Hilbert-space inner products between
    Fock states, while fields create or destroy particles in normal modes; this removes
    the negative-probability objection for every spin.
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 27
    - 28
    note: The source contrasts indefinite conserved field densities with the positive
      probabilities of equation (1.2.73).
- id: weinberg-1.finite-lowest-order-qed-reactions
  label: Finite lowest-order QED reaction calculations
  summary: Lowest-order calculations of Compton scattering, annihilation, electron
    scattering, bremsstrahlung, pair production, and Bhabha scattering gave finite
    cross sections in reasonable agreement with experimental data, despite broader
    dissatisfaction with prewar QFT.
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 29
    note: The source lists representative lowest-order reactions and characterizes
      their finite, experimentally reasonable results.
- id: weinberg-1.fundamental-length-nonlocal-cutoff
  label: Fundamental length and nonlocal ultraviolet cutoff proposals
  summary: One proposed cure for ultraviolet divergences introduces a fundamental
    length below which field theory does not apply, effectively cutting off momenta
    at hbar/L; related proposals give field theory nonlocal structure.
  kind: assumption
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 33
    note: The source describes the fundamental-length cutoff and specific nonlocal
      field-theory proposals.
- id: weinberg-1.hermitian-local-interaction-condition
  label: Hermiticity and spacelike commutation for scalar interactions
  summary: For a Lorentz-scalar interaction density built from scalar-field pieces,
    hermiticity brings in both annihilation and creation pieces, while Lorentz invariance
    of the S-matrix also requires interaction densities to commute at spacelike separation.
  kind: assumption
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 201
    note: The source states the scalar transformation condition and the additional
      spacelike-commutation condition, then identifies hermiticity as requiring the
      adjoint piece.
- id: weinberg-1.hole-theory-limitations
  label: Limits of the hole interpretation
  summary: The filled-sea picture leaves an infinite background charge, cannot identify
    holes with protons because of charge symmetry and rapid atomic annihilation, and
    does not extend to bosons because Bose statistics supplies no exclusion blocking.
    It is therefore not a general account of antiparticles.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 12
    - 13
    - 14
    note: The source lists the charge, proton, annihilation, and bosonic-statistics
      objections to hole theory.
- id: weinberg-1.indefinite-metric-state-cancellation
  label: Indefinite-metric states proposed to cancel infinities
  summary: Another radical proposal permits negative-probability states so that contributions
    in sums over states can cancel infinities; it became the idea of an indefinite
    metric in Hilbert space, though not in its original form.
  kind: assumption
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 33
    - 34
    note: The source presents negative-probability states as a cancellation proposal
      and identifies the later indefinite-metric formulation.
- id: weinberg-1.infrared-inclusive-cancellation
  label: Infrared divergence cancellation in inclusive processes
  summary: Infrared divergences from the low-energy part of integrations cancel when
    the calculation includes processes with arbitrary numbers of emitted low-energy
    photons.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 33
    note: The source states the cancellation condition for infrared infinities.
- id: weinberg-1.interaction-hamiltonian-perturbation-theory
  label: Interaction Hamiltonians and time-dependent perturbation theory
  summary: In field theory, interaction terms are third or higher order in field variables,
    and process rates are obtained by using these interaction operators in time-dependent
    perturbation theory.
  kind: method
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 29
    note: The source states the interaction-order structure and rate-calculation method.
- id: weinberg-1.klein-gordon-indefinite-density
  label: Indefinite conserved density of the Klein-Gordon equation
  summary: The conserved density constructed from a relativistic scalar wave function
    contains a time derivative and has no definite sign, so it cannot serve as a one-particle
    probability density.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 7
    note: Equations (1.1.10)–(1.1.12) give the conserved density and state that it
      lacks definite sign.
- id: weinberg-1.klein-gordon-minimal-substitution
  label: Klein-Gordon equation from relativistic energy-momentum substitution
  summary: Schrodinger obtained a relativistic wave equation by replacing free-particle
    energy and momentum with time and space derivatives in the Lorentz-invariant energy-momentum
    relation, then applying electromagnetic-potential substitutions for an external
    field.
  kind: method
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 4
    note: Equations (1.1.2)–(1.1.4) give the classical relation, derivative identifications,
      and formal substitution method.
- id: weinberg-1.lamb-shift-experimental-test
  label: Lamb shift as a test of radiative energy corrections
  summary: Resonant microwave transitions between metastable 2s and rapidly decaying
    2p hydrogen states, with a controlled Zeeman splitting, measure a nonzero 2s-2p
    energy difference. The observed value established a concrete finite effect that
    divergent calculations had previously been dismissed as unable to predict.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 34
    - 35
    note: The source describes the earlier prediction issue and the Lamb-Retherford
      resonance measurement.
- id: weinberg-1.light-by-light-effective-interaction
  label: Finite low-frequency light-by-light effective interaction
  summary: Virtual electron-positron pairs induce nonlinear electromagnetic interactions
    that can be represented by a low-frequency effective Lagrangian. The apparent
    infinities in the light-by-light calculation are spurious, so this effective interaction
    can be derived without an arbitrary subtraction prescription.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 32
    note: The source introduces the low-frequency effective Lagrangian and reports
      the conclusion that its apparent infinities are spurious.
- id: weinberg-1.many-time-formalism-limitation
  label: Many-time relativistic wave-function formalism and its limitation
  summary: A wave function depending on spacetime and spin coordinates of all positive-
    and negative-energy electrons gives manifest Lorentz invariance, but treats electrons
    differently from photons and is ill suited to processes such as beta decay that
    create an electron and antineutrino without matching antiparticles.
  kind: representation
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 22
    - 23
    note: The source describes the many-time construction, its Lorentz advantage,
      and its physical limitations.
- id: weinberg-1.matrix-mechanics-observable-program
  label: Observable-only program of matrix mechanics
  summary: Matrix mechanics was motivated by requiring quantum theory to use only
    quantities observable in principle, such as energy levels and emission or absorption
    rates. The chapter identifies this positivist program as an ancestor of later
    S-matrix and dispersion-theory approaches, while noting that modern QFT does not
    meet that ideal.
  kind: method
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 3
    - 4
    note: The section introduces matrix mechanics and states its observable-only rationale
      and later reappearances.
- id: weinberg-1.matter-wave-quantization-and-diffraction
  label: Matter-wave quantization and electron diffraction
  summary: Requiring an integral number of matter wavelengths around a closed orbit
    recovers the old Bohr-Sommerfeld conditions; crystal scattering interference supplies
    an experimental consequence of the wave description.
  kind: result
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 3
    note: The source describes the closed-orbit quantization argument and the electron-crystal
      interference test.
- id: weinberg-1.negative-energy-instability
  label: Negative-energy instability in relativistic particle mechanics
  summary: Both Dirac and Klein-Gordon equations retain negative-energy plane-wave
    solutions. Unlike classical mechanics, radiative interactions can drive a positive-energy
    electron into a negative-energy state, so simply discarding the negative branch
    does not explain material stability.
  kind: assumption
  group: weinberg-1.relativistic-wave-mechanics
  evidence:
  - source: weinberg-1
    section: '1.1'
    pages:
    - 11
    note: The source contrasts the classical energy gap with radiative transitions
      to negative-energy states in relativistic quantum mechanics.
- id: weinberg-1.nitrogen-14-statistics-and-neutron-model
  label: Nitrogen-14 statistics contradiction and proton-neutron nuclear model
  summary: A proton-electron composition of nitrogen-14 would make it a fermion, contrary
    to molecular spectroscopy identifying it as a boson. Discovery of the neutron
    and the proton-neutron model of nuclei resolve this contradiction and imply a
    short-range non-electromagnetic nuclear force.
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 29
    note: The source presents the nitrogen-14 statistics contradiction, neutron discovery,
      proton-neutron nuclear composition, and need for a strong force.
- id: weinberg-1.nonzero-spacelike-mixed-commutator
  label: Nonzero spacelike mixed commutator
  summary: The mixed bracket of the annihilation and creation scalar-field pieces
    is Δ₊(x − y). Although Δ₊ is Lorentz invariant and even for spacelike arguments,
    it does not vanish there, so an annihilation piece alone cannot supply a hermitian
    local interaction.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 202
    note: Equations (5.2.6)–(5.2.9) define Δ₊ and evaluate it for spacelike separation
      before establishing that it is nonzero.
  notation:
  - source: weinberg-1
    note: Δ₊(x) denotes the positive-frequency integral in equation (5.2.7).
- id: weinberg-1.old-fashioned-perturbation-covariant-equivalence
  label: Equivalence of complete old-fashioned and covariant perturbation theory
  summary: When all terms through a chosen order are retained, old-fashioned nonrelativistic
    perturbation theory gives the same results as manifestly relativistic Feynman,
    Schwinger, and Tomonaga formalisms; early precise Lamb-shift calculations used
    both styles.
  kind: result
  group: weinberg-1.problem-of-infinities
  evidence:
  - source: weinberg-1
    section: '1.3'
    pages:
    - 38
    note: The source states the equivalence condition and identifies the methods used
      in post-Bethe Lamb-shift calculations.
- id: weinberg-1.parity-covariance-constraint
  label: Parity covariance constrains intrinsic parities
  summary: Requiring the parity-transformed causal scalar field to remain proportional
    to the field that can coexist with it forces ηᶜ = η*. Thus a spinless particle-antiparticle
    pair has even intrinsic parity; for a self-conjugate spinless particle, η is real
    and equals ±1.
  kind: result
  evidence:
  - source: weinberg-1
    section: '5.2'
    pages:
    - 205
    - 206
    note: Equations (5.2.18)–(5.2.19) derive the particle-antiparticle parity relation,
      and the next page gives its self-conjugate consequence.
  notation:
  - source: weinberg-1
    note: η and ηᶜ are the intrinsic parities of particle and antiparticle, and ℘x
      = (−x, x⁰).
- id: weinberg-1.particle-representations-logical-start
  label: Particles as the logical starting point
  summary: 'The book distinguishes its logical route from the historical route: quantum
    theory and special relativity give firmer direct knowledge of particles, characterized
    as representations of the inhomogeneous Lorentz group, than of particular field
    descriptions.'
  kind: representation
  group: weinberg-1.historical-introduction
  evidence:
  - source: weinberg-1
    section: Historical Introduction
    pages:
    - 1
    note: The author contrasts the historical wave-equation route with beginning from
      particles as Lorentz-group representations.
- id: weinberg-1.particle-spectrum-framework-limit
  label: Particle-spectrum limit of a photon-electron-positron framework
  summary: The discovery of mesons, strange particles, and other species showed that
    a conceptual framework restricted to photons, electrons, and positrons is too
    narrow to be a serious fundamental theory.
  kind: result
  group: weinberg-1.birth-of-qft
  evidence:
  - source: weinberg-1
    section: '1.2'
    pages:
    - 30
    note: The source draws this conclusion from the proliferating particle spectrum.
- id: weinberg-1.pauli-exclusion-and-statistics
  label: Pauli exclusion principle and particle statistics
  summary: For electrons, antisymmetry of the many-particle wave function forbids
    more than one electron in a state; symmetric wave functions instead describe Bose-Einstein
    particles. The exclusion rule accounts for shell filling and stabilizes atomic
    electron configurations.
  kind: assumption
