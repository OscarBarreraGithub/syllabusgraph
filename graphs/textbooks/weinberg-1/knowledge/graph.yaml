      and asks what to do with it.
- id: weinberg-1.why-field-theory-replaced-fixed-particle-mechanics
  nodes:
  - weinberg-1.negative-energy-instability
  - weinberg-1.hole-theory-limitations
  - weinberg-1.fields-are-not-probability-amplitudes
  summary: Fixed-particle relativistic wave mechanics must account for negative-energy
    transitions and antiparticles. The historical argument asks for a framework in
    which antiparticles and probabilities can be interpreted without a filled negative-energy
    sea.
  evidence:
  - source: weinberg-1
    section: 1.1; 1.2
    pages:
    - 11
    - 14
    - 28
    note: The chapter states the stability problem, rejects the hole picture as general,
      and supplies the field-theoretic probability interpretation.
