- id: peskin-schroeder.qcd-running-coupling-and-lambda
  label: Running alpha_s and the QCD scale Lambda
  summary: Because on-shell quarks are unsuitable renormalization states, define alpha_s
    at a large arbitrary scale M. Renormalization-group improvement evaluates it at
    the hard scale Q (Q^2=s here), summing powers of alpha_s log(P^2/M^2). At one
    loop alpha_s(Q)=alpha_s(M)/[1+(b_0 alpha_s(M)/(2 pi)) log(Q/M)], equivalently
    alpha_s(Q)=2 pi/[b_0 log(Q/Lambda)]; Lambda is the scale where this one-loop coupling
    becomes strong, not a UV cutoff. Perturbation theory is qualified as useful only
    sufficiently above Lambda, roughly Q above 1 GeV in the text.
  kind: method
  group: peskin-schroeder.ch17-annihilation
  evidence:
