nodes:
- id: peskin-schroeder.adiabatic-interacting-vacuum-projection
  label: Adiabatic projection onto the interacting vacuum
  summary: Assuming the free vacuum overlaps the interacting ground state, evolve
    it to large complex time T->infinity(1-i epsilon) to suppress higher-energy states
    and isolate the interacting vacuum. The construction is formal and carries normalization
    factors.
  kind: method
  evidence:
  - source: peskin-schroeder
    section: '4.2'
    pages:
    - 86
    - 87
- id: peskin-schroeder.antiparticle-causality-cancellation
  label: Antiparticles in the complex-scalar causality cancellation
  summary: For a complex scalar, phi creates positive charge and destroys negative
    charge, while phi-dagger reverses the roles. The two charged contributions cancel
    at spacelike separation only with equal-mass opposite-charge antiparticles; the
    real scalar is its own antiparticle.
  kind: result
  group: peskin-schroeder.scalar-spacetime-propagation
  evidence:
  - source: peskin-schroeder
    section: '2.4 The Klein-Gordon Field in Space-Time: Causality'
    pages:
    - 29
    note: The source connects complex-field charged excitations to the two cancelling
      propagation terms and draws the equal-mass antiparticle conclusion.
- id: peskin-schroeder.axion-electron-pseudoscalar-coupling-assumption
  label: Stated pseudoscalar axion-electron coupling
  summary: Problem 6.3 supplies a pseudoscalar axion with a distinct electron coupling
    and mass m_a, allowing an axion as light as or lighter than the electron; this
    is the interaction input for the requested virtual-axion contribution.
  kind: assumption
  group: peskin-schroeder.ch6-radiative-corrections
  evidence:
  - source: peskin-schroeder
    section: Problem 6.3(c)
    pages:
    - 210
- id: peskin-schroeder.bound-state-production-decay-detailed-balance
  label: Bound-state production-decay resonance relation
  summary: A one-body bound state is produced only when the center-of-mass energy
    equals its mass; finite lifetime broadens the delta-function resonance. Comparing
    production and decay from the same matrix element yields a general relation between
    resonant e+e- production and the leptonic partial width, with a 2J+1 spin factor.
  kind: result
  group: peskin-schroeder.ch5-muon-annihilation
  evidence:
  - source: peskin-schroeder
    section: 5.3 Vector Meson Production and Decay
    pages:
    - 151
    - 152
    note: The text derives the resonance constraint and the production-width relation,
      then generalizes the spin factor.
- id: peskin-schroeder.breit-wigner-resonance-width-and-time-dilation
  label: Breit-Wigner width, rest-frame decay rate, and time dilation
  summary: Near an unstable-particle resonance, the invariant Breit-Wigner denominator
    is p^2-m^2+i m Gamma. Its peak width equals the rest-frame decay rate Gamma, while
    in a frame with energy E_p the decay rate is (m/E_p) Gamma, as required by time
    dilation.
  kind: result
  evidence:
  - source: peskin-schroeder
    section: '4.5'
    pages:
    - 101
- id: peskin-schroeder.canonical-dirac-momentum-and-hamiltonian
  label: Canonical Dirac momentum and Hamiltonian
  summary: For L=ψ̄(iγ·∂−m)ψ, the canonical momentum conjugate to ψ is π_ψ=iψ†. The
    Hamiltonian H=∫d^3x ψ†[−iα·∇+mβ]ψ uses α=γ^0γ and β=γ^0, matching the one-particle
    Dirac Hamiltonian; this classical/canonical construction precedes and is retained
    through the failed commutator route.
  kind: method
  group: peskin-schroeder.dirac-field-quantization
  evidence:
  - source: peskin-schroeder
    section: '3.5'
    pages:
    - 52
    note: Equations (3.83)–(3.85) derive the conjugate momentum and Hamiltonian before
      the attempted commutator quantization.
  notation:
  - source: peskin-schroeder
    note: The source uses α=γ^0γ and β=γ^0 in its Weyl gamma-matrix convention.
- id: peskin-schroeder.canonical-field-momentum-hamiltonian
  label: Canonical momentum and Hamiltonian for a field
  summary: The conjugate momentum density is pi(x) = partial L / partial phidot(x),
    and the Hamiltonian is H = integral d^3x [pi phidot - L]. This is the continuum
    Legendre construction used for the field.
  kind: method
  group: peskin-schroeder.free-scalar-foundations
  notation:
  - source: peskin-schroeder
    note: pi(x) denotes momentum density, whereas the physical momentum associated
      with translations is treated separately later.
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Hamiltonian Field Theory'
    pages:
    - 16
    note: The text obtains the momentum density by a discretization argument and then
      passes to the continuum Hamiltonian density.
- id: peskin-schroeder.canonical-quantization-real-field
  label: Canonical quantization of the real field
  summary: The opening quantization prescription promotes the classical variables
    phi and pi to operators. At equal time their commutator is [phi(x), pi(y)] = i
    delta^(3)(x-y), while field-field and momentum-momentum commutators vanish.
  kind: method
  group: peskin-schroeder.free-scalar-foundations
  notation:
  - source: peskin-schroeder
    note: The equal-time relations are introduced in the Schroedinger picture; the
      book says they also hold at a common time after switching to the Heisenberg
      picture.
  evidence:
  - source: peskin-schroeder
    section: 2.3 The Klein-Gordon Field as Harmonic Oscillators
    pages:
    - 19
    - 20
    note: The text first states promotion of phi and pi, then gives the continuous-system
      equal-time commutation relations.
- id: peskin-schroeder.charge-conjugation-bilinears-and-cpt
  label: Charge conjugation, bilinear signs, and CPT
  summary: Linear unitary charge conjugation exchanges same-spin fermion and antifermion
    annihilators and maps ψ to −iγ^2ψ*. Accounting for fermion anticommutation gives
    the C signs of bilinears. The free Dirac Lagrangian is separately C, P, and T
    invariant. The source then gives an informal CPT-theorem statement; the standard
    general theorem also requires assumptions such as local/microcausal relativistic
    quantum fields and the usual spectrum/unitarity conditions, which this chapter
    does not establish.
  kind: result
  group: peskin-schroeder.dirac-discrete-symmetries
  evidence:
  - source: peskin-schroeder
    section: 3.6, Charge Conjugation and Summary of C, P, and T
    pages:
    - 70
    - 71
    note: The source derives charge conjugation, tabulates bilinears, and states—but
      does not prove—the CPT conclusion.
- id: peskin-schroeder.chiral-dirac-basis-and-relativistic-normalization-declaration
  label: Chiral Dirac basis and relativistic spinor-normalization declaration
  summary: For its Dirac treatment the book declares a chiral basis for the gamma
    matrices and relativistic normalization for Dirac spinors; the detailed realization
    and normalization formulas are supplied in the accepted Dirac representation records.
  kind: representation
  group: peskin-schroeder.notation-and-conventions
  evidence:
  - source: peskin-schroeder-notation
    section: Dirac Equation
    pages:
    - 21
    note: The frontmatter explicitly declares the chiral gamma-matrix basis and relativistic
      spinor normalization, referring readers to Sections 3.2, 3.3, and the Appendix
      for their details.
- id: peskin-schroeder.chiral-u1-symmetry-and-handed-currents
  label: Chiral U(1) symmetry and handed currents
  summary: The ordinary phase transformation is a symmetry of the full free Dirac
    Lagrangian, whereas ψ→e^{iαγ^5}ψ preserves only its derivative term when m≠0.
    At m=0, the combinations (j^μ±j_5^μ)/2 are separately conserved left- and right-handed
    currents.
  kind: concept
  group: peskin-schroeder.dirac-bilinears-and-currents
  evidence:
  - source: peskin-schroeder
    section: '3.4'
    pages:
    - 51
    note: The text relates the two currents to Noether transformations and states
      the mass qualification.
- id: peskin-schroeder.classical-soft-bremsstrahlung-spectrum
  label: Classical soft-bremsstrahlung spectrum
  summary: Solve the worldline current in Lorenz gauge with retarded boundary conditions,
    separate the Coulomb fields from the radiation poles, and integrate the transverse
    electric and magnetic fields. For a sudden relativistic deflection, the low-frequency
    energy spectrum has logarithmic dependence on momentum transfer; the sudden-kick
    idealization requires an upper frequency cutoff.
  kind: result
  group: peskin-schroeder.ch6-radiative-corrections
  evidence:
  - source: peskin-schroeder
    section: 6.1 Soft Bremsstrahlung
    pages:
    - 179
    - 180
    - 181
    - 182
- id: peskin-schroeder.classical-source-on-shell-particle-creation
  label: Particle creation by a finite-time classical source
  summary: For (partial-squared+m-squared)phi=j(x) with a source active for a finite
    interval, retarded propagation shifts the free-field ladder operators. The Fourier
    component j(p) creates quanta in mode p with probability density proportional
    to |j(p)|-squared/(2E_p); only on-shell p-squared=m-squared components are effective.
  kind: result
  group: peskin-schroeder.scalar-spacetime-propagation
  evidence:
  - source: peskin-schroeder
    section: '2.4 The Klein-Gordon Field in Space-Time: Particle Creation by a Classical
      Source'
    pages:
    - 32
    - 33
    note: The source gives the source equation and retarded solution, then interprets
      on-shell Fourier components as particle-creation probability density.
  notation:
  - source: peskin-schroeder
    note: j(x) is an external classical function rather than a dynamical quantum field.
- id: peskin-schroeder.cm-high-energy-muon-pair-setup
  label: High-energy center-of-mass muon-pair setup
  summary: The introductory e+e- to mu+mu- calculation takes p'=-p and k'=-k in the
    CM frame and neglects electron and muon masses by assuming E is much larger than
    both. It averages unobserved initial spins and sums unobserved final spins.
  kind: assumption
  group: peskin-schroeder.qed-scattering
  evidence:
  - source: peskin-schroeder
    section: Chapter 1, The Simplest Situation
    pages:
    - 4
    note: The source explicitly states the CM relations, high-energy massless approximation,
      and spin convention.
  notation:
  - source: peskin-schroeder
    note: Bold symbols are 3-vectors and italic symbols 4-vectors; theta is the scattering
      angle.
- id: peskin-schroeder.coherent-sum-of-diagram-amplitudes
  label: Coherent addition of allowed diagram amplitudes
  summary: When more than one diagram contributes, add the amplitudes before squaring.
    The source illustrates this with Bhabha scattering, which has a second lowest-order
    diagram.
  kind: result
  group: peskin-schroeder.qed-scattering
  evidence:
  - source: peskin-schroeder
    section: Chapter 1
    pages:
    - 10
    note: The Bhabha example explicitly says the two diagram amplitudes must first
      be added, then squared.
- id: peskin-schroeder.complex-scalar-canonical-particles-and-charge
  label: 'Complex scalar quantization: two charged particle species'
  summary: Problem 2.2 treats phi and phi-star as independent dynamical variables.
    Parts (b)-(c) ask the reader to diagonalize the stated Hamiltonian, show that
    two mass-m particle species occur, and determine each species' charge by rewriting
    the supplied conserved U(1) charge in ladder operators.
  kind: method
  group: peskin-schroeder.quantized-scalar-particles
  evidence:
  - source: peskin-schroeder
    section: Problem 2.2(a)-(c)
    pages:
    - 34
    note: The page supplies the Hamiltonian and charge and asks the reader for diagonalization,
      the two-species result, and the charges; it does not present those derivations.
  notation:
  - source: peskin-schroeder
    note: H=integral d^3x [pi-star pi + grad phi-star dot grad phi + m^2 phi-star
      phi].
- id: peskin-schroeder.complex-scalar-u1-current
  label: Complex scalar U(1) current
  summary: The complex Klein-Gordon Lagrangian is invariant under the global phase
    rotation phi to exp(i alpha)phi. Treating phi and phi-star as independent fields
    gives j^mu=i[(partial^mu phi-star)phi-phi-star(partial^mu phi)], whose charge
    later has an electromagnetic interpretation after coupling.
  kind: result
  group: peskin-schroeder.field-symmetry-and-charge
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Noether''s Theorem'
    pages:
    - 18
    note: Equations (2.14)-(2.16) specify the phase symmetry, current, and later electromagnetic-current
      interpretation.
  notation:
  - source: peskin-schroeder
    note: The source chooses the current's overall normalization arbitrarily.
- id: peskin-schroeder.compton-two-diagram-amplitude
  label: Compton amplitude from the two fermion-line orderings
  summary: The lowest-order e- gamma to e- gamma amplitude is the coherent sum of
    the two electron-line orderings. On-shell conditions reduce the propagator denominators
    to dot products and allow the adjacent Dirac equations to simplify their numerators
    before squaring.
  kind: method
  group: peskin-schroeder.ch5-crossing-and-compton
  evidence:
  - source: peskin-schroeder
    section: 5.5 Compton Scattering
    pages:
    - 158
    - 159
    note: The source writes the two-diagram amplitude and performs the on-shell Dirac-algebra
      simplification.
- id: peskin-schroeder.connected-amputated-s-matrix-prescription
  label: Connected, amputated S-matrix prescription
  summary: 'The chapter motivates computing the nontrivial S-matrix from connected
    and amputated diagrams: discard vacuum bubbles and contributions with disconnected
    external lines, and remove external-leg corrections because their on-shell propagators
    diverge and describe one-particle-state evolution rather than scattering. The
    text postpones a proof and loop normalization refinement.'
  kind: method
  evidence:
  - source: peskin-schroeder
    section: '4.6'
    pages:
    - 109
    - 113
    - 114
    - 115
- id: peskin-schroeder.coulomb-ladder-bound-state-resummation
  label: Coulomb-ladder resummation produces threshold resonances
  summary: Near a fermion-antifermion threshold, repeated photon exchanges inside
    higher-order diagrams become large because they contain the Coulomb interaction.
    Summing the ladder is equivalent to solving the nonrelativistic Schrödinger equation
    and yields resonance peaks with the projected bound-state areas and widths.
  kind: result
  group: peskin-schroeder.ch5-muon-annihilation
  evidence:
  - source: peskin-schroeder
    section: '5.3'
    pages:
    - 152
    - 153
    note: The source connects the threshold diagrams to Coulomb dynamics, Schrödinger
      summation, and the resonance prediction.
- id: peskin-schroeder.coulomb-potential-and-exchange-spin-pattern
  label: Coulomb potential and exchanged-spin force pattern
  summary: The nonrelativistic QED exchange amplitude yields a repulsive Coulomb potential
    for like charges and an attractive one for particle-antiparticle pairs. The chapter
    contrasts this vector pattern with universally attractive scalar Yukawa and tensor-exchange
    patterns in its table.
  kind: result
  evidence:
  - source: peskin-schroeder
    section: '4.8'
    pages:
    - 125
    - 126
- id: peskin-schroeder.cross-section-and-decay-observables
  label: Cross sections, differential cross sections, and decay rates
  summary: A cross section normalizes event counts by incident densities and overlap
    geometry, while a differential cross section resolves final momentum regions.
    A decay rate is decays per unit time per parent particle and is related to the
    lifetime and resonance width.
  kind: concept
  evidence:
  - source: peskin-schroeder
    section: '4.5'
    pages:
    - 100
    - 101
- id: peskin-schroeder.crossing-symmetry-s-matrix
  label: Crossing symmetry and crossed-fermion sign
  summary: Relate an S-matrix element with an incoming particle of momentum p to the
    corresponding process with an outgoing antiparticle of momentum minus p by analytic
    continuation. Feynman diagrams correspond one to one under crossing; for fermions,
    the polarization sum introduces a minus sign that is handled by a consistent phase
    convention or one manual sign per crossed fermion.
  kind: method
  group: peskin-schroeder.ch5-crossing-and-compton
  evidence:
  - source: peskin-schroeder
    section: 5.4 Crossing Symmetry
    pages:
    - 153
    - 154
    - 155
    note: Electron-muon scattering is obtained from annihilation and the section states
      the general S-matrix crossing rule and fermion sign.
- id: peskin-schroeder.dirac-adjoint-and-free-lagrangian
  label: Dirac adjoint and free Dirac Lagrangian
  summary: Because boosts are not unitary in the spinor representation, ψ†ψ is not
    a Lorentz scalar. Defining ψ̄=ψ†γ^0 gives scalar ψ̄ψ and vector ψ̄γ^μψ, and L=ψ̄(iγ·∂−m)ψ
    yields the Dirac equation plus its adjoint equation by independent variations.
  kind: method
  group: peskin-schroeder.dirac-lorentz-and-spinors
  evidence:
  - source: peskin-schroeder
    section: '3.2'
    pages:
    - 43
    note: Equations (3.32)–(3.35) define the adjoint, scalar, Lagrangian, and conjugate
      equation.
- id: peskin-schroeder.dirac-bilinear-lorentz-basis
  label: Lorentz classification of Dirac bilinears
  summary: The sixteen Dirac matrices decompose into scalar, vector, antisymmetric
    tensor, pseudovector, and pseudoscalar Lorentz types. γ^5=iγ^0γ^1γ^2γ^3 is Hermitian,
    squares to one, anticommutes with γ^μ, and its chiral eigenvalues distinguish
    the Weyl components.
  kind: representation
  group: peskin-schroeder.dirac-bilinears-and-currents
  evidence:
  - source: peskin-schroeder
    section: '3.4'
    pages:
    - 49
    - 50
    note: The source classifies all sixteen matrices and derives the γ^5 properties.
- id: peskin-schroeder.dirac-clifford-algebra-generators
  label: Dirac Clifford algebra and spinor Lorentz generators
  summary: Matrices γ^μ obeying {γ^μ,γ^ν}=2g^{μν} generate S^{μν}=i[γ^μ,γ^ν]/4, a
    Lorentz-algebra representation. In four-dimensional Minkowski space the minimal
    matrices are 4×4; Peskin and Schroeder adopt the Weyl (chiral) representation.
  kind: representation
  group: peskin-schroeder.dirac-lorentz-and-spinors
  evidence:
  - source: peskin-schroeder
    section: '3.2'
    pages:
    - 40
    - 41
    note: Equations (3.22)–(3.27) build the spinor generators and display the chiral
      realization.
  notation:
  - source: peskin-schroeder
    note: The source uses metric and gamma-matrix signs of its Weyl representation;
      γ^0 is off diagonal, unlike the diagonal-γ^0 convention used in many texts.
- id: peskin-schroeder.dirac-local-field-particle-creation
  label: Local Dirac fields create particle states
  summary: In the QED interpretation, ψ†_a(x)|0⟩ contains a positron at x with polarization
    selected by a, while ψ_a(x)|0⟩ contains an electron. This follows from the finalized
    field expansion and is distinct from deriving the conserved charge operator.
  kind: result
  group: peskin-schroeder.dirac-field-quantization
  evidence:
  - source: peskin-schroeder
    section: '3.5'
    pages:
    - 62
    note: The source explicitly states the local positron and electron interpretations
      after discussing Q.
- id: peskin-schroeder.dirac-momentum-space-and-feynman-propagator
  label: Momentum-space and Feynman Dirac propagator
  summary: Fourier inversion of the Dirac operator gives the momentum-space numerator
    (p̸+m)/(p²−m²) with a boundary-condition pole prescription. The Feynman prescription
    yields the time-ordered fermion propagator, whose definition carries a minus sign
    when ψ fields are interchanged.
  kind: method
  group: peskin-schroeder.dirac-field-quantization
  evidence:
  - source: peskin-schroeder
    section: 3.5, The Dirac Propagator
    pages:
    - 63
    note: Equations (3.119)–(3.121) obtain the Fourier inverse and define the Feynman
      time-ordered result.
- id: peskin-schroeder.dirac-noether-angular-momentum-spin
  label: Noether angular momentum and spin one-half
  summary: Rotational invariance yields J=∫d^3x ψ†[x×(−i∇)+Σ/2]ψ. On zero-momentum
    one-fermion states, the spin term gives J_z eigenvalues ±1/2; for antifermions
    the association of the two-spinor label with spin is reversed.
  kind: result
  group: peskin-schroeder.dirac-field-quantization
  evidence:
  - source: peskin-schroeder
    section: '3.5'
    pages:
    - 60
    - 61
    note: The source applies Noether's theorem, obtains (3.111), and checks rest fermion
      and antifermion spin.
- id: peskin-schroeder.dirac-positive-frequency-spinors
  label: Positive-frequency free Dirac spinors
  summary: Positive-frequency plane waves ψ=u(p)e^{−ip·x}, p²=m² and p^0>0 obey (p̸−m)u(p)=0.
    In the rest frame only two components are free; a normalized two-spinor ξ labels
    the two spin states before quantization establishes their spin angular momentum.
  kind: representation
  group: peskin-schroeder.free-dirac-solutions
  evidence:
  - source: peskin-schroeder
    section: '3.3'
    pages:
    - 45
    note: The source obtains the rest-frame u(p_0) solutions and explains their two
      independent components.
- id: peskin-schroeder.dirac-retarded-propagator-from-anticommutator
  label: Dirac retarded propagator from the field anticommutator
  summary: The quantized-field contractions define S_R(x−y)=θ(x^0−y^0)⟨0|{ψ(x),ψ̄(y)}|0⟩.
    Using the Klein–Gordon retarded Green function gives S_R=(i∂̸+m)D_R, which inverts
    i∂̸−m; this is the retarded route.
  kind: method
  group: peskin-schroeder.dirac-field-quantization
  evidence:
  - source: peskin-schroeder
    section: 3.5, The Dirac Propagator
    pages:
    - 62
    - 63
    note: Equations (3.114)–(3.118) compute contractions, define S_R, and relate it
      to D_R.
- id: peskin-schroeder.dirac-spin-sum-completeness
  label: Dirac spin-sum completeness relations
  summary: Summing the two polarizations gives Σ_s u_s(p)ū_s(p)=p̸+m and Σ_s v_s(p)v̄_s(p)=p̸−m.
    The source introduces Feynman's slash notation p̸=γ^μp_μ for these ubiquitous
    combinations.
  kind: method
  group: peskin-schroeder.free-dirac-solutions
  evidence:
  - source: peskin-schroeder
    section: 3.3–3.4
    pages:
    - 48
    - 49
    note: The source evaluates the u and v sums and introduces slash notation.
- id: peskin-schroeder.dirac-spinor-and-covariant-equation
  label: Dirac spinor and covariant first-order equation
  summary: A four-component Dirac spinor transforms by the spinor matrix Λ_{1/2};
    the relation Λ_{1/2}^{−1}γ^μΛ_{1/2}=Λ^μ{}_νγ^ν makes (iγ^μ∂_μ−m)ψ=0 Lorentz covariant.
    Multiplying by the conjugate first-order operator yields the Klein–Gordon equation
    for each component.
  kind: result
  group: peskin-schroeder.dirac-lorentz-and-spinors
  evidence:
  - source: peskin-schroeder
    section: '3.2'
    pages:
    - 42
    - 43
    note: The source proves covariance of (3.31) and then derives (∂²+m²)ψ=0.
- id: peskin-schroeder.dirac-trace-identities-gamma5
  label: Dirac trace identities, gamma5 traces, and contractions
  summary: 'Use Clifford anticommutation, trace cyclicity, and gamma5 to reduce Dirac
    traces: odd gamma traces vanish, two- and four-gamma traces reduce to metrics,
    and the four-gamma gamma5 trace yields the Levi-Civita tensor. Contraction and
    reversal identities streamline longer products.'
  kind: method
  group: peskin-schroeder.ch5-muon-annihilation
  evidence:
  - source: peskin-schroeder
    section: 5.1 Trace Technology
    pages:
    - 133
    - 134
    - 135
    note: The source derives and summarizes the trace and contraction identities.
- id: peskin-schroeder.dirac-u-v-normalization
  label: u and v solution normalization
  summary: The free Dirac equation has two positive-frequency u_s(p) and two negative-frequency
    v_s(p) solutions, conventionally with p^0>0 in both labels. Peskin and Schroeder
    use ū_r u_s=2mδ_rs, v̄_r v_s=−2mδ_rs and corresponding ψ†ψ normalizations; u
    and v are barred-orthogonal at equal momentum.
  kind: representation
  group: peskin-schroeder.free-dirac-solutions
  evidence:
  - source: peskin-schroeder
    section: '3.3'
    pages:
    - 47
    - 48
    note: Equations (3.55)–(3.65) state the Lorentz-scalar normalization, negative-frequency
      solutions, and orthogonality.
- id: peskin-schroeder.dirac-u1-charge
  label: Dirac U(1) charge
  summary: The conserved vector current gives Q=∫d^3x ψ†ψ. After normal ordering,
    Q assigns +1 to a† fermions and −1 to b† antifermions; in the QED interpretation
    these are electrons and positrons, up to the electric-charge normalization.
  kind: result
  group: peskin-schroeder.dirac-field-quantization
  evidence:
  - source: peskin-schroeder
    section: '3.5'
    pages:
    - 62
    note: The source evaluates Q in ladder operators and identifies the charges of
      fermions and antifermions.
- id: peskin-schroeder.dirac-vector-and-axial-currents
  label: Vector and axial Dirac currents
  summary: For a free Dirac solution, j^μ=ψ̄γ^μψ is conserved. The axial current j_5^μ=ψ̄γ^μγ^5ψ
    has divergence proportional to the mass, so it is conserved only in the massless
    free theory.
  kind: result
  group: peskin-schroeder.dirac-bilinears-and-currents
  evidence:
  - source: peskin-schroeder
    section: '3.4'
    pages:
    - 50
    - 51
    note: Equations (3.73)–(3.75) calculate the two divergences from the Dirac equations.
- id: peskin-schroeder.discrete-lorentz-components-and-cpt-status
  label: P, T, C, and disconnected Lorentz components
  summary: Parity and time reversal preserve x² but lie outside the proper orthochronous
    Lorentz component; charge conjugation independently interchanges particles and
    antiparticles. The source distinguishes possible L^↑_+ covariance from optional
    individual C, P, or T invariance and describes empirical CPT status as context
    rather than a derivation.
  kind: concept
