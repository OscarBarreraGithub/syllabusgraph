    - 506
    - 507
    - 508
- id: peskin-schroeder.yang-mills-field-strength-self-interactions
  label: Yang-Mills curvature and symmetry-fixed self-interactions
  summary: The commutator [D_mu,D_nu]=-i g F_mu_nu^a t^a defines a non-Abelian field
    strength with a term quadratic in A and structure constants. Although each component
    F^a is not gauge invariant, F^a_mu_nu F^{a mu nu} is. The Yang-Mills Lagrangian
    combines this kinetic term with the covariant Dirac term, so cubic and quartic
    vector self-interactions and their common coupling are fixed by local symmetry.
  kind: result
  group: peskin-schroeder.ch15-yang-mills-and-lie
  evidence:
  - source: peskin-schroeder
    section: 15.2 The Yang-Mills Lagrangian
    pages:
    - 488
    - 489
    - 491
- id: peskin-schroeder.yukawa-feynman-rules
  label: Yukawa Feynman rules and external spinors
  summary: For H_int=g psibar psi phi, construct amplitudes from scalar and Dirac
    propagators, -ig vertices, u/v external spinors, vertex momentum conservation,
    loop integrations, and the fermionic sign. Unlike phi-four, Yukawa vertices have
    no symmetry factors because their three field types cannot be interchanged.
  kind: method
  evidence:
