- id: peskin-schroeder.qcd-dis-leading-parton-factorization
  label: Leading-order QCD factorization for deep-inelastic scattering
  summary: At large Q^2=-q^2, a proton constituent has nearly collinear momentum p=xi
    P, with 0<xi<1; hard transverse momentum in the initial state is suppressed by
    small alpha_s. The leading inclusive electron-proton rate is the sum over quark
    and antiquark species of the electron-parton cross section convolved with nonperturbative
    PDFs f_f(xi). PDFs cannot be calculated by perturbation theory because they describe
    soft proton binding. This is the parton-model, first term in alpha_s; hard corrections
    modify both the coefficient process and PDFs.
  kind: method
