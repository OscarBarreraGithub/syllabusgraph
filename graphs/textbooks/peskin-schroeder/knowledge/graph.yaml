groups:
- id: peskin-schroeder.ch5-crossing-and-compton
  title: Crossing, channels, and Compton scattering
  question: How do crossing variables, gauge-current constraints, and kinematics organize
    related QED processes?
- id: peskin-schroeder.ch5-muon-annihilation
  title: Muon-pair annihilation and bound states
  question: How do QED amplitudes, spin, threshold kinematics, and nonrelativistic
    bound states structure e+e- annihilation?
- id: peskin-schroeder.ch5-qed-applications
  title: Chapter 5 QED applications
  question: Which scattering, annihilation, and collinear-emission calculations are
    posed as applications?
- id: peskin-schroeder.ch6-radiative-corrections
  title: 'Radiative corrections: soft photons, vertex structure, and infrared observables'
  question: How do loop and soft-radiation effects modify QED scattering while leaving
    a detector-defined observable finite?
- id: peskin-schroeder.chapter-three-problem-applications
  title: Chapter 3 problem applications
  question: Which further representation, spinor, Majorana, supersymmetry, Fierz,
    and bound-state calculations are posed for the reader?
- id: peskin-schroeder.dirac-bilinears-and-currents
  title: Dirac bilinears, currents, and rearrangements
  question: Which Lorentz objects can be made from Dirac fields, and what conservation
    or algebraic identities do they obey?
- id: peskin-schroeder.dirac-discrete-symmetries
  title: Discrete symmetries of the Dirac theory
  question: How are P, T, and C implemented on fermion fields and bilinears, and what
    does their combined CPT property imply?
- id: peskin-schroeder.dirac-field-quantization
  title: Quantized Dirac field, statistics, and propagation
  question: Why does causal positive-energy quantization require fermionic anticommutators,
    and what particle and propagator structure results?
- id: peskin-schroeder.dirac-lorentz-and-spinors
  title: Lorentz covariance, spinors, and the Dirac equation
  question: How do Lorentz representations and the Clifford algebra produce a covariant
    spin-one-half field equation?
- id: peskin-schroeder.field-symmetry-and-charge
  title: Field symmetries, currents, and stress-energy
  question: How do continuous field and spacetime symmetries produce currents, charges,
    and energy-momentum tensors?
- id: peskin-schroeder.free-dirac-solutions
  title: Free Dirac solutions and spin sums
  question: How do on-shell u and v spinors encode boosts, helicity, normalization,
    and polarization completeness?
- id: peskin-schroeder.free-scalar-foundations
  title: Free real scalar-field foundations
  question: How does the real Klein-Gordon field acquire its classical dynamics, canonical
    variables, and oscillator-mode description?
- id: peskin-schroeder.notation-and-conventions
  title: Notation and conventions
  question: Which conventions fix the signs, indices, normalizations, and representation
    choices used throughout this book?
- id: peskin-schroeder.qed-scattering
  title: QED scattering and diagrammatics
  question: How does introductory e+e- to mu+mu- connect amplitudes, spin selection,
    diagrams, and cross sections?
- id: peskin-schroeder.quantized-scalar-particles
  title: Quantized scalar modes and particles
  question: How do canonical scalar-field modes become particles with relativistic
    normalization and statistics?
- id: peskin-schroeder.scalar-spacetime-propagation
  title: Scalar fields in spacetime, causality, and propagation
  question: How do Heisenberg fields, commutators, propagators, and sources describe
    causal scalar dynamics?
motivations:
- id: peskin-schroeder.ch5-inverse-compton-use
  nodes:
  - peskin-schroeder.high-energy-compton-helicity-endpoint
  summary: Near the inverse-Compton endpoint, helicity reversal makes a tunable polarized
    high-energy photon source and a polarization probe.
  evidence:
  - source: peskin-schroeder
    section: '5.5'
    pages:
    - 167
    note: The text gives these experimental uses of the endpoint helicity structure.
- id: peskin-schroeder.ch5-threshold-tests
  nodes:
  - peskin-schroeder.massive-muon-pair-cross-section
  - peskin-schroeder.quark-pair-r-ratio
  summary: The text uses threshold shapes and high-energy hadron production to test
    QED and identify the color multiplicity of quarks.
  evidence:
  - source: peskin-schroeder
    section: '5.1'
    pages:
    - 137
    - 140
    note: Threshold deviations test QED; the factor three is evidence for color.
- id: peskin-schroeder.ch6-unobservable-infrared-question
  nodes:
  - peskin-schroeder.single-soft-photon-infrared-divergence
  - peskin-schroeder.infrared-inclusive-vertex-and-soft-cross-section
  summary: The separate elastic and unresolved-soft-photon probabilities diverge even
    though a detector cannot distinguish sufficiently soft radiation; the chapter
    asks for the finite quantity that an experiment can measure.
  evidence:
  - source: peskin-schroeder
    section: '6.4 The Electron Vertex Function: Infrared Divergence'
    pages:
    - 200
    - 201
- id: peskin-schroeder.why-commutators-test-causality
  nodes:
  - peskin-schroeder.spacelike-wightman-amplitude
  - peskin-schroeder.microcausality-field-commutator
  - peskin-schroeder.antiparticle-causality-cancellation
  summary: The causality discussion reframes a nonzero spacelike amplitude into whether
    a measurement at one point can affect another, leading to the commutator test
    and particle-antiparticle interpretation.
  evidence:
  - source: peskin-schroeder
    section: '2.4 The Klein-Gordon Field in Space-Time: Causality'
    pages:
    - 28
    - 29
    note: The text asks about measurement effects and explains complex-field cancellation
      in terms of opposite charges.
- id: peskin-schroeder.why-diagrammatic-qed
  nodes:
  - peskin-schroeder.qed-diagrammatic-calculation
  - peskin-schroeder.qed-tree-amplitude-rule
  summary: The opening chapter asks how to calculate an observable QED process and
    uses pair annihilation as an intuitive preview before the full rules are derived.
  evidence:
  - source: peskin-schroeder
    section: Chapter 1
    pages:
    - 3
    note: The chapter discusses a simple QED process in advance to address where the
      formal development is going.
- id: peskin-schroeder.why-fermion-anticommutators
  nodes:
  - peskin-schroeder.naive-dirac-commutator-instability
  - peskin-schroeder.fermionic-anticommutator-causality
  - peskin-schroeder.fermionic-ladder-operators-and-statistics
  summary: The deliberately failed commutator construction is microcausal, but only
    because positive- and negative-energy propagation in the same direction cancels
    outside the light cone, while its Hamiltonian is unbounded below. Requiring positive
    energy and positive norm makes a spacelike commutator cancellation impossible;
    equal weights instead give spacelike anticommutation and positive-energy fermions.
  evidence:
  - source: peskin-schroeder
    section: 3.5, How Not to Quantize the Dirac Field
    pages:
    - 54
    - 55
    - 56
    - 57
    note: The source first finds the commutator vanishes outside the light cone, then
      imposes positive-energy/norm conditions and derives anticommutation.
- id: peskin-schroeder.why-first-order-spinor-field
  nodes:
  - peskin-schroeder.dirac-clifford-algebra-generators
  - peskin-schroeder.dirac-spinor-and-covariant-equation
  - peskin-schroeder.dirac-adjoint-and-free-lagrangian
  summary: The chapter asks how to construct a classical relativistic field equation
    for spin one-half that is stronger than Klein–Gordon dynamics and makes Lorentz
    invariance explicit.
  evidence:
  - source: peskin-schroeder
    section: Chapter 3 and 3.2
    pages:
    - 35
    - 42
    note: The opening states the chapter's classical-field and invariance viewpoint;
      Section 3.2 contrasts Klein–Gordon with the stronger first-order equation.
- id: peskin-schroeder.why-relativistic-fields
  nodes:
  - peskin-schroeder.relativistic-field-viewpoint
  summary: The text asks why relativistic particles cannot simply be quantized as
    nonrelativistic particles, then points to particle creation, multiparticle intermediate
    states, and causality as problems requiring a field-theoretic treatment.
  evidence:
  - source: peskin-schroeder
    section: 2.1 The Necessity of the Field Viewpoint
    pages:
    - 13
    - 14
    note: The opening questions the single-particle approach and discusses both variable
      particle number and spacelike propagation.
