- id: peskin-schroeder.qcd-two-body-jet-rapidity-kinematics
  label: Two-body parton kinematics in transverse momentum and rapidity
  summary: For massless 1+2->3+4 partons, the final transverse momenta are equal and
    opposite. With common p_T, y_*=(y_3-y_4)/2 and Y=(y_3+y_4)/2, one has hat_s=4
    p_T^2 cosh^2(y_*), hat_t=-2 p_T^2 cosh(y_*) exp(-y_*), x_1=(2p_T/sqrt(s))cosh(y_*)exp(Y),
    and x_2=(2p_T/sqrt(s))cosh(y_*)exp(-Y). The Jacobian is partial(x_1,x_2,hat_t)/partial(y_3,y_4,p_T)=8p_T^3
    cosh^2(y_*)/s=2p_T hat_s/s. Consequently d^3sigma/(dy_3 dy_4 dp_T)=f_1(x_1)f_2(x_2)(2p_T
    hat_s/s)dhat_sigma/dhat_t, or d^4sigma/(dy_3 dy_4 d^2p_T)=x_1f_1(x_1)x_2f_2(x_2)(1/pi)dhat_sigma/dhat_t.
