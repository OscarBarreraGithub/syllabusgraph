nodes:
- id: peskin-schroeder.abelian-curvature-from-holonomy-and-covariant-commutator
  label: Abelian field strength as curvature
  summary: The comparator around an infinitesimal square differs from one by the electromagnetic
    curvature F_mu_nu=partial_mu A_nu-partial_nu A_mu. Equivalently, [D_mu,D_nu]=i
    e F_mu_nu. Gauge invariance permits dependence on the connection through F and
    covariant derivatives, while a vector mass term is not invariant.
  kind: method
  group: peskin-schroeder.ch15-gauge-geometry
  evidence:
  - source: peskin-schroeder
    section: 15.1 The Geometry of Gauge Invariance
    pages:
    - 484
    - 485
- id: peskin-schroeder.abelian-wilson-line-and-loop
  label: Abelian Wilson line and loop
  summary: Integrating the Abelian connection along a path gives a path-dependent
    comparator called a Wilson line. For a closed path, the Wilson loop is gauge invariant
    and Stokes's theorem relates it to flux of F_mu_nu through a spanning surface;
    this explains both path dependence and the geometric role of curvature.
  kind: method
  group: peskin-schroeder.ch15-yang-mills-and-lie
  evidence:
  - source: peskin-schroeder
    section: 15.3 The Gauge-Invariant Wilson Loop
    pages:
    - 491
    - 492
- id: peskin-schroeder.adiabatic-interacting-vacuum-projection
  label: Adiabatic projection onto the interacting vacuum
  summary: Assuming the free vacuum overlaps the interacting ground state, evolve
    it to large complex time T->infinity(1-i epsilon) to suppress higher-energy states
    and isolate the interacting vacuum. The construction is formal and carries normalization
    factors.
  kind: method
  evidence:
  - source: peskin-schroeder
    section: '4.2'
    pages:
    - 86
    - 87
- id: peskin-schroeder.adjoint-representation-covariant-derivative-and-bianchi-input
  label: Adjoint representation and its covariant derivative
  summary: For every simple Lie algebra, the structure constants define the real adjoint
    representation by (t_G^b)_ac=i f^abc. Its covariant derivative is (D_mu phi)^a=partial_mu
    phi^a+g f^abc A_mu^b phi^c. The Jacobi identity is exactly the adjoint commutation
    relation and underlies both the covariant Yang-Mills equation and the non-Abelian
    Bianchi identity.
  kind: method
  group: peskin-schroeder.ch15-yang-mills-and-lie
  evidence:
  - source: peskin-schroeder
    section: 15.4 Basic Facts about Lie Algebras
    pages:
    - 499
    - 500
- id: peskin-schroeder.antiparticle-causality-cancellation
  label: Antiparticles in the complex-scalar causality cancellation
  summary: For a complex scalar, phi creates positive charge and destroys negative
    charge, while phi-dagger reverses the roles. The two charged contributions cancel
    at spacelike separation only with equal-mass opposite-charge antiparticles; the
    real scalar is its own antiparticle.
  kind: result
  group: peskin-schroeder.scalar-spacetime-propagation
  evidence:
  - source: peskin-schroeder
    section: '2.4 The Klein-Gordon Field in Space-Time: Causality'
    pages:
    - 29
    note: The source connects complex-field charged excitations to the two cancelling
      propagation terms and draws the equal-mass antiparticle conclusion.
- id: peskin-schroeder.asymptotic-freedom-scaling-violations-and-hard-jets
  label: Asymptotic freedom predicts logarithmic scaling violations
  summary: A non-Abelian gauge theory with gluons explains approximate free partons
    at large momentum transfer, but its nonzero finite-scale coupling approaches zero
    only logarithmically. It therefore predicts slow Q-squared evolution of parton
    distributions, deviations from strict Bjorken scaling, and hard-scattered quark
    or gluon jets rather than exact high-momentum simplification.
  kind: result
  group: peskin-schroeder.ch14-parton-model
  evidence:
  - source: peskin-schroeder
    section: 14 Asymptotically Free Partons
    pages:
    - 479
    - 480
- id: peskin-schroeder.axion-electron-pseudoscalar-coupling-assumption
  label: Stated pseudoscalar axion-electron coupling
  summary: Problem 6.3 supplies a pseudoscalar axion with a distinct electron coupling
    and mass m_a, allowing an axion as light as or lighter than the electron; this
    is the interaction input for the requested virtual-axion contribution.
  kind: assumption
  group: peskin-schroeder.ch6-radiative-corrections
  evidence:
  - source: peskin-schroeder
    section: Problem 6.3(c)
    pages:
    - 210
- id: peskin-schroeder.background-determinants-magnetic-moment-and-beta-coefficients
  label: Background determinants, g-factor two, and beta coefficients
  summary: The quadratic gauge, fermion, and ghost fluctuation operators take a covariant
    d'Alembertian form plus a field-strength spin coupling. The latter is a magnetic-moment
    term with g-factor two. Their one-loop determinants are gauge-invariant functionals;
    expanding to F-squared gives scalar, Dirac-spinor, and vector coefficients, whose
    vector magnetic term dominates with opposite sign and reproduces the negative
    non-Abelian beta function for sufficiently few fermions.
  kind: method
  group: peskin-schroeder.ch16-quantization
  evidence:
  - source: peskin-schroeder
    section: '16.6 Asymptotic Freedom: The Background Field Method'
    pages:
    - 536
    - 537
    - 538
    - 539
    - 540
- id: peskin-schroeder.background-field-gauge-invariant-effective-action-route
  label: Background-field route to the non-Abelian beta function
  summary: Rescale the gauge field so g multiplies the inverse kinetic coefficient,
    split it into a fixed classical background and a quantum fluctuation, and use
    a background-covariant Faddeev-Popov gauge condition. The gauge-fixed action remains
    invariant under simultaneous local transformations of background and fluctuation
    fields, so integrating out fluctuations produces a gauge-invariant effective action
    for the background.
  kind: method
  group: peskin-schroeder.ch16-quantization
  evidence:
  - source: peskin-schroeder
    section: '16.6 Asymptotic Freedom: The Background Field Method'
    pages:
    - 533
    - 534
    - 535
- id: peskin-schroeder.bare-to-renormalized-parameter-elimination
  label: Bare perturbation theory and renormalization
  summary: Bare perturbation theory regulates diagrams in terms of bare mass, coupling,
    and cutoff, computes physical parameters and field strengths consistently, and
    eliminates bare parameters in favor of measured ones. In a renormalizable theory
    the resulting S-matrix expression is finite as the ultraviolet cutoff is removed.
  kind: method
  group: peskin-schroeder.ch10-systematics-renormalization
  evidence:
  - source: peskin-schroeder
    section: '10.2'
    pages:
    - 323
- id: peskin-schroeder.beta-function-flow-classes
  label: Beta-function flow classes
  summary: A beta function can drive a coupling to zero in the infrared, to zero in
    the ultraviolet (asymptotic freedom), or to a nonzero fixed point. A zero's slope
    determines whether it is infrared- or ultraviolet-stable, while scheme changes
    preserve the existence of a fixed point and its critical data.
  kind: concept
  group: peskin-schroeder.ch12-cs-rg
  evidence:
  - source: peskin-schroeder
    section: '12.3'
    pages:
    - 425
    - 426
    - 427
    - 428
- id: peskin-schroeder.bjorken-scaling-parton-cross-section
  label: Parton-model Bjorken scaling
  summary: In the parton model, the deep-inelastic electron-proton distribution is
    obtained by evaluating charged-parton densities at xi=x and multiplying by the
    elementary electron-quark cross section. After division by the displayed QED kinematic
    factor, the prediction depends on x but not Q-squared; SLAC-MIT data showed this
    scaling to roughly ten-percent accuracy above Q of 1 GeV.
  kind: result
  group: peskin-schroeder.ch14-parton-model
  evidence:
  - source: peskin-schroeder
    section: 14 Almost Free Partons
    pages:
    - 478
    - 479
- id: peskin-schroeder.bosonic-functional-determinant
  label: Bosonic functional determinant
  summary: A quadratic scalar functional integral formally gives an inverse square-root
    determinant of the Klein-Gordon operator; the normalization determinants cancel
    in normalized correlators but can carry physical meaning in other settings.
  kind: result
  group: peskin-schroeder.scalar-functional-methods
  evidence:
  - source: peskin-schroeder
    section: 9.2 Functional Quantization of Scalar Fields
    pages:
    - 287
- id: peskin-schroeder.bound-state-production-decay-detailed-balance
  label: Bound-state production-decay resonance relation
  summary: A one-body bound state is produced only when the center-of-mass energy
    equals its mass; finite lifetime broadens the delta-function resonance. Comparing
    production and decay from the same matrix element yields a general relation between
    resonant e+e- production and the leptonic partial width, with a 2J+1 spin factor.
  kind: result
  group: peskin-schroeder.ch5-muon-annihilation
  evidence:
  - source: peskin-schroeder
    section: 5.3 Vector Meson Production and Decay
    pages:
    - 151
    - 152
    note: The text derives the resonance constraint and the production-width relation,
      then generalizes the spin factor.
- id: peskin-schroeder.bphz-and-two-loop-phi4-nonlocal-cancellation
  label: BPHZ finiteness and the two-loop phi-four cancellation
  summary: The BPHZ theorem states that in a renormalizable theory all divergences
    at every perturbative order are removed by counterterms for superficially divergent
    amplitudes. The two-loop phi-four four-point example organizes crossing-related
    diagrams so a first-order vertex counterterm cancels momentum-dependent nonlocal
    terms, leaving momentum-independent divergences for the second-order vertex counterterm;
    the remaining poles can be double poles and finite high-energy terms contain double
    logarithms.
  kind: result
  group: peskin-schroeder.ch10-systematics-renormalization
  evidence:
  - source: peskin-schroeder
    section: 10.4–10.5
    pages:
    - 338
    - 339
    - 340
    - 341
    - 342
    - 343
    - 344
- id: peskin-schroeder.breit-wigner-resonance-width-and-time-dilation
  label: Breit-Wigner width, rest-frame decay rate, and time dilation
  summary: Near an unstable-particle resonance, the invariant Breit-Wigner denominator
    is p^2-m^2+i m Gamma. Its peak width equals the rest-frame decay rate Gamma, while
    in a frame with energy E_p the decay rate is (m/E_p) Gamma, as required by time
    dilation.
  kind: result
  evidence:
  - source: peskin-schroeder
    section: '4.5'
    pages:
    - 101
- id: peskin-schroeder.broken-on-sigma-counterterms
  label: Symmetry-linked counterterms in the broken O(N) model
  summary: Although the shifted linear sigma model has eight superficially divergent
    amplitude types, rewriting the original symmetric Lagrangian supplies only three
    independent counterterms, delta-Z, delta-mu, and delta-lambda. Their many shifted
    vertices are linked, so adding independent symmetry-breaking counterterms would
    be necessary only if quantum theory failed to preserve O(N).
  kind: concept
  group: peskin-schroeder.ch11-renormalization-symmetry
  evidence:
  - source: peskin-schroeder
    section: '11.2'
    pages:
    - 353
    - 354
- id: peskin-schroeder.brst-auxiliary-field-symmetry-and-nilpotence
  label: BRST auxiliary-field symmetry and nilpotence
  summary: 'Introducing a nondynamical commuting B^a rewrites the gauge-fixed Faddeev-Popov
    Lagrangian without changing its functional integral. Its global BRST symmetry
    uses an anticommuting parameter: gauge and matter variations are gauge transformations
    with ghost parameter, the ghost variation is quadratic, c-bar varies to B, and
    B is fixed. Anticommutation plus the Jacobi identity makes the BRST operation
    nilpotent, Q-squared=0.'
  kind: method
  group: peskin-schroeder.ch16-quantization
  evidence:
  - source: peskin-schroeder
    section: 16.4 BRST Symmetry
    pages:
    - 517
    - 518
- id: peskin-schroeder.brst-physical-state-space-and-restricted-unitarity
  label: BRST physical state space and restricted unitarity
  summary: The conserved nilpotent BRST charge decomposes states into nonclosed states,
    Q-exact zero-norm states, and Q-closed states not Q-exact. At zero coupling, unphysical
    gauge polarizations and ghosts occupy the nonphysical sectors while transverse
    gauge bosons span the physical sector. Since Q commutes with time evolution, the
    full unitary S matrix restricts to a unitary S matrix between transverse states
    and all-order cuts reduce to transverse intermediate states.
  kind: result
  group: peskin-schroeder.ch16-quantization
  evidence:
  - source: peskin-schroeder
    section: 16.4 BRST Symmetry
    pages:
    - 519
    - 520
    - 521
- id: peskin-schroeder.callan-symanzik-equation
  label: Callan-Symanzik equation
  summary: Holding bare Green functions fixed while shifting the arbitrary subtraction
    scale M changes the renormalized coupling and field normalization. Defining beta=M
    d lambda/dM and gamma from the field rescaling gives (M partial-M+beta partial-lambda+n
    gamma)G-n=0 for massless scalar n-point functions.
  kind: result
  group: peskin-schroeder.ch12-cs-rg
  evidence:
  - source: peskin-schroeder
    section: '12.2'
    pages:
    - 410
    - 411
- id: peskin-schroeder.canonical-dirac-momentum-and-hamiltonian
  label: Canonical Dirac momentum and Hamiltonian
  summary: For L=ψ̄(iγ·∂−m)ψ, the canonical momentum conjugate to ψ is π_ψ=iψ†. The
    Hamiltonian H=∫d^3x ψ†[−iα·∇+mβ]ψ uses α=γ^0γ and β=γ^0, matching the one-particle
    Dirac Hamiltonian; this classical/canonical construction precedes and is retained
    through the failed commutator route.
  kind: method
  group: peskin-schroeder.dirac-field-quantization
  evidence:
  - source: peskin-schroeder
    section: '3.5'
    pages:
    - 52
    note: Equations (3.83)–(3.85) derive the conjugate momentum and Hamiltonian before
      the attempted commutator quantization.
  notation:
  - source: peskin-schroeder
    note: The source uses α=γ^0γ and β=γ^0 in its Weyl gamma-matrix convention.
- id: peskin-schroeder.canonical-field-momentum-hamiltonian
  label: Canonical momentum and Hamiltonian for a field
  summary: The conjugate momentum density is pi(x) = partial L / partial phidot(x),
    and the Hamiltonian is H = integral d^3x [pi phidot - L]. This is the continuum
    Legendre construction used for the field.
  kind: method
  group: peskin-schroeder.free-scalar-foundations
  notation:
  - source: peskin-schroeder
    note: pi(x) denotes momentum density, whereas the physical momentum associated
      with translations is treated separately later.
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Hamiltonian Field Theory'
    pages:
    - 16
    note: The text obtains the momentum density by a discretization argument and then
      passes to the continuum Hamiltonian density.
- id: peskin-schroeder.canonical-quantization-real-field
  label: Canonical quantization of the real field
  summary: The opening quantization prescription promotes the classical variables
    phi and pi to operators. At equal time their commutator is [phi(x), pi(y)] = i
    delta^(3)(x-y), while field-field and momentum-momentum commutators vanish.
  kind: method
  group: peskin-schroeder.free-scalar-foundations
  notation:
  - source: peskin-schroeder
    note: The equal-time relations are introduced in the Schroedinger picture; the
      book says they also hold at a common time after switching to the Heisenberg
      picture.
  evidence:
  - source: peskin-schroeder
    section: 2.3 The Klein-Gordon Field as Harmonic Oscillators
    pages:
    - 19
    - 20
    note: The text first states promotion of phi and pi, then gives the continuous-system
      equal-time commutation relations.
- id: peskin-schroeder.casimir-definitions-and-index-relation
  label: Quadratic Casimir definitions and the index relation
  summary: With tr(t_r^a t_r^b)=C(r) delta^ab, define T-squared=T^a T^a. It commutes
    with every generator and therefore equals C2(r) times the identity on an irreducible
    representation; in the adjoint, f^acd f^bcd=C2(G) delta^ab. Taking the trace gives
    d(r) C2(r)=d(G) C(r), without fixing any representation's numerical value.
  kind: concept
  group: peskin-schroeder.ch15-yang-mills-and-lie
  evidence:
  - source: peskin-schroeder
    section: 15.4 Representations; The Casimir Operator
    pages:
    - 498
    - 500
  notation:
  - source: peskin-schroeder
    note: C(r) is the trace-normalization index, while C2(r) is the scalar by which
      the quadratic generator product acts on an irreducible representation.
- id: peskin-schroeder.charge-conjugation-bilinears-and-cpt
  label: Charge conjugation, bilinear signs, and CPT
  summary: Linear unitary charge conjugation exchanges same-spin fermion and antifermion
    annihilators and maps ψ to −iγ^2ψ*. Accounting for fermion anticommutation gives
    the C signs of bilinears. The free Dirac Lagrangian is separately C, P, and T
    invariant. The source then gives an informal CPT-theorem statement; the standard
    general theorem also requires assumptions such as local/microcausal relativistic
    quantum fields and the usual spectrum/unitarity conditions, which this chapter
    does not establish.
  kind: result
  group: peskin-schroeder.dirac-discrete-symmetries
  evidence:
  - source: peskin-schroeder
    section: 3.6, Charge Conjugation and Summary of C, P, and T
    pages:
    - 70
    - 71
    note: The source derives charge conjugation, tabulates bilinears, and states—but
      does not prove—the CPT conclusion.
- id: peskin-schroeder.charge-renormalization-and-running-coupling
  label: Charge renormalization and momentum-dependent effective coupling
  summary: The physical charge is square-root Z3 times the bare Lagrangian charge.
    At nonzero momentum transfer, the difference between the polarization function
    and its zero-momentum value defines an effective electromagnetic coupling whose
    variation is observable even though the bare-to-physical constant shift is not.
  kind: result
  group: peskin-schroeder.ch7-charge-renormalization
  evidence:
  - source: peskin-schroeder
    section: '7.5'
    pages:
    - 246
    - 247
    - 252
- id: peskin-schroeder.chiral-dirac-basis-and-relativistic-normalization-declaration
  label: Chiral Dirac basis and relativistic spinor-normalization declaration
  summary: For its Dirac treatment the book declares a chiral basis for the gamma
    matrices and relativistic normalization for Dirac spinors; the detailed realization
    and normalization formulas are supplied in the accepted Dirac representation records.
  kind: representation
  group: peskin-schroeder.notation-and-conventions
  evidence:
  - source: peskin-schroeder-notation
    section: Dirac Equation
    pages:
    - 21
    note: The frontmatter explicitly declares the chiral gamma-matrix basis and relativistic
      spinor normalization, referring readers to Sections 3.2, 3.3, and the Appendix
      for their details.
- id: peskin-schroeder.chiral-u1-symmetry-and-handed-currents
  label: Chiral U(1) symmetry and handed currents
  summary: The ordinary phase transformation is a symmetry of the full free Dirac
    Lagrangian, whereas ψ→e^{iαγ^5}ψ preserves only its derivative term when m≠0.
    At m=0, the combinations (j^μ±j_5^μ)/2 are separately conserved left- and right-handed
    currents.
  kind: concept
  group: peskin-schroeder.dirac-bilinears-and-currents
  evidence:
  - source: peskin-schroeder
    section: '3.4'
    pages:
    - 51
    note: The text relates the two currents to Noether transformations and states
      the mass qualification.
- id: peskin-schroeder.classical-goldstone-theorem
  label: Classical Goldstone theorem from symmetry of the potential
  summary: Every spontaneously broken continuous symmetry yields a massless scalar.
    At a constant potential minimum, differentiating the symmetry-invariance identity
    shows that the broken transformation direction is a zero eigenvector of the Hessian,
    whose eigenvalues are the scalar masses.
  kind: method
  group: peskin-schroeder.ch11-renormalization-symmetry
  evidence:
  - source: peskin-schroeder
    section: '11.1'
    pages:
    - 351
    - 352
- id: peskin-schroeder.classical-soft-bremsstrahlung-spectrum
  label: Classical soft-bremsstrahlung spectrum
  summary: Solve the worldline current in Lorenz gauge with retarded boundary conditions,
    separate the Coulomb fields from the radiation poles, and integrate the transverse
    electric and magnetic fields. For a sudden relativistic deflection, the low-frequency
    energy spectrum has logarithmic dependence on momentum transfer; the sudden-kick
    idealization requires an upper frequency cutoff.
  kind: result
  group: peskin-schroeder.ch6-radiative-corrections
  evidence:
  - source: peskin-schroeder
    section: 6.1 Soft Bremsstrahlung
    pages:
    - 179
    - 180
    - 181
    - 182
- id: peskin-schroeder.classical-source-on-shell-particle-creation
  label: Particle creation by a finite-time classical source
  summary: For (partial-squared+m-squared)phi=j(x) with a source active for a finite
    interval, retarded propagation shifts the free-field ladder operators. The Fourier
    component j(p) creates quanta in mode p with probability density proportional
    to |j(p)|-squared/(2E_p); only on-shell p-squared=m-squared components are effective.
  kind: result
  group: peskin-schroeder.scalar-spacetime-propagation
  evidence:
  - source: peskin-schroeder
    section: '2.4 The Klein-Gordon Field in Space-Time: Particle Creation by a Classical
      Source'
    pages:
    - 32
    - 33
    note: The source gives the source equation and retarded solution, then interprets
      on-shell Fourier components as particle-creation probability density.
  notation:
  - source: peskin-schroeder
    note: j(x) is an external classical function rather than a dynamical quantum field.
- id: peskin-schroeder.cm-high-energy-muon-pair-setup
  label: High-energy center-of-mass muon-pair setup
  summary: The introductory e+e- to mu+mu- calculation takes p'=-p and k'=-k in the
    CM frame and neglects electron and muon masses by assuming E is much larger than
    both. It averages unobserved initial spins and sums unobserved final spins.
  kind: assumption
  group: peskin-schroeder.qed-scattering
  evidence:
  - source: peskin-schroeder
    section: Chapter 1, The Simplest Situation
    pages:
    - 4
    note: The source explicitly states the CM relations, high-energy massless approximation,
      and spin convention.
  notation:
  - source: peskin-schroeder
    note: Bold symbols are 3-vectors and italic symbols 4-vectors; theta is the scattering
      angle.
- id: peskin-schroeder.coherent-sum-of-diagram-amplitudes
  label: Coherent addition of allowed diagram amplitudes
  summary: When more than one diagram contributes, add the amplitudes before squaring.
    The source illustrates this with Bhabha scattering, which has a second lowest-order
    diagram.
  kind: result
  group: peskin-schroeder.qed-scattering
  evidence:
  - source: peskin-schroeder
    section: Chapter 1
    pages:
    - 10
    note: The Bhabha example explicitly says the two diagram amplitudes must first
      be added, then squared.
- id: peskin-schroeder.coleman-weinberg-model-assumptions
  label: Coleman-Weinberg scalar QED project setup
  summary: The final project studies four-dimensional scalar QED with complex phi,
    small scalar mass, and D-mu phi=(partial-mu+i e A-mu)phi. It generally uses starred
    Sections 11.3, 11.4, and 13.2, while parts (a) and (e) require only unstarred
    Part II material.
  kind: assumption
  group: peskin-schroeder.ch12-13-problems
  evidence:
  - source: peskin-schroeder
    section: Final Project
    pages:
    - 469
- id: peskin-schroeder.compact-simple-lie-algebra-classification
  label: Compact simple Lie algebras and their classification
  summary: A commuting generator supplies an independent U(1) factor; an algebra with
    none is semisimple, and one that cannot be split into mutually commuting generator
    sets is simple. A general algebra is a direct sum of simple non-Abelian components
    and Abelian generators. Compact simple algebras comprise the SU(N), SO(N), and
    Sp(N) classical families plus five exceptional cases G2, F4, E6, E7, and E8.
  kind: concept
  group: peskin-schroeder.ch15-yang-mills-and-lie
  evidence:
  - source: peskin-schroeder
    section: 15.4 Classification of Lie Algebras
    pages:
    - 496
    - 497
- id: peskin-schroeder.complex-scalar-canonical-particles-and-charge
  label: 'Complex scalar quantization: two charged particle species'
  summary: Problem 2.2 treats phi and phi-star as independent dynamical variables.
    Parts (b)-(c) ask the reader to diagonalize the stated Hamiltonian, show that
    two mass-m particle species occur, and determine each species' charge by rewriting
    the supplied conserved U(1) charge in ladder operators.
  kind: method
  group: peskin-schroeder.quantized-scalar-particles
  evidence:
  - source: peskin-schroeder
    section: Problem 2.2(a)-(c)
    pages:
    - 34
    note: The page supplies the Hamiltonian and charge and asks the reader for diagonalization,
      the two-species result, and the charges; it does not present those derivations.
  notation:
  - source: peskin-schroeder
    note: H=integral d^3x [pi-star pi + grad phi-star dot grad phi + m^2 phi-star
      phi].
- id: peskin-schroeder.complex-scalar-current-contact-identity
  label: Complex-scalar current contact identity
  summary: A spacetime-dependent infinitesimal global U(1) rotation of a free complex
    scalar gives the divergence of its Noether current inside a correlator plus charge-weighted
    contact terms at field insertions.
  kind: result
  group: peskin-schroeder.functional-symmetries
  evidence:
  - source: peskin-schroeder
    section: 9.6 Symmetries in the Functional Formalism
    pages:
    - 309
- id: peskin-schroeder.complex-scalar-u1-current
  label: Complex scalar U(1) current
  summary: The complex Klein-Gordon Lagrangian is invariant under the global phase
    rotation phi to exp(i alpha)phi. Treating phi and phi-star as independent fields
    gives j^mu=i[(partial^mu phi-star)phi-phi-star(partial^mu phi)], whose charge
    later has an electromagnetic interpretation after coupling.
  kind: result
  group: peskin-schroeder.field-symmetry-and-charge
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Noether''s Theorem'
    pages:
    - 18
    note: Equations (2.14)-(2.16) specify the phase symmetry, current, and later electromagnetic-current
      interpretation.
  notation:
  - source: peskin-schroeder
    note: The source chooses the current's overall normalization arbitrarily.
- id: peskin-schroeder.compton-two-diagram-amplitude
  label: Compton amplitude from the two fermion-line orderings
