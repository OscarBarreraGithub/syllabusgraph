nodes:
- id: peskin-schroeder.antiparticle-causality-cancellation
  label: Antiparticles in the complex-scalar causality cancellation
  summary: For a complex scalar, phi creates positive charge and destroys negative
    charge, while phi-dagger reverses the roles. The two charged contributions cancel
    at spacelike separation only with equal-mass opposite-charge antiparticles; the
    real scalar is its own antiparticle.
  kind: result
  group: peskin-schroeder.scalar-spacetime-propagation
  evidence:
  - source: peskin-schroeder
    section: '2.4 The Klein-Gordon Field in Space-Time: Causality'
    pages:
    - 29
    note: The source connects complex-field charged excitations to the two cancelling
      propagation terms and draws the equal-mass antiparticle conclusion.
- id: peskin-schroeder.canonical-field-momentum-hamiltonian
  label: Canonical momentum and Hamiltonian for a field
  summary: The conjugate momentum density is pi(x) = partial L / partial phidot(x),
    and the Hamiltonian is H = integral d^3x [pi phidot - L]. This is the continuum
    Legendre construction used for the field.
  kind: method
  group: peskin-schroeder.free-scalar-foundations
  notation:
  - source: peskin-schroeder
    note: pi(x) denotes momentum density, whereas the physical momentum associated
      with translations is treated separately later.
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Hamiltonian Field Theory'
    pages:
    - 16
    note: The text obtains the momentum density by a discretization argument and then
      passes to the continuum Hamiltonian density.
- id: peskin-schroeder.canonical-quantization-real-field
  label: Canonical quantization of the real field
  summary: The opening quantization prescription promotes the classical variables
    phi and pi to operators. At equal time their commutator is [phi(x), pi(y)] = i
    delta^(3)(x-y), while field-field and momentum-momentum commutators vanish.
  kind: method
  group: peskin-schroeder.free-scalar-foundations
  notation:
  - source: peskin-schroeder
    note: The equal-time relations are introduced in the Schroedinger picture; the
      book says they also hold at a common time after switching to the Heisenberg
      picture.
  evidence:
  - source: peskin-schroeder
    section: 2.3 The Klein-Gordon Field as Harmonic Oscillators
    pages:
    - 19
    - 20
    note: The text first states promotion of phi and pi, then gives the continuous-system
      equal-time commutation relations.
- id: peskin-schroeder.classical-source-on-shell-particle-creation
  label: Particle creation by a finite-time classical source
  summary: For (partial-squared+m-squared)phi=j(x) with a source active for a finite
    interval, retarded propagation shifts the free-field ladder operators. The Fourier
    component j(p) creates quanta in mode p with probability density proportional
    to |j(p)|-squared/(2E_p); only on-shell p-squared=m-squared components are effective.
  kind: result
  group: peskin-schroeder.scalar-spacetime-propagation
  evidence:
  - source: peskin-schroeder
    section: '2.4 The Klein-Gordon Field in Space-Time: Particle Creation by a Classical
      Source'
    pages:
    - 32
    - 33
    note: The source gives the source equation and retarded solution, then interprets
      on-shell Fourier components as particle-creation probability density.
  notation:
  - source: peskin-schroeder
    note: j(x) is an external classical function rather than a dynamical quantum field.
- id: peskin-schroeder.cm-high-energy-muon-pair-setup
  label: High-energy center-of-mass muon-pair setup
  summary: The introductory e+e- to mu+mu- calculation takes p'=-p and k'=-k in the
    CM frame and neglects electron and muon masses by assuming E is much larger than
    both. It averages unobserved initial spins and sums unobserved final spins.
  kind: assumption
  group: peskin-schroeder.qed-scattering
  evidence:
  - source: peskin-schroeder
    section: Chapter 1, The Simplest Situation
    pages:
    - 4
    note: The source explicitly states the CM relations, high-energy massless approximation,
      and spin convention.
  notation:
  - source: peskin-schroeder
    note: Bold symbols are 3-vectors and italic symbols 4-vectors; theta is the scattering
      angle.
- id: peskin-schroeder.coherent-sum-of-diagram-amplitudes
  label: Coherent addition of allowed diagram amplitudes
  summary: When more than one diagram contributes, add the amplitudes before squaring.
    The source illustrates this with Bhabha scattering, which has a second lowest-order
    diagram.
  kind: result
  group: peskin-schroeder.qed-scattering
  evidence:
  - source: peskin-schroeder
    section: Chapter 1
    pages:
    - 10
    note: The Bhabha example explicitly says the two diagram amplitudes must first
      be added, then squared.
- id: peskin-schroeder.complex-scalar-canonical-particles-and-charge
  label: 'Complex scalar quantization: two charged particle species'
  summary: Problem 2.2 treats phi and phi-star as independent dynamical variables.
    Parts (b)-(c) ask the reader to diagonalize the stated Hamiltonian, show that
    two mass-m particle species occur, and determine each species' charge by rewriting
    the supplied conserved U(1) charge in ladder operators.
  kind: method
  group: peskin-schroeder.quantized-scalar-particles
  evidence:
  - source: peskin-schroeder
    section: Problem 2.2(a)-(c)
    pages:
    - 34
    note: The page supplies the Hamiltonian and charge and asks the reader for diagonalization,
      the two-species result, and the charges; it does not present those derivations.
  notation:
  - source: peskin-schroeder
    note: H=integral d^3x [pi-star pi + grad phi-star dot grad phi + m^2 phi-star
      phi].
- id: peskin-schroeder.complex-scalar-u1-current
  label: Complex scalar U(1) current
  summary: The complex Klein-Gordon Lagrangian is invariant under the global phase
    rotation phi to exp(i alpha)phi. Treating phi and phi-star as independent fields
    gives j^mu=i[(partial^mu phi-star)phi-phi-star(partial^mu phi)], whose charge
    later has an electromagnetic interpretation after coupling.
  kind: result
  group: peskin-schroeder.field-symmetry-and-charge
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Noether''s Theorem'
    pages:
    - 18
    note: Equations (2.14)-(2.16) specify the phase symmetry, current, and later electromagnetic-current
      interpretation.
  notation:
  - source: peskin-schroeder
    note: The source chooses the current's overall normalization arbitrarily.
- id: peskin-schroeder.feynman-scalar-propagator
  label: Feynman scalar propagator and time ordering
  summary: The i epsilon prescription gives D_F(x-y)=integral d^4p/(2 pi)^4 i exp[-ip
    dot (x-y)]/(p-squared-m-squared+i epsilon). It is the vacuum expectation value
    of T phi(x)phi(y), a Klein-Gordon Green's function, and the factor attached to
    an internal scalar line in later Feynman rules.
  kind: result
  group: peskin-schroeder.scalar-spacetime-propagation
  evidence:
  - source: peskin-schroeder
    section: '2.4 The Klein-Gordon Field in Space-Time: The Klein-Gordon Propagator'
    pages:
    - 31
    note: The source gives the i epsilon form, defines time ordering, calls D_F the
      Feynman propagator, and states its internal-line role.
  notation:
  - source: peskin-schroeder
    note: T places the later operator left; i epsilon specifies displaced poles.
- id: peskin-schroeder.field-euler-lagrange-equation
  label: Field Euler-Lagrange equation
  summary: Varying a local field action with boundary-vanishing variations yields
    partial_mu[partial L / partial(partial_mu phi)] - partial L / partial phi = 0;
    one equation occurs for each field.
  kind: result
  group: peskin-schroeder.free-scalar-foundations
  notation:
  - source: peskin-schroeder
    note: This is Eq. (2.3), with partial_mu acting on the derivative of the Lagrangian
      density with respect to partial_mu phi.
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Lagrangian Field Theory'
    pages:
    - 16
    note: The derivation removes the surface term by boundary conditions and uses
      arbitrary variations to obtain the local equation of motion.
- id: peskin-schroeder.free-field-perturbative-foundation
  label: Free field as the basis of perturbation theory
  summary: The free Klein-Gordon theory has a linear equation and no interparticle
    interactions, so it cannot itself describe scattering observations. Its oscillator
    and propagator formalism supplies the basis for perturbative calculations in an
    interacting theory.
  kind: assumption
  group: peskin-schroeder.scalar-spacetime-propagation
  evidence:
  - source: peskin-schroeder
    section: 2.4 The Klein-Gordon Field in Space-Time
    pages:
    - 31
    note: The source contrasts isolated free modes with scattering and identifies
      the free theory as the perturbative basis.
- id: peskin-schroeder.heisenberg-klein-gordon-field
  label: Heisenberg evolution of the free Klein-Gordon field
  summary: In the Heisenberg picture, phi(x,t)=exp(iHt)phi(x)exp(-iHt), and the Hamiltonian
    plus canonical commutators reproduce the Klein-Gordon equation as an operator
    equation. Positive-frequency coefficients annihilate particles and negative-frequency
    Hermitian-conjugate coefficients create them, while excitation energies remain
    positive.
  kind: representation
  group: peskin-schroeder.scalar-spacetime-propagation
  evidence:
  - source: peskin-schroeder
    section: 2.4 The Klein-Gordon Field in Space-Time
    pages:
    - 25
    - 26
    note: p. 25 gives the Heisenberg definition and operator equation; p. 26 explains
      the frequency signs and creation/annihilation roles.
  notation:
  - source: peskin-schroeder
    note: Positive and negative frequency describe exponential time dependence, not
      excitation-energy signs.
- id: peskin-schroeder.helicity-angular-momentum-selection
  label: Helicity and angular-momentum selection in pair annihilation
  summary: In the massless CM treatment, helicities determine which e+e- to mu+mu-
    amplitudes can be nonzero. Angular-momentum matching gives factors proportional
    to 1 plus or minus cos(theta), while vector coupling vanishes when either end
    has zero total angular momentum.
  kind: result
  group: peskin-schroeder.qed-scattering
  evidence:
  - source: peskin-schroeder
    section: Chapter 1
    pages:
    - 7
    - 8
    note: The source derives a polarization-overlap amplitude, explains the vanishing
      RR coupling, and lists the remaining nonzero helicity amplitudes.
  notation:
  - source: peskin-schroeder
    note: R and L label spin parallel and antiparallel to momentum in this high-energy
      discussion.
- id: peskin-schroeder.identical-complex-scalars-internal-symmetry
  label: Internal symmetry of identical complex scalar fields
  summary: For two equal-mass complex Klein-Gordon fields, Problem 2.2(d) gives the
    candidate U(1) and three Pauli-matrix charges and asks the reader to prove that
    the latter obey SU(2) angular-momentum commutators and to generalize them to n
    fields. Its footnote states that with additional work there are n(2n-1) conserved
    charges and qualifies that extra symmetries often fail after nonlinear interactions
    are added.
  kind: concept
  group: peskin-schroeder.field-symmetry-and-charge
  evidence:
  - source: peskin-schroeder
    section: Problem 2.2(d)
    pages:
    - 34
    note: The page gives candidate charges and prompts the SU(2) proof and n-field
      generalization; the footnote, rather than a derivation, states the n(2n-1) count
      and nonlinear-interaction qualification.
  notation:
  - source: peskin-schroeder
    note: Labels a=1,2 are mixed by Pauli matrices sigma^i; this is an internal symmetry
      among equal-mass fields.
- id: peskin-schroeder.improved-electromagnetic-stress-energy
  label: Improved electromagnetic stress-energy tensor
  summary: The canonical electromagnetic stress-energy tensor can be changed by the
    divergence of a tensor antisymmetric in its first two indices without changing
    global conserved energy or momentum. Problem 2.1(b) asks the reader to show that
    the supplied improvement is symmetric and yields the standard energy density one-half(E-squared+B-squared)
    and momentum density E cross B.
  kind: method
  group: peskin-schroeder.field-symmetry-and-charge
  evidence:
  - source: peskin-schroeder
    section: Problem 2.1(b)
    pages:
    - 33
    note: The page supplies the divergenceless improvement construction and asks the
      reader to show symmetry and the stated standard densities; it does not present
      that derivation.
- id: peskin-schroeder.infrared-inclusive-final-states
  label: Infrared-inclusive final-state requirement
  summary: At the next order, a muon-pair observable must include final states with
    an extremely low-energy photon if a detector cannot distinguish them. The qualification
    is tied to the detector-insensitive observable.
  kind: assumption
  group: peskin-schroeder.qed-scattering
  evidence:
  - source: peskin-schroeder
    section: Chapter 1
    pages:
    - 11
    note: The source says the extra-photon diagrams are necessary because no detector
      can notice sufficiently low-energy photons.
- id: peskin-schroeder.kg-ladder-mode-expansion
  label: Klein-Gordon ladder-operator mode expansion
  summary: The real Klein-Gordon field and canonical momentum are expanded over Fourier
    modes with a_p and a_p-dagger. Canonical equal-time commutation implies [a_p,a_p'-dagger]=(2
    pi)^3 delta^(3)(p-p'), so every momentum mode is an oscillator with E_p=sqrt(p-squared+m-squared).
  kind: representation
  group: peskin-schroeder.quantized-scalar-particles
  evidence:
  - source: peskin-schroeder
    section: 2.3 The Klein-Gordon Field as Harmonic Oscillators
    pages:
    - 20
    - 21
    note: The source identifies the Fourier oscillator frequency, gives the mode expansion,
      and derives the ladder commutator.
  notation:
  - source: peskin-schroeder
    note: For a real field phi-star(p)=phi(-p); a_p and a_p-dagger are Schrödinger-picture
      operators.
- id: peskin-schroeder.klein-gordon-canonical-hamiltonian
  label: Klein-Gordon canonical Hamiltonian
  summary: For the real Klein-Gordon field, pi = phidot and H = integral d^3x [1/2
    pi^2 + 1/2 (grad phi)^2 + 1/2 m^2 phi^2]. The terms are identified as temporal-motion,
    spatial-gradient, and field-amplitude energy costs.
  kind: result
  group: peskin-schroeder.free-scalar-foundations
  notation:
  - source: peskin-schroeder
    note: This is Eq. (2.8), constructed from the Lagrangian of Eq. (2.6).
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Hamiltonian Field Theory'
    pages:
    - 17
    note: The book states the conjugate momentum and the resulting Hamiltonian for
      the real scalar field.
- id: peskin-schroeder.klein-gordon-classical-equation
  label: Classical Klein-Gordon equation
  summary: The real Klein-Gordon Lagrangian gives (partial_t^2 - grad^2 + m^2) phi
    = 0, equivalently (partial_mu partial^mu + m^2) phi = 0. In this treatment it
    is a classical field equation rather than a one-particle wave equation.
  kind: result
  group: peskin-schroeder.free-scalar-foundations
  notation:
  - source: peskin-schroeder
    note: The two displayed forms are Eq. (2.7); the sign convention is the one implicit
      in Eq. (2.6).
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Hamiltonian Field Theory'
    pages:
    - 17
    note: The text applies the usual variational procedure to Eq. (2.6) and explicitly
      distinguishes the result from a quantum-mechanical wave equation.
- id: peskin-schroeder.klein-gordon-fourier-oscillator-modes
  label: Klein-Gordon Fourier modes as harmonic oscillators
  summary: Expanding the real classical field in spatial Fourier modes gives, for
    each momentum p, [d_t^2 + |p|^2 + m^2] phi(p,t) = 0. Each mode therefore has the
    simple-harmonic-oscillator frequency omega_p = sqrt(|p|^2 + m^2).
  kind: representation
  group: peskin-schroeder.free-scalar-foundations
  notation:
  - source: peskin-schroeder
    note: The expansion is phi(x,t) = integral d^3p/(2pi)^3 exp(i p dot x) phi(p,t),
      with phi*(p) = phi(-p) for a real field.
  evidence:
  - source: peskin-schroeder
    section: 2.3 The Klein-Gordon Field as Harmonic Oscillators
    pages:
    - 20
    note: Equations (2.21) and (2.22) identify the Fourier-space equation and oscillator
      frequency.
- id: peskin-schroeder.local-field-action
  label: Local field action
  summary: For fields phi(x), the action is the spacetime integral of a local Lagrangian
    density L(phi, partial_mu phi); stationary variations are taken with fixed boundary
    field configurations.
  kind: method
  group: peskin-schroeder.free-scalar-foundations
  notation:
  - source: peskin-schroeder
    note: The book calls the Lagrangian density script L simply the Lagrangian, and
      writes S = integral d^4x L(phi, partial_mu phi).
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Lagrangian Field Theory'
    pages:
    - 15
    - 16
    note: The action is expressed through a local density depending on fields and
      their derivatives; the boundary conditions used to eliminate the surface term
      span pp. 15-16.
- id: peskin-schroeder.local-field-particle-creation
  label: Field operator creates a localized one-particle superposition
  summary: phi(x)|0> is a superposition of one-particle momentum states. In the free-field
    interpretation, phi(x) creates a particle at x, and its vacuum-to-one-particle
    matrix element is that state's position-space wavefunction.
  kind: representation
  group: peskin-schroeder.quantized-scalar-particles
  evidence:
  - source: peskin-schroeder
    section: 2.3 The Klein-Gordon Field as Harmonic Oscillators
    pages:
    - 24
    note: The source interprets phi(x)|0> as a one-particle superposition and confirms
      it with the matrix element against |p>.
- id: peskin-schroeder.loop-momentum-integration-and-divergence
  label: Loop momentum integration and ultraviolet divergence
  summary: A virtual momentum not fixed at vertices is summed by integrating over
    all values. The displayed higher-order examples contain naively infinite loop
    integrals, motivating later finite-result methods and a physical account of the
    divergences.
  kind: concept
  group: peskin-schroeder.qed-scattering
  evidence:
  - source: peskin-schroeder
    section: Chapter 1
    pages:
    - 12
    note: The source identifies undetermined virtual momentum, its required integration,
      and naive infinities in loop integrals.
- id: peskin-schroeder.lorentz-invariant-one-particle-normalization
  label: Lorentz-invariant one-particle normalization
  summary: Defining |p>=sqrt(2E_p)a_p-dagger|0> gives (p|q)=2E_p(2 pi)^3 delta^(3)(p-q),
    invariant under boosts. It provides the invariant one-particle measure d^3p/[(2
    pi)^3 2E_p], an integral over the positive-energy mass shell.
  kind: representation
  group: peskin-schroeder.quantized-scalar-particles
  evidence:
  - source: peskin-schroeder
    section: 2.3 The Klein-Gordon Field as Harmonic Oscillators
    pages:
    - 23
    - 24
    note: The source derives boost-invariant normalization and identifies the measure
      with p^2=m^2, p^0>0.
  notation:
  - source: peskin-schroeder
    note: The factor of 2 is conventional; U(Lambda) implements Lorentz transformations
      on Hilbert space.
- id: peskin-schroeder.maxwell-variational-field-equations
  label: Maxwell equations from the electromagnetic action
  summary: Problem 2.1 asks for source-free Maxwell equations by treating A_mu(x)
    as dynamical fields in the electromagnetic action and applying field Euler-Lagrange
    equations, identifying E and B from F_mu_nu.
  kind: method
  group: peskin-schroeder.field-symmetry-and-charge
  evidence:
  - source: peskin-schroeder
    section: Problem 2.1(a)
    pages:
    - 33
    note: The problem explicitly specifies the Euler-Lagrange derivation using A_mu
      and E/B identifications.
  notation:
  - source: peskin-schroeder
    note: The requested identifications are E^i=-F^{0i} and epsilon^{ijk}B^k=-F^{ij}.
- id: peskin-schroeder.microcausality-field-commutator
  label: Microcausality from the spacelike field commutator
  summary: Causal separation is tested by [phi(x),phi(y)], not by a one-particle propagation
    amplitude. For spacelike x-y, Lorentz invariance makes the two Wightman terms
    equal and they cancel, so no Klein-Gordon measurement can affect another outside
    the light cone.
  kind: result
  group: peskin-schroeder.scalar-spacetime-propagation
  evidence:
  - source: peskin-schroeder
    section: '2.4 The Klein-Gordon Field in Space-Time: Causality'
    pages:
    - 28
    - 29
    note: The source sets the measurement criterion, performs the spacelike Lorentz
      argument, and states the no-influence conclusion.
- id: peskin-schroeder.noether-current-and-charge
  label: Noether current and conserved charge
  summary: For an infinitesimal continuous field transformation whose Lagrangian changes
    at most by a four-divergence, the on-shell Noether current obeys partial_mu j^mu=0.
    Its spatial integral Q=integral j^0 d^3x is time independent; the local equation
    is the direct field-theory result.
  kind: result
  group: peskin-schroeder.field-symmetry-and-charge
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Noether''s Theorem'
    pages:
    - 17
    - 18
    note: The source gives the allowed-divergence condition, derives conservation,
      and distinguishes local conservation from the integrated charge.
  notation:
  - source: peskin-schroeder
    note: For multiple fields, sum the canonical term over fields; J^mu records the
      Lagrangian surface term.
- id: peskin-schroeder.photon-mediated-second-order-amplitude
  label: Photon-mediated second-order amplitude
  summary: Because electromagnetism couples electrons and muons through the photon
    field rather than directly, the first-order e+e- to mu+mu- transition vanishes.
    The leading contribution has two vertices and a sum over photon vector intermediate
    states; it is Lorentz scalar when its halves are 4-vectors.
  kind: result
  group: peskin-schroeder.qed-scattering
  evidence:
  - source: peskin-schroeder
    section: Chapter 1
    pages:
    - 6
    note: Equation (1.3) and its explanation identify the vertices, photon projector,
      component sum, and scalar condition.
- id: peskin-schroeder.qed-diagrammatic-calculation
  label: Feynman diagrams as a calculational prescription
  summary: 'For a QED process, a Feynman diagram encodes a perturbative contribution
    to its quantum-mechanical amplitude: assign the prescribed algebraic factor to
    external lines, internal lines, and vertices, then multiply the factors.'
  kind: method
  group: peskin-schroeder.qed-scattering
  evidence:
  - source: peskin-schroeder
    section: Chapter 1
    pages:
    - 3
    - 5
    note: The chapter presents diagrams as a calculation method and says their element
      factors multiply to give a perturbative term.
  notation:
  - source: peskin-schroeder
    note: The book denotes the dimensionless process amplitude by M; arrows on fermion
      lines show negative-charge flow rather than momentum.
- id: peskin-schroeder.qed-tree-amplitude-rule
  label: QED tree amplitude from propagator, vertices, and spinors
  summary: For one-photon annihilation, the QED rules attach -i g_mu_nu/q-squared
    to the internal photon, -i e gamma-mu to each vertex, and Dirac spinors to external
    fermion lines. Contracting the factors gives the tree amplitude, with q fixed
    by momentum conservation.
  kind: method
  group: peskin-schroeder.qed-scattering
  evidence:
  - source: peskin-schroeder
    section: Chapter 1
    pages:
    - 8
    - 9
    - 10
    note: These pages identify each diagrammatic factor and write the amplitude directly
      from the diagram.
  notation:
  - source: peskin-schroeder
    note: gamma^mu are four constant 4-by-4 matrices; u,v are column and u-bar,v-bar
      row spinors.
- id: peskin-schroeder.real-klein-gordon-lagrangian
  label: Real Klein-Gordon Lagrangian
  summary: The real scalar field is governed classically by L = 1/2 phidot^2 - 1/2
    (grad phi)^2 - 1/2 m^2 phi^2, equivalently 1/2 (partial_mu phi)^2 - 1/2 m^2 phi^2
    in the book's notation.
  kind: representation
  group: peskin-schroeder.free-scalar-foundations
  notation:
  - source: peskin-schroeder
    note: The field phi is real-valued here; m is initially a parameter and is later
      interpreted as mass.
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Hamiltonian Field Theory'
    pages:
    - 16
    note: Equation (2.6) defines the single-field classical Lagrangian used in the
      subsequent Klein-Gordon discussion.
- id: peskin-schroeder.relativistic-field-viewpoint
  label: Relativistic field viewpoint
  summary: A relativistic quantum description must accommodate variable particle number
    and preserve causal observables; the text motivates a multiparticle field theory
    through pair creation, virtual multiparticle states, and the spacelike propagation
    problem of a one-particle amplitude.
  kind: concept
  group: peskin-schroeder.free-scalar-foundations
  evidence:
  - source: peskin-schroeder
    section: 2.1 The Necessity of the Field Viewpoint
    pages:
    - 13
    - 14
    note: The discussion gives variable particle number and a nonzero spacelike single-particle
      propagation amplitude as motivations for a multiparticle field theory.
- id: peskin-schroeder.retarded-klein-gordon-green-function
  label: Retarded Klein-Gordon Green's function
  summary: D_R(x-y)=theta(x^0-y^0)<0|[phi(x),phi(y)]|0> vanishes when x^0<y^0 and
    obeys (partial-squared+m-squared)D_R=-i delta^(4)(x-y). Its momentum-space contour
    is the retarded prescription.
  kind: result
  group: peskin-schroeder.scalar-spacetime-propagation
  evidence:
  - source: peskin-schroeder
    section: '2.4 The Klein-Gordon Field in Space-Time: The Klein-Gordon Propagator'
    pages:
    - 30
    note: Equations (2.55)-(2.58) define D_R, prove its Green-function equation, and
      state its retarded support.
- id: peskin-schroeder.scalar-bose-einstein-statistics
  label: Bose-Einstein statistics of Klein-Gordon quanta
  summary: Commuting scalar creation operators make a two-particle state unchanged
    under exchange, and a single momentum mode admits arbitrarily many quanta. Klein-Gordon
    particles therefore obey Bose-Einstein statistics.
  kind: result
  group: peskin-schroeder.quantized-scalar-particles
  evidence:
  - source: peskin-schroeder
