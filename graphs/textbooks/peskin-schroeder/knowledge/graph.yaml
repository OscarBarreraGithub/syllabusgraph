      measure energy differences, then defines the vacuum and particles.
- id: peskin-schroeder.scalar-wick-theorem
  label: Scalar Wick theorem and contractions
  summary: For free scalar fields, time ordering equals normal ordering plus every
    possible pairing contraction; a contraction is the Feynman propagator. In a vacuum
    expectation value only fully contracted terms survive, reducing a many-field expression
    to sums of propagator products.
  kind: method
  evidence:
  - source: peskin-schroeder
    section: '4.3'
    pages:
    - 88
    - 89
- id: peskin-schroeder.schwinger-one-loop-electron-anomalous-moment
  label: Schwinger one-loop anomalous magnetic moment
  summary: Integrating the finite Pauli form factor at q-squared zero gives a_e=(g-2)/2=alpha/(2
    pi) at order alpha. Its finite value supports comparison with precision measurements,
    while higher-order predictions require a systematic treatment of ultraviolet divergences.
  kind: result
  group: peskin-schroeder.ch6-radiative-corrections
