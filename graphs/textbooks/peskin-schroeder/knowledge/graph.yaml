- id: peskin-schroeder.translation-stress-energy-tensor
  label: Translation symmetry and stress-energy tensor
  summary: Noether’s theorem applied to spacetime translations gives four separately
    conserved currents T^{mu nu}, one for each translation direction nu. Their charges
    are the Hamiltonian for time translation and the three components of physical
    field momentum for spatial translations, distinct from canonical momentum density.
  kind: result
  group: peskin-schroeder.field-symmetry-and-charge
