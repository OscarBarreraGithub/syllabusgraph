- id: peskin-schroeder.sudden-kick-worldline-current
  label: Conserved current for a suddenly deflected charge
  summary: Represent a point charge on an arbitrary worldline by a delta-function
    current integrated along the worldline. It is reparametrization independent and
    conserved; for a sudden momentum change, use the incoming and outgoing straight
