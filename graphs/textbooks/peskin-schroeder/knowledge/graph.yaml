    note: ψ_L has γ^5 eigenvalue −1 and ψ_R eigenvalue +1 in the source's chiral basis;
      the bar on σ̄ is unrelated to ψ̄.
- id: peskin-schroeder.wick-rotation-for-convergent-loop-integrals
  label: Wick rotation and Euclidean loop integration
  summary: When poles and large-momentum falloff permit it, rotate the loop-energy
    contour to Euclidean momentum and evaluate a rotationally symmetric four-dimensional
    integral in spherical coordinates. The displayed power-counting condition shows
    why the needed quadratic-numerator integral is divergent at its marginal case
    and cannot simply be Wick-rotated there.
  kind: method
  group: peskin-schroeder.ch6-radiative-corrections
  evidence:
