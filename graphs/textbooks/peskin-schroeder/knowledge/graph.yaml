- id: peskin-schroeder.soft-photon-emission-factorization
  label: Soft-photon emission factorization
  summary: When the emitted photon momentum is small compared with the hard momentum
    transfer, neglect it in the hard elastic amplitude and propagator numerators.
    The one-photon amplitude then factors into the elastic amplitude times the eikonal
    difference p-prime dot epsilon divided by p-prime dot k minus p dot epsilon divided
    by p dot k; its phase-space factor reproduces the classical soft spectrum.
  kind: method
  group: peskin-schroeder.ch6-radiative-corrections
  evidence:
  - source: peskin-schroeder
    section: 6.1 Soft Bremsstrahlung
    pages:
    - 182
    - 183
- id: peskin-schroeder.soft-photon-poisson-multiplicity
  label: Poisson multiplicity of emitted soft photons
  summary: Within the section's leading-log soft approximation, an energy bin between
    two soft scales has a Poisson distribution for the number of accompanying photons.
    Its mean reproduces the earlier semiclassical soft-radiation estimate when photons
    above the upper scale are assigned to the hard process.
  kind: result
  group: peskin-schroeder.ch6-radiative-corrections
