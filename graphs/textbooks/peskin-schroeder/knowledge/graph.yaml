    section: '4.7'
    pages:
    - 117
    - 118
- id: peskin-schroeder.yukawa-potential-from-nonrelativistic-exchange
  label: Attractive Yukawa potential from scalar exchange
  summary: For distinguishable fermions at low momentum, compare the one-scalar-exchange
    amplitude with the nonrelativistic Born formula and Fourier transform it to obtain
    V(r)=-g^2 exp(-m_phi r)/(4 pi r). The source concludes the same attractive strength
    for fermion-fermion, fermion-antifermion, and antifermion-antifermion cases.
  kind: result
  evidence:
  - source: peskin-schroeder
    section: '4.7'
    pages:
    - 121
    - 122
    - 123
- id: peskin-schroeder.yukawa-scalar-field-strength-renormalization
  label: Yukawa scalar self-energy needs mass and field-strength counterterms
  summary: A fermion loop in Yukawa theory produces a scalar two-point function with
    both constant and p-squared divergent pieces. Enforcing the on-shell conditions
    therefore needs nonzero delta-m and delta-Z; this contrasts with the one-loop
    phi-four special case.
  kind: result
  group: peskin-schroeder.ch10-systematics-renormalization
  evidence:
