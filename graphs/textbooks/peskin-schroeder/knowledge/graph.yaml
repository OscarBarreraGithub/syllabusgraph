- id: peskin-schroeder.wilson-rescaling-transformation
  label: Wilson rescaling transformation
  summary: After integrating a shell, rescale k'=k/b, x'=bx and rescale the field
    to restore the free action. This maps the effective Lagrangian back to cutoff
    Lambda with transformed mass, quartic, derivative, and higher-operator coefficients.
  kind: method
  group: peskin-schroeder.ch12-wilson-rg
  evidence:
