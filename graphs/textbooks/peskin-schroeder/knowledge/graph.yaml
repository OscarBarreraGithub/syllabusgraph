- id: peskin-schroeder.field-symmetry-and-charge
  title: Field symmetries, currents, and stress-energy
  question: How do continuous field and spacetime symmetries produce currents, charges,
    and energy-momentum tensors?
- id: peskin-schroeder.free-scalar-foundations
  title: Free real scalar-field foundations
  question: How does the real Klein-Gordon field acquire its classical dynamics, canonical
    variables, and oscillator-mode description?
- id: peskin-schroeder.qed-scattering
  title: QED scattering and diagrammatics
  question: How does introductory e+e- to mu+mu- connect amplitudes, spin selection,
    diagrams, and cross sections?
- id: peskin-schroeder.quantized-scalar-particles
  title: Quantized scalar modes and particles
  question: How do canonical scalar-field modes become particles with relativistic
    normalization and statistics?
- id: peskin-schroeder.scalar-spacetime-propagation
  title: Scalar fields in spacetime, causality, and propagation
  question: How do Heisenberg fields, commutators, propagators, and sources describe
    causal scalar dynamics?
