      calculation and mass restoration.
- id: peskin-schroeder.vacuum-bubble-exponentiation-and-cancellation
  label: Vacuum-bubble exponentiation and cancellation
  summary: Diagrams disconnected from every external point factor into the exponential
    of the sum of connected vacuum pieces. The same exponential occurs in the normalized
    denominator, so vacuum bubbles cancel from correlation functions while encoding
    a vacuum-energy shift.
  kind: result
  evidence:
