- id: peskin-schroeder.wilson-fisher-fixed-point-from-shell-flow
  label: Wilson-Fisher fixed point from shell flow
  summary: For d<4, canonical rescaling makes phi-four grow at long distance while
    its negative nonlinear correction eventually balances that growth. The resulting
    nonzero fixed point is perturbatively accessible near d=4 and controls a nontrivial
    large-distance theory.
  kind: result
  group: peskin-schroeder.ch12-wilson-rg
  evidence:
