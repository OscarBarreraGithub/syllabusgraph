- id: peskin-schroeder.soft-real-photon-exponentiation
  label: Soft real-photon exponentiation and detector threshold
  summary: Within the section's leading-log soft approximation, each real soft photon
    contributes the eikonal polarization-summed phase-space factor, and identical
    final photons supply one over n factorial. Summing any number of photons below
    the detector threshold exponentiates the real contribution.
  kind: result
  group: peskin-schroeder.ch6-radiative-corrections
  evidence:
