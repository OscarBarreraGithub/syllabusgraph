    section: '10.2'
    pages:
    - 329
    - 330
- id: peskin-schroeder.zeroth-order-natural-relations
  label: Zeroth-order natural relations as finite predictions
  summary: A classical relation that holds for all choices of the symmetric Lagrangian
    parameters receives no counterterm correction after those parameters are renormalized.
    Its loop correction is therefore ultraviolet finite; the linear sigma-model sigma-mass
    relation is the example.
  kind: result
  group: peskin-schroeder.ch11-renormalization-symmetry
  evidence:
  - source: peskin-schroeder
    section: '11.6'
    pages:
