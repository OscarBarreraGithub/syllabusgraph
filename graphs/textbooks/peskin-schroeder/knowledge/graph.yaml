- id: peskin-schroeder.s-t-u-channel-classification
  label: s-, t-, and u-channel propagator classification
  summary: For a two-to-two diagram with one virtual particle, identify its channel
    by whether its propagator denominator is s-minus-m-squared, t-minus-m-squared,
    or u-minus-m-squared. A process may have several channels whose amplitudes must
