- id: peskin-schroeder.spin-statistics-theorem-stated-assumptions
  label: Stated spin-statistics theorem assumptions
  summary: The source states, without proving the general theorem here, that Lorentz
    invariance, positive energies, positive norms, and causality together require
    Bose–Einstein statistics for integer spin and Fermi–Dirac statistics for half-odd-integer
    spin. This is broader than the chapter's explicit free-Dirac argument.
