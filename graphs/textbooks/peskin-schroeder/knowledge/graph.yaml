- id: peskin-schroeder.scalar-fock-spectrum
  label: Scalar Fock spectrum and positive-energy quanta
  summary: Dropping the infinite state-independent zero-point term, the state annihilated
    by every a_p is the vacuum and creation operators generate the free-field spectrum.
    A created excitation has momentum p and positive E_p; multi-operator states carry
    sums of momenta and energies.
  kind: result
  group: peskin-schroeder.quantized-scalar-particles
  evidence:
  - source: peskin-schroeder
    section: 2.3 The Klein-Gordon Field as Harmonic Oscillators
    pages:
    - 21
    - 22
    note: The source identifies the zero-point term, permits dropping it because experiments
      measure energy differences, then defines the vacuum and particles.
- id: peskin-schroeder.spacelike-wightman-amplitude
  label: Nonzero spacelike free-field propagation amplitude
  summary: D(x-y)=<0|phi(x)phi(y)|0> is Lorentz invariant and, for spacelike separation,
    exponentially suppressed at large distance but nonzero. Its nonvanishing alone
    is not the criterion for causal influence. Problem 2.3 separately asks for its
    exact spacelike evaluation in terms of Bessel functions, beyond the preceding
    asymptotic contour result.
  kind: result
  group: peskin-schroeder.scalar-spacetime-propagation
  evidence:
  - source: peskin-schroeder
    section: 2.4 The Klein-Gordon Field in Space-Time
    pages:
    - 27
    - 28
    note: The source evaluates D over temporal and spatial intervals and states that
      the spacelike amplitude is exponentially vanishing but nonzero.
  - source: peskin-schroeder
    section: Problem 2.3
    pages:
    - 34
    note: The problem asks the reader for an exact Bessel-function evaluation at spacelike
      separation; it does not present that derivation on this page.
- id: peskin-schroeder.translation-stress-energy-tensor
  label: Translation symmetry and stress-energy tensor
  summary: Noether’s theorem applied to spacetime translations gives four separately
    conserved currents T^{mu nu}, one for each translation direction nu. Their charges
    are the Hamiltonian for time translation and the three components of physical
    field momentum for spatial translations, distinct from canonical momentum density.
  kind: result
  group: peskin-schroeder.field-symmetry-and-charge
  evidence:
  - source: peskin-schroeder
    section: '2.2 Elements of Classical Field Theory: Noether''s Theorem'
    pages:
    - 18
    - 19
    note: The translation transformation is set up on p. 18; p. 19 identifies the
      resulting four currents as the stress-energy tensor and identifies the energy
      and momentum charges.
- id: peskin-schroeder.tree-level-muon-pair-cross-section
  label: Leading muon-pair angular distribution and energy scaling
  summary: After initial-spin averaging and final-spin summation, the leading e+e-
    to mu+mu- distribution is proportional to alpha-squared times (1+cos-squared theta)/E_cm-squared;
    the total cross section falls as 1/E_cm-squared. This is a high-energy CM result
    with higher-order corrections.
  kind: result
  group: peskin-schroeder.qed-scattering
  evidence:
  - source: peskin-schroeder
    section: Chapter 1
    pages:
    - 8
    note: Equations (1.8) and (1.9) follow the spin average and sum and are described
      as angularly dependent with sharp energy decrease.
  notation:
  - source: peskin-schroeder
    note: alpha=e^2/(4 pi) in the book's units.
- id: peskin-schroeder.unpolarized-trace-technology
  label: Trace technology for unpolarized cross sections
  summary: Products of gamma matrices and spinors in an unpolarized cross section
    can be reduced with trace identities, avoiding explicit gamma-matrix and spinor
    representations. The source says this method also readily restores the final-state
    mass omitted in the high-energy example.
  kind: method
  group: peskin-schroeder.qed-scattering
  evidence:
  - source: peskin-schroeder
    section: Chapter 1
    pages:
    - 10
    note: The chapter names Feynman trace technology and describes both its trace
      calculation and mass restoration.
