    note: alpha=e^2/(4 pi) in the book's units.
- id: peskin-schroeder.unpolarized-trace-technology
  label: Trace technology for unpolarized cross sections
  summary: Products of gamma matrices and spinors in an unpolarized cross section
    can be reduced with trace identities, avoiding explicit gamma-matrix and spinor
    representations. The source says this method also readily restores the final-state
    mass omitted in the high-energy example.
  kind: method
  group: peskin-schroeder.qed-scattering
