    section: '12.1'
    pages:
    - 400
- id: peskin-schroeder.yang-mills-feynman-rules-and-universal-coupling
  label: Yang-Mills Feynman rules and universal coupling
  summary: Expanding the gauge-fixed Yang-Mills Lagrangian gives the fermion-gauge
    vertex, three-gauge-boson vertex, and four-gauge-boson vertex. All contain the
    same g because their terms arose from one locally invariant Lagrangian; this equality
    is required for the Ward-identity cancellations discussed later.
  kind: result
  group: peskin-schroeder.ch16-quantization
  evidence:
  - source: peskin-schroeder
    section: 16.1 Interactions of Non-Abelian Gauge Bosons
    pages:
