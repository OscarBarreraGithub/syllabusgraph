- id: peskin-schroeder.soft-virtual-photon-exponentiation
  label: Soft virtual-photon exponentiation
  summary: After summing attachments to both external electron lines, pair momenta
    into virtual photons, include the factor one-half for exchanging a paired photon
    and one over m factorial for identical virtual photons, and sum over m. The leading
    soft virtual correction multiplies the hard amplitude by exp(X), where X is the
    infrared one-loop form-factor limit. The text flags that external-leg and subtraction
    subtleties need the full Yennie-Frautschi-Suura proof.
  kind: result
  group: peskin-schroeder.ch6-radiative-corrections
  evidence:
