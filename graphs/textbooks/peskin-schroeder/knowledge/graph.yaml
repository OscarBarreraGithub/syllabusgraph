  summary: In the chiral representation ψ=(ψ_L,ψ_R)^T decomposes into inequivalent
    two-component Lorentz representations. The mass term couples them; only for m=0
    do the Weyl equations decouple, with σ^μ=(1,σ) and σ̄^μ=(1,−σ) giving the compact
