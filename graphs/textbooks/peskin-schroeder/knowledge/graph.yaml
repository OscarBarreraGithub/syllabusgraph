  label: Weyl-spinor Fierz rearrangement
  summary: The two-component σ-matrix identity produces a nontrivial rearrangement
    of products of same-chirality vector bilinears, antisymmetric under interchange
    of the indicated external spinors. Further σ identities reduce longer Weyl-bilinear
    products; this is an algebraic identity, not a dynamical interaction.
