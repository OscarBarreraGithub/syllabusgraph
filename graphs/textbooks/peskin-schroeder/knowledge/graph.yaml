- id: peskin-schroeder.qcd-neutrino-dis-flavor-and-helicity-analysis
  label: Neutrino DIS separates flavors through chiral charged currents
  summary: In the |q^2| much less than m_W^2 charged-current limit, W exchange couples
    only to left-handed relativistic fermions. Neutrino-quark scattering therefore
    carries the s_hat^2 helicity contribution, while antineutrino-quark scattering
    carries u_hat^2. Neglecting s and c, d^2sigma(nu p->mu- X)/(dx dy)=(G_F^2 s/pi)[x
    f_d(x)+x f_ubar(x)(1-y)^2], whereas d^2sigma(nubar p->mu+ X)/(dx dy)=(G_F^2 s/pi)[x
    f_u(x)(1-y)^2+x f_dbar(x)]. These distinct y weights separate quark and antiquark
    PDFs; for a valence-dominated nucleon the neutrino rate is roughly constant in
    y and the antineutrino rate falls as (1-y)^2.
