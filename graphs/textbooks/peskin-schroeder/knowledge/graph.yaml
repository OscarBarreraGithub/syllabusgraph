- id: peskin-schroeder.scalar-bose-einstein-statistics
  label: Bose-Einstein statistics of Klein-Gordon quanta
  summary: Commuting scalar creation operators make a two-particle state unchanged
    under exchange, and a single momentum mode admits arbitrarily many quanta. Klein-Gordon
    particles therefore obey Bose-Einstein statistics.
  kind: result
  group: peskin-schroeder.quantized-scalar-particles
  evidence:
