- id: peskin-schroeder.time-reversal-antiunitary-dirac-symmetry
  label: Antiunitary time reversal for Dirac fermions
  summary: 'A linear unitary time reversal conflicts with the frequency content required
    by [T,H]=0, so T must be antilinear/antiunitary: it complex conjugates c-numbers
    and reverses exponential time evolution. With momentum and spin flipped, it gives
    a field transformation proportional to γ^1γ^3ψ(−t,x) and the stated bilinear transformation
