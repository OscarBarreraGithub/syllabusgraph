- id: peskin-schroeder.single-soft-photon-infrared-divergence
  label: Single-soft-photon infrared divergence
  summary: The factorized one-soft-photon expression gives a logarithmically divergent
    integral at zero photon energy. Giving the photon a provisional mass mu exposes
    the unphysical infrared logarithm; the high-momentum-transfer dependence contains
    the physical Sudakov double logarithm. The one-photon expression must therefore
    be reinterpreted beyond a literal exclusive probability.
  kind: result
  group: peskin-schroeder.ch6-radiative-corrections
  evidence:
