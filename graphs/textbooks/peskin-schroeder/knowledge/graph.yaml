- id: peskin-schroeder.qcd-scaling-violation-phenomenology
  label: Scaling-violation phenomenology from PDF evolution
  summary: With experimentally fitted low-scale proton PDFs, AP evolution predicts
    that increasing Q^2 depletes high x through radiation and enhances small x by
    creating new partons. The gluon PDF is not directly measured in electron DIS but
    enters quark evolution and is absolutely normalized by the momentum sum rule,
    leaving predictive Q^2 dependence. This is the p.591–592 scaling-violation result,
    distinct from extracting alpha_s from independent experiments.
