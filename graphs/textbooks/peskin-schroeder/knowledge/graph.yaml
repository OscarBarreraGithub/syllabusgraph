- id: peskin-schroeder.qcd-three-jet-energy-flow
  label: Hard-gluon emission as three-jet energy flow
  summary: For e+e−→qqg, define x_1,x_2,x_3 as the quark, antiquark, and gluon energies
    divided by beam energy, with 0<x_i<1 and sum x_i=2. The leading differential rate
    has collinear singularities as x_1 or x_2 tends to 1; below the soft scale these
    configurations hadronize into two back-to-back jets and the partonic formula is
    unusable. A gluon with transverse momentum well above about 1 GeV cannot be undone
    by soft exchange and produces a distinct third hadron jet; choose its transverse
    momentum as the running-coupling scale, subject to that hard-scale qualification.
