- id: peskin-schroeder.qcd-altarelli-parisi-evolution
  label: Altarelli–Parisi evolution framework
  summary: Initial-state collinear singularities in massless QCD do not cancel from
    hard parton subprocesses; absorb them into PDFs, whose Q dependence then violates
    exact Bjorken scaling logarithmically. At leading logarithmic accuracy, d f_i(x,Q)/d
    log Q is alpha_s(Q^2)/(pi) times a sum of convolutions integral_x^1 dz/z P_{i←j}(z)
    f_j(x/z,Q), for each massless quark, antiquark, and gluon. The q→qg and g→q qbar
    kernels are the QED kernels multiplied by C_F=4/3 and 1/2. This framework respects
    quark-number and momentum sum rules; the transverse-gluon reduction used to transfer
    the QED derivation is stated to be true for the non-Abelian case but its proof
    is outside this chapter.
