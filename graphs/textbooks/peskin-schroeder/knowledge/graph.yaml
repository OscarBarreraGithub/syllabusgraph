    note: The chapter names Feynman trace technology and describes both its trace
      calculation and mass restoration.
- id: peskin-schroeder.weyl-fierz-rearrangement
  label: Weyl-spinor Fierz rearrangement
  summary: The two-component σ-matrix identity produces a nontrivial rearrangement
    of products of same-chirality vector bilinears, antisymmetric under interchange
    of the indicated external spinors. Further σ identities reduce longer Weyl-bilinear
    products; this is an algebraic identity, not a dynamical interaction.
  kind: method
  group: peskin-schroeder.dirac-bilinears-and-currents
  evidence:
  - source: peskin-schroeder
    section: '3.4'
    pages:
    - 51
    - 52
    note: Equations (3.77)–(3.82) derive and apply the Weyl Fierz identity.
- id: peskin-schroeder.weyl-spinors-and-chiral-mass-mixing
  label: Weyl spinors, chirality, and mass mixing
  summary: In the chiral representation ψ=(ψ_L,ψ_R)^T decomposes into inequivalent
    two-component Lorentz representations. The mass term couples them; only for m=0
    do the Weyl equations decouple, with σ^μ=(1,σ) and σ̄^μ=(1,−σ) giving the compact
    notation.
  kind: representation
  group: peskin-schroeder.dirac-lorentz-and-spinors
  evidence:
