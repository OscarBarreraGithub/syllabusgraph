  - peskin-schroeder.fermionic-anticommutator-causality
  - peskin-schroeder.fermionic-ladder-operators-and-statistics
  summary: The deliberately failed commutator construction is microcausal, but only
    because positive- and negative-energy propagation in the same direction cancels
    outside the light cone, while its Hamiltonian is unbounded below. Requiring positive
    energy and positive norm makes a spacelike commutator cancellation impossible;
    equal weights instead give spacelike anticommutation and positive-energy fermions.
  evidence:
  - source: peskin-schroeder
    section: 3.5, How Not to Quantize the Dirac Field
    pages:
    - 54
    - 55
    - 56
    - 57
    note: The source first finds the commutator vanishes outside the light cone, then
      imposes positive-energy/norm conditions and derives anticommutation.
