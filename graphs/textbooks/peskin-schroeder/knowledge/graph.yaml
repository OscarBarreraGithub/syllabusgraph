    - 207
- id: peskin-schroeder.spacelike-wightman-amplitude
  label: Nonzero spacelike free-field propagation amplitude
  summary: D(x-y)=<0|phi(x)phi(y)|0> is Lorentz invariant and, for spacelike separation,
    exponentially suppressed at large distance but nonzero. Its nonvanishing alone
    is not the criterion for causal influence. Problem 2.3 separately asks for its
    exact spacelike evaluation in terms of Bessel functions, beyond the preceding
    asymptotic contour result.
  kind: result
  group: peskin-schroeder.scalar-spacetime-propagation
  evidence:
