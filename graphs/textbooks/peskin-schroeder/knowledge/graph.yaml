- id: peskin-schroeder.qcd-strong-coupling-color-confinement
  label: Strong-coupling confinement and the color flux tube
  summary: 'Wilson''s strong-coupling lattice approximation gives confinement: finite-energy
    asymptotic states are color singlets. Separating the colored parts of a meson
    produces a fixed-radius flux tube with fixed energy density, so its energy cost
    grows in proportion to separation. This explains why a theory that is weak at
    short distance can keep isolated quarks unobserved at long distance; it is a stated
    strong-coupling result, not a perturbative derivation in this chapter.'
