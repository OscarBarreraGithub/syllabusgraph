      occupation to Bose-Einstein statistics.
- id: peskin-schroeder.scalar-fock-spectrum
  label: Scalar Fock spectrum and positive-energy quanta
  summary: Dropping the infinite state-independent zero-point term, the state annihilated
    by every a_p is the vacuum and creation operators generate the free-field spectrum.
    A created excitation has momentum p and positive E_p; multi-operator states carry
    sums of momenta and energies.
  kind: result
  group: peskin-schroeder.quantized-scalar-particles
  evidence:
