    - 98
- id: peskin-schroeder.vacuum-correlators-from-scalar-path-integral
  label: Vacuum correlators from the scalar path integral
  summary: Split a field history at operator insertions and take complex large-time
    limits to project the interacting vacuum; dividing by the zero-insertion integral
    cancels the overlap and phase factors in time-ordered correlators.
  kind: method
  group: peskin-schroeder.scalar-functional-methods
  evidence:
  - source: peskin-schroeder
    section: 9.2 Functional Quantization of Scalar Fields
    pages:
    - 284
- id: peskin-schroeder.ward-identity-external-photon-polarization-sum
  label: Ward identity and external-photon polarization sum
  summary: Conditionally assuming that current conservation continues to hold in the
    quantum theory, the text argues that a QED amplitude vanishes when an external
    photon polarization vector is replaced by its momentum. This provisional Ward-identity
    argument permits replacing the physical transverse-polarization sum by minus the
    metric inside a complete amplitude, so timelike and longitudinal contributions
    cancel; a formal proof and omitted subtleties are deferred to Section 7.4.
  kind: method
  group: peskin-schroeder.ch5-crossing-and-compton
  evidence:
  - source: peskin-schroeder
    section: 5.5 Photon Polarization Sums
    pages:
