    section: 2.1 The Necessity of the Field Viewpoint
    pages:
    - 13
    - 14
    note: The discussion gives variable particle number and a nonzero spacelike single-particle
      propagation amplitude as motivations for a multiparticle field theory.
- id: peskin-schroeder.retarded-klein-gordon-green-function
  label: Retarded Klein-Gordon Green's function
  summary: D_R(x-y)=theta(x^0-y^0)<0|[phi(x),phi(y)]|0> vanishes when x^0<y^0 and
    obeys (partial-squared+m-squared)D_R=-i delta^(4)(x-y). Its momentum-space contour
    is the retarded prescription.
  kind: result
  group: peskin-schroeder.scalar-spacetime-propagation
  evidence:
  - source: peskin-schroeder
    section: '2.4 The Klein-Gordon Field in Space-Time: The Klein-Gordon Propagator'
    pages:
    - 30
    note: Equations (2.55)-(2.58) define D_R, prove its Green-function equation, and
      state its retarded support.
- id: peskin-schroeder.scalar-bose-einstein-statistics
  label: Bose-Einstein statistics of Klein-Gordon quanta
  summary: Commuting scalar creation operators make a two-particle state unchanged
    under exchange, and a single momentum mode admits arbitrarily many quanta. Klein-Gordon
    particles therefore obey Bose-Einstein statistics.
  kind: result
  group: peskin-schroeder.quantized-scalar-particles
  evidence:
  - source: peskin-schroeder
    section: 2.3 The Klein-Gordon Field as Harmonic Oscillators
    pages:
    - 22
    note: The source directly connects commuting creation operators and unlimited
      occupation to Bose-Einstein statistics.
- id: peskin-schroeder.scalar-fock-spectrum
  label: Scalar Fock spectrum and positive-energy quanta
  summary: Dropping the infinite state-independent zero-point term, the state annihilated
    by every a_p is the vacuum and creation operators generate the free-field spectrum.
    A created excitation has momentum p and positive E_p; multi-operator states carry
    sums of momenta and energies.
  kind: result
  group: peskin-schroeder.quantized-scalar-particles
  evidence:
  - source: peskin-schroeder
    section: 2.3 The Klein-Gordon Field as Harmonic Oscillators
    pages:
    - 21
    - 22
    note: The source identifies the zero-point term, permits dropping it because experiments
      measure energy differences, then defines the vacuum and particles.
- id: peskin-schroeder.spacelike-wightman-amplitude
  label: Nonzero spacelike free-field propagation amplitude
  summary: D(x-y)=<0|phi(x)phi(y)|0> is Lorentz invariant and, for spacelike separation,
    exponentially suppressed at large distance but nonzero. Its nonvanishing alone
    is not the criterion for causal influence. Problem 2.3 separately asks for its
    exact spacelike evaluation in terms of Bessel functions, beyond the preceding
    asymptotic contour result.
  kind: result
  group: peskin-schroeder.scalar-spacetime-propagation
  evidence:
