- id: peskin-schroeder.threshold-muon-pair-spin-triplet-swave
  label: Threshold muon pairs as a spin-triplet S wave
  summary: Near muon-pair threshold, the electron current creates an angle-independent
    muon pair. The pair is therefore an S wave, and angular-momentum conservation
