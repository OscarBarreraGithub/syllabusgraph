    hat_t)]; and d sigma/dhat_t(qq->qq)=4 pi alpha_s^2/(9 hat_s^2)[(hat_u^2+hat_s^2)/hat_t^2+(hat_t^2+hat_s^2)/hat_u^2-2hat_s^2/(3hat_u
    hat_t)]. The channels involving gluons are d sigma/dhat_t(q qbar->gg)=32 pi alpha_s^2/(27
    hat_s^2)[hat_u/hat_t+hat_t/hat_u-(9/4)(hat_t^2+hat_u^2)/hat_s^2], d sigma/dhat_t(gg->q
