      replacement, and defers a formal proof and subtleties.
- id: peskin-schroeder.ward-identity-z1-z2-and-universal-charge
  label: Ward identity, Z1 equals Z2, and universal charge
  summary: With a gauge-invariant regulator, the Ward identity equates the vertex
    and electron field-strength renormalizations, Z1=Z2, recursively to all perturbative
    orders. Consequently e=square-root(Z3) e0, so species-specific vertex and fermion
    factors cancel and charged species share one electric charge.
  kind: result
  group: peskin-schroeder.ch10-systematics-renormalization
  evidence:
  - source: peskin-schroeder
    section: 10.3–10.4
    pages:
    - 334
    - 335
- id: peskin-schroeder.ward-takahashi-correlation-identity
  label: Ward-Takahashi identity for QED correlation functions
  summary: Sum the insertion of an external photon over every allowed place in each
    QED diagram. Adjacent insertions on a through-going fermion line telescope to
    endpoint terms, and insertions around a closed loop cancel after an allowed loop-momentum
    shift, giving the off-shell correlation-function identity; its endpoint terms
    do not contain the full LSZ pole product.
  kind: method
  group: peskin-schroeder.ch7-unitarity-ward
  evidence:
  - source: peskin-schroeder
    section: '7.4'
    pages:
