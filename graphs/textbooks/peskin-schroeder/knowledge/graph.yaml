  label: QCD color representations and color-singlet hadrons
  summary: QCD is a local SU(3) gauge theory whose quarks of every flavor transform
    in the fundamental 3 and whose gauge quanta are gluons. A q-qbar contraction and
    epsilon_ijk q_i q_j q_k (and its conjugate) are invariant; imposing color-singlet
