- id: peskin-schroeder.qcd-dis-xy-scaling-and-callan-gross
  label: DIS x-y kinematics, Bjorken scaling, and Callan–Gross behavior
  summary: For massless elastic scattering from p=xi P, xi=x=Q^2/(2P·q). With y=P·q/(P·k),
    Q^2=x y s and 0<x,y<1. Removing the virtual-photon 1/Q^4 factor from the leading
    DIS cross section leaves a factorized x dependence through sum_f Q_f^2 x f_f(x)
    and y dependence [1+(1-y)^2]. Q-independent PDFs give Bjorken scaling; that y
    form is the Callan–Gross relation and is specific to massless spin-one-half partons,
    while hard corrections are O(alpha_s(Q^2)).
