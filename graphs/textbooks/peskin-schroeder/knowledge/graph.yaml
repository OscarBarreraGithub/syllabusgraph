- id: peskin-schroeder.qcd-quark-flavors-charges-and-color-motivation
  label: Quark flavors, charge assignments, flavor symmetry, and the color puzzle
  summary: 'The chapter frames asymptotic freedom as the key to a realistic strong-interaction
    model. The six quark flavors are u,d,s,c,b,t, with charges +2/3 for u,c,t and
    -1/3 for d,s,b; proton uud and neutron udd then have integer charge. Equal u,d
    masses and interactions give approximate isospin SU(2), while near-degenerate
    u,d,s motivate flavor SU(3). The original model nevertheless has two stated problems:
    no isolated fractional charge was found, and the spin-3/2 Delta++ as an L=0 uuu
    state has symmetric spin-flavor wavefunction, conflicting with Fermi statistics
    until an antisymmetric color degree of freedom is supplied.'
