    section: '6.3 The Electron Vertex Function: Evaluation'
    pages:
    - 193
- id: peskin-schroeder.wilson-euclidean-sharp-cutoff
  label: Wilson's Euclidean sharp-cutoff setup
  summary: For the Wilson analysis of scalar phi-four theory, impose a sharp bound
    |k|<Lambda on Euclidean rather than Minkowski momentum after Wick rotation; a
    Minkowski k-squared cutoff leaves arbitrarily large lightlike components uncontrolled.
  kind: method
  group: peskin-schroeder.ch12-wilson-rg
  evidence:
