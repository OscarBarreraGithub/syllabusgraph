- id: peskin-schroeder.ward-vertex-identity-and-z1-z2
  label: Ward vertex identity and Z1 equals Z2
  summary: Amputating the electron three-point Ward-Takahashi identity relates the
    momentum contraction of the exact vertex to the difference of inverse exact propagators.
    Expanding near zero photon momentum and the electron pole gives Z1=Z2, so vertex
    and external-leg rescalings cancel and F1(0)=1 to all perturbative orders.
  kind: result
  group: peskin-schroeder.ch7-unitarity-ward
  evidence:
