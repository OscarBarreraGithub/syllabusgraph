groups:
- id: peskin-schroeder.chapter-three-problem-applications
  title: Chapter 3 problem applications
  question: Which further representation, spinor, Majorana, supersymmetry, Fierz,
    and bound-state calculations are posed for the reader?
- id: peskin-schroeder.dirac-bilinears-and-currents
  title: Dirac bilinears, currents, and rearrangements
  question: Which Lorentz objects can be made from Dirac fields, and what conservation
    or algebraic identities do they obey?
- id: peskin-schroeder.dirac-discrete-symmetries
  title: Discrete symmetries of the Dirac theory
  question: How are P, T, and C implemented on fermion fields and bilinears, and what
    does their combined CPT property imply?
- id: peskin-schroeder.dirac-field-quantization
  title: Quantized Dirac field, statistics, and propagation
  question: Why does causal positive-energy quantization require fermionic anticommutators,
    and what particle and propagator structure results?
- id: peskin-schroeder.dirac-lorentz-and-spinors
  title: Lorentz covariance, spinors, and the Dirac equation
  question: How do Lorentz representations and the Clifford algebra produce a covariant
    spin-one-half field equation?
- id: peskin-schroeder.field-symmetry-and-charge
  title: Field symmetries, currents, and stress-energy
  question: How do continuous field and spacetime symmetries produce currents, charges,
    and energy-momentum tensors?
- id: peskin-schroeder.free-dirac-solutions
  title: Free Dirac solutions and spin sums
  question: How do on-shell u and v spinors encode boosts, helicity, normalization,
    and polarization completeness?
- id: peskin-schroeder.free-scalar-foundations
  title: Free real scalar-field foundations
  question: How does the real Klein-Gordon field acquire its classical dynamics, canonical
    variables, and oscillator-mode description?
- id: peskin-schroeder.qed-scattering
  title: QED scattering and diagrammatics
  question: How does introductory e+e- to mu+mu- connect amplitudes, spin selection,
    diagrams, and cross sections?
- id: peskin-schroeder.quantized-scalar-particles
  title: Quantized scalar modes and particles
  question: How do canonical scalar-field modes become particles with relativistic
    normalization and statistics?
- id: peskin-schroeder.scalar-spacetime-propagation
  title: Scalar fields in spacetime, causality, and propagation
  question: How do Heisenberg fields, commutators, propagators, and sources describe
    causal scalar dynamics?
motivations:
- id: peskin-schroeder.why-commutators-test-causality
  nodes:
  - peskin-schroeder.spacelike-wightman-amplitude
  - peskin-schroeder.microcausality-field-commutator
  - peskin-schroeder.antiparticle-causality-cancellation
  summary: The causality discussion reframes a nonzero spacelike amplitude into whether
    a measurement at one point can affect another, leading to the commutator test
    and particle-antiparticle interpretation.
  evidence:
  - source: peskin-schroeder
    section: '2.4 The Klein-Gordon Field in Space-Time: Causality'
    pages:
