  - finding: 0
    issue: Constant-background work became compulsory for the independent spacetime-dependent
      Problem 3 route
    alternatives:
    - Keep the edge necessary and let Problem 3 derive its regulator treatment internally
      instead of reusing the regulation node.
    - Make the edge helpful evidence and retain route-neutral regulation as a necessary
      input to Problem 3.
    resolution: Make the constant-background edge helpful evidence so Problem 3 keeps
      a route-neutral regulator prerequisite.
    rationale: Section 17.5 contrasts the usual spacetime-dependent quadratic-field
      calculation with the simpler constant-background quartic-field calculation,
      and Problem 3 assigns the former route. The constant-background calculation
      defines the particular integral J later regulated in the text, so it is useful
      evidence for that application, but it is not required mastery for applying the
      same Wick-rotation and dimensional-regulation method in the independent quadratic-field
      derivation. Marking the edge helpful preserves both source-backed routes while
      the regulation result remains a jointly needed input to the completed coupling
      relation.
