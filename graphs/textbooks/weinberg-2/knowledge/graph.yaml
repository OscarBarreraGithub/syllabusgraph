nodes:
- id: weinberg-2.adjoint-representation
  label: Adjoint representation from structure constants
  summary: For structure constants satisfying the displayed antisymmetry and Jacobi
    relation, matrices (t^A_α)^β{}_γ=−i C^β_{γα} furnish the adjoint (regular) representation
    of the Lie algebra.
  kind: representation
  group: weinberg-2.gauge-construction
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 3
    note: Equations (15.1.6)–(15.1.7) construct and name the adjoint representation.
  notation:
  - source: weinberg-2
    note: A superscript A on t denotes the adjoint representation in this treatment.
- id: weinberg-2.anti-brst-ghost-antighost-role-observation
  label: Anti-BRST observation about ghost and antighost roles
  summary: The source records that anti-BRST invariance reveals a similarity between
    the roles of the ghost and antighost despite their asymmetric appearance in the
    construction, while explicitly saying that this similarity remains mysterious.
  kind: concept
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.8'
    pages:
    - 41
    note: The closing sentence of the section identifies the anti-BRST observation
      and preserves the source's unresolved qualification.
- id: weinberg-2.appendix-a-proof-of-compact-algebra-criterion
  label: Appendix proof of the positive-metric compact-algebra criterion
  summary: 'Appendix A supplies a proof route for the earlier stated equivalence:
    a real symmetric positive-definite invariant Lie-algebra metric is equivalent
    to a basis with totally antisymmetric structure constants and to a direct sum
    of compact simple and U(1) subalgebras. The route constructs a real inverse square
    root of the metric to prove total antisymmetry, uses the Hermitian adjoint representation
    to reduce into simple and Abelian blocks, proves each simple block compact because
    -C^c_ad C^d_bc is a positive sum of squares whose kernel would define an invariant
    Abelian subalgebra, and reconstructs an invariant positive metric from compact
    blocks using the Jacobi identity.'
  kind: method
  group: weinberg-2.lie-algebra-appendices
  evidence:
  - source: weinberg-2
    section: Appendix A
    pages:
    - 51
    - 52
    - 53
    note: The appendix explicitly organizes the proof as a implies b, b implies c,
      and c implies a.
- id: weinberg-2.asymptotic-freedom-logarithmic-scaling
  label: Asymptotic freedom and logarithmic scaling
  summary: When the weak-coupling beta-function is negative, the running coupling
    tends to zero at high scale, while operator factors produce logarithmic rather
    than altered energy-power corrections.
  kind: result
  group: weinberg-2.renormalization-group
  evidence:
  - source: weinberg-2
    section: 18.3(d)
    pages:
    - 133
    - 134
    - 135
    note: The source solves the negative-beta weak-coupling flow and analyzes the
      associated operator factors.
- id: weinberg-2.axial-gauge-canonical-reduction
  label: Axial gauge canonical reduction
  summary: Choosing axial gauge A^a_3=0 leaves A^a_i for i=1,2 as canonical gauge
    variables. The Gauss-law constraint, with suitable boundary conditions, determines
    A^a_0 from these variables and the matter canonical variables; this avoids the
    Gribov ambiguity that the source notes for Coulomb gauge.
  kind: method
  group: weinberg-2.field-equations-and-quantization
  evidence:
  - source: weinberg-2
    section: '15.4'
    pages:
    - 15
    - 16
    note: Equations (15.4.4)–(15.4.9) establish the axial-gauge variables and solve
      the constraint for A_0.
  notation:
  - source: weinberg-2
    note: In this gauge i,j run only over spatial values 1 and 2, while the gauge
      condition fixes the 3 component.
- id: weinberg-2.axial-gauge-path-integral-to-covariant-action
  label: Deriving the covariant gauge-field path integral from axial gauge
  summary: Starting with the Gauss-law solution for A^a_0, the source instead introduces
    A^a_0 as an independent Gaussian integration variable, whose stationary point
    is that solution. Provided the matter momentum integration is also Gaussian under
    the stated restriction on the matter Lagrangian, integrating the canonical momenta
    yields a configuration-space integral over matter and all four A^a_μ components
    with the original covariant Lagrangian and an axial-gauge delta functional δ(A^a_3).
  kind: method
  group: weinberg-2.field-equations-and-quantization
  evidence:
  - source: weinberg-2
    section: '15.4'
    pages:
    - 17
    - 18
    note: The source replaces the constrained A_0 solution by independent integration,
      then integrates the canonical momenta under its Gaussian assumption and retains
      all four gauge-field components.
- id: weinberg-2.background-field-gauge-formal-invariance
  label: Background-field gauge and formal background invariance
  summary: Splitting each field into a fixed background and an integrated quantum
    fluctuation, then choosing fᵃ=Dᵘ[A]A′ᵃ_μ, makes the gauge-fixing term covariant
    under a formal transformation in which the background transforms as a connection
    and the fluctuation transforms homogeneously. With matching background transformations
    of matter and ghosts, the measure and modified action imply that the effective
    action is invariant under the background transformations.
  kind: method
  group: weinberg-2.gauge-theory-renormalization
  evidence:
  - source: weinberg-2
    section: '17.4'
    pages:
    - 95
    - 96
    - 97
    - 98
    note: Equations (17.4.1)–(17.4.28) construct the background split, gauge functional,
      and invariant ghost action.
- id: weinberg-2.background-formal-versus-true-gauge-transformations
  label: Formal background transformations differ from true gauge transformations
  summary: The formal background transformation changes the prescribed background
    and rotates fluctuations homogeneously, preserving the chosen background gauge-fixing
    term. A true gauge transformation leaves prescribed backgrounds fixed and transforms
    the total field; it preserves the original Lagrangian but generally does not preserve
    that gauge-fixing term.
  kind: concept
  group: weinberg-2.gauge-theory-renormalization
  evidence:
  - source: weinberg-2
    section: '17.4'
    pages:
    - 97
    - 98
    note: Equations (17.4.16)–(17.4.20) make the distinction and its gauge-fixing
      consequence.
- id: weinberg-2.background-gauge-coupling-renormalization-from-field-strength
  label: Background gauge invariance ties coupling renormalization to the field-strength
    term
  summary: Background gauge invariance restricts divergent local terms to background-covariant
    field-strength, matter, and ghost structures. For a simple group with irreducible
    fermions, redefining fields and mass restores the classical form and forces the
    renormalized coupling to be determined by the coefficient of Fᵃ_{μν}F^{aμν}. Thus
    one background gauge-field amplitude suffices, unlike in a general gauge where
    field and coupling factors must be separated from multiple amplitudes.
  kind: result
  group: weinberg-2.gauge-theory-renormalization
  evidence:
  - source: weinberg-2
    section: '17.4'
    pages:
    - 98
    - 99
    - 100
    note: Equations (17.4.29)–(17.4.48) classify divergences and derive g_R=g(1+L_A)^−1/2.
- id: weinberg-2.beta-function-first-two-coefficients-scheme-invariant
  label: Scheme invariance of the first two beta coefficients
  summary: For a nonsingular redefinition of a one-coupling running parameter, the
    first two perturbative beta-function coefficients are unchanged, while higher
    coefficients can be changed.
  kind: result
  group: weinberg-2.renormalization-group
  evidence:
  - source: weinberg-2
    section: '18.3'
    pages:
    - 138
    - 139
    note: The source relates two coupling definitions and proves invariance through
      the second displayed coefficient.
- id: weinberg-2.brst-beyond-power-counting-and-bilinear-faddeev-popov
  label: Why BRST must extend power counting and bilinear Faddeev–Popov actions
  summary: Power counting does not by itself ensure that every divergence has an available
    counterterm, and nonlinear BRST transformations do not directly transfer Lagrangian
    symmetry to Green functions or matrix elements. The source also notes that gauges
    beyond the bilinear Faddeev–Popov construction can require quartic ghost counterterms;
    the more general ghost-number-zero BRST-invariant action permits the needed BRST-exact
    gauge-fixing functional beyond the bilinear form.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: 15.6–15.7
    pages:
    - 27
    - 32
    - 35
    note: These pages state the power-counting limitation, the nonlinear-BRST limitation,
      and the need for four-ghost counterterms in more general gauges.
- id: weinberg-2.brst-cohomology-of-physical-states
  label: Physical states as BRST cohomology
  summary: The conserved BRST charge Q is nilpotent. Gauge-fixing independence of
    physical matrix elements requires physical states to be annihilated by Q, and
    two such states differing by a Q-exact state are physically equivalent. Thus independent
    physical states are the cohomology ker Q / im Q.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 32
    - 33
    note: Equations (15.7.27)–(15.7.31) connect changes of the gauge-fixing functional
      to Q and derive the cohomological characterization.
- id: weinberg-2.brst-conditional-ghost-free-gauge-independence
  label: Conditional ghost-free gauge independence from BRST cohomology
  summary: 'For gauge-invariant operators between Q-closed physical states, the source
    derives independence under changing the gauge-fixing functional. It then gives
    a conditional physical conclusion: if some gauge-fixing functional has decoupled
    ghosts, the general BRST-invariant action yields a unitary S-matrix with no ghosts
    in initial or final states even when a different gauge is used for calculation.'
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.8'
    pages:
    - 41
    note: Equations (15.8.20)–(15.8.21) state the Q-cohomology condition and the following
      paragraphs give the conditional ghost-decoupling argument.
- id: weinberg-2.brst-electrodynamic-polarization-example
  label: BRST cohomology removes unphysical photon and ghost states
  summary: In the free electrodynamic example, Q-closed one-photon states have transverse
    polarization, and polarizations differing by a multiple of momentum are Q-equivalent.
    Longitudinal/temporal unphysical modes and ghost excitations are excluded or Q-exact,
    leaving a physical Hilbert space free of ghosts and antighosts.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 33
    - 34
    note: Equations (15.7.32)–(15.7.36) and their interpretation give the polarization
      equivalence and removal of ghost states.
- id: weinberg-2.brst-exact-gauge-fixing
  label: Gauge fixing as a BRST-exact term
  summary: For the auxiliary-field formulation, the gauge-fixed action has the form
    I_new=∫d⁴x L+sΨ. Since the matter-plus-gauge Lagrangian is gauge invariant and
    s is nilpotent, both terms are BRST invariant; the gauge-fixing and ghost contribution
    is BRST exact.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 31
    - 32
    note: Equations (15.7.21)–(15.7.26) identify the gauge transformation parameter
      and rewrite the new action.
- id: weinberg-2.brst-field-transformations
  label: BRST transformations with auxiliary field
  summary: Introducing the Nakanishi–Lautrup field h^a via a Fourier representation
    of the gauge-fixing weight gives a gauge-fixed action invariant under a constant
    anticommuting BRST transformation. On matter and gauge fields it is a gauge transformation
    with parameter proportional to ω^a; it transforms the antighost into h^a, h^a
    trivially, and the ghost quadratically through C_{abc}ω^bω^c.
  kind: method
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 28
    - 29
    note: Equations (15.7.5)–(15.7.11) introduce h and list the BRST transformations.
  notation:
  - source: weinberg-2
    note: The BRST parameter θ is a constant anticommuting c-number; h^a is often
      called the Nakanishi–Lautrup field.
- id: weinberg-2.brst-nilpotence
  label: Nilpotence of the BRST differential
  summary: The BRST operator s satisfies s²=0 on all fields and their products. For
    matter and gauge fields the cancellation uses the Lie-algebra commutator, antisymmetry,
    and Jacobi identity; for arbitrary products it uses the graded Leibniz rule and
    the opposite statistics of sφ relative to φ.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 29
    - 30
    - 31
    note: Equations (15.7.14)–(15.7.20) prove nilpotence first on fields and then
      on arbitrary functionals.
- id: weinberg-2.brst-unitarity-and-general-gauge-fixing
  label: BRST quantization and gauge-fixing-functional independence
  summary: A general local ghost-number-zero BRST-invariant action can be written
    as a gauge/matter functional plus s applied to a ghost-number-minus-one functional.
    For Yang–Mills theory, BRST-closed S-matrix elements are independent of that functional;
    with the stated Yang–Mills result, the BRST cohomology is ghost-free, positive
    definite, and has a unitary S-matrix, while separate proofs are needed for other
    local symmetries.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 35
    - 36
    note: Equation (15.7.40) and the following discussion state the general action,
      ghost decoupling argument, and qualified BRST-quantization result.
- id: weinberg-2.bv-antibracket-classical-master-equation
  label: Antibracket form of the classical master equation
  summary: The antibracket is defined using left and right functional derivatives
    with respect to fields and antifields. For the bosonic master action S, its graded
    signs make the classical master equation equivalent to (S,S)=0; unlike the fermionic
    self-antibracket case, this is a nontrivial condition.
  kind: representation
  group: weinberg-2.batalin-vilkovisky-formalism
  evidence:
  - source: weinberg-2
    section: '15.9'
    pages:
    - 45
    - 46
    note: Equations (15.9.13)–(15.9.15) define the antibracket, rewrite the master
      equation, and state its graded symmetry.
  notation:
  - source: weinberg-2
    note: The source retains the distinction between right and left functional differentiation
      because field and antifield variables may be fermionic.
- id: weinberg-2.bv-anticanonical-transformations
  label: BV anticanonical transformations preserve the master structure
  summary: Because the BV solution is not unique, infinitesimal fermionic ghost-number-minus-one
    generators can transform a solution into another. The source calls transformations
    preserving the fundamental field-antifield antibrackets anticanonical transformations;
    the Jacobi identity shows that they preserve c-number fundamental brackets and
    hence the master equation.
  kind: method
  group: weinberg-2.batalin-vilkovisky-formalism
  evidence:
  - source: weinberg-2
    section: '15.9'
    pages:
    - 47
    - 48
    note: Equations (15.9.23)–(15.9.27) introduce the solution-changing transformation,
      define anticanonical transformations, and verify bracket preservation.
- id: weinberg-2.bv-antifields-and-graded-master-action
  label: BV antifields and the graded master action
  summary: For every field x^n, the BV construction introduces an external antifield
    x*_n with the same Bose/Fermi statistics as the BRST-transformed field s x^n,
    hence opposite statistics to x^n, and ghost number -gh(x^n)-1. In the closed cases
    stated by the source, the gauge-invariant action is augmented by antifield couplings
    to s x^n; the resulting bosonic ghost-number-zero action obeys the classical master
    equation. Directly setting x*_n equal to a derivative of a fermionic gauge-fixing
    functional of ghost number -1 reproduces the BRST-exact gauge-fixed action.
  kind: method
  group: weinberg-2.batalin-vilkovisky-formalism
  evidence:
  - source: weinberg-2
    section: '15.9'
    pages:
    - 43
    note: Equations (15.9.1)–(15.9.6) assign antifield grading, state the master equation,
      and recover gauge fixing from the fermion Psi.
  notation:
  - source: weinberg-2
    note: Weinberg uses x*_n as an antifield symbol; it is explicitly unrelated to
      complex or charge conjugation, and the antighost is not the ghost's antifield.
- id: weinberg-2.bv-cohomological-renormalization-of-general-gauge-theories
  label: BV cohomological renormalization of general gauge theories
  summary: For a general gauge theory, the quantum master equation and a loop expansion
    constrain counterterms. Allowing anticanonical field–antifield redefinitions removes
    exact divergences; the remaining possible divergences are cohomology classes of
    the nilpotent map X↦(S_R,X). Renormalizability follows when these classes obey
    the action's structural constraints and hence have available counterterms.
  kind: method
  group: weinberg-2.gauge-theory-renormalization
  evidence:
  - source: weinberg-2
    section: '17.3'
    pages:
    - 91
    - 92
    - 93
    - 94
    - 95
    note: Equations (17.3.1)–(17.3.14) formulate the quantum-master, anticanonical,
      and cohomological proof route.
- id: weinberg-2.bv-cohomology-theorem-and-renormalizability-limits
  label: Cohomology theorem and limits of structural renormalizability
  summary: For gravity coupled to semisimple Yang–Mills fields under the stated nonexceptional
    assumptions, the cited local ghost-number-zero cohomology consists of gauge-invariant
    functionals, so available bare-action parameters and field–antifield renormalizations
    cancel divergences despite higher-dimensional operators. Other theories can have
    extra classes; some are excluded by separate theorems, while unremovable divergent
    classes would require relaxing structural constraints or rejecting the theory.
  kind: result
  group: weinberg-2.gauge-theory-renormalization
  evidence:
  - source: weinberg-2
    section: '17.3'
    pages:
    - 94
    - 95
    note: The closing paragraphs state the cohomology theorem, U(1) qualification,
      and possible limitation.
- id: weinberg-2.bv-formalism-for-open-and-reducible-symmetries
  label: Batalin-Vilkovisky formalism for open and reducible gauge symmetries
  summary: The Batalin-Vilkovisky formalism extends the treatment beyond irreducible
    gauge symmetries with an off-shell closed algebra. It is introduced for theories
    with open algebras, whose closure holds only on field equations, and for reducible
    symmetries; the source also identifies its later roles in renormalization and
    quantum symmetry violations.
  kind: method
  group: weinberg-2.batalin-vilkovisky-formalism
  evidence:
  - source: weinberg-2
    section: '15.9'
    pages:
    - 42
    note: The section introduction contrasts closed irreducible algebras with open
      and reducible cases and lists the formalism's applications.
- id: weinberg-2.bv-gauge-fixing-fermion-and-on-shell-brst
  label: BV gauge fixing by a fermion and on-shell BRST closure
  summary: 'To compute an S-matrix, the BV antifields are directly set to derivatives
    of a fermionic gauge-fixing functional Psi. The source also gives an equivalent
    anticanonical interpretation: shift the antifields and set the transformed ones
    to zero. The resulting gauge-fixed action is invariant under a BRST transformation
    on fields alone. For a general open algebra this field-only transformation differs
    from the original BRST transformation and is generally nilpotent only when field
    equations hold.'
  kind: method
  group: weinberg-2.batalin-vilkovisky-formalism
  evidence:
  - source: weinberg-2
    section: '15.9'
    pages:
    - 43
    - 48
    - 49
    note: Page 43 first obtains gauge fixing by direct antifield substitution; equations
      (15.9.28)–(15.9.30) give the equivalent shifted-antifield interpretation and
      state the open-algebra, on-shell qualification.
- id: weinberg-2.bv-generalized-brst-antibracket-differential
  label: Generalized BRST differential from the antibracket
  summary: The BV generalized BRST transformation acts on fields and antifields through
    the antibracket with S. The antibracket derivative rule extends this action to
    every functional, while the classical master equation makes S invariant and, through
    the antibracket Jacobi identity, makes the differential nilpotent.
  kind: method
  group: weinberg-2.batalin-vilkovisky-formalism
  evidence:
  - source: weinberg-2
    section: '15.9'
    pages:
    - 46
    - 47
    note: Equations (15.9.16)–(15.9.22) define the transformation, establish its action
      on a general functional, and derive nilpotency from the master equation and
      Jacobi identity.
- id: weinberg-2.bv-master-equation-open-algebra-consistency-tower
  label: Master equation as the open-algebra consistency tower
  summary: Expanding the BV master equation in antifield order yields gauge invariance
    at zeroth antifield order, on-shell closure and generalized Jacobi consistency
    at the next orders, and further consistency conditions at higher orders. Terms
    quadratic or higher in antifields carry the field-equation dependence characteristic
    of an open algebra, so the single master equation packages the whole hierarchy.
  kind: result
  group: weinberg-2.batalin-vilkovisky-formalism
  evidence:
  - source: weinberg-2
    section: '15.9'
    pages:
    - 44
    - 45
    note: The antifield expansion is displayed on p. 44 and p. 45 explains how its
      master-equation orders encode open-algebra consistency conditions.
- id: weinberg-2.bv-minimal-and-trivial-pairs
  label: BV minimal variables and trivial pairs
  summary: For general theories the master action may be nonlinear in antifields and
    includes ghosts of ghosts and their antifields when symmetry is reducible. The
    fields phi, ghosts, and their antifields are minimal variables, while the antighost
    and auxiliary h field, whose BRST transformations remain linear, and their antifields
    form trivial pairs that enter bilinearly.
  kind: representation
  group: weinberg-2.batalin-vilkovisky-formalism
  evidence:
  - source: weinberg-2
    section: '15.9'
    pages:
    - 44
    note: Equation (15.9.7), its discussion, and the footnote distinguish the nonlinear
      minimal action from the bilinear trivial-pair sector.
  notation:
  - source: weinberg-2
    note: The source assigns ghost numbers -1, -2, and 0 respectively to the antifields
      of phi, omega, and omega* in the displayed general action.
- id: weinberg-2.bv-quantum-brst-observable-condition
  label: Quantum BRST condition for gauge-fixing-independent observables
  summary: Assuming the quantum master equation, expectation values of generalized-BRST-invariant
    operators are unchanged under a small change of gauge-fixing fermion. For open
    gauge theories, the source qualifies that field-only invariant operators are generally
    only constants and instead gives the nilpotent quantum BRST operator sigma O=(O,S)-i
    Delta O for observables depending on fields and antifields.
  kind: result
  group: weinberg-2.batalin-vilkovisky-formalism
  evidence:
  - source: weinberg-2
    section: '15.9'
    pages:
    - 50
    note: Equation (15.9.36) gives the field-only invariance result, while the footnote
      supplies the open-algebra quantum-BRST qualification.
- id: weinberg-2.bv-quantum-master-equation
  label: Quantum master equation for gauge-fixing independence
  summary: For functional-integral quantum calculations, gauge-fixing-fermion independence
    requires the quantum master equation (S,S)-2i Delta S=0 evaluated at the gauge-fixing
    antifields, rather than the classical master equation alone. In units restoring
    hbar, the Delta S contribution is weighted by hbar; a failure of a local action
    to satisfy this equation is deferred to the source's anomaly discussion.
  kind: result
  group: weinberg-2.batalin-vilkovisky-formalism
  evidence:
  - source: weinberg-2
    section: '15.9'
    pages:
    - 49
    - 50
    note: Equations (15.9.31)–(15.9.35) derive the quantum master equation from changing
      Psi, and p. 50 states the anomaly qualification.
  notation:
  - source: weinberg-2
    note: Delta is the field-antifield second-order operator defined in equation (15.9.34);
      the displayed convention suppresses hbar until the following paragraph.
- id: weinberg-2.cartan-catalog-compact-classical-families
  label: Cartan catalog of compact classical families
  summary: 'The appendix presents compact forms of the classical families: A_n=su(n+1),
    the traceless Hermitian (n+1)-by-(n+1) matrices, has rank n and d=n(n+2); B_n,
    imaginary antisymmetric (2n+1)-by-(2n+1) matrices, has rank n and d=n(2n+1); C_n=usp(2n),
    derived from the symplectic block constraint, has rank n and d=n(2n+1); and D_n,
    the even-dimensional orthogonal family, has rank n and d=n(2n-1). The source states
    A_n, B_n, and C_n are simple, while D_1 is Abelian and D_2 is B_1+B_1.'
  kind: representation
  group: weinberg-2.lie-algebra-appendices
  evidence:
  - source: weinberg-2
    section: Appendix B
    pages:
    - 54
    - 55
    - 56
    - 57
    note: The catalog introduces the compact convention, then describes A_n, B_n,
      C_n, and D_n by their defining matrix groups, ranks, dimensions, and simplicity
      qualifications.
  notation:
  - source: weinberg-2
    note: The subscript n denotes rank, not dimension; Appendix B uses compact Hermitian-generator
      conventions.
- id: weinberg-2.cartan-exceptional-algebras-and-low-rank-isomorphisms
  label: Exceptional algebras, low-rank isomorphisms, and covering-group qualification
  summary: 'Beyond the classical families, the source lists the five exceptional simple
    algebras G_2, F_4, E_6, E_7, and E_8 with dimensions 14, 52, 78, 133, and 248.
    Its four low-rank algebra isomorphisms are A_1=B_1, B_1=C_1, C_2=B_2, and A_3=D_3.
    These do not identify the corresponding groups: SU(2), USp(4), and SU(4) are simply
    connected covers of the cited orthogonal groups. The source also gives SO(4)=SO(3)xSO(3),
    hence its double-valued spinor representation from SU(2)xSU(2), and says higher-dimensional
    SO(d) spinors require other constructions such as Clifford algebras.'
  kind: result
  group: weinberg-2.lie-algebra-appendices
  evidence:
  - source: weinberg-2
    section: Appendix B
    pages:
    - 57
    - 58
    note: The final catalog page lists the exceptional algebras; the following page
      states the four isomorphisms and distinguishes algebra isomorphism from group
      isomorphism.
- id: weinberg-2.compact-simple-lie-algebra-classification
  label: Classification consequences for compact simple gauge algebras
  summary: The positive-metric restriction leaves compact simple algebras of limited
    types and dimensions. The source identifies the unique three-generator case, shared
    by O(3) and SU(2), reports no simple algebras with four through seven generators,
    and places the compact simple algebras into classical infinite families plus five
    exceptional algebras.
  kind: result
  group: weinberg-2.lagrangian-and-algebra
