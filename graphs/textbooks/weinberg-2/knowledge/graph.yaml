- id: weinberg-2.yang-mills-original-massless-vector-obstacle
  label: Historical mass obstacle in the original Yang-Mills interpretation
  summary: 'The source describes the 1954 Yang-Mills proposal as an SU(2) isotopic-spin
    gauge theory whose photon-analog vector fields were identified with strongly interacting
    isovector mesons. It records the immediate phenomenological obstacle: gauge invariance
    would require them to be massless, so they were expected already to have been
    detected.'
  kind: result
  group: weinberg-2.gauge-theory-framing
  evidence:
  - source: weinberg-2
    section: 15 opening
    pages:
    - 1
    note: The opening gives the original SU(2) interpretation and explicitly states
      the massless-vector obstacle.
- id: weinberg-2.yang-mills-three-and-four-vector-vertices
  label: Three- and four-vector Yang–Mills vertices
  summary: The cubic and quartic terms in the non-Abelian field-strength Lagrangian
    yield three- and four-vector-boson momentum-space vertices. Because Weinberg absorbs
    couplings into C_{abc}, the cubic and quartic vertex factors are respectively
    first and second order in the couplings.
  kind: result
  group: weinberg-2.gauge-fixing-and-ghosts
  evidence:
  - source: weinberg-2
    section: '15.5'
    pages:
    - 24
    note: Equations (15.5.26)–(15.5.27) give the momentum-space vertex factors and
      the text identifies their coupling orders.
