motivations:
- id: weinberg-2.composite-fermion-mass-motivation
  nodes:
  - weinberg-2.t-hooft-anomaly-matching-massless-bound-states
  summary: If quarks and leptons were deeply bound composite particles, their observed
    masses far below the compositeness scale demand an explanation; unbroken chiral
    symmetries and anomaly matching constrain one possible explanation.
  evidence:
  - source: weinberg-2
    section: '22.5'
    pages:
    - 389
    - 390
    note: The source poses the compositeness scale/mass conflict and introduces the
      anomaly-based answer.
- id: weinberg-2.consistency-form-motivation
  nodes:
  - weinberg-2.wess-zumino-consistency-condition-for-anomalies
  - weinberg-2.differential-form-consistency-derivation-of-symmetric-anomaly
  summary: Consistency conditions largely determine anomaly form independently of
    microscopic details, leaving matter-dependent numerical coefficients to calculation.
  evidence:
  - source: weinberg-2
    section: '22.6'
    pages:
    - 396
    note: The source states this separation of form from matter-dependent coefficient.
- id: weinberg-2.covariant-rules-without-gauge-dependence
  nodes:
  - weinberg-2.faddeev-popov-gauge-fixing-independence
  - weinberg-2.generalized-feynman-gauge-propagator
  - weinberg-2.faddeev-popov-ghost-determinant
  - weinberg-2.brst-exact-gauge-fixing
  summary: Axial gauge is convenient for canonical quantization but obscures rotational
    and Lorentz invariance in Feynman rules; the source develops gauge fixing, ghosts,
    and BRST symmetry to obtain covariant calculations while retaining gauge-independent
    physical content.
  evidence:
  - source: weinberg-2
    section: 15.5–15.7
    pages:
    - 19
    - 27
    - 28
    note: The source states the axial-gauge motivation, the overcounting role of ghosts,
      and the counterterm problem caused by gauge fixing.
- id: weinberg-2.deep-inelastic-scaling-surprise
  nodes:
  - weinberg-2.dis-structure-functions-and-bjorken-limit
  summary: At fixed Bjorken variable, the observed near constancy of vW2 contradicted
    the expected rapid form-factor falloff and motivated the deep-inelastic analysis.
  evidence:
  - source: weinberg-2
    section: '20.6'
    pages:
    - 273
    note: The source contrasts the expectation of rapid falloff with the SLAC-MIT
      observation.
- id: weinberg-2.effective-action-organizes-multiloop-effects
  nodes:
  - weinberg-2.effective-action-1pi-tree-reconstruction
  - weinberg-2.one-loop-effective-potential-determinant-method
  - weinberg-2.constant-background-one-loop-gauge-coupling-method
  summary: The source introduces external fields because fictitious sources can simplify
    amplitudes and because the quantum effective action packages multiloop effects
    into tree graphs with 1PI vertices, enabling both effective-potential calculations
    and the later gauge-theory renormalization calculation.
  evidence:
  - source: weinberg-2
    section: 16 opening and 16.1
    pages:
    - 63
    - 66
    - 67
    note: The opening states the calculation motivation and the section derives the
      tree/1PI reorganization.
- id: weinberg-2.extended-configurations-nonperturbative-motivation
  nodes:
  - weinberg-2.extended-configuration-physical-roles
  - weinberg-2.instanton-path-integral-suppression
  summary: The chapter motivates nonperturbative stationary configurations because
    they must be included with their fluctuations in path integrals and can matter
    in QCD despite frequent suppression.
  evidence:
  - source: weinberg-2
    section: '23'
    pages:
    - 421
    note: The introduction distinguishes perturbative vacuum expansion from extended
      stationary configurations and says their fluctuations are summed in path integrals.
- id: weinberg-2.gauge-cancellation-motivation
  nodes:
  - weinberg-2.quantum-anomaly-regulator-symmetry-trace
  - weinberg-2.gauge-anomaly-cancellation-d-symbol-condition
  summary: Because a gauge anomaly makes the theory inconsistent, cancellation constrains
    admissible gauge-theory matter content.
  evidence:
  - source: weinberg-2
    section: '22'
    pages:
    - 359
    note: The opening paragraph makes the inconsistency-to-constraint motivation explicit.
- id: weinberg-2.goldstone-anomaly-matching-motivation
  nodes:
  - weinberg-2.anomaly-matching-goldstone-effective-action
  - weinberg-2.qcd-wess-zumino-witten-action-and-color-coefficient
  summary: Anomaly matching requires anomalous Goldstone interactions; when fictitious
    gauge fields are identified with real weak gauge fields, the corresponding spectators
    must be real fermions that cancel trapped-fermion gauge anomalies.
  evidence:
  - source: weinberg-2
    section: '22.7'
    pages:
    - 408
    - 409
    note: The source gives both the matching necessity and the real weak-gauge-field
      qualification.
- id: weinberg-2.hard-momentum-short-distance-motivation
  nodes:
  - weinberg-2.short-distance-operator-product-expansion
  - weinberg-2.short-distance-spectral-sum-rule-criterion
  - weinberg-2.dis-ope-dispersion-connection
  summary: Large Fourier momentum through a current pair selects its coincident-point
    singularities, whereas an analytic product would have an exponentially decreasing
    transform. This motivates the OPE for propagator and spectral asymptotics as well
    as deep-inelastic scattering.
  evidence:
  - source: weinberg-2
    section: Chapter 20 introduction
    pages:
    - 252
    note: The source states the hard-momentum/short-distance bridge and its spectral
      and DIS applications.
- id: weinberg-2.local-symmetry-needs-dynamical-fields
  nodes:
  - weinberg-2.dynamical-gauge-fields-give-local-symmetry-physical-content
  - weinberg-2.yang-mills-original-massless-vector-obstacle
  summary: The opening frames non-Abelian gauge theory through the attractive possibility
    that local symmetry determines dynamical fields and their properties, while recalling
    that the first Yang-Mills phenomenological interpretation immediately faced a
    massless-vector obstacle.
  evidence:
  - source: weinberg-2
    section: 15 opening
    pages:
    - 1
    note: The opening compares local electromagnetic and gravitational symmetry principles,
      then recounts the original Yang-Mills interpretation and mass problem.
- id: weinberg-2.locality-requires-compensation
  nodes:
  - weinberg-2.local-matter-gauge-transformations
  - weinberg-2.gauge-field-transformation
  - weinberg-2.covariant-derivative
  summary: Position dependence spoils the simple transformation of ordinary matter-field
    derivatives; the gauge field is introduced to compensate for that obstruction.
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 4
    note: The page explains that derivatives of the local parameters prevent ordinary
      derivatives from transforming like the fields and motivates the compensating
      field.
- id: weinberg-2.pi0-rate-motivation
  nodes:
  - weinberg-2.pi0-two-photon-chiral-suppression-puzzle
  - weinberg-2.pi0-two-photon-anomaly-color-prediction
  summary: The unexpectedly large neutral-pion two-photon decay rate is the concrete
    failure that exposes the chiral anomaly and turns it into a color-counting prediction.
  evidence:
  - source: weinberg-2
    section: 22.1–22.2
    pages:
    - 361
    - 368
    note: The source contrasts the failed suppressed estimate with the anomaly calculation
      agreeing for three colors.
- id: weinberg-2.symmetry-controls-counterterms
  nodes:
  - weinberg-2.zinn-justin-equation-for-quantum-effective-action
  - weinberg-2.direct-brst-renormalizability-induction
  - weinberg-2.bv-cohomological-renormalization-of-general-gauge-theories
  - weinberg-2.background-gauge-coupling-renormalization-from-field-strength
  summary: Power counting only limits the dimensionality of divergent terms; gauge-theory
    renormalizability also requires them to satisfy symmetry constraints so that allowed
    counterterms exist. The source develops BRST/BV and background-field tools to
    impose those constraints.
  evidence:
  - source: weinberg-2
    section: 17.2–17.4
    pages:
    - 82
    - 83
    - 95
    - 98
    note: These pages state the insufficiency of power counting and the symmetry-based
      controls on divergences.
- id: weinberg-2.why-broken-chiral-symmetry-controls-low-energy-hadrons
  nodes:
  - weinberg-2.goldstone-boson-theorem-effective-action-route
  - weinberg-2.chiral-su2-times-su2-qcd-symmetry
  - weinberg-2.chiral-pion-effective-field-theory-power-counting
  - weinberg-2.threshold-pion-nucleon-scattering-lengths
  summary: The observed hadron spectrum lacks the parity doubling expected from an
    unbroken chiral symmetry, while pions are light. The chapter uses this pattern
    to motivate a broken approximate chiral symmetry and a controlled low-energy expansion
    for its consequences.
  evidence:
  - source: weinberg-2
    section: 19.4; 19.5
    pages:
    - 184
    - 197
    note: The source infers chiral breaking from the spectrum and motivates a low-energy
      expansion for pion amplitudes.
- id: weinberg-2.why-run-couplings-and-operators
  nodes:
  - weinberg-2.rg-high-energy-mode-elimination
  - weinberg-2.sliding-scale-coupling-callan-symanzik-method
  - weinberg-2.sliding-operator-renormalization-and-anomalous-dimension
  - weinberg-2.qcd-one-loop-beta-and-active-flavors
  summary: Perturbative expressions fail when a small coupling multiplies a large
    ratio-of-scales logarithm. The chapter replaces fixed prescriptions with flowing
    couplings and operator normalizations, then uses their flow to explain when high-energy
    calculations become reliable or lose reliability.
  evidence:
  - source: weinberg-2
    section: 18; 18.2; 18.7
    pages:
    - 111
    - 112
    - 119
    - 120
    - 153
    note: The introduction states the logarithm problem, the sliding-scale construction
      supplies the remedy, and QCD provides the high-energy example.
