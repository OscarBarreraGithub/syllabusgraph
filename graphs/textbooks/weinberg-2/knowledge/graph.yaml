motivations:
- id: weinberg-2.covariant-rules-without-gauge-dependence
  nodes:
  - weinberg-2.faddeev-popov-gauge-fixing-independence
  - weinberg-2.generalized-feynman-gauge-propagator
  - weinberg-2.faddeev-popov-ghost-determinant
  - weinberg-2.brst-exact-gauge-fixing
  summary: Axial gauge is convenient for canonical quantization but obscures rotational
    and Lorentz invariance in Feynman rules; the source develops gauge fixing, ghosts,
    and BRST symmetry to obtain covariant calculations while retaining gauge-independent
    physical content.
  evidence:
  - source: weinberg-2
    section: 15.5–15.7
    pages:
    - 19
    - 27
    - 28
    note: The source states the axial-gauge motivation, the overcounting role of ghosts,
      and the counterterm problem caused by gauge fixing.
- id: weinberg-2.effective-action-organizes-multiloop-effects
  nodes:
  - weinberg-2.effective-action-1pi-tree-reconstruction
  - weinberg-2.one-loop-effective-potential-determinant-method
  - weinberg-2.constant-background-one-loop-gauge-coupling-method
  summary: The source introduces external fields because fictitious sources can simplify
    amplitudes and because the quantum effective action packages multiloop effects
    into tree graphs with 1PI vertices, enabling both effective-potential calculations
    and the later gauge-theory renormalization calculation.
  evidence:
  - source: weinberg-2
    section: 16 opening and 16.1
    pages:
    - 63
    - 66
    - 67
    note: The opening states the calculation motivation and the section derives the
      tree/1PI reorganization.
- id: weinberg-2.local-symmetry-needs-dynamical-fields
  nodes:
  - weinberg-2.dynamical-gauge-fields-give-local-symmetry-physical-content
  - weinberg-2.yang-mills-original-massless-vector-obstacle
  summary: The opening frames non-Abelian gauge theory through the attractive possibility
    that local symmetry determines dynamical fields and their properties, while recalling
    that the first Yang-Mills phenomenological interpretation immediately faced a
    massless-vector obstacle.
  evidence:
  - source: weinberg-2
    section: 15 opening
    pages:
    - 1
    note: The opening compares local electromagnetic and gravitational symmetry principles,
      then recounts the original Yang-Mills interpretation and mass problem.
- id: weinberg-2.locality-requires-compensation
  nodes:
  - weinberg-2.local-matter-gauge-transformations
  - weinberg-2.gauge-field-transformation
  - weinberg-2.covariant-derivative
  summary: Position dependence spoils the simple transformation of ordinary matter-field
    derivatives; the gauge field is introduced to compensate for that obstruction.
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 4
    note: The page explains that derivatives of the local parameters prevent ordinary
      derivatives from transforming like the fields and motivates the compensating
      field.
- id: weinberg-2.symmetry-controls-counterterms
  nodes:
  - weinberg-2.zinn-justin-equation-for-quantum-effective-action
  - weinberg-2.direct-brst-renormalizability-induction
  - weinberg-2.bv-cohomological-renormalization-of-general-gauge-theories
  - weinberg-2.background-gauge-coupling-renormalization-from-field-strength
  summary: Power counting only limits the dimensionality of divergent terms; gauge-theory
    renormalizability also requires them to satisfy symmetry constraints so that allowed
    counterterms exist. The source develops BRST/BV and background-field tools to
    impose those constraints.
  evidence:
  - source: weinberg-2
    section: 17.2–17.4
    pages:
    - 82
    - 83
    - 95
    - 98
    note: These pages state the insufficiency of power counting and the symmetry-based
      controls on divergences.
- id: weinberg-2.why-run-couplings-and-operators
  nodes:
  - weinberg-2.rg-high-energy-mode-elimination
  - weinberg-2.sliding-scale-coupling-callan-symanzik-method
  - weinberg-2.sliding-operator-renormalization-and-anomalous-dimension
  - weinberg-2.qcd-one-loop-beta-and-active-flavors
  summary: Perturbative expressions fail when a small coupling multiplies a large
    ratio-of-scales logarithm. The chapter replaces fixed prescriptions with flowing
    couplings and operator normalizations, then uses their flow to explain when high-energy
    calculations become reliable or lose reliability.
  evidence:
  - source: weinberg-2
    section: 18; 18.2; 18.7
    pages:
    - 111
    - 112
    - 119
    - 120
    - 153
    note: The introduction states the logarithm problem, the sliding-scale construction
      supplies the remedy, and QCD provides the high-energy example.
