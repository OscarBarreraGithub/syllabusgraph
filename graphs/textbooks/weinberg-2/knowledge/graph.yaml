nodes:
- id: weinberg-2.adjoint-representation
  label: Adjoint representation from structure constants
  summary: For structure constants satisfying the displayed antisymmetry and Jacobi
    relation, matrices (t^A_α)^β{}_γ=−i C^β_{γα} furnish the adjoint (regular) representation
    of the Lie algebra.
  kind: representation
  group: weinberg-2.gauge-construction
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 3
    note: Equations (15.1.6)–(15.1.7) construct and name the adjoint representation.
  notation:
  - source: weinberg-2
    note: A superscript A on t denotes the adjoint representation in this treatment.
- id: weinberg-2.adler-bardeen-radiative-and-mass-decoupling-qualification
  label: Radiative nonrenormalization and symmetry-allowed mass decoupling
  summary: 'The chapter gives only the gist of the external Adler-Bardeen all-orders
    analysis: its surface-term power counting says virtual gauge interactions inside
    the anomalous fermion loop lower its degree enough to remove radiative contributions,
    while external-field interactions renormalize the local F F operator. Separately,
    its displayed mass-matrix/Schur-lemma argument shows that fermions with a symmetry-allowed
    mass contribute zero or cancel in the anomaly.'
  kind: result
  group: weinberg-2.general-anomalies
  evidence:
  - source: weinberg-2
    section: '22.3'
    pages:
    - 381
    - 382
    note: The source gives the surface-term argument and the mass-matrix/Schur-lemma
      cancellation condition.
- id: weinberg-2.adler-weisberger-sum-rule-exact-chiral-limit
  label: Adler-Weisberger sum rule in the exact chiral limit
  summary: In the exact chiral limit, comparison of the forward pion-proton dispersion
    relation with its low-energy limit fixes the subtraction constant to zero and
    expresses the axial coupling in terms of an energy integral of the charged-pion
    total-cross-section difference. The source says analogous sum rules can be formed
    for pion scattering on any baryon or meson, including another pion.
  kind: result
  group: weinberg-2.spontaneously-broken-global-symmetries
  evidence:
  - source: weinberg-2
    section: '19.5'
    pages:
    - 211
    note: The closing discussion identifies the exact-chiral Adler-Weisberger relation
      and its generalization.
- id: weinberg-2.altarelli-parisi-evolution-from-ope-moments
  label: Altarelli–Parisi evolution from OPE moments
  summary: Renormalization-group evolution of the twist-two moments is equivalently
    expressed as an evolution equation for parton distributions with splitting kernels
    Pij(x). The moment condition on Pij fixes its relation to the anomalous-dimension
    matrix; the source gives the one-loop kernels for N massless active quark flavors,
    treating heavier flavors as integrated out except through the coupling.
  kind: method
  group: weinberg-2.ope-deep-inelastic
  evidence:
  - source: weinberg-2
    section: '20.6'
    pages:
    - 281
    - 282
    note: Equations (20.6.43)–(20.6.57) give the moment evolution, kernel condition,
      active-flavor assumption, and plus prescription.
- id: weinberg-2.anomalous-goldstone-action-terms-and-h5
  label: Anomalous Goldstone action terms from H⁵(G/H; R)
  summary: When π4(G/H)=0, action terms can be represented by invariant five-forms
    on an extension ball. The genuinely anomalous terms are closed invariant five-forms
    that are not exterior derivatives of invariant four-forms, so their independent
    classes are the generators of H⁵(G/H;R). For the stated SU(N) coset there is one
    generator, the Wess-Zumino form; this topology does not determine its integer
    coefficient.
  kind: result
  group: weinberg-2.spontaneously-broken-global-symmetries
  evidence:
  - source: weinberg-2
    section: '19.8'
    pages:
    - 237
    - 238
    note: The source distinguishes exact four-forms from anomalous forms and identifies
      the cohomology classification and SU(N) example.
- id: weinberg-2.anomaly-free-gauge-algebras-and-standard-model-risk
  label: Gauge algebras with automatic local anomaly absence
  summary: Groups with only real or pseudoreal representations, and certain additional
    listed algebras with vanishing D-symbols, have no local perturbative gauge anomaly
    for any fermion representation. Local anomalies can arise with SU(n) factors for
    n≥3 or U(1) factors; therefore Standard Model SU(3)×SU(2)×U(1) requires cancellations
    among quarks and leptons.
  kind: result
  group: weinberg-2.anomaly-free-gauge-theories
  evidence:
  - source: weinberg-2
    section: '22.4'
    pages:
    - 384
    note: The rendered source lists the automatic cases and states that anomalies
      can occur for SU(n) with n≥3 and for U(1) factors.
- id: weinberg-2.anomaly-matching-goldstone-effective-action
  label: Anomaly-matched Goldstone effective action
  summary: For a broken global G realized by confined massless fermions, introduce
    weak fictitious gauge fields and spectators to make the microscopic theory anomaly-free.
    In the low-energy theory, the Goldstone effective action must transform with the
    underlying trapped-fermion anomaly so as to cancel the spectator anomaly. If unbroken
    subgroup H currents are anomaly-free, a local solution is obtained by integrating
    the anomaly along the gauge transformation that removes the Goldstone coordinates,
    and solutions differ by anomaly-free functionals.
  kind: method
  group: weinberg-2.anomalous-goldstone-actions
  evidence:
  - source: weinberg-2
    section: '22.7'
    pages:
    - 408
    - 409
    - 410
    - 411
    note: The source gives the matching argument, the H-anomaly hypothesis, and verifies
      the transformation of the integrated solution.
- id: weinberg-2.anti-brst-ghost-antighost-role-observation
  label: Anti-BRST observation about ghost and antighost roles
  summary: The source records that anti-BRST invariance reveals a similarity between
    the roles of the ghost and antighost despite their asymmetric appearance in the
    construction, while explicitly saying that this similarity remains mysterious.
  kind: concept
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.8'
    pages:
    - 41
    note: The closing sentence of the section identifies the anti-BRST observation
      and preserves the source's unresolved qualification.
- id: weinberg-2.appendix-a-proof-of-compact-algebra-criterion
  label: Appendix proof of the positive-metric compact-algebra criterion
  summary: 'Appendix A supplies a proof route for the earlier stated equivalence:
    a real symmetric positive-definite invariant Lie-algebra metric is equivalent
    to a basis with totally antisymmetric structure constants and to a direct sum
    of compact simple and U(1) subalgebras. The route constructs a real inverse square
    root of the metric to prove total antisymmetry, uses the Hermitian adjoint representation
    to reduce into simple and Abelian blocks, proves each simple block compact because
    -C^c_ad C^d_bc is a positive sum of squares whose kernel would define an invariant
    Abelian subalgebra, and reconstructs an invariant positive metric from compact
    blocks using the Jacobi identity.'
  kind: method
  group: weinberg-2.lie-algebra-appendices
  evidence:
  - source: weinberg-2
    section: Appendix A
    pages:
    - 51
    - 52
    - 53
    note: The appendix explicitly organizes the proof as a implies b, b implies c,
      and c implies a.
- id: weinberg-2.appendix-general-unitarity-gauge-construction
  label: Appendix construction of general unitarity gauge
  summary: Near the identity, factor a group element into gauge, constrained broken-direction,
    and unbroken factors. Minimizing the positive Goldstone quadratic form along the
    gauge orbit imposes the constraint, and continuity then constructs the desired
    local unitarity gauge.
  kind: method
  evidence:
  - source: weinberg-2
    section: Appendix General Unitarity Gauge
    pages:
    - 352
    - 353
- id: weinberg-2.asymptotic-freedom-logarithmic-scaling
  label: Asymptotic freedom and logarithmic scaling
  summary: When the weak-coupling beta-function is negative, the running coupling
    tends to zero at high scale, while operator factors produce logarithmic rather
    than altered energy-power corrections.
  kind: result
  group: weinberg-2.renormalization-group
  evidence:
  - source: weinberg-2
    section: 18.3(d)
    pages:
    - 133
    - 134
    - 135
    note: The source solves the negative-beta weak-coupling flow and analyzes the
      associated operator factors.
- id: weinberg-2.asymptotically-free-ope-logarithmic-coefficients
  label: Asymptotically free logarithmic OPE coefficients
  summary: Near the g=0 ultraviolet fixed point, canonical dimension determines the
    power of the hard scale while anomalous-dimension matrices supply powers of the
    running coupling, equivalently powers of ln K. This perturbative form requires
    weak coupling, but it need not be reduced to a single anomalous-dimension eigenvector.
  kind: result
  group: weinberg-2.ope-coefficient-functions
  evidence:
  - source: weinberg-2
    section: '20.3'
    pages:
    - 264
    - 265
    note: Equations (20.3.7)–(20.3.10) give the asymptotically-free coefficient behavior
      and its validity condition.
- id: weinberg-2.avv-aaa-routing-and-gauge-invariant-completion
  label: AVV/AAA routing and exact gauge-invariant anomaly completions
  summary: For one global/axial current and two gauged/vector currents, a=k₁−k₂ preserves
    both vector currents and gives [∂_μΓ_{αβγ}^{μνρ}]_anom=−D_{αβγ}ε^{κνλρ}∂_{yκ}δ⁴(y−x)∂_{zλ}δ⁴(z−x)/(4π²).
    For AAA, a=(k₁−k₂)/3 gives one third of AVV. With V_μ=λ_aV_{μa}/2, A_μ=λ_aA_{μa}/2,
    V_{μν}=∂_μV_ν−∂_νV_μ−i[V_μ,V_ν]−i[A_μ,A_ν], and A_{μν}=∂_μA_ν−∂_νA_μ−i[V_μ,A_ν]−i[A_μ,V_ν],
    Bardeen's vector-conserving result is 𝒳_aΓ=iε^{μνρσ}Tr{λ_a[V_{μν}V_{ρσ}+A_{μν}A_{ρσ}/3−32A_μA_νA_ρA_σ/3+(8i/3)(A_μA_νV_{ρσ}+A_μV_{ρσ}A_ν+V_{ρσ}A_μA_ν)]}/(32π²).
    For all currents treated symmetrically, square and pentagon graphs complete the
    triangle to [D_μJ^μ_α]_anom=−ε^{κνλρ}Tr{T_α[∂_κA_ν∂_λA_ρ−(i/2)∂_κA_νA_λA_ρ+(i/2)A_κ∂_νA_λA_ρ−(i/2)A_κA_ν∂_λA_ρ]}/(24π²).
  kind: method
  group: weinberg-2.general-anomalies
  evidence:
  - source: weinberg-2
    section: '22.3'
    pages:
    - 376
    - 377
    - 378
    - 379
    - 380
    note: Rendered Eqs. (22.3.23)–(22.3.38) fix both routings, the 1/(4π²), 1/(32π²),
      and 1/(24π²) coefficients, field definitions, and all completion terms.
- id: weinberg-2.axial-anomaly-gauge-chiral-regulator-tradeoff
  label: Gauge versus chiral invariance in axial-current regularization
  summary: The anomalous Ward identity can be rewritten with a Chern-Simons current
    only by using a conserved current that is not gauge invariant. Regulating with
    the free Dirac operator instead would make the axial anomaly vanish but breaks
    gauge invariance; no regulator for both propagators and determinants preserves
    both symmetries.
  kind: result
  group: weinberg-2.abelian-anomaly
  evidence:
  - source: weinberg-2
    section: '22.2'
    pages:
    - 366
    - 367
    note: The source gives the Chern-Simons rewrite and the explicit no-simultaneous-invariance
      conclusion.
- id: weinberg-2.axial-gauge-canonical-reduction
  label: Axial gauge canonical reduction
  summary: Choosing axial gauge A^a_3=0 leaves A^a_i for i=1,2 as canonical gauge
    variables. The Gauss-law constraint, with suitable boundary conditions, determines
    A^a_0 from these variables and the matter canonical variables; this avoids the
    Gribov ambiguity that the source notes for Coulomb gauge.
  kind: method
  group: weinberg-2.field-equations-and-quantization
  evidence:
  - source: weinberg-2
    section: '15.4'
    pages:
    - 15
    - 16
    note: Equations (15.4.4)–(15.4.9) establish the axial-gauge variables and solve
      the constraint for A_0.
  notation:
  - source: weinberg-2
    note: In this gauge i,j run only over spatial values 1 and 2, while the gauge
      condition fixes the 3 component.
- id: weinberg-2.axial-gauge-path-integral-to-covariant-action
  label: Deriving the covariant gauge-field path integral from axial gauge
  summary: Starting with the Gauss-law solution for A^a_0, the source instead introduces
    A^a_0 as an independent Gaussian integration variable, whose stationary point
    is that solution. Provided the matter momentum integration is also Gaussian under
    the stated restriction on the matter Lagrangian, integrating the canonical momenta
    yields a configuration-space integral over matter and all four A^a_μ components
    with the original covariant Lagrangian and an axial-gauge delta functional δ(A^a_3).
  kind: method
  group: weinberg-2.field-equations-and-quantization
  evidence:
  - source: weinberg-2
    section: '15.4'
    pages:
    - 17
    - 18
    note: The source replaces the constrained A_0 solution by independent integration,
      then integrates the canonical momenta under its Gaussian assumption and retains
      all four gauge-field components.
- id: weinberg-2.axion-pion-effective-lagrangian-and-mass
  label: Axion–pion effective Lagrangian and mass
  summary: After choosing axial rephasings c_u+c_d=1 to remove θFF, the source derives
    pion–axion mixing from rotated u,d mass terms and chooses c_u,c_d to eliminate
    the ∂μφ′∂^μπ⁰ cross term. For M≫F_π, m_a²=F_π²m_um_d m_π²/[M²(m_u+m_d)²], and
    m_a=13 MeV/M(GeV) for its quark ratio. The axion eigenvector has pion component
    (m_uc_u−m_dc_d)F_π/[(m_u+m_d)M], so hadron-production amplitudes relative to pion
    production scale as F_π/M; its two-photon decay-rate ratio is stated as ~(F_π/M)²(m_a/m_π)³.
    The source reports M>3 TeV from nonobservation in collisions, M>10^7 GeV from
    red-giant cooling, M>10^10 GeV from SN1987A, and the cosmological upper bound
    M<10^12 GeV.
  kind: result
  group: weinberg-2.instantons-and-theta
  evidence:
  - source: weinberg-2
    section: '23.6'
    pages:
    - 459
    - 460
    - 461
    note: Field redefinition, mixing choice, mass and eigenvector/amplitude formulas,
      two-photon scaling, and reported bounds.
- id: weinberg-2.background-field-gauge-formal-invariance
  label: Background-field gauge and formal background invariance
  summary: Splitting each field into a fixed background and an integrated quantum
    fluctuation, then choosing fᵃ=Dᵘ[A]A′ᵃ_μ, makes the gauge-fixing term covariant
    under a formal transformation in which the background transforms as a connection
    and the fluctuation transforms homogeneously. With matching background transformations
    of matter and ghosts, the measure and modified action imply that the effective
    action is invariant under the background transformations.
  kind: method
  group: weinberg-2.gauge-theory-renormalization
  evidence:
  - source: weinberg-2
    section: '17.4'
    pages:
    - 95
    - 96
    - 97
    - 98
    note: Equations (17.4.1)–(17.4.28) construct the background split, gauge functional,
      and invariant ghost action.
- id: weinberg-2.background-formal-versus-true-gauge-transformations
  label: Formal background transformations differ from true gauge transformations
  summary: The formal background transformation changes the prescribed background
    and rotates fluctuations homogeneously, preserving the chosen background gauge-fixing
    term. A true gauge transformation leaves prescribed backgrounds fixed and transforms
    the total field; it preserves the original Lagrangian but generally does not preserve
    that gauge-fixing term.
  kind: concept
  group: weinberg-2.gauge-theory-renormalization
  evidence:
  - source: weinberg-2
    section: '17.4'
    pages:
    - 97
    - 98
    note: Equations (17.4.16)–(17.4.20) make the distinction and its gauge-fixing
      consequence.
- id: weinberg-2.background-gauge-coupling-renormalization-from-field-strength
  label: Background gauge invariance ties coupling renormalization to the field-strength
    term
  summary: Background gauge invariance restricts divergent local terms to background-covariant
    field-strength, matter, and ghost structures. For a simple group with irreducible
    fermions, redefining fields and mass restores the classical form and forces the
    renormalized coupling to be determined by the coefficient of Fᵃ_{μν}F^{aμν}. Thus
    one background gauge-field amplitude suffices, unlike in a general gauge where
    field and coupling factors must be separated from multiple amplitudes.
  kind: result
  group: weinberg-2.gauge-theory-renormalization
  evidence:
  - source: weinberg-2
    section: '17.4'
    pages:
    - 98
    - 99
    - 100
    note: Equations (17.4.29)–(17.4.48) classify divergences and derive g_R=g(1+L_A)^−1/2.
- id: weinberg-2.bcs-effective-electron-theory-near-fermi-surface
  label: BCS effective electron theory near a Fermi surface
  summary: After ionic degrees of freedom are integrated out under the stated low-energy
    qualification, retain electrons in a thin shell around a Fermi surface. Their
    dispersion linearizes normal to that surface and supplies the propagator used
    for the effective-theory scaling analysis.
  kind: assumption
  evidence:
  - source: weinberg-2
    section: '21.6'
    pages:
    - 342
    - 343
- id: weinberg-2.beta-function-first-two-coefficients-scheme-invariant
  label: Scheme invariance of the first two beta coefficients
  summary: For a nonsingular redefinition of a one-coupling running parameter, the
    first two perturbative beta-function coefficients are unchanged, while higher
    coefficients can be changed.
  kind: result
  group: weinberg-2.renormalization-group
  evidence:
  - source: weinberg-2
    section: '18.3'
    pages:
    - 138
    - 139
    note: The source relates two coupling definitions and proves invariance through
      the second displayed coefficient.
- id: weinberg-2.borel-transform-asymptotic-series-method
  label: Borel transform for factorial perturbative growth
  summary: For a series whose coefficients grow factorially, divide the nth coefficient
    by n! to form a Borel transform and formally reconstruct the original function
    by a Laplace integral. Singularities away from the positive real axis limit convergence
    but need not obstruct that integral; positive-axis singularities make the contour
    prescription ambiguous.
  kind: method
  group: weinberg-2.ope-renormalons
  evidence:
  - source: weinberg-2
    section: '20.7'
    pages:
    - 283
    - 284
    note: Equations (20.7.1)–(20.7.3) define the Borel construction and the text distinguishes
      off-axis from positive-axis singularities.
- id: weinberg-2.bounce-negative-mode-rate-and-exponentiation
  label: Bounce negative mode, rate prefactor, and multi-bounce exponentiation
  summary: The x₀,t₀ collective coordinates give volume and Euclidean-time factors;
    if G→H, orientation collective coordinates add the coset volume G/H to A. The
    scale variation proves at least one negative eigenvalue; the printed claim that
    there is “in fact just one” is attributed to ref. 39 rather than proved here,
    and makes A imaginary. The source does not calculate A and prints A~iM^−4. Summing
    N well-separated identical bounces with 1/N! exponentiates the contribution; it
    then prints Γ/V~M^−4e^(−B). Those two printed powers conflict dimensionally, so
    this record preserves the source rather than silently changing the rate to M^4.
    The decay occurs through bubbles of true vacuum in a false-vacuum background rather
    than by changing the scalar field simultaneously everywhere; after barrier penetration,
    a true-vacuum bubble grows at light speed, collides with other bubbles, and converts
    space to the lowest-energy state.
  kind: result
  group: weinberg-2.semiclassical-euclidean
  evidence:
  - source: weinberg-2
    section: '23.8'
    pages:
    - 467
    - 468
    note: Collective factors including orientation footnote, negative-mode external-proof
      boundary, printed A/rate powers, and N! exponentiation.
- id: weinberg-2.bounce-ode-scaling-positivity
  label: Bounce O(4) equation and positive action
  summary: For large T compared with the potential’s characteristic time, O(4) symmetry
    gives φ″+(3/ρ)φ′=V′(φ), with φ′(0)=0 from analyticity and φ(∞)=0. The mechanical
    analogy is a unit-mass particle in −V with viscous force −(3/ρ)φ′. Rescaling φ_R(ρ)=φ(ρ/R)
    and stationarity yields ∫ρ³(φ′)²dρ=−4∫ρ³Vdρ, hence B=(π²/2)∫ρ³(φ′)²dρ>0.
  kind: method
  group: weinberg-2.semiclassical-euclidean
  evidence:
  - source: weinberg-2
    section: '23.8'
    pages:
    - 466
    note: Large-T and regularity conditions, ODE/analogy, scaling relation, and B
      positivity.
- id: weinberg-2.bps-monopole-radial-solution
  label: BPS monopole radial solution and restored core
  summary: For the BPS first-order equations and F,G→1 at infinity, the source gives
    F=coth p−1/p and G=1−p/sinh p with p=e〈φ〉r. The scalar then vanishes at r→0, explicitly
    realizing restoration of SU(2) at the monopole center. It calls these BPS monopoles
    and says the small-potential condition is λ<e² for the quartic V=λ(φ_nφ_n−〈φ〉²)²
    example.
  kind: result
  group: weinberg-2.monopoles-and-defects
  evidence:
  - source: weinberg-2
    section: '23.3'
    pages:
    - 441
    note: First-order radial equations, exact profiles, core behavior, and potential-size
      qualification.
- id: weinberg-2.bpst-instanton-action-and-normalization
  label: BPST instanton action, winding, and coupling convention
  summary: The Belavin–Polyakov–Schwarz–Tyupkin solution built from a standard SU(2)
    subgroup has v=1 and arbitrary scale R; it can also be translated or gauge transformed.
    In the displayed field normalization S=8π²|v| and ∫εF F=64π²v, whereas the conventional
    coupling convention yields Euclidean action I=−8π²|v|/g² and ∫εF F=64π²v/g². The
    source states uniqueness up to those degrees of freedom for v=1.
  kind: result
  group: weinberg-2.instantons-and-theta
  evidence:
  - source: weinberg-2
    section: '23.5'
    pages:
    - 452
    - 453
    note: BPST solution properties, winding/action formulas, and normalization conversion.
  notation:
  - source: weinberg-2
    note: The first S[A] convention omits g from generators; the conventional normalization
      changes the displayed F components and action as stated.
- id: weinberg-2.broken-gauge-vector-mass-matrix-kernel
  label: Elementary-scalar broken-gauge vector mass matrix and unbroken kernel
  summary: For elementary canonically normalized scalar fields, expanding around the
    scalar vacuum gives a real symmetric positive vector mass matrix. Its null vectors
    are exactly the unbroken generator combinations, so every and only unbroken gauge
    symmetry has a massless gauge boson; Section 21.4 separately gives the strong-dynamics
    result.
  kind: result
  evidence:
  - source: weinberg-2
    section: '21.1'
    pages:
    - 296
    - 297
- id: weinberg-2.broken-theory-xi-gauge-fixing
  label: Renormalizable ξ-gauge fixing for a broken gauge theory
  summary: Choose a gauge-fixing function containing both the divergence of the gauge
    field and the vacuum-times-shifted-scalar term. It cancels scalar-vector mixing;
    ξ→∞ recovers unitarity gauge and ξ→0 gives Landau gauge.
  kind: method
  evidence:
  - source: weinberg-2
    section: '21.2'
    pages:
    - 301
- id: weinberg-2.broken-theory-xi-spectrum-and-renormalizability
  label: ξ-gauge spectrum, cancellation, and renormalizability qualification
  summary: The broken-theory ξ gauge includes ghosts and gauge-dependent Goldstone
    masses √ξ times nonzero vector masses. For finite ξ the propagators have unbroken-theory
    ultraviolet behavior, while renormalizability still requires the symmetry constraint
    on divergences beyond good propagators.
  kind: result
  evidence:
  - source: weinberg-2
    section: '21.2'
    pages:
    - 302
    - 303
    - 304
- id: weinberg-2.brst-beyond-power-counting-and-bilinear-faddeev-popov
  label: Why BRST must extend power counting and bilinear Faddeev–Popov actions
  summary: Power counting does not by itself ensure that every divergence has an available
    counterterm, and nonlinear BRST transformations do not directly transfer Lagrangian
    symmetry to Green functions or matrix elements. The source also notes that gauges
    beyond the bilinear Faddeev–Popov construction can require quartic ghost counterterms;
    the more general ghost-number-zero BRST-invariant action permits the needed BRST-exact
    gauge-fixing functional beyond the bilinear form.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: 15.6–15.7
    pages:
    - 27
    - 32
    - 35
    note: These pages state the power-counting limitation, the nonlinear-BRST limitation,
      and the need for four-ghost counterterms in more general gauges.
- id: weinberg-2.brst-cohomology-classification-of-local-anomalies
  label: BRST cohomology classification of local anomalies
  summary: 'With a fermionic ghost and nilpotent BRST differential, the Wess-Zumino
    condition is exactly sG[ω,A]=0 for the ghost-linear anomaly functional. An anomaly
    of the form sF[A] for a local ghost-number-zero functional can be removed by a
    local action counterterm. Thus candidate anomalies are H¹(s|d): local ghost-number-one
    functions closed modulo a derivative, modulo BRST-exact local terms and derivatives.'
  kind: method
  group: weinberg-2.consistency-and-cohomology
  evidence:
  - source: weinberg-2
    section: '22.6'
    pages:
    - 398
    - 399
    note: The source proves BRST equivalence and defines the local cohomology quotient.
- id: weinberg-2.brst-cohomology-of-physical-states
  label: Physical states as BRST cohomology
  summary: The conserved BRST charge Q is nilpotent. Gauge-fixing independence of
    physical matrix elements requires physical states to be annihilated by Q, and
    two such states differing by a Q-exact state are physically equivalent. Thus independent
    physical states are the cohomology ker Q / im Q.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 32
    - 33
    note: Equations (15.7.27)–(15.7.31) connect changes of the gauge-fixing functional
      to Q and derive the cohomological characterization.
- id: weinberg-2.brst-conditional-ghost-free-gauge-independence
