nodes:
- id: weinberg-2.adjoint-representation
  label: Adjoint representation from structure constants
  summary: For structure constants satisfying the displayed antisymmetry and Jacobi
    relation, matrices (t^A_α)^β{}_γ=−i C^β_{γα} furnish the adjoint (regular) representation
    of the Lie algebra.
  kind: representation
  group: weinberg-2.gauge-construction
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 3
    note: Equations (15.1.6)–(15.1.7) construct and name the adjoint representation.
  notation:
  - source: weinberg-2
    note: A superscript A on t denotes the adjoint representation in this treatment.
- id: weinberg-2.axial-gauge-canonical-reduction
  label: Axial gauge canonical reduction
  summary: Choosing axial gauge A^a_3=0 leaves A^a_i for i=1,2 as canonical gauge
    variables. The Gauss-law constraint, with suitable boundary conditions, determines
    A^a_0 from these variables and the matter canonical variables; this avoids the
    Gribov ambiguity that the source notes for Coulomb gauge.
  kind: method
  group: weinberg-2.field-equations-and-quantization
  evidence:
  - source: weinberg-2
    section: '15.4'
    pages:
    - 15
    - 16
    note: Equations (15.4.4)–(15.4.9) establish the axial-gauge variables and solve
      the constraint for A_0.
  notation:
  - source: weinberg-2
    note: In this gauge i,j run only over spatial values 1 and 2, while the gauge
      condition fixes the 3 component.
- id: weinberg-2.axial-gauge-path-integral-to-covariant-action
  label: Deriving the covariant gauge-field path integral from axial gauge
  summary: Starting with the Gauss-law solution for A^a_0, the source instead introduces
    A^a_0 as an independent Gaussian integration variable, whose stationary point
    is that solution. Provided the matter momentum integration is also Gaussian under
    the stated restriction on the matter Lagrangian, integrating the canonical momenta
    yields a configuration-space integral over matter and all four A^a_μ components
    with the original covariant Lagrangian and an axial-gauge delta functional δ(A^a_3).
  kind: method
  group: weinberg-2.field-equations-and-quantization
  evidence:
  - source: weinberg-2
    section: '15.4'
    pages:
    - 17
    - 18
    note: The source replaces the constrained A_0 solution by independent integration,
      then integrates the canonical momenta under its Gaussian assumption and retains
      all four gauge-field components.
- id: weinberg-2.brst-beyond-power-counting-and-bilinear-faddeev-popov
  label: Why BRST must extend power counting and bilinear Faddeev–Popov actions
  summary: Power counting does not by itself ensure that every divergence has an available
    counterterm, and nonlinear BRST transformations do not directly transfer Lagrangian
    symmetry to Green functions or matrix elements. The source also notes that gauges
    beyond the bilinear Faddeev–Popov construction can require quartic ghost counterterms;
    the more general ghost-number-zero BRST-invariant action permits the needed BRST-exact
    gauge-fixing functional beyond the bilinear form.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: 15.6–15.7
    pages:
    - 27
    - 32
    - 35
    note: These pages state the power-counting limitation, the nonlinear-BRST limitation,
      and the need for four-ghost counterterms in more general gauges.
- id: weinberg-2.brst-cohomology-of-physical-states
  label: Physical states as BRST cohomology
  summary: The conserved BRST charge Q is nilpotent. Gauge-fixing independence of
    physical matrix elements requires physical states to be annihilated by Q, and
    two such states differing by a Q-exact state are physically equivalent. Thus independent
    physical states are the cohomology ker Q / im Q.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 32
    - 33
    note: Equations (15.7.27)–(15.7.31) connect changes of the gauge-fixing functional
      to Q and derive the cohomological characterization.
- id: weinberg-2.brst-electrodynamic-polarization-example
  label: BRST cohomology removes unphysical photon and ghost states
  summary: In the free electrodynamic example, Q-closed one-photon states have transverse
    polarization, and polarizations differing by a multiple of momentum are Q-equivalent.
    Longitudinal/temporal unphysical modes and ghost excitations are excluded or Q-exact,
    leaving a physical Hilbert space free of ghosts and antighosts.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 33
    - 34
    note: Equations (15.7.32)–(15.7.36) and their interpretation give the polarization
      equivalence and removal of ghost states.
- id: weinberg-2.brst-exact-gauge-fixing
  label: Gauge fixing as a BRST-exact term
  summary: For the auxiliary-field formulation, the gauge-fixed action has the form
    I_new=∫d⁴x L+sΨ. Since the matter-plus-gauge Lagrangian is gauge invariant and
    s is nilpotent, both terms are BRST invariant; the gauge-fixing and ghost contribution
    is BRST exact.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 31
    - 32
    note: Equations (15.7.21)–(15.7.26) identify the gauge transformation parameter
      and rewrite the new action.
- id: weinberg-2.brst-field-transformations
  label: BRST transformations with auxiliary field
  summary: Introducing the Nakanishi–Lautrup field h^a via a Fourier representation
    of the gauge-fixing weight gives a gauge-fixed action invariant under a constant
    anticommuting BRST transformation. On matter and gauge fields it is a gauge transformation
    with parameter proportional to ω^a; it transforms the antighost into h^a, h^a
    trivially, and the ghost quadratically through C_{abc}ω^bω^c.
  kind: method
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 28
    - 29
    note: Equations (15.7.5)–(15.7.11) introduce h and list the BRST transformations.
  notation:
  - source: weinberg-2
    note: The BRST parameter θ is a constant anticommuting c-number; h^a is often
      called the Nakanishi–Lautrup field.
- id: weinberg-2.brst-nilpotence
  label: Nilpotence of the BRST differential
  summary: The BRST operator s satisfies s²=0 on all fields and their products. For
    matter and gauge fields the cancellation uses the Lie-algebra commutator, antisymmetry,
    and Jacobi identity; for arbitrary products it uses the graded Leibniz rule and
    the opposite statistics of sφ relative to φ.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 29
    - 30
    - 31
    note: Equations (15.7.14)–(15.7.20) prove nilpotence first on fields and then
      on arbitrary functionals.
- id: weinberg-2.brst-unitarity-and-general-gauge-fixing
  label: BRST quantization and gauge-fixing-functional independence
  summary: A general local ghost-number-zero BRST-invariant action can be written
    as a gauge/matter functional plus s applied to a ghost-number-minus-one functional.
    For Yang–Mills theory, BRST-closed S-matrix elements are independent of that functional;
    with the stated Yang–Mills result, the BRST cohomology is ghost-free, positive
    definite, and has a unitary S-matrix, while separate proofs are needed for other
    local symmetries.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.7'
    pages:
    - 35
    - 36
    note: Equation (15.7.40) and the following discussion state the general action,
      ghost decoupling argument, and qualified BRST-quantization result.
- id: weinberg-2.compact-simple-lie-algebra-classification
  label: Classification consequences for compact simple gauge algebras
  summary: The positive-metric restriction leaves compact simple algebras of limited
    types and dimensions. The source identifies the unique three-generator case, shared
    by O(3) and SU(2), reports no simple algebras with four through seven generators,
    and places the compact simple algebras into classical infinite families plus five
    exceptional algebras.
  kind: result
  group: weinberg-2.lagrangian-and-algebra
  evidence:
  - source: weinberg-2
    section: '15.2'
    pages:
    - 11
    note: The source gives the three-generator case, the four-to-seven gap, and the
      classical-plus-exceptional classification.
  notation:
  - source: weinberg-2
    note: The three-generator structure constant has an arbitrary nonzero scale c
      that can be removed by rescaling generators in the source's compact basis.
- id: weinberg-2.compactness-and-hermitian-representations
  label: Compact gauge algebras and Hermitian finite representations
  summary: The source distinguishes real changes of basis, which preserve a real Lie
    algebra, from complex changes that can turn a noncompact real form into a compact
    one. It then states that finite-dimensional representations of compact groups
    are unitary and that independent finite-dimensional Hermitian generators require
    a direct sum of compact simple and U(1) algebras.
  kind: result
  group: weinberg-2.lagrangian-and-algebra
  evidence:
  - source: weinberg-2
    section: '15.2'
    pages:
    - 10
    note: The page contrasts real and complex basis changes and derives the algebraic
      restriction from a positive trace metric.
- id: weinberg-2.covariant-derivative
  label: Covariant derivative of matter fields
  summary: The operator (D_μψ)_l=∂_μψ_l−iA^β_μ(t_β)_l{}^mψ_m is constructed so that
    D_μψ transforms in the same representation as ψ under the local transformation.
    This records the endpoint of the source's cancellation argument through equation
    (15.1.11).
  kind: method
  group: weinberg-2.connection-and-curvature
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 4
    note: Equations (15.1.10)–(15.1.11) define D_μ and show its homogeneous transformation.
  notation:
  - source: weinberg-2
    note: D_μ acts on matter components through the representation matrices t_β.
- id: weinberg-2.covariant-field-equation-and-matter-current
  label: Gauge-covariant field equation and matter-current conservation
  summary: Rewriting the gauge equation as D_μF^{aμν}=−J^{aν} isolates the matter
    current. Gauge invariance makes this equation covariant and gives D_νJ^{aν}=0,
    rather than ordinary conservation of the matter current alone.
  kind: result
  group: weinberg-2.field-equations-and-quantization
  evidence:
  - source: weinberg-2
    section: '15.3'
    pages:
    - 13
    note: Equations (15.3.5)–(15.3.8) define the covariant derivative on F, identify
      the matter current, and state covariant conservation.
  notation:
  - source: weinberg-2
    note: D_μ acts here in the adjoint representation on the group label of F and
      J.
- id: weinberg-2.covariant-gauge-ghost-propagator-and-vertex
  label: Adjoint massless ghost propagator and ghost–gauge vertex
  summary: In generalized ξ gauge, the Faddeev–Popov operator splits into a field-independent
    free part and a field-dependent part. The ghosts therefore propagate as massless
    spinless fermions in the adjoint representation and have a one-gauge-boson ghost–antighost
    interaction vertex determined by the structure constants.
  kind: result
  group: weinberg-2.gauge-fixing-and-ghosts
  evidence:
  - source: weinberg-2
    section: '15.6'
    pages:
    - 26
    note: Equations (15.6.8)–(15.6.14) give the operator, propagator, interaction,
      and vertex.
  notation:
  - source: weinberg-2
    note: The source uses ω^a for a ghost and ω^*_a for an antighost, with gauge indices
      in the adjoint representation.
- id: weinberg-2.dewitt-notation-general-local-symmetry
  label: De Witt notation for general local symmetries
  summary: For a general action and measure invariant under δφ^r=ε^Aδ_Aφ^r, De Witt
    indices r and A include both spacetime and discrete labels and repeated indices
    imply sums and integrals. This notation extends the BRST setup beyond Yang–Mills
    theory to local symmetries such as those in gravity and string theory.
  kind: representation
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.8'
    pages:
    - 36
    - 37
    note: Equation (15.8.1) and the following paragraph define the compressed index
      convention and give the Yang–Mills example.
  notation:
  - source: weinberg-2
    note: In this section A labels an independent gauge variation and r labels fields,
      both potentially including spacetime coordinates.
- id: weinberg-2.faddeev-popov-gauge-fixed-functional-integral
  label: Faddeev–Popov gauge-fixed functional integral
  summary: The De Witt–Faddeev–Popov setup integrates gauge and matter fields with
    a gauge-invariant weighted measure, a noninvariant gauge-fixing functional f^a,
    a numerical weight B[f], and the determinant of the variation of f under a gauge
    transformation. Axial gauge is a special case whose determinant is field independent.
  kind: method
  group: weinberg-2.gauge-fixing-and-ghosts
  evidence:
  - source: weinberg-2
    section: '15.5'
    pages:
    - 19
    - 20
    note: Equations (15.5.1)–(15.5.7) define the general integral and identify axial
      gauge as its special case.
- id: weinberg-2.faddeev-popov-gauge-fixing-independence
  label: Gauge-fixing independence in the Faddeev–Popov theorem
  summary: Assuming the gauge transformations form a group and the required Jacobians
    exist, inserting the invariant Haar measure over transformations turns the gauge-fixing
    functions into integration variables. The resulting gauge-fixed integral is independent
    of the choice of f^a and depends on B only through a constant, with the infinite
    gauge-orbit volume cancelling formally between numerator and denominator.
  kind: result
  group: weinberg-2.gauge-fixing-and-ghosts
  evidence:
  - source: weinberg-2
    section: '15.5'
    pages:
    - 21
    - 22
    note: Equations (15.5.17)–(15.5.21) complete the theorem and the following discussion
      records the gauge-orbit divergence caveat.
- id: weinberg-2.faddeev-popov-ghost-determinant
  label: Faddeev–Popov determinant as ghost fields
  summary: A Faddeev–Popov determinant is represented by a path integral over independent
    anticommuting fields ω^a and ω^*_a. These Lorentz-scalar fields have Fermi statistics
    because bosonic variables would generate the inverse determinant; they carry ghost
    numbers +1 and −1 and do not label external physical particles.
  kind: method
  group: weinberg-2.gauge-fixing-and-ghosts
  evidence:
  - source: weinberg-2
    section: '15.6'
    pages:
    - 25
    note: Equations (15.6.1)–(15.6.4) give the determinant representation and the
      page explains statistics and ghost number.
  notation:
  - source: weinberg-2
    note: ω and ω* are independent variables, not assumed to be related by complex
      conjugation.
- id: weinberg-2.finite-gauge-transformations
  label: Finite gauge transformations
  summary: A finite transformation acts on matter through exp(i t_αΛ^α(x)); requiring
    the covariant derivative to transform in the same way fixes the corresponding
    finite transformation law for the gauge field. Its infinitesimal limit recovers
    the earlier local rules.
  kind: method
  group: weinberg-2.connection-and-curvature
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 5
    note: Equations (15.1.15)–(15.1.17) give the finite matter and gauge-field transformations
      and relate them to the infinitesimal rules.
  notation:
  - source: weinberg-2
    note: Λ^α(x) parameterizes the finite group element, while ε^α(x) denotes its
      infinitesimal limit.
- id: weinberg-2.gauge-charge-includes-gauge-fields
  label: Non-Abelian charge includes the gauge-field contribution
  summary: The ordinarily conserved total current defines time-independent charges
    T^a=∫d^3x j^{a0}. Its gauge-field term is required because non-Abelian gauge fields
    carry the quantum numbers with which they interact; this is contrasted with electrodynamics.
  kind: result
  group: weinberg-2.field-equations-and-quantization
  evidence:
  - source: weinberg-2
    section: '15.3'
    pages:
    - 14
    note: The discussion around equation (15.3.10) interprets the conserved total
      current and explains its gauge-field term.
- id: weinberg-2.gauge-field-lagrangian-restrictions
  label: Gauge-field terms and mass restriction
  summary: Within this construction, the gauge field may occur only through field
    strengths and covariant derivatives; a direct quadratic mass term is excluded.
    For a parity-conserving Lorentz-invariant gauge-field term, the source gives −¼
    g_{αβ}F^α_{μν}F^{βμν} with constant g_{αβ}. If parity (or CP or T) conservation
    is not assumed, it may also include L′_A=−½ θ_{αβ}ε^{μνρσ}F^α_{μν}F^β_{ρσ}, with
    constant θ_{αβ}; the source describes this term as a derivative that does not
    affect the field equations or Feynman rules.
  kind: result
  group: weinberg-2.lagrangian-ingredients
  evidence:
  - source: weinberg-2
    section: '15.2'
    pages:
    - 7
    note: The opening page of Section 15.2 excludes direct gauge-field dependence
      and the mass term, then gives the parity-conserving quadratic field-strength
      term in equation (15.2.3).
  notation:
  - source: weinberg-2
    note: g_{αβ} is a constant matrix in the displayed quadratic gauge-field Lagrangian
      term.
  - source: weinberg-2
    note: θ_{αβ} is the other constant matrix in the displayed parity-odd term; ε^{μνρσ}
      is the spacetime antisymmetric tensor used there.
- id: weinberg-2.gauge-field-transformation
  label: Inhomogeneous gauge-field transformation
  summary: Gauge fields A^α_μ transform as δA^β_μ=∂_μ ε^β+C^β_{γα}ε^α A^γ_μ. The derivative
    of the local parameter supplies the compensating term missing from the derivative
    of a matter field.
  kind: concept
  group: weinberg-2.connection-and-curvature
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 4
    note: Equations (15.1.8)–(15.1.9) derive the need for and give the gauge-field
      transformation.
  notation:
  - source: weinberg-2
    note: The book includes coupling factors in t_α, and consequently in the structure
      constants, rather than displaying a separate coupling in D_μ.
- id: weinberg-2.gauge-invariant-functional-measure-assumption
  label: Gauge invariance of the functional measure
  summary: For gauge fields, the infinitesimal transformation has unit Jacobian to
    first order because C^a_{aγ}=0, so the gauge-field volume element is invariant.
    The chapter assumes the matter-field measure is also gauge invariant, while flagging
    subtleties to be revisited in the anomaly discussion.
  kind: assumption
  group: weinberg-2.field-equations-and-quantization
  evidence:
  - source: weinberg-2
    section: '15.4'
    pages:
    - 18
    note: Equation (15.4.17) and the final paragraph establish the gauge-field argument
      and state the matter-measure assumption.
- id: weinberg-2.gauge-invariant-lagrangian-ingredients
  label: Gauge-covariant ingredients for a Lagrangian
  summary: A Lagrangian built from matter fields, their gauge-covariant derivatives,
    field strengths, and covariant derivatives of field strengths is gauge invariant
    when it is invariant under the corresponding global transformations, because these
    ingredients transform without derivatives of the local parameters.
  kind: concept
  group: weinberg-2.lagrangian-ingredients
  evidence:
  - source: weinberg-2
    section: '15.2'
    pages:
    - 7
    note: The opening of Section 15.2 gives the sufficient construction criterion
      and lists the allowed covariant ingredients in equation (15.2.1).
- id: weinberg-2.general-brst-cohomology-functional-result
  label: General BRST cohomology of ghost-number-zero functionals
  summary: Within the stated general setup, the source states that a BRST-invariant
    ghost-number-zero functional is a gauge-invariant functional of the original fields
    plus an s-exact functional of ghost number minus one. The included range begins
    a proof by grading terms by their total h and antighost number and introducing
    a Hodge operator; the proof is not complete within this packet.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.8'
    pages:
    - 40
    note: Equation (15.8.14) states the result and equations (15.8.15)–(15.8.18) begin
      the proof.
- id: weinberg-2.general-faddeev-popov-dewitt-theorem
  label: Faddeev–Popov–De Witt theorem for general local symmetries
  summary: For general local transformations, gauge-fixing functionals f_A must be
    chosen so the functional matrix δ_Af_B has nonzero determinant. The theorem represents
    the gauge-invariant integral through a gauge-fixed integral with this determinant
    and B[f], whose dependence on the gauge-fixing choice is only through the normalization
    constant under the stated assumptions.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.8'
    pages:
    - 37
    - 38
    note: Equations (15.8.2)–(15.8.7) state the theorem and its Fourier/ghost implementation.
- id: weinberg-2.generalized-brst-slavnov-operator
  label: Generalized BRST Slavnov operator and closure condition
  summary: For general local symmetries, the Slavnov operator acts on fields, ghosts,
    antighosts, and auxiliary fields using possibly field-dependent gauge variations
    and structure functions. Nilpotence requires both closure of the gauge transformations
    and a generalized consistency condition that replaces the ordinary Jacobi identity
    when the structure constants depend on fields.
  kind: method
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.8'
    pages:
    - 39
    - 40
    note: Equations (15.8.8)–(15.8.13) define the operator, state its nilpotence conditions,
      and show BRST invariance of the gauge-fixed action.
  notation:
  - source: weinberg-2
    note: The subscript L on a derivative in (15.8.9) denotes left differentiation
      for fermionic variables.
- id: weinberg-2.generalized-feynman-gauge-propagator
  label: Generalized Feynman (ξ) gauge
  summary: Taking B[f]=exp[−(i/2ξ)∫f^af^a] and f^a=∂^μA^a_μ adds the covariant gauge-fixing
    term and yields the massless vector propagator with ξ-dependent longitudinal part.
    ξ=0 gives Landau gauge and ξ=1 Feynman gauge; physical amplitudes may be checked
    for ξ independence.
  kind: method
  group: weinberg-2.gauge-fixing-and-ghosts
  evidence:
  - source: weinberg-2
    section: '15.5'
    pages:
    - 23
    - 24
    note: Equations (15.5.22)–(15.5.25) give the choice and propagator; the next page
      recommends the ξ-independence check.
  notation:
  - source: weinberg-2
    note: The book writes the gauge parameter as ξ and calls nonzero-ξ propagators
      generalized Feynman or generalized ξ gauges.
- id: weinberg-2.ghost-loop-compensation-and-power-counting
  label: Ghost loops compensate gauge overcounting
  summary: Ghosts run only in closed loops with an additional fermionic minus sign.
    The source interprets each ghost–antighost pair as a negative degree of freedom
    that compensates the overcounting produced by covariant gauge propagators, and
    notes that the resulting ξ-gauge Lagrangian is power-counting renormalizable when
    the matter Lagrangian is.
  kind: result
  group: weinberg-2.gauge-fixing-and-ghosts
  evidence:
  - source: weinberg-2
    section: '15.6'
    pages:
    - 27
    note: The page gives the loop interpretation, degree-of-freedom rationale, and
      dimensionality-four-or-less power-counting statement.
- id: weinberg-2.lie-algebra-structure-constants
  label: Lie-algebra generators and structure constants
  summary: The generators obey [t_α,t_β]=i C^γ_{αβ}t_γ. The real structure constants
    are antisymmetric in α and β and obey the Jacobi constraint inherited from the
    generator commutator.
  kind: representation
  group: weinberg-2.gauge-construction
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 2
    - 3
    note: Equations (15.1.2)–(15.1.5) give the commutator, antisymmetry, and Jacobi
      constraint.
  notation:
  - source: weinberg-2
    note: The book writes the structure constants as C^γ_{αβ}; their placement should
      not be silently replaced by another convention.
- id: weinberg-2.local-matter-gauge-transformations
  label: Local infinitesimal transformations of matter fields
  summary: Matter components transform infinitesimally as δψ_l(x)=i ε^α(x)(t_α)_l{}^m
    ψ_m(x), with real spacetime-dependent parameters and constant generator matrices.
  kind: concept
  group: weinberg-2.gauge-construction
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 2
    note: Equation (15.1.1) states the local matter-field transformation and identifies
      the parameters and generators.
  notation:
  - source: weinberg-2
    note: Weinberg uses Greek generator labels α, β, … and spacetime indices μ, ν,
      …; matter components are ψ_l.
- id: weinberg-2.nonabelian-bianchi-identity
  label: Non-Abelian Bianchi identity
  summary: The cyclic covariant-derivative identity D_λF^a_{μν}+D_νF^a_{λμ}+D_μF^a_{νλ}=0
    follows from the covariant-derivative commutator and holds independently of the
    field equations.
  kind: result
  group: weinberg-2.field-equations-and-quantization
  evidence:
  - source: weinberg-2
    section: '15.3'
    pages:
    - 13
    note: Equation (15.3.9) is stated as an identity valid on and off shell.
- id: weinberg-2.nonabelian-field-strength
  label: Non-Abelian field strength from covariant-derivative commutators
  summary: The commutator [D_ν,D_μ] acting on matter defines F^γ_{νμ}; explicitly
    F^γ_{νμ}=∂_νA^γ_μ−∂_μA^γ_ν+C^γ_{αβ}A^α_νA^β_μ. It transforms homogeneously in
    the adjoint representation. The source identifies this as a commutator construction
    and leaves a direct transformation-law check to the reader.
  kind: result
  group: weinberg-2.connection-and-curvature
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 5
    note: Equations (15.1.12)–(15.1.14) define the field strength through the commutator
      and give its transformation law.
  notation:
  - source: weinberg-2
