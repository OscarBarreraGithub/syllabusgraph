  label: Couplings as normalization of simple algebra factors
  summary: After decomposing the gauge algebra into simple or U(1) factors, one may
    rescale gauge fields so g_{αβ}=δ_{αβ}. The corresponding factor-specific constants
    then occur in the generators and structure constants; equivalently, with fixed
    generator normalization they appear as inverse squared factors in the gauge-field
    Lagrangian.
  kind: concept
  group: weinberg-2.lagrangian-and-algebra
  evidence:
  - source: weinberg-2
    section: '15.2'
    pages:
    - 11
    - 12
    note: Equations (15.2.5)–(15.2.9) identify the factor-by-factor rescaling and
      the resulting coupling conventions.
  notation:
  - source: weinberg-2
    note: Weinberg absorbs a coupling g_m for each simple or U(1) subalgebra into
      t_a and C^a_{bc} after normalizing g_{αβ} to δ_{αβ}.
- id: weinberg-2.yang-mills-field-equations-and-total-current
  label: Yang–Mills field equation and ordinarily conserved total current
  summary: Varying the normalized Yang–Mills Lagrangian gives a field equation that
    can be written with an ordinary divergence equal to a total current. This current
    includes a gauge-field contribution as well as the matter contribution, and it
    is ordinarily conserved.
  kind: result
  group: weinberg-2.field-equations-and-quantization
  evidence:
  - source: weinberg-2
    section: '15.3'
    pages:
    - 12
    note: Equations (15.3.2)–(15.3.4) define the current and state its ordinary conservation.
  notation:
  - source: weinberg-2
    note: The source writes the total current as j^a_ν and reserves J^a_ν for the
      matter-only covariant current introduced next.
- id: weinberg-2.yang-mills-first-class-constraints
  label: First-class constraints in canonical Yang–Mills theory
  summary: Canonical Yang–Mills quantization has the primary constraint π^{a0}=0 and
    a secondary Gauss-law constraint. Their Poisson brackets vanish because the secondary
    constraint is independent of A^a_0, so they are first class and cannot be handled
    by the direct Dirac-bracket replacement used for second-class constraints.
  kind: result
  group: weinberg-2.field-equations-and-quantization
  evidence:
  - source: weinberg-2
    section: '15.4'
    pages:
    - 15
    note: Equations (15.4.2)–(15.4.3) and the following text identify the constraints
      and their first-class character.
- id: weinberg-2.yang-mills-original-massless-vector-obstacle
  label: Historical mass obstacle in the original Yang-Mills interpretation
  summary: 'The source describes the 1954 Yang-Mills proposal as an SU(2) isotopic-spin
    gauge theory whose photon-analog vector fields were identified with strongly interacting
    isovector mesons. It records the immediate phenomenological obstacle: gauge invariance
    would require them to be massless, so they were expected already to have been
    detected.'
  kind: result
  group: weinberg-2.gauge-theory-framing
  evidence:
  - source: weinberg-2
    section: 15 opening
    pages:
    - 1
    note: The opening gives the original SU(2) interpretation and explicitly states
      the massless-vector obstacle.
- id: weinberg-2.yang-mills-three-and-four-vector-vertices
  label: Three- and four-vector Yang–Mills vertices
  summary: The cubic and quartic terms in the non-Abelian field-strength Lagrangian
    yield three- and four-vector-boson momentum-space vertices. Because Weinberg absorbs
    couplings into C_{abc}, the cubic and quartic vertex factors are respectively
    first and second order in the couplings.
  kind: result
  group: weinberg-2.gauge-fixing-and-ghosts
  evidence:
  - source: weinberg-2
    section: '15.5'
    pages:
    - 24
    note: Equations (15.5.26)–(15.5.27) give the momentum-space vertex factors and
      the text identifies their coupling orders.
- id: weinberg-2.zero-gauge-coupling-vector-goldstone-exchange-equivalence
  label: Zero-gauge-coupling vector/Goldstone exchange equivalence
  summary: Assuming for simplicity that all gauged symmetries are broken, the singular
    inverse vector-mass contribution makes unitarity-gauge vector exchange survive
    when gauge couplings vanish. Canonical Goldstone normalization and the current-coupling
    formulas give the same amplitude as Goldstone exchange, establishing continuity
    of physical matrix elements.
  kind: method
  evidence:
  - source: weinberg-2
    section: '21.1'
    pages:
    - 299
    - 300
- id: weinberg-2.zero-momentum-goldstone-effective-vertices
  label: Zero-momentum Goldstone effective-vertex constraints
  summary: Differentiated effective-potential symmetry identities make vacuum tadpoles
    and zero-momentum transitions from a Goldstone boson to other scalars vanish.
    A further identity makes the three-Goldstone zero-momentum vertex vanish, so soft
    Goldstones are not emitted from external soft-Goldstone lines at leading order.
  kind: result
  group: weinberg-2.spontaneously-broken-global-symmetries
  evidence:
  - source: weinberg-2
    section: '19.2'
    pages:
    - 176
    - 177
    note: Equations (19.2.53)–(19.2.56) give the zero-momentum interaction and vertex
      consequences.
- id: weinberg-2.zero-resistance-and-ac-josephson-effect
  label: Zero resistance and ac Josephson effect
  summary: The phase is conjugate to minus charge density, making its time derivative
    equal to minus voltage. A steady current then has zero voltage drop, while a junction's
    periodic phase-dependent energy gives an alternating current with frequency e|ΔV|/(πℏ).
  kind: result
  evidence:
  - source: weinberg-2
    section: '21.6'
    pages:
    - 335
    - 336
- id: weinberg-2.zinn-justin-equation-for-quantum-effective-action
  label: Zinn–Justin equation for the quantum effective action
  summary: Coupling external K fields to the BRST variations Aⁿ and Legendre transforming
    only the ordinary sources makes the expectation of Aⁿ a K derivative of Γ[x,K].
    BRST nilpotence then yields the Zinn–Justin equation, equivalently the vanishing
    antibracket (Γ,Γ), as a quantum effective-action constraint.
  kind: method
  group: weinberg-2.gauge-theory-renormalization
  evidence:
  - source: weinberg-2
    section: '17.1'
    pages:
    - 80
    - 81
    - 82
    note: Equations (17.1.1)–(17.1.11) introduce K, derive the derivative identity,
      and give the Zinn–Justin equation.
