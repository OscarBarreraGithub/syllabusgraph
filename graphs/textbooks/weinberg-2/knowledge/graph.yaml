      term uses A^α_νA^β_μ.
- id: weinberg-2.nonabelian-gauge-self-interaction
  label: Unavoidable non-Abelian gauge self-interactions
  summary: Because the gauge field transforms in the adjoint representation, its gauge-invariant
    field-strength kinetic term contains interaction terms. Thus, unlike electrodynamics,
    a non-Abelian gauge-field kinetic term cannot be introduced without self-interactions.
  kind: result
  group: weinberg-2.lagrangian-and-algebra
  evidence:
  - source: weinberg-2
    section: '15.2'
    pages:
    - 8
    note: The source explains why the quadratic field-strength term necessarily supplies
      gauge-field interactions.
  notation:
  - source: weinberg-2
    note: The interaction coefficients remain in the structure constants under the
      book's coupling convention.
- id: weinberg-2.positive-invariant-lie-algebra-metric
  label: Positive invariant metric restricts the gauge algebra
  summary: A real symmetric positive-definite matrix g_{αβ} in the quadratic gauge-field
    Lagrangian must obey the structure-constant invariance condition. The source states
    this is equivalent to a basis with totally antisymmetric structure constants and
    to a direct sum of compact simple and U(1) subalgebras.
  kind: result
  group: weinberg-2.lagrangian-and-algebra
  evidence:
  - source: weinberg-2
    section: '15.2'
    pages:
    - 8
    - 9
    note: Pages 8–9 state the invariance and positivity requirements and the three
      equivalent algebraic conditions.
  notation:
  - source: weinberg-2
    note: g_{αβ} is the numerical matrix multiplying F^α_{μν}F^{βμν}; the book permits
      upper/lower generator-index distinction to be dropped only in the special antisymmetric
      basis.
- id: weinberg-2.pure-gauge-flatness
  label: Pure gauge and the flatness criterion
  summary: A gauge field is pure gauge when a gauge transformation can make it vanish
    everywhere. In a simply connected region, vanishing field strength is stated to
    be both necessary and sufficient for this condition.
  kind: result
  group: weinberg-2.connection-and-curvature
  evidence:
  - source: weinberg-2
    section: '15.1'
    pages:
    - 6
    note: The text defines a pure gauge field and states the necessary-and-sufficient
      condition in a simply connected region.
- id: weinberg-2.reducible-gauge-symmetry-and-ghosts-of-ghosts
  label: Reducible gauge symmetries require ghosts of ghosts
  summary: The usual ghost determinant construction requires independent gauge transformations,
    hence one ghost per independent transformation. For p-form gauge fields with p≥2,
    the parameter itself has a redundancy because d²=0; compensating the extra ghosts
    requires ghosts of ghosts, and for p≥3 requires ghosts of ghosts of ghosts, and
    so on.
  kind: result
  group: weinberg-2.brst-and-generalizations
  evidence:
  - source: weinberg-2
    section: '15.8'
    pages:
    - 38
    - 39
    note: The rendered source states p≥2 for the parameter redundancy and p≥3 for
      the next ghost stage.
- id: weinberg-2.renormalizable-yang-mills-lagrangian-assumption
  label: Renormalizable Yang–Mills Lagrangian truncation
  summary: For the standard-model-type Lagrangian, the matter sector is coupled through
    covariant derivatives and the gauge sector through −1/4 F^a_{μν}F^{aμν}. The source
    explicitly excludes higher covariant derivatives and matter dependence on F here
    as nonrenormalizable terms suppressed at ordinary energies by a large mass scale.
  kind: assumption
  group: weinberg-2.field-equations-and-quantization
  evidence:
  - source: weinberg-2
    section: '15.3'
    pages:
    - 12
    note: The paragraph before equation (15.3.1) specifies the omission of higher-derivative
      and F-dependent matter terms.
- id: weinberg-2.theta-term-nonperturbative-effects
  label: Nonperturbative effects of the parity-odd theta term
  summary: The parity-odd gauge-field term described at the end of the preceding context
    is a total derivative, so it does not alter the classical field equations or perturbative
    Feynman rules, but the source immediately qualifies that it can have nonperturbative
    quantum-mechanical effects. This is a limitation of the derivative-based perturbative
    conclusion, not a gauge-field mass term.
  kind: result
  group: weinberg-2.lagrangian-and-algebra
  evidence:
  - source: weinberg-2
    section: '15.2'
    pages:
    - 8
    note: The opening continuation explicitly states that the term can have nonperturbative
      quantum-mechanical effects.
  notation:
  - source: weinberg-2
    note: The context calls the coefficient matrix θ_{αβ}; this node preserves the
      source's distinction between perturbative Feynman rules and nonperturbative
      effects.
- id: weinberg-2.yang-mills-coupling-normalization
  label: Couplings as normalization of simple algebra factors
  summary: After decomposing the gauge algebra into simple or U(1) factors, one may
    rescale gauge fields so g_{αβ}=δ_{αβ}. The corresponding factor-specific constants
    then occur in the generators and structure constants; equivalently, with fixed
    generator normalization they appear as inverse squared factors in the gauge-field
    Lagrangian.
  kind: concept
  group: weinberg-2.lagrangian-and-algebra
  evidence:
  - source: weinberg-2
    section: '15.2'
    pages:
    - 11
    - 12
    note: Equations (15.2.5)–(15.2.9) identify the factor-by-factor rescaling and
      the resulting coupling conventions.
  notation:
  - source: weinberg-2
    note: Weinberg absorbs a coupling g_m for each simple or U(1) subalgebra into
      t_a and C^a_{bc} after normalizing g_{αβ} to δ_{αβ}.
- id: weinberg-2.yang-mills-field-equations-and-total-current
  label: Yang–Mills field equation and ordinarily conserved total current
  summary: Varying the normalized Yang–Mills Lagrangian gives a field equation that
    can be written with an ordinary divergence equal to a total current. This current
    includes a gauge-field contribution as well as the matter contribution, and it
    is ordinarily conserved.
  kind: result
  group: weinberg-2.field-equations-and-quantization
  evidence:
  - source: weinberg-2
    section: '15.3'
    pages:
    - 12
    note: Equations (15.3.2)–(15.3.4) define the current and state its ordinary conservation.
  notation:
  - source: weinberg-2
    note: The source writes the total current as j^a_ν and reserves J^a_ν for the
      matter-only covariant current introduced next.
- id: weinberg-2.yang-mills-first-class-constraints
  label: First-class constraints in canonical Yang–Mills theory
  summary: Canonical Yang–Mills quantization has the primary constraint π^{a0}=0 and
    a secondary Gauss-law constraint. Their Poisson brackets vanish because the secondary
    constraint is independent of A^a_0, so they are first class and cannot be handled
    by the direct Dirac-bracket replacement used for second-class constraints.
  kind: result
  group: weinberg-2.field-equations-and-quantization
  evidence:
  - source: weinberg-2
    section: '15.4'
    pages:
    - 15
    note: Equations (15.4.2)–(15.4.3) and the following text identify the constraints
      and their first-class character.
- id: weinberg-2.yang-mills-three-and-four-vector-vertices
  label: Three- and four-vector Yang–Mills vertices
  summary: The cubic and quartic terms in the non-Abelian field-strength Lagrangian
    yield three- and four-vector-boson momentum-space vertices. Because Weinberg absorbs
    couplings into C_{abc}, the cubic and quartic vertex factors are respectively
    first and second order in the couplings.
  kind: result
  group: weinberg-2.gauge-fixing-and-ghosts
  evidence:
  - source: weinberg-2
    section: '15.5'
    pages:
    - 24
    note: Equations (15.5.26)–(15.5.27) give the momentum-space vertex factors and
      the text identifies their coupling orders.
