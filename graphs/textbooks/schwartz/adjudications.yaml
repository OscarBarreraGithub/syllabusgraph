  - finding: 1
    issue: Complex-scalar derivations use a real-scalar input, and Dirac expansion
      requires a bosonic algebra.
    alternatives:
    - Use the accepted complex-scalar record for the scalar derivations and as a helpful
      Dirac analogy.
    - Add a new statistics-neutral particle-antiparticle expansion node and use it
      for all three targets.
    resolution: Reuse the complex-scalar record and remove the bosonic prerequisite
      from the Dirac expansion.
    rationale: The propagator and stability calculations require independent particle
      and antiparticle operators, which the accepted complex-scalar record supplies
      and the real-scalar record does not. The spinor expansion is introduced by analogy
      with that complex field before the text chooses statistics, so the analogy is
      helpful while the accepted bosonic commutator algebra is not a prerequisite.
    evidence:
    - source: schwartz
      section: 12.3–12.5.1
      pages:
