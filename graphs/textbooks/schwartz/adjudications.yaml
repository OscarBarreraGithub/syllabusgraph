  - finding: 0
    issue: Problem 11.6(b,c,e) still unions unrelated prerequisites.
    alternatives:
    - Split part (b) from parts (c,e) and retarget each necessary input.
    - Split all three parts into separate nodes with individual prerequisite edges.
    resolution: Split part (b) from parts (c,e) and retarget each necessary input.
    rationale: Part (b) is an explicit rest-spinor current calculation and needs the
      free Dirac solutions. Parts (c) and (e) concern magnetic spin flips and slow-spin
      measurement and use the Schrödinger–Pauli coupling. Two nodes preserve the exercise
      structure without making either input compulsory for the other route.
