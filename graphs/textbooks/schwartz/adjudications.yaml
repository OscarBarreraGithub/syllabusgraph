  - finding: 3
    issue: Three path-integral arguments still omitted an equation, a photon contact
      relation, or proof assumptions.
    alternatives:
    - Leave the missing facts implicit in neighboring method summaries.
    - Add the exact Euler-Lagrange and QED contact inputs plus an explicit gauge-factorization
      assumption.
    resolution: Represent the missing equation and assumptions and use the QED photon
      contact derivation.
    rationale: Stationary phase identifies classical dynamics only through the Euler-Lagrange
      result. The LSZ proof specifically applies the photon Schwinger-Dyson relation,
      and orbit factorization depends on measure, action, insertion, and gauge-representative
      hypotheses that the generic correlator formula does not state.
