    issue: Three QED applications still lacked the rate or amplitude input they use.
    alternatives:
    - Treat the missing rate and interaction structures as implicit within each task.
    - Connect the target-rest rate, Moller rate, and Compton helicity calculation
      to their exact inputs.
    resolution: Add the LIPS, center-of-mass rate, and Compton-amplitude prerequisites.
    rationale: The target-rest and Moller tasks request cross sections, so their amplitudes
