groups:
- id: schwartz.classical-field-theory
  title: Classical field theory
  question: How do actions, symmetries, sources, and Green functions organize classical
    field dynamics?
- id: schwartz.free-scalar-quantization
  title: Free scalar-field quantization
  question: How do momentum-mode operators define a free scalar field and its equal-time
    quantum structure?
- id: schwartz.lorentz-and-oscillators
  title: Lorentz invariance and oscillator modes
  question: How do relativistic symmetry and harmonic oscillator modes lead to a free-field
    description?
- id: schwartz.radiation-quantization
  title: Radiation and quantization
  question: Why do the thermal spectrum and atomic emission require quantized radiation
    and field degrees of freedom?
motivations:
- id: schwartz.blackbody-observation-motivation
  nodes:
  - schwartz.blackbody-cavity-modes-and-classical-spectrum
  - schwartz.ultraviolet-catastrophe
  - schwartz.quantized-massless-photon-modes
  - schwartz.planck-thermal-radiation-spectrum
  summary: The observed finite-frequency blackbody peak conflicts with the classical
    rising spectrum; quantized radiation supplies the source's resolution and a starting
    motivation for a quantum theory of fields.
  evidence:
  - source: schwartz
    section: 1.1 Blackbody radiation
    pages:
    - 4
    - 5
    note: Contrasts observation with the classical result and gives the quantized
      spectrum.
- id: schwartz.classical-source-propagation-motivation
  nodes:
  - schwartz.sourced-maxwell-equations-from-action
  - schwartz.coulomb-potential-from-field-propagation
  - schwartz.green-function-propagator-kernel
  summary: A point charge provides a concrete calculation in which a source generates
    a field through the inverse wave operator, making the propagator an operational
    tool rather than only formal notation.
  evidence:
  - source: schwartz
    section: 3.4 Coulomb's law and 3.5 Green's functions
    pages:
    - 37
    - 39
    - 41
    note: Derives the source equation, Coulomb solution, and general propagator interpretation.
- id: schwartz.dynamical-background-context
  nodes:
  - schwartz.free-scalar-field-mode-expansion
  summary: 'The closing application frames the reason to describe the electromagnetic
    system by a quantum field: a system treated as a background in single-particle
    quantum mechanics becomes dynamical, allowing transition amplitudes to depend
    on photon occupation through field operators.'
  evidence:
  - source: schwartz
    section: 2.3.4 Einstein coefficients revisited
    pages:
    - 26
    note: Uses a field-containing interaction in an atom-photon transition calculation
      as context for a dynamical electromagnetic system.
- id: schwartz.spontaneous-emission-motivation
  nodes:
  - schwartz.einstein-emission-and-absorption-coefficients
  - schwartz.bosonic-spontaneous-and-stimulated-emission-factor
  - schwartz.intensity-mode-occupation-relation
  summary: The source asks why an isolated atom can emit spontaneously when Einstein's
    first relation used equilibrium; the creation and annihilation operators of field
    theory give the later first-principles explanation.
  evidence:
  - source: schwartz
    section: 1.2 Einstein coefficients and 1.3 Quantum field theory
    pages:
    - 7
    - 9
    note: States the isolated-emission puzzle and resolves the coefficient relation
      without equilibrium.
