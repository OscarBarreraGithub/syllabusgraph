groups:
- id: schwartz.classical-field-theory
  title: Classical field theory
  question: How do actions, symmetries, sources, and Green functions organize classical
    field dynamics?
- id: schwartz.eft-examples
  title: Examples of effective quantum field theories
  question: How do Schrödinger, Fermi, chiral, and gravitational theories encode low-energy
    physics?
- id: schwartz.free-scalar-quantization
  title: Free scalar-field quantization
  question: How do momentum-mode operators define a free scalar field and its equal-time
    quantum structure?
- id: schwartz.infrared-safety
  title: Infrared safety and resolved final states
  question: Which sums of QED final states are finite observables?
- id: schwartz.lorentz-and-oscillators
  title: Lorentz invariance and oscillator modes
  question: How do relativistic symmetry and harmonic oscillator modes lead to a free-field
    description?
- id: schwartz.lsz-and-time-ordering
  title: The S-matrix and time-ordered products
  question: How do asymptotic particles emerge from time-ordered correlation functions?
- id: schwartz.naturalness
  title: Masses, naturalness, and super-renormalizable terms
  question: When are small mass parameters protected from large quantum corrections?
- id: schwartz.old-fashioned-perturbation
  title: Old-fashioned perturbation theory
  question: How do sums over on-shell intermediate states recover an efficient covariant
    scattering description?
- id: schwartz.path-integral-construction
  title: Path-integral construction and generating functionals
  question: How are field path integrals constructed and used to calculate quantum
    correlators?
- id: schwartz.path-integral-identities
  title: Path-integral symmetry identities
  question: How do field redefinitions produce gauge, Schwinger–Dyson, and Ward identities?
- id: schwartz.power-counting-eft
  title: Power counting and effective field theories
  question: Why can non-renormalizable theories still make low-energy predictions?
- id: schwartz.qed-calculations
  title: QED rules and scattering calculations
  question: How do the QED rules yield amplitudes, cross sections, and their spin
    and gauge structure?
- id: schwartz.qed-radiative-corrections
  title: QED radiative corrections
  question: How do QED loops modify propagators, charge, and magnetic moments?
- id: schwartz.quantum-feynman-rules
  title: Quantum Feynman rules
  question: How do interaction dynamics and contractions generate position- and momentum-space
    Feynman rules?
- id: schwartz.quantum-yang-mills
  title: Quantum Yang–Mills theory
  question: How are QCD observables and its running coupling computed and defined?
- id: schwartz.radiation-quantization
  title: Radiation and quantization
  question: Why do the thermal spectrum and atomic emission require quantized radiation
    and field degrees of freedom?
- id: schwartz.renormalization
  title: Regularization and renormalization
  question: How do regulator-dependent loop expressions yield finite physical predictions?
- id: schwartz.renormalization-group
  title: Renormalization-group evolution
  question: How does invariance under an arbitrary calculation scale organize logarithms,
    operator coefficients, and fixed points?
- id: schwartz.scalar-qed
  title: Scalar quantum electrodynamics
  question: How do local U(1) invariance and quantization determine scalar-QED amplitudes
    and their consistency conditions?
- id: schwartz.scattering-observables
  title: Cross sections and decay rates
  question: How are S-matrix amplitudes converted into measurable scattering and decay
    observables?
- id: schwartz.soft-spin-constraints
  title: Soft emission and integer-spin constraints
  question: What do Lorentz invariance and soft limits require of interactions of
    massless particles?
- id: schwartz.spectral-locality
  title: Spectra, poles, and locality
  question: How do spectral representations and poles constrain fields, effective
    descriptions, and locality?
- id: schwartz.spin-and-gauge-invariance
  title: Spin, representations, and gauge invariance
  question: How can Lorentz-covariant fields describe exactly the physical polarizations
    of integer-spin particles?
- id: schwartz.spin-statistics-causality
  title: Spin, statistics, stability, and causality
  question: Why must integer- and half-integer-spin quantum fields have their respective
    statistics?
- id: schwartz.spinor-helicity-amplitudes
  title: Spinor-helicity amplitudes
  question: How do physical on-shell spinors organize gluon amplitudes and recursion?
- id: schwartz.spinor-representations
  title: Spinor representations and Dirac dynamics
  question: How do Lorentz representations produce spinor fields, their equations,
    and their electromagnetic response?
- id: schwartz.spinor-solutions-cpt
  title: Spinor solutions and discrete symmetries
  question: How do free spinor states and C, P, T act while preserving the stated
    theory?
- id: schwartz.ssb-and-weak-interactions
  title: Spontaneous symmetry breaking and weak interactions
  question: How do broken symmetries generate Goldstones and gauge masses, and organize
    electroweak interactions, flavor, and CP violation?
- id: schwartz.unitarity-consequences
  title: Consequences of unitarity
  question: What do S-matrix unitarity and Hilbert-space completeness require of amplitudes
    and propagators?
- id: schwartz.wilsonian-rg
  title: Wilsonian renormalization group
  question: How does lowering a physical cutoff classify operators and explain low-energy
    predictivity?
- id: schwartz.yang-mills-foundations
  title: Yang–Mills foundations
  question: How do non-Abelian gauge structure, quantization, and lattice variables
    arise?
motivations:
- id: schwartz.anomaly-consistency-motivation
  nodes:
  - schwartz.quantum-anomaly-gauge-versus-global-consistency
  - schwartz.standard-model-mixed-and-gravitational-anomaly-cancellation
  summary: Gauge anomalies threaten Ward identities and unitarity, making cancellation
    a consistency condition for chiral gauge theories.
  evidence:
  - source: schwartz
    section: 30 introduction
    pages:
    - 616
- id: schwartz.blackbody-observation-motivation
  nodes:
  - schwartz.blackbody-cavity-modes-and-classical-spectrum
  - schwartz.ultraviolet-catastrophe
  - schwartz.quantized-massless-photon-modes
  - schwartz.planck-thermal-radiation-spectrum
  summary: The observed finite-frequency blackbody peak conflicts with the classical
    rising spectrum; quantized radiation supplies the source's resolution and a starting
    motivation for a quantum theory of fields.
  evidence:
  - source: schwartz
    section: 1.1 Blackbody radiation
    pages:
    - 4
    - 5
    note: Contrasts observation with the classical result and gives the quantized
      spectrum.
- id: schwartz.classical-source-propagation-motivation
  nodes:
  - schwartz.sourced-maxwell-equations-from-action
  - schwartz.coulomb-potential-from-field-propagation
  - schwartz.green-function-propagator-kernel
  summary: A point charge provides a concrete calculation in which a source generates
    a field through the inverse wave operator, making the propagator an operational
    tool rather than only formal notation.
  evidence:
  - source: schwartz
    section: 3.4 Coulomb's law and 3.5 Green's functions
    pages:
    - 37
    - 39
    - 41
    note: Derives the source equation, Coulomb solution, and general propagator interpretation.
- id: schwartz.dynamical-background-context
  nodes:
  - schwartz.free-scalar-field-mode-expansion
  summary: 'The closing application frames the reason to describe the electromagnetic
    system by a quantum field: a system treated as a background in single-particle
    quantum mechanics becomes dynamical, allowing transition amplitudes to depend
    on photon occupation through field operators.'
  evidence:
  - source: schwartz
    section: 2.3.4 Einstein coefficients revisited
    pages:
    - 26
    note: Uses a field-containing interaction in an atom-photon transition calculation
      as context for a dynamical electromagnetic system.
- id: schwartz.eft-predictivity-motivation
  nodes:
  - schwartz.nonrenormalizable-eft-low-energy-predictivity
  - schwartz.uv-completion-and-range-of-validity
  summary: An infinite counterterm set does not preclude finite, measurable low-energy
    predictions because symmetry and power suppression organize the relevant terms.
  evidence:
  - source: schwartz
    section: 21.2.3–21.2.4
    pages:
    - 391
    - 393
- id: schwartz.ir-observable-motivation
  nodes:
  - schwartz.inclusive-qed-cross-section-ir-finiteness
  - schwartz.jet-resolution-ir-safe-cross-section
  summary: The separate exclusive amplitudes are infrared divergent although an experiment
    cannot distinguish a charged particle from sufficiently soft or collinear radiation,
    motivating observables defined by a finite resolution.
  evidence:
  - source: schwartz
    section: 20 introduction, 20.2
    pages:
    - 355
    - 364
- id: schwartz.loop-infinities-observables-question
