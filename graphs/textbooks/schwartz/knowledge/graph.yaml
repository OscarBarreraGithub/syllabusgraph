nodes:
- id: schwartz.action-variation-and-boundary-assumption
  label: Action variation and the asymptotic-boundary assumption
  summary: For ℒ[φ,∂φ], varying the action and integrating by parts separates a bulk
    variation from a total derivative. The source assumes fields vanish at spatial
    and temporal asymptotic boundaries, permitting total derivatives in the Lagrangian
    to be dropped for this derivation.
  kind: assumption
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: 3.2 The Euler–Lagrange equations
    pages:
    - 31
    note: States the boundary assumption behind integration by parts.
- id: schwartz.advanced-retarded-propagator-integrals-problem
  label: Advanced/retarded propagator integral problem
  summary: Problem 6.2 asks for d⁴k integral representations of the advanced and retarded
    propagators. It extends the chapter’s time-ordering comparison but does not supply
    their derivation on the problem page.
  kind: method
  group: schwartz.lsz-and-time-ordering
  evidence:
  - source: schwartz
    section: Problem 6.2
    pages:
    - 77
    note: Explicitly requests advanced and retarded integral expressions.
- id: schwartz.advanced-retarded-time-ordering-sum
  label: Advanced and retarded OFPT time orderings
  summary: 'Electron scattering by photon exchange has two valid temporal orderings:
    one intermediate state is retarded relative to a chosen source and the other advanced.
    Both must be included before expressing the physical transition amplitude covariantly.'
  kind: method
  group: schwartz.old-fashioned-perturbation
  evidence:
  - source: schwartz
    section: 4.1.1 Coulomb’s law revisited
    pages:
    - 49
    - 50
    - 51
    note: Identifies the two intermediate states and adds their contributions.
- id: schwartz.asymptotic-freedom-assumption-for-lsz
  label: Asymptotic-free-state assumption for LSZ
  summary: The LSZ derivation assumes interactions are negligible at asymptotically
    early and late times, so one-particle momentum states can be defined there. The
    source presents this as a physical working assumption and notes that a rigorous
    wavepacket construction has an issue for massless particles such as in QED.
  kind: assumption
  group: schwartz.lsz-and-time-ordering
  evidence:
  - source: schwartz
    section: Chapter 6 introduction and 6.1
    pages:
    - 69
    - 71
    note: States why asymptotic freedom is needed and qualifies the assumption.
- id: schwartz.atom-photon-interaction-hamiltonian
  label: Atom-photon interaction Hamiltonian
  summary: For the Einstein-coefficient application, split H=H_0+H_int with H_0=H_atom+H_photon
    and treat the remaining interaction perturbatively. A semiclassical form H_int=φH_I
    makes the photon field dynamical and its ladder-operator matrix elements produce
    the √n and √(n+1) factors.
  kind: method
  group: schwartz.free-scalar-quantization
  evidence:
  - source: schwartz
    section: 2.3.4 Einstein coefficients revisited
    pages:
    - 26
    note: Recasts the atomic transition calculation with a quantum photon field.
- id: schwartz.axial-photon-propagator-problem
  label: Axial-gauge photon propagator problem
  summary: Problem 8.4 asks for a photon propagator in axial gauge A_0=0. It is a
    requested gauge-fixed Maxwell inversion independent of the massive-Proca propagator
    task.
  kind: method
  group: schwartz.spin-and-gauge-invariance
  evidence:
  - source: schwartz
    section: Problem 8.4
    pages:
    - 138
    note: Requests the photon propagator in axial gauge.
- id: schwartz.blackbody-cavity-modes-and-classical-spectrum
  label: Blackbody cavity modes and the classical spectrum
  summary: A thermal blackbody can be idealized as a periodic box of electromagnetic
    standing-wave modes. Classical equipartition assigns equal thermal energy to modes,
    so their growing phase-space density gives an intensity proportional to ω²kBT
    (with c restored as c⁻³).
  kind: representation
  group: schwartz.radiation-quantization
  evidence:
  - source: schwartz
    section: 1.1 Blackbody radiation
    pages:
    - 3
    note: Defines the cavity modes and obtains the equipartition spectrum.
- id: schwartz.bosonic-spontaneous-and-stimulated-emission-factor
  label: Bosonic spontaneous and stimulated emission factor
  summary: For atomic de-excitation into a photon mode already occupied by n_ω photons,
    the squared amplitude is proportional to n_ω+1; excitation is proportional to
    n_ω. The additive one is the spontaneous contribution and the occupation term
    is stimulated emission or absorption.
  kind: result
  group: schwartz.radiation-quantization
  evidence:
  - source: schwartz
    section: 1.3 Quantum field theory
    pages:
    - 9
    note: Obtains the nω+1 and nω transition factors.
- id: schwartz.canonical-and-path-integral-quantization-routes
  label: Canonical and path-integral quantization routes
  summary: The source identifies canonical quantization and the Feynman path integral
    as two common approaches to field theory. Canonical quantization supplies physical
    operator insight and is needed for some results such as LSZ, while path integrals
    are more concise and support applications such as nonperturbative QCD.
  kind: method
  group: schwartz.lorentz-and-oscillators
  evidence:
  - source: schwartz
    section: Chapter 2 introduction
    pages:
    - 10
    note: Contrasts the two approaches and gives source-specific examples.
- id: schwartz.canonical-quantum-harmonic-oscillator
  label: Canonical quantum harmonic oscillator
  summary: Quantizing a linear oscillator promotes x and p to [x,p]=i; the combinations
    a and a† obey [a,a†]=1 and put H=ω(a†a+1/2). In the Heisenberg picture the annihilation
    operator evolves as a(t)=e^(−iωt)a(0).
  kind: method
  group: schwartz.lorentz-and-oscillators
  evidence:
  - source: schwartz
    section: 2.2.1 Simple harmonic oscillator
    pages:
    - 18
    note: Reviews canonical oscillator quantization and time evolution.
- id: schwartz.canonical-scalar-field-energy-density
  label: Canonical scalar-field energy density
  summary: For ℒ=1/2(∂_μφ)(∂^μφ)−V[φ], the conjugate momentum is π=φ̇ and ℋ=1/2π²+1/2(∇φ)²+V[φ].
    This illustrates H=K+V and L=K−V, while the source notes that Hamiltonians are
    not Lorentz scalars and Lagrangians are preferred in relativistic field theory.
  kind: representation
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: 3.1 Hamiltonians and Lagrangians
    pages:
    - 30
    note: Works the scalar Legendre transform and explains Lorentz status.
- id: schwartz.circular-polarization-annihilation-problem
  label: Circular-polarization annihilation problem
  summary: Problem 5.4 asks for the e⁺e⁻→μ⁺μ⁻ calculation of Section 5.3 in a circular-polarization
    basis. It is a requested alternative spin representation, not an additional result
    established on the problem page.
  kind: method
  group: schwartz.scattering-observables
  evidence:
  - source: schwartz
    section: Problem 5.4
    pages:
    - 67
    note: Requests the circular-polarization repetition.
- id: schwartz.classical-feynman-diagrams-and-rules
  label: Classical Feynman diagrams and rules
  summary: 'The iterative Green-function solution can be represented by diagrams:
    propagator lines connect the observation point, source insertions, and nonlinear
    branching vertices weighted by λ, with internal points integrated. The source
    calls these Feynman diagrams and distinguishes the quantum extension by the possibility
    of loops when ℏ is nonzero. Problem 3.4 asks for the next-order diagrams, their
    integral expressions, and a Green-function check of the result.'
  kind: representation
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: 3.5 Green's functions
    pages:
    - 42
    note: States the classical diagram rules and their physical gravity example.
  - source: schwartz
    section: Problem 3.4
    pages:
    - 43
    note: Extends the diagram expansion and checks it against Green functions.
- id: schwartz.classical-field-hamiltonian-lagrangian-legendre-transform
  label: Field Hamiltonians, Lagrangians, and Legendre transforms
  summary: A classical field theory has continuous degrees of freedom and may be formulated
    through H=∫d³x ℋ or L=∫d³x ℒ. At each spatial point, ℒ[φ,φ̇]=πφ̇−ℋ after solving
    π from ∂ℋ/∂π=φ̇, with the inverse Legendre transform when it exists.
  kind: method
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: 3.1 Hamiltonians and Lagrangians
    pages:
    - 29
    note: Defines field densities and the Legendre transform.
- id: schwartz.classical-spontaneous-symmetry-breaking
  label: Classical spontaneous symmetry breaking
  summary: For a real scalar with a negative mass term and stabilizing quartic interaction,
    constant solutions of the field equation include ground states that need not respect
    the Lagrangian's φ→−φ symmetry. Expanding φ=c+π about a selected vacuum gives
    a fluctuation theory and illustrates spontaneous breaking of a discrete Z₂ symmetry.
  kind: result
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: Problem 3.5 Spontaneous symmetry breaking
    pages:
    - 43
    note: Specifies the classical symmetry-breaking construction.
- id: schwartz.cm-two-to-two-cross-section
  label: Center-of-mass 2→2 cross section
  summary: For 2→2 scattering in the center-of-mass frame, integrating two-body LIPS
    gives dσ/dΩ=|M|²(p_f/p_i)/[64π²E_CM²], together with the threshold step function.
    Equal masses and elastic kinematics set p_f=p_i.
  kind: result
  group: schwartz.scattering-observables
  evidence:
  - source: schwartz
    section: 5.1.2 Special cases
    pages:
    - 62
    - 63
    note: Performs the two-body phase-space integral and states the CM formula.
- id: schwartz.coherent-states-of-the-oscillator
  label: Coherent states of the harmonic oscillator
  summary: The problem defines |z⟩=e^(za†)|0⟩, asks to show it is an eigenstate of
    a, and studies its occupation amplitudes and minimum uncertainty ΔpΔx=1/2. It
    also asks why a† cannot have an eigenstate.
  kind: representation
  group: schwartz.lorentz-and-oscillators
  evidence:
  - source: schwartz
    section: Problem 2.7 Coherent states of the simple harmonic oscillator
    pages:
    - 28
    note: Specifies the coherent-state construction and properties.
- id: schwartz.complex-scalar-antiparticle-quantization
  label: Complex scalar quantization and antiparticles
  summary: 'A complex scalar requires independent a and b ladder operators: φ contains
    a and b†, while φ* contains a† and b. The b modes annihilate same-mass opposite-charge
    antiparticles, so coupling complex matter to a massless spin-1 field entails antiparticles
    in this relativistic quantum description.'
  kind: result
  group: schwartz.scalar-qed
  evidence:
  - source: schwartz
    section: '9.1'
    pages:
    - 140
    - 141
    note: Gives opposite classical couplings and the two-operator quantum expansion
      and conclusion.
- id: schwartz.complex-scalar-global-u1-symmetry
  label: Complex scalar global U(1) symmetry
  summary: The complex scalar Lagrangian ℒ=|∂_μφ|²−m²|φ|² is invariant under the continuous
    global phase rotation φ→e^(−iα)φ and φ*→e^(iα)φ*. The complex field can be represented
    by two real degrees of freedom or by φ and φ*.
  kind: concept
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: 3.3 Noether's theorem
    pages:
    - 33
    note: Gives the complex-scalar symmetry example.
- id: schwartz.compton-scattering-as-photon-momentum-application
  label: Compton scattering as photon momentum application
  summary: The Compton-scattering problem treats crystal electrons as free for the
    collision, derives the reflected X-ray frequency versus angle, examines the massless-electron
    limit, and asks what distribution would be expected without quantized photon momentum.
  kind: method
  group: schwartz.radiation-quantization
  evidence:
  - source: schwartz
    section: Problem 2.5 Compton scattering
    pages:
    - 27
    note: Poses the momentum-quantization scattering test.
- id: schwartz.coulomb-potential-from-field-propagation
  label: Coulomb potential from field propagation
  summary: For a static point source J⁰=eδ³(x⃗), Lorenz-gauge Maxwell theory gives
    A⁰=−e∆⁻¹δ³(x⃗). Fourier transformation and contour integration yield A⁰(r)=e/(4πr),
    recovering the Coulomb potential as propagation from the source.
  kind: result
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: 3.4.2 Coulomb potential
    pages:
    - 39
    note: Calculates the potential from the point-charge source.
- id: schwartz.covariant-rxi-photon-propagator
  label: Covariant Rξ photon propagator
  summary: Gauge redundancy makes the Maxwell kinetic operator noninvertible. Adding
    −(∂·A)²/(2ξ) yields the covariant propagator iΠ_μν=−i[g_μν−(1−ξ)p_μp_ν/p²]/(p²+iε);
    ξ=1 is Feynman–’t Hooft gauge, while ξ→0 is obtained only after inversion.
  kind: representation
  group: schwartz.spin-and-gauge-invariance
  evidence:
  - source: schwartz
    section: 8.5–8.5.1
    pages:
    - 128
    - 129
    - 130
    note: Shows the zero mode, gauge-fixing inverse, propagator, and named gauge limits.
- id: schwartz.cross-section-flux-probability-luminosity
  label: Cross section from flux, probability, and luminosity
  summary: A differential cross section is differential scattering probability divided
    by the incident flux and duration. Collider event counts are obtained by integrating
    a cross section against luminosity, separating the interaction property from experimental
    beam conditions.
  kind: representation
  group: schwartz.scattering-observables
  evidence:
  - source: schwartz
    section: 5.1 Cross sections
    pages:
    - 57
    - 58
    - 59
    note: Defines cross section, differential probability, luminosity, and event counting.
- id: schwartz.current-roles-and-nondynamical-sources
  label: Roles of currents and nondynamical sources
  summary: A current can be a Noether current, an external prescribed charge flow,
    a source coupled as −A_μJ^μ, or a placeholder for matter terms. In the external-source
    role it has no kinetic term and is not solved dynamically alongside propagating
    fields; the notation separates source production from field response.
  kind: concept
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: 3.3.2 Currents
    pages:
    - 36
    note: Lists current roles and states the nondynamical-source qualification.
- id: schwartz.decay-rate-lips-and-time-dilation
  label: Decay rate from phase space and time dilation
  summary: Treating decay perturbatively over a finite time gives dΓ=|M|²dΠ_LIPS/(2E₁).
    A moving particle has a larger E₁ than in its rest frame, so this formula encodes
    the expected relativistic time dilation of its decay rate.
  kind: result
  group: schwartz.scattering-observables
  evidence:
  - source: schwartz
    section: 5.1.1 Decay rates
    pages:
    - 61
    - 62
    note: Defines decay probability per time and gives the LIPS formula and time-dilation
      explanation.
- id: schwartz.derivative-couplings-and-total-derivative-invariance
  label: Derivative couplings and total-derivative invariance
  summary: A derivative acting on a field produces a momentum factor whose sign depends
    on whether the particle enters or leaves a vertex. Rewriting an interaction by
    integration by parts redistributes such vertex factors but gives the same matrix
    element; in perturbation theory, a total derivative vanishes by momentum conservation
    at the vertex. Problems 7.5–7.6 request a general integration-by-parts proof and
    a derivative-coupling tree-level cross section, respectively; those requested
    calculations are not proved on the problem page.
  kind: result
  group: schwartz.quantum-feynman-rules
  evidence:
  - source: schwartz
    section: 7.4.2 Derivative couplings
    pages:
    - 99
    - 100
    note: Works the derivative-coupling example and proves the perturbative total-derivative
      statement.
  - source: schwartz
    section: Problems 7.5–7.6
    pages:
    - 104
    note: Requests the general proof and a derivative-coupling cross section.
- id: schwartz.disconnected-amplitudes-and-cluster-decomposition
  label: Disconnected amplitudes and cluster decomposition
  summary: A disconnected process factorizes into independently connected S-matrix
    parts and carries additional momentum delta functions. Its singularity structure
    gives zero interference with a connected amplitude; this is related to cluster
    decomposition, the requirement that widely separated experiments do not influence
    one another. Problem 7.2 asks for a connected and a disconnected 2→4 contribution
    and a check of their noninterference; this requested check is not separately proved
    on the problem page.
  kind: result
  group: schwartz.quantum-feynman-rules
  evidence:
  - source: schwartz
    section: 7.3.2 Disconnected graphs
    pages:
    - 95
    - 96
    - 97
    note: Explains factorization, absence of interference, and the cluster-decomposition
      interpretation.
  - source: schwartz
    section: Problem 7.2
    pages:
    - 103
    note: Requests the connected/disconnected 2→4 calculation and noninterference
      check.
- id: schwartz.discrete-lorentz-transformations-and-causal-type
  label: Discrete Lorentz transformations and causal type
  summary: Parity P and time reversal T preserve the Minkowski metric but are not
    products of rotations and boosts. Lorentz-invariant norms classify vectors as
    timelike, spacelike, or lightlike; a four-momentum is lightlike exactly when the
    particle is massless. Problem 2.4 tests whether a single-coordinate reflection
    is Lorentz and why it is not counted with P and T.
  kind: concept
  group: schwartz.lorentz-and-oscillators
  evidence:
  - source: schwartz
    section: 2.1.3 Discrete transformations
    pages:
    - 16
    note: Defines P, T, and the norm-based causal classifications.
  - source: schwartz
    section: Problem 2.4
    pages:
    - 27
    note: Applies the definition to an improper single-coordinate reflection.
- id: schwartz.einstein-emission-and-absorption-coefficients
  label: Einstein emission and absorption coefficient relations
  summary: For two atomic levels, the spontaneous-emission coefficient A, stimulated-emission
    coefficient B, and absorption coefficient B′ satisfy B=B′ and A/B=ℏω³/π². The
    source develops this common result both through thermal detailed balance and through
    a field-theoretic transition-rate calculation that does not assume equilibrium.
  kind: result
  group: schwartz.radiation-quantization
  evidence:
  - source: schwartz
    section: 1.2 Einstein coefficients
    pages:
    - 6
    note: Obtains the coefficient relations from equilibrium.
  - source: schwartz
    section: 1.3 Quantum field theory
    pages:
    - 9
    note: Obtains the same relations without assuming thermal equilibrium.
- id: schwartz.energy-momentum-tensor-improvement-ambiguity
  label: Energy-momentum tensor improvement ambiguity
  summary: The problem investigates how adding a total derivative ∂_μX^μ to a Lagrangian
    changes the canonical energy-momentum tensor while leaving the integrated total
    energy invariant, and asks how to obtain a symmetric tensor for electromagnetism.
    It identifies that local tensor representatives are not unique.
  kind: concept
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: Problem 3.3 Ambiguities in the energy-momentum tensor
    pages:
    - 43
    note: States the total-derivative, total-energy, and symmetry questions.
- id: schwartz.equal-time-scalar-field-commutation-relations
  label: Equal-time scalar-field commutation relations
  summary: At equal time, the free field satisfies [φ(x⃗),φ(y⃗)]=0. Defining the canonical
    conjugate π(x⃗)=∂_tφ(x)|_{t=0} gives [φ(x⃗),π(y⃗)]=iδ³(x⃗−y⃗). The source also
    states that, at any fixed time in an interacting theory, the corresponding field
    and conjugate momentum obey these relations and [π(x⃗),π(y⃗)]=0 because their
    creation-annihilation algebra is the same.
  kind: result
  group: schwartz.free-scalar-quantization
  evidence:
  - source: schwartz
    section: 2.3.3 Commutation relations
    pages:
    - 24
    - 25
    note: Derives the field commutator from the mode algebra, defines the conjugate
      momentum, and gives the canonical equal-time commutator.
  notation:
  - source: schwartz
    note: The source explicitly limits the derivation to equal time and says the different-time
      calculation is more subtle.
- id: schwartz.equilibration-requires-particle-creation-and-destruction
  label: Equilibration requires particle creation and destruction
  summary: For radiation of initially one frequency to thermalize into all frequencies,
    different particle types must turn into one another. The source uses this need
    for creation and destruction as a motivation for quantum field theory.
  kind: concept
  group: schwartz.radiation-quantization
  evidence:
  - source: schwartz
    section: 1.1 Blackbody radiation
    pages:
    - 5
    note: Explains why equilibration motivates QFT.
- id: schwartz.euler-lagrange-and-klein-gordon-equations
  label: Euler–Lagrange and Klein–Gordon equations
  summary: Stationarity of the action for arbitrary field variations gives ∂ℒ/∂φ−∂_μ[∂ℒ/∂(∂_μφ)]=0.
    For the scalar Lagrangian with potential V, this is □φ+V′[φ]=0; a quadratic mass
    potential gives (□+m²)φ=0, the free scalar Klein–Gordon equation. Problem 3.1
    extends the variational derivation to Lagrangians with second and higher field
    derivatives.
  kind: result
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: 3.2 The Euler–Lagrange equations
    pages:
    - 32
    note: Derives Euler–Lagrange and specializes it to Klein–Gordon.
  - source: schwartz
    section: Problem 3.1
    pages:
    - 42
    note: Requests the general higher-derivative Euler–Lagrange equation.
- id: schwartz.external-photon-lsz-polarizations
  label: External photon polarizations in LSZ rules
  summary: For scalar external states LSZ supplies factor one; each external photon
    supplies its polarization vector, ε_μ for an incoming photon and ε*_μ for an outgoing
    one. A diagram contracts those vectors with the derivative-vertex momenta.
  kind: method
  group: schwartz.scalar-qed
  evidence:
  - source: schwartz
    section: 9.2.1
    pages:
    - 145
    - 146
    note: States the external-state prescription and works a two-photon diagram.
- id: schwartz.fermi-golden-rule-field-interaction
  label: Fermi golden rule for a field-creating interaction
  summary: Using Γ∼|⟨f|H_int|i⟩|²δ(E_f−E_i), a Hermitian interaction that creates
    or annihilates the photon has form H_I†a†+H_Ia. Its atomic matrix element supplies
    the transition amplitude while the oscillator operator changes photon occupation.
  kind: method
  group: schwartz.radiation-quantization
  evidence:
  - source: schwartz
    section: 1.3 Quantum field theory
    pages:
    - 8
    note: Applies Fermi's golden rule and the creation-annihilation interaction.
- id: schwartz.feynman-propagator-iepsilon-contour
  label: Feynman propagator iε contour prescription
  summary: The momentum-space Feynman propagator D_F(x₁,x₂)=∫d⁴k/(2π)⁴ i e^{ik(x₁−x₂)}/(k²−m²+iε)
    follows by placing the two energy poles on opposite sides of the contour. The
    choice reproduces the time-ordering step functions and makes k⁰ an independent,
    generally off-shell integration variable.
  kind: representation
  group: schwartz.lsz-and-time-ordering
  evidence:
  - source: schwartz
    section: 6.2 The Feynman propagator and Problems
    pages:
    - 76
    - 77
    note: Derives the pole prescription and states the final propagator and off-shell
      interpretation.
- id: schwartz.feynman-propagator-time-ordering
  label: Feynman propagator from time ordering
  summary: The free two-point time-ordered vacuum matrix element is the sum of the
    two operator orderings weighted by θ(t₁−t₂) and θ(t₂−t₁). The resulting Feynman
    propagator combines the advanced and retarded contributions that appeared separately
    in OFPT.
  kind: result
  group: schwartz.lsz-and-time-ordering
  evidence:
  - source: schwartz
    section: 6.2 The Feynman propagator
    pages:
    - 75
    note: Computes the free time-ordered two-point function and identifies its two
      pieces.
- id: schwartz.field-theoretic-einstein-coefficient-derivation
  label: Field-theoretic derivation of Einstein coefficients
  summary: The field-theoretic route combines the n_ω+1 versus n_ω transition rates
    from creation and annihilation operators with I(ω)=ℏω³n_ω/π². It thereby reads
    off B=B′ and A/B=ℏω³/π² without using a thermal-equilibrium distribution.
  kind: method
  group: schwartz.radiation-quantization
  evidence:
  - source: schwartz
    section: 1.3 Quantum field theory
    pages:
    - 8
    - 9
    note: Calculates occupation-dependent transition amplitudes and converts occupation
      to intensity.
- id: schwartz.fierz-pauli-massive-spin-two
  label: Fierz–Pauli massive spin-2 Lagrangian
  summary: Decomposing a symmetric tensor into transverse and longitudinal parts shows
    that the mass combination h_μν²−h² uniquely removes the dangerous four-derivative
    longitudinal scalar. The resulting Fierz–Pauli kinetic and mass terms describe
    the physical massive spin-2 field; their massless kinetic limit is the leading
    Einstein–Hilbert expansion.
  kind: result
  group: schwartz.spin-and-gauge-invariance
  evidence:
  - source: schwartz
    section: 8.7.2
    pages:
    - 135
    note: Derives the unique mass term and displays the Fierz–Pauli Lagrangian.
- id: schwartz.fock-space-particle-sectors
  label: Fock space and physical particle sectors
  summary: For one particle type, the Fock space is organized into Hilbert spaces
    H_n of physical n-particle states. A state in H_n has on-shell momenta p_i with
    p_i^0>0; for several particle types, the Fock space is the direct sum of their
    associated Hilbert spaces. The source emphasizes that this is not a sum over arbitrary
    four-vectors, because energy is fixed by three-momentum and mass.
  kind: representation
  group: schwartz.free-scalar-quantization
  evidence:
  - source: schwartz
    section: 2.3 Second quantization
    pages:
    - 21
    note: Defines the physical n-particle sectors and their on-shell momentum labels.
  notation:
  - source: schwartz
    note: The source writes |p⃗⟩, |p^μ⟩, and |p⟩ interchangeably for physical momentum
      states, with p_i^0=√(p⃗_i²+m_i²).
- id: schwartz.fourier-transform-derivative-operator-correspondence
  label: Fourier correspondence for field operators
  summary: With the source's Fourier conventions, ∇² corresponds to −|k⃗|² and □ corresponds
    to −k². This diagonalizes differential operators and turns inverse differential
    operators such as 1/□ into momentum-space factors.
  kind: method
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: 3.4.1 Fourier transform interlude
    pages:
    - 38
