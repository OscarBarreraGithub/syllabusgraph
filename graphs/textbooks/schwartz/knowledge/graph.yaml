groups:
- id: schwartz.classical-field-theory
  title: Classical field theory
  question: How do actions, symmetries, sources, and Green functions organize classical
    field dynamics?
- id: schwartz.free-scalar-quantization
  title: Free scalar-field quantization
  question: How do momentum-mode operators define a free scalar field and its equal-time
    quantum structure?
- id: schwartz.lorentz-and-oscillators
  title: Lorentz invariance and oscillator modes
  question: How do relativistic symmetry and harmonic oscillator modes lead to a free-field
    description?
- id: schwartz.lsz-and-time-ordering
  title: The S-matrix and time-ordered products
  question: How do asymptotic particles emerge from time-ordered correlation functions?
- id: schwartz.old-fashioned-perturbation
  title: Old-fashioned perturbation theory
  question: How do sums over on-shell intermediate states recover an efficient covariant
    scattering description?
- id: schwartz.quantum-feynman-rules
  title: Quantum Feynman rules
  question: How do interaction dynamics and contractions generate position- and momentum-space
    Feynman rules?
- id: schwartz.radiation-quantization
  title: Radiation and quantization
  question: Why do the thermal spectrum and atomic emission require quantized radiation
    and field degrees of freedom?
- id: schwartz.scalar-qed
  title: Scalar quantum electrodynamics
  question: How do local U(1) invariance and quantization determine scalar-QED amplitudes
    and their consistency conditions?
- id: schwartz.scattering-observables
  title: Cross sections and decay rates
  question: How are S-matrix amplitudes converted into measurable scattering and decay
    observables?
- id: schwartz.soft-spin-constraints
  title: Soft emission and integer-spin constraints
  question: What do Lorentz invariance and soft limits require of interactions of
    massless particles?
- id: schwartz.spin-and-gauge-invariance
  title: Spin, representations, and gauge invariance
  question: How can Lorentz-covariant fields describe exactly the physical polarizations
    of integer-spin particles?
motivations:
- id: schwartz.blackbody-observation-motivation
  nodes:
  - schwartz.blackbody-cavity-modes-and-classical-spectrum
  - schwartz.ultraviolet-catastrophe
  - schwartz.quantized-massless-photon-modes
  - schwartz.planck-thermal-radiation-spectrum
  summary: The observed finite-frequency blackbody peak conflicts with the classical
    rising spectrum; quantized radiation supplies the source's resolution and a starting
    motivation for a quantum theory of fields.
  evidence:
  - source: schwartz
    section: 1.1 Blackbody radiation
    pages:
    - 4
    - 5
    note: Contrasts observation with the classical result and gives the quantized
      spectrum.
- id: schwartz.classical-source-propagation-motivation
  nodes:
  - schwartz.sourced-maxwell-equations-from-action
  - schwartz.coulomb-potential-from-field-propagation
  - schwartz.green-function-propagator-kernel
  summary: A point charge provides a concrete calculation in which a source generates
    a field through the inverse wave operator, making the propagator an operational
    tool rather than only formal notation.
  evidence:
  - source: schwartz
    section: 3.4 Coulomb's law and 3.5 Green's functions
    pages:
    - 37
    - 39
    - 41
    note: Derives the source equation, Coulomb solution, and general propagator interpretation.
- id: schwartz.dynamical-background-context
  nodes:
  - schwartz.free-scalar-field-mode-expansion
  summary: 'The closing application frames the reason to describe the electromagnetic
    system by a quantum field: a system treated as a background in single-particle
    quantum mechanics becomes dynamical, allowing transition amplitudes to depend
    on photon occupation through field operators.'
  evidence:
  - source: schwartz
    section: 2.3.4 Einstein coefficients revisited
    pages:
    - 26
    note: Uses a field-containing interaction in an atom-photon transition calculation
      as context for a dynamical electromagnetic system.
- id: schwartz.motivation-local-description-of-photons
  nodes:
  - schwartz.massless-maxwell-gauge-redundancy-and-two-modes
  - schwartz.gauge-redundancy-locality-and-global-data
  summary: The chapter asks how a local Lorentz-covariant field can describe a massless
    photon with only two polarizations. Gauge redundancy answers the degree-of-freedom
    problem while retaining local matter interactions.
  evidence:
  - source: schwartz
    section: 8.2.3 and 8.6
    pages:
    - 118
    - 132
    note: Introduces the massless-mode problem and explains why the redundant Aμ description
      is useful.
- id: schwartz.motivation-observables-from-amplitudes
  nodes:
  - schwartz.lorentz-invariant-phase-space-cross-section
  - schwartz.decay-rate-lips-and-time-dilation
  - schwartz.lsz-reduction-pole-projection
  summary: 'The chapters connect a chain of experimentally meaningful quantities:
    collider event counts and decay rates require cross sections, cross sections require
    S-matrix elements, and LSZ supplies their extraction from field correlation functions.'
  evidence:
  - source: schwartz
    section: 5.1 and Chapter 6 introduction
    pages:
    - 57
    - 69
    note: States the cross-section/S-matrix connection and LSZ’s role in calculating
      S-matrix elements.
- id: schwartz.motivation-offshell-efficiency
  nodes:
  - schwartz.offshell-momentum-from-ofpt
  - schwartz.feynman-propagator-iepsilon-contour
  summary: 'The text addresses why an off-shell propagator is useful even though OFPT
    uses only physical on-shell intermediate states: it packages multiple temporal
    orderings into a Lorentz-invariant calculation with exact four-momentum conservation.'
  evidence:
  - source: schwartz
    section: Chapter 4 introduction and 4.1.2
    pages:
    - 46
    - 52
    note: Frames off-shellness as an efficient conceptual shift and says the Feynman
      propagator combines the two orderings.
- id: schwartz.motivation-soft-constraints
  nodes:
  - schwartz.soft-spin-one-lorentz-implies-charge-conservation
  - schwartz.soft-spin-two-universal-gravity
  - schwartz.soft-spin-greater-than-two-obstruction
  summary: 'The final section seeks consequences of Lorentz invariance that do not
    depend on choosing a Lagrangian: soft massless spin one enforces charge conservation,
    spin two enforces universal coupling, and higher spin obstructs interaction.'
  evidence:
  - source: schwartz
    section: 9.5–9.5.1
    pages:
    - 150
    - 153
    - 155
    note: Frames the Lagrangian-independent soft argument and states its spin-one,
      spin-two, and higher-spin conclusions.
- id: schwartz.spontaneous-emission-motivation
  nodes:
  - schwartz.einstein-emission-and-absorption-coefficients
  - schwartz.bosonic-spontaneous-and-stimulated-emission-factor
  - schwartz.intensity-mode-occupation-relation
  summary: The source asks why an isolated atom can emit spontaneously when Einstein's
    first relation used equilibrium; the creation and annihilation operators of field
    theory give the later first-principles explanation.
  evidence:
  - source: schwartz
    section: 1.2 Einstein coefficients and 1.3 Quantum field theory
    pages:
    - 7
    - 9
    note: States the isolated-emission puzzle and resolves the coefficient relation
      without equilibrium.
