    for e⁺e⁻→γ→μ⁺μ⁻ and show that their sum gives 2Eγ/k² for the virtual off-shell
    photon. This is a requested application, not a result proved on the problem page.
  kind: method
  group: schwartz.old-fashioned-perturbation
  evidence:
  - source: schwartz
    section: Problem 4.1
    pages:
    - 55
    note: States the two-slicing and combined-denominator task.
- id: schwartz.ofpt-on-shell-intermediate-states
  label: OFPT on-shell intermediate states
  summary: Old-fashioned perturbation theory sums physical, on-shell intermediate
    Fock states. It conserves three-momentum at each local vertex while intermediate-state
    energy differs from the fixed total external energy, with denominators determined
    by the total intermediate-state energy.
  kind: representation
  group: schwartz.old-fashioned-perturbation
  evidence:
  - source: schwartz
    section: 4.1.1–4.1.2
    pages:
    - 49
    - 52
    note: Builds the electron-photon intermediate states and summarizes OFPT rules.
- id: schwartz.ofpt-relativistic-rules
  label: Relativistically normalized OFPT rules
  summary: With relativistic normalization, OFPT assigns an overall energy delta function,
    a factor 1/(Eᵢ−Eₖ+iε) to each intermediate state, a three-momentum delta function
    at each vertex, and d³p/[(2π)³2E] for each internal line. These rules retain on-shell
    internal states rather than covariant four-momentum integration.
  kind: representation
  group: schwartz.old-fashioned-perturbation
  evidence:
  - source: schwartz
    section: 4.1.2 Feynman rules for OFPT
    pages:
    - 52
    note: Footnote states the relativistically normalized rules and the main text
      contrasts OFPT with the covariant propagator.
- id: schwartz.one-particle-nonrelativistic-wavefunction-limit
  label: One-particle wavefunction and nonrelativistic limit
  summary: Restricting the second-quantized theory to one-particle states gives ⟨x|=⟨0|φ(x)
    and ψ(x)=⟨x|ψ⟩. For a massive free field, this wavefunction obeys i∂_tψ=√(m²−∇⃗²)ψ.
    Expanding at low energy and removing the rest-energy contribution gives i∂_tψ=−∇⃗²ψ/(2m),
    the free nonrelativistic Schrödinger equation.
  kind: result
  group: schwartz.free-scalar-quantization
  evidence:
  - source: schwartz
    section: 2.3.2 Time dependence
    pages:
    - 23
    - 24
    note: Defines the one-particle wavefunction and derives its massive free-field
      and low-energy forms.
  notation:
  - source: schwartz
    note: The source calls the final expansion a low-energy (large-mass) expansion
      and obtains the nonrelativistic equation after subtracting the mc² energy contribution.
- id: schwartz.one-particle-position-state-from-field
  label: One-particle position state from a field operator
  summary: Projecting the field-created vacuum state onto a momentum state gives ⟨p⃗|φ_0(x⃗)|0⟩=e^−ip⃗·x⃗.
    Hence |x⃗⟩≡φ_0(x⃗)|0⟩ is the unique one-particle state with that momentum-space
    overlap. Other Fock-space states can share the overlap if they include additional
    zero- or two-particle components, so the uniqueness claim is specifically within
    the one-particle sector.
  kind: result
  group: schwartz.free-scalar-quantization
  evidence:
  - source: schwartz
    section: 2.3.1 Field expansion
    pages:
    - 22
    note: Computes the momentum projection and states the one-particle-sector qualification
      on the position state.
  notation:
  - source: schwartz
    note: The source uses |x⃗⟩ for φ_0(x⃗)|0⟩ and distinguishes it from arbitrary
      Fock-space states with the same one-particle projection.
- id: schwartz.perturbative-nonlinear-classical-field-solution
  label: Perturbative nonlinear classical-field solution
  summary: For □h−λh²−J=0, expand h=h_0+h_1+… in λ. The leading solution h_0=(1/□)J
    and first correction h_1=λ(1/□)[(1/□J)(1/□J)] exhibit iterative source propagation
    and self-interaction.
  kind: method
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: 3.5 Green's functions
    pages:
    - 40
    note: Develops the nonlinear scalar-gravity perturbative expansion.
- id: schwartz.photon-polarizations-current-conservation-and-causality
  label: Photon polarizations, current conservation, and causality
  summary: The photon-polarization problem integrates out A_μ to obtain a current-current
    interaction, uses current conservation to eliminate components for a chosen momentum,
    and asks which terms are instantaneous and why they do not enable superluminal
    communication. It connects constrained components to the count of causal propagating
    degrees of freedom.
  kind: method
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: Problem 3.9 Photon polarizations
    pages:
    - 44
    - 45
    note: Sets up the current-conservation reduction and causality questions.
- id: schwartz.planck-thermal-radiation-spectrum
  label: Planck thermal radiation spectrum
  summary: Integer occupation j of a photon mode with Boltzmann weight gives mean
    energy ℏω/(e^(βℏω)−1). Taking the continuum limit and two photon polarizations
    yields I(ω)=ℏω³/[π²(e^(βℏω)−1)], the spectrum that fits blackbody data.
  kind: result
  group: schwartz.radiation-quantization
  evidence:
  - source: schwartz
    section: 1.1 Blackbody radiation
    pages:
    - 5
    note: Derives the mean mode energy and continuum intensity.
- id: schwartz.position-space-feynman-rules
  label: Position-space Feynman rules
  summary: For a time-ordered correlator, each original field insertion is an external
    point, each interaction is an integrated internal vertex weighted by its Lagrangian
    coefficient, and each contraction is a Feynman propagator. With normalized vertices,
    the remaining numerical factor is the graph’s geometrical symmetry factor; the
    Lagrangian and Hamiltonian derivations agree.
  kind: representation
  group: schwartz.quantum-feynman-rules
  evidence:
  - source: schwartz
    section: 7.2.6 Position-space Feynman rules
    pages:
    - 92
    - 93
    note: States equivalence of derivations and summarizes vertex and symmetry-factor
      accounting.
- id: schwartz.position-space-propagator-massless-limit-problem
  label: Position-space propagator and massless-limit problem
  summary: Problem 6.1 asks for the position-space Feynman propagator, suggests Schwinger
    parameters to control poles, and requests its massless limit. This is an assigned
    evaluation of the propagator, rather than a result proved on the problem page.
  kind: method
  group: schwartz.lsz-and-time-ordering
  evidence:
  - source: schwartz
    section: Problem 6.1
    pages:
    - 77
    note: States the position-space and massless-limit tasks.
- id: schwartz.quantized-massless-photon-modes
  label: Quantized massless photon modes
  summary: Planck assigns a cavity mode energy E_n=ℏω_n=|p⃗_n|; Einstein's particle
    interpretation then gives m²=E²−|p⃗|²=0. The source frames light as a collection
    of massless photons.
  kind: result
  group: schwartz.radiation-quantization
  evidence:
  - source: schwartz
    section: 1.1 Blackbody radiation
    pages:
    - 4
    note: States energy quantization, the momentum relation, and the massless conclusion.
- id: schwartz.rapidity-parameterization-of-boosts
  label: Rapidity parameterization of boosts
  summary: Boosts use hyperbolic angles β_i (rapidities); for one direction coshβ=1/√(1−v²)
    and sinhβ=v/√(1−v²), so β agrees with velocity to leading small-v order. Rotations
    and boosts generally do not commute. Problem 2.1 reconstructs the boost perturbatively
    from a Galilean transformation by preserving t²−x² order by order and matching
    the full transformation's expansion.
  kind: representation
  group: schwartz.lorentz-and-oscillators
  evidence:
  - source: schwartz
    section: 2.1.2 Lorentz transformations
    pages:
    - 13
    note: Gives boost matrices and their velocity relation.
  - source: schwartz
    section: Problem 2.1
    pages:
    - 27
    note: Applies invariant-interval preservation to construct boosts perturbatively.
- id: schwartz.relativistic-energy-allows-particle-production
  label: Relativistic energy allows particle production
  summary: When kinetic energy is comparable to rest mass, relativistic corrections
    and the threshold for producing additional particles are separated only by factors
    of order one. The source uses this consequence of E=mc² to explain why relativistic
    quantum theory needs variable particle number.
  kind: concept
  group: schwartz.lorentz-and-oscillators
  evidence:
  - source: schwartz
    section: 2.1 Lorentz invariance
    pages:
    - 11
    note: Connects relativistic kinetic energy to pair-production threshold.
- id: schwartz.relativistic-state-normalization-and-delta-regulation
  label: Relativistic normalization and delta-function regulation
  summary: Momentum eigenstates have relativistic normalization ⟨p|p⟩=2E V after regulating
    δ³(0) in a finite volume. Squaring the overall momentum-conserving delta function
    similarly produces TV, and these regulator factors cancel from the physical rate
    formula.
  kind: representation
  group: schwartz.scattering-observables
  evidence:
  - source: schwartz
    section: 5.1 Cross sections
    pages:
    - 59
    - 60
    - 61
    note: Derives finite-volume delta identities, state normalization, and cancellation
      factors.
- id: schwartz.rotations-and-invariant-inner-products
  label: Rotations and invariant inner products
  summary: A rotation is an orientation-preserving orthogonal transformation R with
    RᵀR=1. Its defining preservation of δ_ijx^ix^j illustrates index contraction and
    supplies the SO(2) and SO(3) template for relativistic symmetry.
  kind: concept
  group: schwartz.lorentz-and-oscillators
  evidence:
  - source: schwartz
    section: 2.1.1 Rotations
    pages:
    - 12
    note: Defines orthogonality and the rotationally invariant norm.
- id: schwartz.rutherford-scattering-cross-section-problem
  label: Rutherford-scattering correspondence problem
  summary: Problems 5.5–5.6 ask the learner to connect classical Rutherford scattering,
    Coulomb Born scattering, virtual-photon kinematics, and Mandelstam invariants,
    including when identical-electron scattering differs. They are application prompts
    and do not establish their requested conclusions on these pages.
  kind: method
  group: schwartz.scattering-observables
  evidence:
  - source: schwartz
    section: Problems 5.5–5.6
    pages:
    - 67
    - 68
    note: States the Rutherford matching, virtual-photon, and s,t,u tasks.
- id: schwartz.s-matrix-asymptotic-state-map
  label: S-matrix as an asymptotic-state map
  summary: An S-matrix element projects freely moving momentum eigenstates prepared
    at asymptotically early times onto freely moving momentum eigenstates at late
    times. It is the object whose nontrivial interaction part will be related to experimentally
    measured rates.
  kind: concept
  group: schwartz.scattering-observables
  evidence:
  - source: schwartz
    section: Chapter 5 introduction
    pages:
    - 56
    note: Defines asymptotic states and S-matrix elements.
- id: schwartz.schwinger-dyson-contact-equations
  label: Schwinger–Dyson contact equations
  summary: Differentiating time-ordered correlators generates delta-function contact
    terms through equal-time commutators. Combining these terms with the interacting
    Euler–Lagrange equation gives the Schwinger–Dyson equations; their contact terms
    distinguish quantum correlation functions from their classical counterparts and
    enable loop contractions.
  kind: result
  group: schwartz.quantum-feynman-rules
  evidence:
  - source: schwartz
    section: 7.1 Lagrangian derivation
    pages:
    - 79
    - 80
    - 81
    note: Derives contact terms and identifies the Schwinger–Dyson equations and their
      quantum role.
- id: schwartz.second-quantization-many-mode-particle-interpretation
  label: Second quantization as many mode oscillators
  summary: 'Second quantization assigns a harmonic oscillator to each wavevector and
    interprets n excitations of that oscillator as n particles. The source cautions
    that the phrase is historical: discrete classical modes and quantizing their oscillator
    occupations are logically distinct steps.'
  kind: concept
  group: schwartz.lorentz-and-oscillators
  evidence:
  - source: schwartz
    section: 2.3 Second quantization
    pages:
    - 20
    note: Defines the many-mode and particle-number features.
- id: schwartz.semiclassical-field-matter-consistency-question
  label: Classical-field and quantum-matter consistency question
  summary: Problem 3.8 asks whether the blackbody-paradox argument rules out treating
    the electromagnetic field classically while electrons and atoms are quantum mechanical,
    and whether the same reasoning bears on classical gravity coupled to quantum electrons.
    It records the source's semiclassical-consistency question without asserting an
    answer not supplied on the problem page.
  kind: concept
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: Problem 3.8
    pages:
    - 44
    note: Poses the electromagnetic and gravity comparison.
- id: schwartz.single-mode-oscillator-number-algebra
  label: Single-mode oscillator number algebra
  summary: 'A photon mode with integer excitations is represented by a harmonic oscillator:
    [a,a†]=1 and N̂=a†a. Normalization fixes a†|n⟩=√(n+1)|n+1⟩ and a|n⟩=√n|n−1⟩.'
  kind: representation
  group: schwartz.radiation-quantization
  evidence:
  - source: schwartz
    section: 1.3 Quantum field theory
    pages:
    - 7
    note: Builds the oscillator occupation algebra for one photon frequency.
- id: schwartz.sourced-maxwell-equations-from-action
  label: Sourced Maxwell equations from the action
  summary: Varying ℒ=−1/4F_μνF^μν−A_μJ^μ gives ∂_μF^μν=J^ν. In Lorenz gauge this becomes
    □A^ν=J^ν, formally A^ν=(1/□)J^ν; the inverse wave operator is the propagator that
    carries source information to the field.
  kind: result
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: 3.4 Coulomb's law
    pages:
    - 37
    note: Derives sourced Maxwell equations and the formal inverse-□ solution.
- id: schwartz.spin-projection-annihilation-angular-distribution
  label: Spin projections in e⁺e⁻→μ⁺μ⁻
  summary: For massless, linearly polarized e⁺e⁻ and μ⁺μ⁻ states in the CM frame,
    only matching initial electron/positron polarizations overlap a spin-1 photon.
    Summing the two nonzero polarization projections gives |M|² proportional to 1+cos²θ,
    and hence the stated angular dependence of the cross section.
  kind: result
  group: schwartz.scattering-observables
  evidence:
  - source: schwartz
    section: 5.3 e⁺e⁻→μ⁺μ⁻ with spin
    pages:
    - 65
    - 66
    - 67
    note: Sets up polarization overlaps and obtains 1+cos²θ and the cross section.
- id: schwartz.tetrahedron-symmetry-factor-problem
  label: Tetrahedron symmetry-factor problem
  summary: Problem 7.7 asks for the amplitude and symmetry factor of a tetrahedral
    scalar graph with external lines in φ⁴ theory, and for the corresponding φ³ vacuum-graph
    factor. It is a requested symmetry-factor calculation, not a result derived on
    the problem pages.
  kind: method
  group: schwartz.quantum-feynman-rules
  evidence:
  - source: schwartz
    section: Problem 7.7
    pages:
    - 104
    - 105
    note: States the tetrahedron amplitude and symmetry-factor tasks.
- id: schwartz.transfer-matrix-born-series
  label: Transfer matrix and Born series
  summary: Defining V|ψ⟩=T|φ⟩ gives T=V+V(E−H₀)⁻¹T and its perturbative expansion.
    Matrix elements are sums of potential insertions separated by the Lippmann–Schwinger
    kernel; the first and second terms are the first and second Born approximations.
  kind: method
  group: schwartz.old-fashioned-perturbation
  evidence:
  - source: schwartz
    section: 4.1 Lippmann–Schwinger equation
    pages:
    - 48
    note: Derives the transfer-matrix equation, Born expansion, and intermediate-state
      interpretation.
- id: schwartz.translation-symmetry-and-canonical-energy-momentum-tensor
  label: Translation symmetry and the canonical energy-momentum tensor
  summary: Global spacetime translations act on fields as δφ/δξ^ν=∂_νφ and change
    the Lagrangian by a total derivative. Noether's construction gives T^μν=Σ_n[∂ℒ/∂(∂_μφ_n)]∂^νφ_n−g^μνℒ,
    with ∂_μT^μν=0; its charges are total energy and momentum and T^00 equals the
    Hamiltonian density.
  kind: result
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: 3.3.1 Energy-momentum tensor
    pages:
    - 35
    note: Derives the canonical energy-momentum tensor from translations.
- id: schwartz.two-level-equilibrium-detailed-balance
  label: Two-level equilibrium detailed balance
  summary: For atoms with energies E₁ and E₂ separated by ℏω, the population-rate
    equation includes spontaneous emission A, stimulated emission BI(ω), and absorption
    B′I(ω). In thermal equilibrium, zero net rate together with n_i proportional to
    e^(−βE_i) gives I(ω)=A/[B′e^(βℏω)−B].
  kind: method
  group: schwartz.radiation-quantization
  evidence:
  - source: schwartz
    section: 1.2 Einstein coefficients
    pages:
    - 6
    note: Sets up the rate balance and thermal populations.
- id: schwartz.ultraviolet-catastrophe
  label: Ultraviolet catastrophe
  summary: The equipartition spectrum rises with frequency, whereas the observed blackbody
    distribution peaks at finite frequency. This high-frequency disagreement is the
    ultraviolet catastrophe and shows that classical equipartition cannot describe
    blackbody radiation.
  kind: result
  group: schwartz.radiation-quantization
  evidence:
  - source: schwartz
    section: 1.1 Blackbody radiation
    pages:
    - 4
    note: Contrasts the classical spectrum with observation.
- id: schwartz.unstable-particle-width-problem
  label: Unstable-particle width problem
  summary: Problem 7.9 asks the learner to analyze the Breit–Wigner form i/(p²−m²+imΓ),
    relate the imaginary part of a propagator to going on shell, and connect loop
    imaginary parts to decay widths. It records the exercise’s requested reasoning
    without asserting its unshown derivation.
  kind: method
  group: schwartz.quantum-feynman-rules
  evidence:
  - source: schwartz
    section: Problem 7.9 Unstable particles
    pages:
    - 105
    note: States the Breit–Wigner, on-shell-imaginary-part, loop, and decay-rate tasks.
- id: schwartz.weak-decay-scale-estimate-problem
  label: Weak-decay scale-estimate problem
  summary: Problem 7.8 asks for a scalar interaction enabling muon decay, its large-W-mass
    amplitude scaling, dimensional factors from spin, muon/tau lifetime estimates,
    branching-fraction refinement, and a precision-measurement question. It is a requested
    effective-interaction and scale-estimation exercise, not a problem-page derivation.
  kind: method
  group: schwartz.quantum-feynman-rules
  evidence:
  - source: schwartz
    section: Problem 7.8 Radioactive decay
    pages:
    - 105
    note: States the interaction, scaling, lifetime, branching, and measurement tasks.
- id: schwartz.wick-contractions-and-vacuum-bubble-cancellation
  label: Wick contractions and vacuum-bubble cancellation
  summary: Writing free fields as creation and annihilation parts shows that a free-vacuum
    time-ordered product is the sum over complete contractions, each a Feynman propagator.
    Vacuum bubbles factor out and cancel against the vacuum-normalization denominator,
    leaving diagrams whose connected subgraphs involve an external point.
  kind: result
  group: schwartz.quantum-feynman-rules
  evidence:
  - source: schwartz
    section: 7.2.5 Time-ordered products and contractions
    pages:
    - 90
    - 91
    - 92
    note: Defines contractions, invokes Wick’s theorem, and proves bubble cancellation
      in the example.
- id: schwartz.yukawa-potential-and-massive-vector-constraint
  label: Yukawa potential and massive-vector constraint
  summary: The massive-vector source problem derives the field equation and a constraint
    on A_μ for conserved J_μ, evaluates the static point-source potential, and recovers
    Coulomb behavior as m→0. Its finite-mass potential supplies a short-range force
    model relevant to Yukawa's nuclear-force proposal.
  kind: method
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: Problem 3.6 Yukawa potential
    pages:
    - 43
    note: States the massive-vector potential, constraint, and m→0 tasks.
- id: schwartz.zero-point-energy-observable-differences
  label: Zero-point energy and observable differences
  summary: The free photon Hamiltonian has a formally divergent vacuum zero-point
    contribution, but the source treats only energy differences as directly measurable,
    where this common contribution drops out. It identifies this cancellation idea
    as a basic renormalization lesson while noting physical settings involving differences
    in vacuum energy.
  kind: concept
  group: schwartz.old-fashioned-perturbation
  evidence:
  - source: schwartz
    section: 4.2 Early infinities
    pages:
    - 52
    - 53
    note: States the vacuum-energy divergence and the energy-difference interpretation.
