nodes:
- id: schwartz.abelian-chiral-anomaly-and-one-loop-exactness
  label: Abelian chiral anomaly and one-loop exactness
  summary: The regulated measure gives partial_mu J5^mu=-e^2 epsilon_mu_nu_alpha_beta
    F^mu_nu F^alpha_beta/(16 pi^2). The text calls the anomaly one-loop exact; its
    displayed calculation is one loop and says the satisfying proof uses topological
    arguments rather than supplying that proof.
  kind: result
  evidence:
  - source: schwartz
    section: '30.3'
    pages:
    - 630
    - 631
- id: schwartz.abelian-gauge-orbit-factorization-assumptions
  label: Abelian gauge-orbit factorization assumptions
  summary: The orbit-factorization argument assumes that a longitudinal gauge representative
    can be chosen, linear shifts preserve the functional measure, and the action and
    inserted operator are invariant under the accompanying gauge transformation.
  kind: assumption
  group: schwartz.path-integral-identities
  evidence:
  - source: schwartz
    section: '14.5'
    pages:
    - 268
    note: States the representative, measure, action, and operator conditions used
      by the change of variables.
- id: schwartz.abelian-higgs-gauge-shift-and-degree-count
  label: Abelian Higgs gauge shift and degree count
  summary: 'The gauge transformation Aμ→Aμ+∂μα/e, π→π−Fπα removes π in unitary gauge
    or leaves it massless in Lorenz gauge. Two constrained-vector modes plus π equal
    the three modes of an unconstrained massive vector: the vector “eats” the Goldstone.'
  kind: method
  group: schwartz.ssb-and-weak-interactions
  evidence:
  - source: schwartz
    section: 28.3.1
    pages:
    - 576
- id: schwartz.abelian-higgs-model-and-vector-mass
  label: Abelian Higgs model and vector mass
  summary: Gauging the broken U(1) replaces derivatives by QED covariant derivatives.
    In this gauged convention φ=(v+σ)/√2 exp(iπ/Fπ) with Fπ=v; the term ½e²v²Aμ² gives
    mA=ev before resolving Goldstone–vector mixing. This differs from the ungauged
    convention Fπ=√2v.
  kind: result
  group: schwartz.ssb-and-weak-interactions
  evidence:
  - source: schwartz
    section: 28.3.1
    pages:
    - 575
    - 576
- id: schwartz.abelian-wilson-line-as-parallel-transport
  label: Abelian Wilson line as parallel transport
  summary: A Wilson line W(x,y) transforms with endpoint phases so W(x,y)phi(y)-phi(x)
    is covariant. Its infinitesimal expansion defines the connection A_mu and D_mu=partial_mu-i
    e A_mu.
  kind: concept
  group: schwartz.yang-mills-foundations
  evidence:
  - source: schwartz
    section: 25.2.1
    pages:
    - 489
- id: schwartz.abelian-wilson-loop-curvature
  label: Abelian Wilson loop and curvature
  summary: For a closed path, the Abelian Wilson loop is gauge invariant and Stokes
    relates it to the F_mu nu flux. Equivalently F_mu nu=(i/e)[D_mu,D_nu], which measures
    the noncommutativity of infinitesimal parallel transport.
  kind: result
  group: schwartz.yang-mills-foundations
  evidence:
  - source: schwartz
    section: 25.2.1
    pages:
    - 490
- id: schwartz.action-variation-and-boundary-assumption
  label: Action variation and the asymptotic-boundary assumption
  summary: For ℒ[φ,∂φ], varying the action and integrating by parts separates a bulk
    variation from a total derivative. The source assumes fields vanish at spatial
    and temporal asymptotic boundaries, permitting total derivatives in the Lagrangian
    to be dropped for this derivation.
  kind: assumption
  group: schwartz.classical-field-theory
  evidence:
  - source: schwartz
    section: 3.2 The Euler–Lagrange equations
    pages:
    - 31
    note: States the boundary assumption behind integration by parts.
- id: schwartz.adjoint-representation-of-gauge-fields
  label: Adjoint representation of gauge fields
  summary: The adjoint matrices are (T_adj^a)_{bc}=-i f^{abc}; it has N^2-1 components
    for SU(N). Gauge fields naturally transform in this representation.
  kind: representation
  group: schwartz.yang-mills-foundations
  evidence:
  - source: schwartz
    section: 25.1.1
    pages:
    - 486
- id: schwartz.advanced-retarded-propagator-integrals-problem
  label: Advanced/retarded propagator integral problem
  summary: Problem 6.2 asks for d⁴k integral representations of the advanced and retarded
    propagators. It extends the chapter’s time-ordering comparison but does not supply
    their derivation on the problem page.
  kind: method
  group: schwartz.lsz-and-time-ordering
  evidence:
  - source: schwartz
    section: Problem 6.2
    pages:
    - 77
    note: Explicitly requests advanced and retarded integral expressions.
- id: schwartz.advanced-retarded-time-ordering-sum
  label: Advanced and retarded OFPT time orderings
  summary: 'Electron scattering by photon exchange has two valid temporal orderings:
    one intermediate state is retarded relative to a chosen source and the other advanced.
    Both must be included before expressing the physical transition amplitude covariantly.'
  kind: method
  group: schwartz.old-fashioned-perturbation
  evidence:
  - source: schwartz
    section: 4.1.1 Coulomb’s law revisited
    pages:
    - 49
    - 50
    - 51
    note: Identifies the two intermediate states and adds their contributions.
- id: schwartz.alpha-s-extraction-scheme-and-scale
  label: Strong-coupling extraction, scheme, and scale
  summary: Measurements extract alpha_s from physical quantities, but comparisons
    require a specified regularization/subtraction convention and evolution to a common
    scale; the stated convention is dimensional regularization with modified minimal
    subtraction at mu=m_Z.
  kind: assumption
  group: schwartz.quantum-yang-mills
  evidence:
  - source: schwartz
    section: 26.3.2
    pages:
    - 516
- id: schwartz.alternative-physical-notions-of-locality
  label: Alternative physical notions of locality
  summary: Alongside the Lagrangian-density definition, locality can be associated
    with cluster decomposition, requiring the connected S matrix to have no singularities
    worse than poles or branch cuts, or with spacelike commutators vanishing outside
    the light cone. These are related physical notions, so Lagrangian locality is
    a calculational definition rather than the unique observable definition.
  kind: concept
  group: schwartz.spectral-locality
  evidence:
  - source: schwartz
    section: '24.4'
    pages:
    - 475
- id: schwartz.amplitude-outlook-gravity-square-and-open-formulation
  label: 'Amplitude outlook: gravity square and open formulation'
  summary: The source notes spin-two little-group scaling makes a three-point graviton
    amplitude look like the square of the gauge-theory form and discusses dual conformal/Yangian
    structure as evidence motivating, but not establishing, a more general formulation
    beyond local QFT.
  kind: concept
  group: schwartz.spinor-helicity-amplitudes
  evidence:
  - source: schwartz
    section: '27.7'
    pages:
    - 558
    - 559
- id: schwartz.anomalous-chiral-rotations-and-theta-terms
  label: Anomalous chiral rotations and theta terms
  summary: A chiral field rotation changes the path-integral measure by a gauge F
    F̃ phase. Accordingly QCD, SU(2), and U(1) theta terms are allowed/needed as counterterms,
    but their observable status must be assessed after chiral rephasings.
  kind: result
  group: schwartz.ssb-and-weak-interactions
  evidence:
  - source: schwartz
    section: 29.5.3
    pages:
    - 609
- id: schwartz.anomalous-dimension-as-quantum-scaling-deviation
  label: Anomalous dimensions as deviations from classical scaling
  summary: Classical dimensional analysis fixes a Green function's scaling power.
    Quantum dependence on the subtraction scale shifts that power, and the corresponding
    μ derivative is its anomalous dimension; anomalous dimensions therefore measure
    departures from canonical scaling, rather than introducing a new physical dimension
    for μ.
  kind: concept
  group: schwartz.renormalization-group
  evidence:
  - source: schwartz
    section: 23.4.4
    pages:
    - 434
    - 435
- id: schwartz.anomaly-allowed-b-minus-l
  label: Anomaly-allowed B minus L
  summary: 'For the fermion content used in Eqs. (30.73)–(30.87), including a right-handed
    neutrino, the independent anomaly-free U(1) has charge -1 for leptons (including
    nu_R) and 1/3 for quarks: B-L. It may be gauged, unlike B or L separately. With
    nu_R omitted, substituting these charges into the displayed grav^2(B-L) and (B-L)^3
    conditions leaves uncancelled anomalies, so this gauging claim is conditional
    on that field content.'
  kind: result
  evidence:
  - source: schwartz
    section: '30.4'
    pages:
    - 633
    - 634
  - source: schwartz
    section: 30.5.1
    pages:
    - 635
- id: schwartz.anomaly-coefficient-definition-and-normalization
  label: Anomaly coefficient definition and normalization
  summary: For SU(N), A(R) is fixed by tr[T_R^a{T_R^b,T_R^c}]=(1/2)A(R)d^{abc}=A(R)tr[T^a{T^b,T^c}],
    equivalently A(fund)=1. This is the coefficient used by Problem 25.4.
  kind: result
  group: schwartz.yang-mills-foundations
  evidence:
  - source: schwartz
    section: 25.1.1
    pages:
    - 488
- id: schwartz.anomaly-conjugate-and-real-representation-task
  label: Anomaly conjugate and real-representation task
  summary: Problem 25.4(a) asks to prove A(R)=-A(Rbar) and infer that a real representation
    has zero anomaly coefficient.
  kind: method
  group: schwartz.yang-mills-foundations
  evidence:
  - source: schwartz
    section: Problem 25.4(a)
    pages:
    - 506
- id: schwartz.anomaly-direct-sum-task
  label: Anomaly direct-sum task
  summary: Problem 25.4(b) asks to show A(R1 direct-sum R2)=A(R1)+A(R2).
  kind: method
  group: schwartz.yang-mills-foundations
  evidence:
  - source: schwartz
    section: Problem 25.4(b)
    pages:
    - 506
- id: schwartz.anomaly-hypercharge-solutions-and-charge-quantization
  label: Anomaly solutions and charge quantization
  summary: 'The four constraints are U(1)_Y^3: (2Y_L^3-Y_e^3-Y_nu^3)+3(2Y_Q^3-Y_u^3-Y_d^3)=0;
    SU(3)^2U(1): 2Y_Q-Y_u-Y_d=0; SU(2)^2U(1):Y_L+3Y_Q=0; and grav^2U(1):(2Y_L-Y_e-Y_nu)+3(2Y_Q-Y_u-Y_d)=0.
    Their two displayed solution families are (30.85): Y_L=-a/2-b, Y_e=-a-b, Y_nu=-b,
    Y_Q=a/6+b/3, Y_u=2a/3+b/3, Y_d=-a/3+b/3; and (30.86): Y_Q=Y_L=0, Y_u=c, Y_d=-c,
    Y_e=d, Y_nu=-d. In the first family Y_nu=0 gives b=0 and a rescaling sets a=1;
    every displayed solution has Y_L+3Y_Q=0, giving equal and opposite proton/electron
    charge.'
  kind: result
  evidence:
  - source: schwartz
    section: '30.4'
    pages:
    - 633
    - 634
- id: schwartz.anomaly-ir-matching-and-trace-scope
  label: Infrared anomaly matching and trace-anomaly scope
  summary: Anomalies are infrared effects of massless particles, so anomaly matching
    constrains the massless spectrum across a phase transition at a finite scale.
    In massless QCD, classical scale invariance instead has a trace anomaly proportional
    to the beta function; the chapter limits its treatment to chiral anomalies.
  kind: concept
  evidence:
  - source: schwartz
    section: 30 introduction
    pages:
    - 616
    - 617
- id: schwartz.anomaly-su4-ten-task
  label: Anomaly SU(4) ten task
  summary: Problem 25.4(d) asks for A(10) in SU(4), using 4 tensor 4=6+10 and the
    reality of 6.
  kind: method
  group: schwartz.yang-mills-foundations
  evidence:
  - source: schwartz
    section: Problem 25.4(d)
    pages:
    - 507
- id: schwartz.anomaly-tensor-product-task
  label: Anomaly tensor-product task
  summary: Problem 25.4(c) asks to derive A(R1 tensor R2)=A(R1)d(R2)+d(R1)A(R2).
  kind: method
  group: schwartz.yang-mills-foundations
  evidence:
  - source: schwartz
    section: Problem 25.4(c)
    pages:
    - 506
- id: schwartz.asymptotic-freedom-assumption-for-lsz
  label: Asymptotic-free-state assumption for LSZ
  summary: The LSZ derivation assumes interactions are negligible at asymptotically
    early and late times, so one-particle momentum states can be defined there. The
    source presents this as a physical working assumption and notes that a rigorous
    wavepacket construction has an issue for massless particles such as in QED.
  kind: assumption
  group: schwartz.lsz-and-time-ordering
  evidence:
  - source: schwartz
    section: Chapter 6 introduction and 6.1
    pages:
    - 69
    - 71
    note: States why asymptotic freedom is needed and qualifies the assumption.
- id: schwartz.atom-photon-interaction-hamiltonian
  label: Atom-photon interaction Hamiltonian
  summary: For the Einstein-coefficient application, split H=H_0+H_int with H_0=H_atom+H_photon
    and treat the remaining interaction perturbatively. A semiclassical form H_int=φH_I
    makes the photon field dynamical and its ladder-operator matrix elements produce
    the √n and √(n+1) factors.
  kind: method
  group: schwartz.free-scalar-quantization
  evidence:
  - source: schwartz
    section: 2.3.4 Einstein coefficients revisited
    pages:
    - 26
    note: Recasts the atomic transition calculation with a quantum photon field.
- id: schwartz.axial-and-lightcone-gauges-ghost-decoupling
  label: Axial and lightcone gauges
  summary: Axial gauge imposes r.A through lambda and r_mu. For lambda=0 the propagator
    is r-transverse, so the ghost-gluon vertex proportional to r_mu decouples; lightcone
    gauge further has r^2=0 and propagates only two physical polarizations.
  kind: result
  group: schwartz.yang-mills-foundations
  evidence:
  - source: schwartz
    section: 25.4.3
    pages:
    - 502
- id: schwartz.axial-photon-propagator-problem
  label: Axial-gauge photon propagator problem
  summary: Problem 8.4 asks for a photon propagator in axial gauge A_0=0. It is a
    requested gauge-fixed Maxwell inversion independent of the massive-Proca propagator
    task.
  kind: method
  group: schwartz.spin-and-gauge-invariance
  evidence:
  - source: schwartz
    section: Problem 8.4
    pages:
    - 138
    note: Requests the photon propagator in axial gauge.
- id: schwartz.background-field-axial-anomaly
  label: Background-field axial anomaly
  summary: The massive triangle gives <psibar gamma5 psi>_A=i e^2 epsilon F F/(32pi^2m),
    consistently requiring <partial J5>_A=-e^2 epsilon F F/(16pi^2). The text limits
    a rigorous derivation of the former to constant F in Chapter 33.
  kind: result
  evidence:
  - source: schwartz
    section: 30.1.3
    pages:
    - 621
- id: schwartz.bare-spectral-normalization-and-field-strength-limit
  label: Bare spectral normalization and 0≤Z≤1
  summary: For a regulated, finite, or conformal theory, the bare scalar field also
    has a spectral representation. Its equal-time canonical commutator fixes ∫ρ0(q²)dq²=1.
    In the on-shell scheme this decomposes into Zδ(q²−mP²) plus a positive continuum
    and gives 0≤Z≤1, but the source cautions that perturbative QED with an infrared
    regulator limit cannot be used to compute this unmeasurable Z reliably.
  kind: result
  group: schwartz.spectral-locality
  evidence:
  - source: schwartz
    section: 24.2.2
    pages:
    - 470
    - 471
- id: schwartz.baryon-lepton-anomalies-and-sphaleron-scope
  label: Baryon/lepton anomalies and sphalerons
  summary: partial_mu J_B^mu=partial_mu J_L^mu=n_g g^2epsilon W^aW^a/(32pi^2), while
    B-L is nonanomalous. The total-derivative density has no perturbative effect;
    topological sphalerons can violate B,L but preserve B-L, and the displayed zero-temperature
    rate is only rough.
  kind: result
  evidence:
  - source: schwartz
    section: 30.5.1
    pages:
    - 635
- id: schwartz.baryon-octet-decuplet-quantum-number-diagram
  label: Baryon octet and decuplet quantum-number organization
  summary: The octet and decuplet are displayed by quantum numbers; diagonal lines
    in the diagram share strangeness. Treat the diagram as the representation-level
    organization associated with the preceding SU(3) decomposition.
  kind: representation
  group: schwartz.ssb-and-weak-interactions
  evidence:
  - source: schwartz
    section: Figure 28.2
    pages:
    - 574
- id: schwartz.bcfw-complex-shift-and-residue-recursion
  label: BCFW complex shift and residue recursion
  summary: The [i,j> shift preserves the two shifted legs’ masslessness and total
    momentum. If M(z) vanishes at infinity, contour integration expresses M(0) as
    residues at factorization poles, recursively sewing lower-point on-shell amplitudes
    with an internal propagator and helicity sum.
  kind: method
  group: schwartz.spinor-helicity-amplitudes
  evidence:
  - source: schwartz
    section: '27.6'
    pages:
    - 555
- id: schwartz.bcfw-large-z-helicity-qualification
  label: BCFW large-z helicity qualification
  summary: BCFW requires the selected shift to vanish as z tends to infinity. For
    the displayed four-gluon MHV amplitude (++), (--), and (-,+) shift choices are
    good, while (+,-) is bad; scalar constant tree amplitudes supply the counterexample
    to automatic BCFW decay.
  kind: assumption
  group: schwartz.spinor-helicity-amplitudes
  evidence:
  - source: schwartz
    section: '27.6'
    pages:
    - 557
- id: schwartz.bcfw-mhv-example-and-parke-taylor-recursion
  label: BCFW MHV example and Parke–Taylor recursion
  summary: A (-,+) shift computes the four-gluon MHV partial amplitude from a single
    nonzero three-point factorization channel and reproduces Parke–Taylor. Iterating
    the selected shift gives one nonzero branch at each MHV step, motivating the Parke–Taylor
    proof task.
  kind: method
  group: schwartz.spinor-helicity-amplitudes
  evidence:
  - source: schwartz
    section: 27.6.1
    pages:
    - 557
    - 558
- id: schwartz.bcfw-pole-location-and-recursion-formula
  label: BCFW pole location and recursion formula
  summary: For each partition separating i and j, solve P-hat(z)^2=0 for z_star. The
    residue factorizes into shifted subamplitudes and 1/P^2; the BCFW formula sums
    partitions and internal helicities, which flip under the all-incoming convention.
  kind: result
  group: schwartz.spinor-helicity-amplitudes
  evidence:
  - source: schwartz
    section: '27.6'
    pages:
    - 556
- id: schwartz.beta-decay-electron-polarization-problem
  label: Beta-decay electron-polarization problem
  summary: Problem 11.6(f) asks how a cobalt-60 beta-decay experiment could test electron
    polarization and which helicity is expected more often. It is an independent physical
    interpretation prompt.
  kind: method
  group: schwartz.spinor-solutions-cpt
  evidence:
  - source: schwartz
    section: Problem 11.6(f)
    pages:
    - 202
    note: States the beta-decay polarization question.
- id: schwartz.beta-decay-handedness-and-operational-parity-problem
  label: Beta-decay handedness and operational-parity problem
  summary: Problem 13.6(d–g) asks to use a chiral weak interaction to determine beta-decay
    lepton handedness, construct an operational left–right test with beta decay, and
    assess whether circularly polarized light alone can distinguish handedness.
  kind: method
  group: schwartz.qed-calculations
  evidence:
  - source: schwartz
    section: Problem 13.6(d–g)
    pages:
    - 249
    - 250
    note: States the beta-decay handedness, alien-communication, and circular-polarization
      tasks.
- id: schwartz.biunitary-yukawa-diagonalization-and-mass-basis
  label: Biunitary Yukawa diagonalization and mass basis
  summary: Diagonalize YdYd† and YuYu† with left unitary matrices and factor Y=UMK†.
    Right-handed rotations remove K, while separate left rotations make diagonal quark
    masses and leave residual vector rephasings.
  kind: method
  group: schwartz.ssb-and-weak-interactions
  evidence:
  - source: schwartz
    section: 29.3.2
    pages:
    - 596
- id: schwartz.blackbody-cavity-modes-and-classical-spectrum
  label: Blackbody cavity modes and the classical spectrum
  summary: A thermal blackbody can be idealized as a periodic box of electromagnetic
    standing-wave modes. Classical equipartition assigns equal thermal energy to modes,
    so their growing phase-space density gives an intensity proportional to ω²kBT
    (with c restored as c⁻³).
  kind: representation
  group: schwartz.radiation-quantization
  evidence:
  - source: schwartz
    section: 1.1 Blackbody radiation
    pages:
    - 3
    note: Defines the cavity modes and obtains the equipartition spectrum.
- id: schwartz.bloch-nordsieck-and-kln-qualifications
  label: Bloch–Nordsieck and KLN infrared cancellation
  summary: With a massive electron and finite energy resolution, QED infrared singularities
    cancel after summing final-state radiation (Bloch–Nordsieck). More generally,
    a unitary theory requires summing all possible final and initial states in a finite
    energy window for KLN cancellation; the QCD qualification stated in the text differs
    for massive quarks at two loops.
  kind: result
  group: schwartz.infrared-safety
  evidence:
  - source: schwartz
    section: 20.3.2, Boxes 20.1–20.2
    pages:
    - 372
- id: schwartz.bosonic-spontaneous-and-stimulated-emission-factor
  label: Bosonic spontaneous and stimulated emission factor
  summary: For atomic de-excitation into a photon mode already occupied by n_ω photons,
    the squared amplitude is proportional to n_ω+1; excitation is proportional to
    n_ω. The additive one is the spontaneous contribution and the occupation term
    is stimulated emission or absorption.
  kind: result
  group: schwartz.radiation-quantization
  evidence:
  - source: schwartz
    section: 1.3 Quantum field theory
    pages:
    - 9
    note: Obtains the nω+1 and nω transition factors.
- id: schwartz.brst-cohomological-physical-state-qualification
  label: BRST cohomology and physical states
  summary: With nilpotent Slavnov operator Delta, exact states are closed and closed
    states modulo exact states form cohomology; the source states physical states
    can be identified with that cohomology.
  kind: concept
  group: schwartz.yang-mills-foundations
  evidence:
  - source: schwartz
    section: 25.4.2
    pages:
    - 501
- id: schwartz.brst-transformations-and-nilpotency-task
  label: BRST transformations and nilpotency task
  summary: 'The gauge-fixed Faddeev–Popov Lagrangian has an exact global Grassmann-parameter
    BRST symmetry: the gauge field and matter transform as a gauge transformation
    with alpha^a=theta c^a, while c transforms quadratically and bar c cancels the
    gauge-fixing variation. The exercise asks to verify Delta^2=0.'
  kind: method
  group: schwartz.yang-mills-foundations
  evidence:
  - source: schwartz
    section: 25.4.2; Problem 25.7
    pages:
    - 500
    - 501
    - 507
- id: schwartz.callan-symanzik-green-function-rge
  label: Callan–Symanzik equation for Green functions
  summary: A bare QED Green function is μ independent but is related to a finite renormalized
    Green function by field Z factors. Differentiating yields an RGE containing explicit
    μ dependence, beta and mass-running derivatives, and one half of each external
    field anomalous dimension; inserting a general operator adds its anomalous dimension.
    The source names scheme variants Callan–Symanzik, Gell-Mann–Low, ’t Hooft–Weinberg,
    and Georgi–Politzer equations.
  kind: method
  group: schwartz.renormalization-group
  evidence:
  - source: schwartz
    section: 23.4.3
    pages:
    - 433
    - 434
- id: schwartz.canonical-and-path-integral-quantization-routes
  label: Canonical and path-integral quantization routes
  summary: The source identifies canonical quantization and the Feynman path integral
    as two common approaches to field theory. Canonical quantization supplies physical
    operator insight and is needed for some results such as LSZ, while path integrals
    are more concise and support applications such as nonperturbative QCD.
  kind: method
  group: schwartz.lorentz-and-oscillators
  evidence:
  - source: schwartz
    section: Chapter 2 introduction
    pages:
    - 10
    note: Contrasts the two approaches and gives source-specific examples.
- id: schwartz.canonical-path-integral-equivalence-by-schwinger-dyson
  label: Canonical/path-integral equivalence by Schwinger–Dyson equations
  summary: The canonically defined source functional obeys the same Schwinger–Dyson
    differential equation and boundary conditions as the path-integral functional,
    so the two formulations generate the same correlation functions.
  kind: result
  group: schwartz.path-integral-identities
  evidence:
  - source: schwartz
    section: 14.7.2
    pages:
    - 276
    - 277
    note: Matches the canonical Taylor expansion to the functional equation and concludes
      equivalence.
- id: schwartz.canonical-quantum-harmonic-oscillator
  label: Canonical quantum harmonic oscillator
  summary: Quantizing a linear oscillator promotes x and p to [x,p]=i; the combinations
    a and a† obey [a,a†]=1 and put H=ω(a†a+1/2). In the Heisenberg picture the annihilation
    operator evolves as a(t)=e^(−iωt)a(0).
  kind: method
  group: schwartz.lorentz-and-oscillators
  evidence:
  - source: schwartz
    section: 2.2.1 Simple harmonic oscillator
    pages:
    - 18
    note: Reviews canonical oscillator quantization and time evolution.
- id: schwartz.canonical-scalar-field-energy-density
  label: Canonical scalar-field energy density
  summary: For ℒ=1/2(∂_μφ)(∂^μφ)−V[φ], the conjugate momentum is π=φ̇ and ℋ=1/2π²+1/2(∇φ)²+V[φ].
    This illustrates H=K+V and L=K−V, while the source notes that Hamiltonians are
    not Lorentz scalars and Lagrangians are preferred in relativistic field theory.
