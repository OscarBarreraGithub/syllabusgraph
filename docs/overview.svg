<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
  <title id="title">SyllabusGraph: one knowledge base, many courses</title>
  <desc id="description">Textbooks, lecture notes, and original material feed proposals that are checked and reviewed into a shared knowledge graph. Learning goals and student background select prerequisite paths through that graph to produce introductory and advanced course plans, with syllabus, notes, and graph exports. This is a conceptual illustration of the workflow.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ced5c9" opacity=".5"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fafaf5"/>
      <stop offset="1" stop-color="#eeefe5"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#264b43"/>
      <stop offset="1" stop-color="#18372f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 6 4.5 1 8" fill="none" stroke="#879b84" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="graph-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" fill="none" stroke="#bed09b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- All text, paths, and fills are local. No scripts, fonts, or remote assets. -->
  <rect x="1" y="1" width="1278" height="758" rx="24" fill="url(#paper)" stroke="#d9dfd3"/>
  <rect x="860" y="20" width="396" height="244" rx="18" fill="url(#grid)"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#233f37">
    <rect x="48" y="43" width="38" height="38" rx="11" fill="#254c41"/>
    <g fill="none" stroke="#e9eddb" stroke-width="1.8">
      <path d="m58 54 17 9-17 8M58 54v17"/>
    </g>
    <g fill="#e9eddb">
      <circle cx="58" cy="54" r="3.2"/><circle cx="75" cy="63" r="3.2"/><circle cx="58" cy="71" r="3.2"/>
    </g>
    <text x="99" y="70" font-size="25" font-weight="600" letter-spacing="-.8">SyllabusGraph</text>
    <text x="1230" y="67" text-anchor="end" font-size="15" letter-spacing="2.5" fill="#657261">A REASON FOR EVERY TOPIC</text>
  </g>

  <g fill="#233f37" font-family="Georgia, 'Times New Roman', serif" font-size="61" letter-spacing="-2">
    <text x="48" y="160">One knowledge base.</text>
    <text x="48" y="224">Many courses.</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#657261">
    <text x="817" y="159">Connect the sources.</text>
    <text x="817" y="190">Choose the learning goals.</text>
    <text x="817" y="221">Make the sequence make sense.</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <g font-size="16" letter-spacing="2">
      <text x="48" y="286" fill="#758169">01 / YOUR MATERIAL</text>
      <text x="356" y="286" fill="#758169">02 / SHARED KNOWLEDGE</text>
      <text x="920" y="286" fill="#758169">03 / YOUR COURSES</text>
    </g>

    <!-- Source shelf: editable bibliography and locally supplied material. -->
    <rect x="48" y="311" width="238" height="284" rx="17" fill="#fffefa" stroke="#d7ddcf"/>
    <g stroke="#e0e4d9" stroke-width="1.2">
      <path d="M69 402h195M69 487h195"/>
    </g>
    <g fill="#edf0e6" stroke="#bdc8b2" stroke-width="1.2">
      <rect x="70" y="337" width="34" height="43" rx="4"/>
      <rect x="70" y="423" width="34" height="43" rx="4"/>
      <rect x="70" y="509" width="34" height="43" rx="4"/>
    </g>
    <g stroke="#819175" stroke-width="1.4" stroke-linecap="round" fill="none">
      <path d="M78 338v41m6-31h12m-12 7h12m-12 7h8"/>
      <path d="M79 433h16m-16 7h16m-16 7h11m-11 7h14"/>
      <path d="m78 539 5-10 5 6 7-16m-17 22h18"/>
    </g>
    <g fill="#2a443a" font-size="21">
      <text x="118" y="354">Textbooks</text>
      <text x="118" y="440">Lecture notes</text>
      <text x="118" y="526">Original work</text>
    </g>
    <g fill="#758169" font-size="16">
      <text x="118" y="377">References</text>
      <text x="118" y="463">Teaching context</text>
      <text x="118" y="549">Your material</text>
    </g>

    <!-- The review boundary is explicit: uploaded books do not become facts automatically. -->
    <path d="M295 453h50" fill="none" stroke="#879b84" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- Diagrammatic graph. Paths express dependencies, never textbook chapter order. -->
    <rect x="356" y="311" width="474" height="284" rx="17" fill="url(#forest)"/>
    <text x="382" y="349" fill="#e8ecdc" font-size="20">Concepts, evidence, prerequisites</text>
    <g stroke="#8eab83" stroke-width="2" fill="none" opacity=".5">
      <path d="M411 494 490 538 585 485 680 532 774 471"/>
      <path d="M411 411 490 455 585 401 680 446"/>
      <path d="M490 538v-83m95 30v-84m95 131v-86"/>
    </g>
    <g stroke="#bed09b" stroke-width="2.4" fill="none" marker-end="url(#graph-arrow)">
      <path d="m421 489 57-29"/>
      <path d="m502 455 70 25"/>
      <path d="m598 480 68-29"/>
      <path d="m693 441 68-32"/>
    </g>
    <g fill="#2e5144" stroke="#688c71" stroke-width="1.5">
      <circle cx="411" cy="411" r="10"/><circle cx="490" cy="538" r="10"/>
      <circle cx="585" cy="401" r="10"/><circle cx="680" cy="532" r="10"/>
      <circle cx="774" cy="471" r="10"/>
    </g>
    <g fill="#c1d29e" stroke="#c1d29e" stroke-width="2">
      <circle cx="411" cy="494" r="10"/><circle cx="490" cy="455" r="10"/>
      <circle cx="585" cy="485" r="10"/><circle cx="680" cy="446" r="10"/>
    </g>
    <circle cx="774" cy="404" r="20" fill="none" stroke="#d7b773" stroke-width="1" opacity=".65"/>
    <circle cx="774" cy="404" r="11" fill="#e3c687"/>
    <text x="746" y="376" fill="#e3c687" font-size="15" letter-spacing="1.5">GOAL</text>
    <text x="382" y="575" fill="#c7d4bd" font-size="16">Recognize</text>
    <circle cx="474" cy="569" r="2" fill="#8ba47b"/>
    <text x="490" y="575" fill="#c7d4bd" font-size="16">Use</text>
    <circle cx="534" cy="569" r="2" fill="#8ba47b"/>
    <text x="550" y="575" fill="#c7d4bd" font-size="16">Derive</text>
    <text x="805" y="575" text-anchor="end" fill="#c7d4bd" font-size="16">Reviewed together</text>

    <path d="M841 453h22q10 0 10-10v-66q0-10 10-10h26M873 443v86q0 10 10 10h26" fill="none" stroke="#879b84" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M890 367h19" fill="none" stroke="#879b84" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- Both courses use the same graph, with different outcomes and entry assumptions. -->
    <rect x="920" y="311" width="312" height="130" rx="17" fill="#fffefa" stroke="#d7ddcf"/>
    <rect x="920" y="465" width="312" height="130" rx="17" fill="#fffefa" stroke="#d7ddcf"/>
    <g fill="#2a443a" font-size="22">
      <text x="944" y="348">Introductory course</text>
      <text x="944" y="502">Advanced course</text>
    </g>
    <g fill="#758169" font-size="16">
      <text x="944" y="375">Build the foundations</text>
      <text x="944" y="529">Assume them. Go further.</text>
    </g>
    <g>
      <rect x="944" y="398" width="56" height="17" rx="4" fill="#dbe3cb"/>
      <rect x="1008" y="398" width="56" height="17" rx="4" fill="#bccc9f"/>
      <rect x="1072" y="398" width="56" height="17" rx="4" fill="#8fa77c"/>
      <rect x="1136" y="398" width="72" height="17" rx="4" fill="#496d50"/>
      <rect x="944" y="552" width="68" height="17" rx="4" fill="#8fa77c"/>
      <rect x="1020" y="552" width="92" height="17" rx="4" fill="#496d50"/>
      <rect x="1120" y="552" width="88" height="17" rx="4" fill="#d8b877"/>
    </g>

    <g font-size="17" fill="#657261">
      <text x="167" y="630" text-anchor="middle">Read &amp; propose</text>
      <text x="593" y="630" text-anchor="middle">Check &amp; review</text>
      <text x="1076" y="630" text-anchor="middle">Plan &amp; export</text>
    </g>
    <path d="M48 663h1184" stroke="#d7ddcf"/>
    <text x="48" y="707" fill="#2a443a" font-size="19">Change the goals or student background. See the course change.</text>
    <text x="1232" y="707" text-anchor="end" fill="#657261" font-size="16">Syllabus · Notes · JSON · Mermaid</text>
  </g>
</svg>
