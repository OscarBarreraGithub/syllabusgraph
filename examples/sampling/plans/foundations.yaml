id: foundations
title: Sampling & uncertainty
status: ready
audience: Students comfortable with arithmetic; no probability course assumed.
sessions: 4
minutes_per_session: 45
outcomes:
- node: sampling.confidence_interval
  level: use
  assessment: Construct an interval in the stated model and explain its coverage over
    repeated samples.
- node: sampling.standard_error
  level: derive
  assessment: Derive the standard error of a mean, stating the independence and variance
    assumptions.
background:
  sampling.fractions: use
include: {}
prior_plans: []
omit: []
group_order:
- experiments
- averages
- variation
- decisions
notes:
- Reserve remaining time for the assessment, examples, and discussion.
description: A compact introduction that moves from a random experiment to defensible
  statements about uncertainty.
