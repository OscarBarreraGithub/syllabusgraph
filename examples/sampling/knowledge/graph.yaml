groups:
- id: experiments
  title: Describe the experiment
  question: What can happen, and what are we counting?
- id: averages
  title: From events to averages
  question: How do we turn uncertain outcomes into useful numbers?
- id: variation
  title: Make variation visible
  question: Why do repeated samples give different answers?
- id: decisions
  title: Reason with uncertainty
  question: What does an interval actually promise?
motivations:
- id: sampling.interval-puzzle
  nodes:
  - sampling.confidence_interval
  - sampling.simulation
  summary: An interval can look reassuring while its coverage fails when the sampling
    assumptions fail. Simulation lets students test the promise of a procedure.
  evidence:
  - source: sampling-notes
    section: Use simulation to inspect the assumptions
    pages:
    - 5
