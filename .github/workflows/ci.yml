name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked --all-extras --python '${{ matrix.python }}'
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python scripts/check_graph_bank.py
      - run: uv run --no-sync syllabusgraph validate -p examples/sampling
      - run: uv run --no-sync syllabusgraph build -p examples/sampling --strict
  browser-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked --all-extras --python '3.14'
      - run: uv run --no-sync playwright install --with-deps chromium webkit
      - run: uv run --no-sync python scripts/test_browser.py
      - run: uv run --no-sync python scripts/test_explorer.py
      - run: uv run --no-sync python -m build
      - run: uv run --no-sync python scripts/audit_public.py --fresh-history
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
